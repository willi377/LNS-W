const parseLocalDate = (dateStr) => {
    if (!dateStr) return new Date();
    const parts = dateStr.split('T')[0].split('-').map(Number);
    return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0));
};

const getCalendarDaysDiff = (date1, date2) => {
    const utc1 = Date.UTC(date1.getUTCFullYear(), date1.getUTCMonth(), date1.getUTCDate());
    const utc2 = Date.UTC(date2.getUTCFullYear(), date2.getUTCMonth(), date2.getUTCDate());
    return Math.floor((utc2 - utc1) / (1000 * 60 * 60 * 24));
};

const formatDateLocal = (date) => {
    if (!date) return '';
    const d = new Date(date);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
};

const cleanOrphanCapitalMovements = async (userId) => {
    if (!userId) return;
    try {
        const allMovements = await db.capitalMovements.where({ userId }).toArray();
        const allLoans = await db.loans.where({ userId }).toArray();
        const allExpenses = await db.expenses.where({ userId }).toArray();
        const loanIds = new Set(allLoans.map(l => l.id));
        const expenseIds = new Set(allExpenses.map(e => e.id));
        const allInstallments = [];
        for (const loan of allLoans) {
            const insts = await db.installments.where({ loanId: loan.id }).toArray();
            allInstallments.push(...insts);
        }
        const installmentIds = new Set(allInstallments.map(i => i.id));
        const toDelete = [];
        for (const mov of allMovements) {
            if (mov.referenceType === 'loan' && mov.referenceId && !loanIds.has(mov.referenceId)) {
                toDelete.push(mov.id);
            } else if (mov.referenceType === 'payment' && mov.referenceId && !installmentIds.has(mov.referenceId)) {
                toDelete.push(mov.id);
            } else if (mov.referenceType === 'expense' && mov.referenceId && !expenseIds.has(mov.referenceId)) {
                toDelete.push(mov.id);
            }
        }
        if (toDelete.length > 0) {
            await db.capitalMovements.bulkDelete(toDelete);
            console.log(`[CLEAN] ${toDelete.length} movimientos huérfanos eliminados`);
        }
    } catch (err) {
        console.error('[CLEAN] Error limpiando huérfanos:', err);
    }
};

class SecurityUtils {
    static async hashPassword(pw) { const encoder = new TextEncoder(); const data = encoder.encode(pw + 'LoansW_Salt_2025'); const hashBuffer = await crypto.subtle.digest('SHA-256', data); return 'lw8_' + Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join(''); }
    static async verifyPassword(pw, hash) { return await this.hashPassword(pw) === hash; }
    static generateToken() { const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; const array = new Uint8Array(64); crypto.getRandomValues(array); return Array.from(array, b => chars.charAt(b % chars.length)).join(''); }
    static async createSession(userId, remember = false) { const token = this.generateToken(); const expiresAt = new Date(); expiresAt.setDate(expiresAt.getDate() + (remember ? 30 : 1)); await db.sessions.add({ userId, token, expiresAt: expiresAt.toISOString(), createdAt: new Date().toISOString() }); (remember ? localStorage : sessionStorage).setItem('lw_session', JSON.stringify({ userId, token })); }
    static async validateSession() { try { let data = sessionStorage.getItem('lw_session'); if (!data) data = localStorage.getItem('lw_session'); if (!data) return null; const { userId, token } = JSON.parse(data); const session = await db.sessions.where({ userId, token }).first(); if (!session || new Date(session.expiresAt) < new Date()) { sessionStorage.removeItem('lw_session'); localStorage.removeItem('lw_session'); if (session) await db.sessions.delete(session.id); return null; } return await db.users.get(userId); } catch { sessionStorage.removeItem('lw_session'); localStorage.removeItem('lw_session'); return null; } }
    static async destroySession() { const sources = [sessionStorage.getItem('lw_session'), localStorage.getItem('lw_session')]; for (const src of sources) { if (src) { try { const { token } = JSON.parse(src); await db.sessions.where({ token }).delete(); } catch {} } } sessionStorage.removeItem('lw_session'); localStorage.removeItem('lw_session'); }
}

class ScheduleEngine {
    static generate({ startDate, frequency, count, dueDateType = 'fixed_day' }) {
        const dates = [];
        const start = parseLocalDate(startDate);
        for (let i = 0; i < count; i++) {
            let date;
            switch (frequency) {
                case 'daily': date = new Date(start); date.setUTCDate(date.getUTCDate() + i); break;
                case 'weekly': date = new Date(start); date.setUTCDate(date.getUTCDate() + (i * 7)); break;
                case 'biweekly': date = new Date(start); date.setUTCDate(date.getUTCDate() + (i * 14)); break;
                case 'monthly':
                    if (dueDateType === 'end_of_period') {
                        date = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i + 1, 0, 12, 0, 0, 0));
                    } else {
                        const targetDay = start.getUTCDate();
                        date = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, 1, 12, 0, 0, 0));
                        const lastDay = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0, 12, 0, 0, 0)).getUTCDate();
                        date.setUTCDate(Math.min(targetDay, lastDay));
                    }
                    break;
                default: date = new Date(start); date.setUTCDate(date.getUTCDate() + (i * 30));
            }
            date.setUTCHours(12, 0, 0, 0);
            dates.push(date);
        }
        return dates;
    }
}

class InterestEngine {
    static calculate({ principal, rate, count, type }) {
        let ti = 0; const d = []; const p = Number(principal), r = Number(rate) / 100, n = Number(count);
        switch (type) {
            case 'on_principal': ti = p * r; const ip = ti / n, pp = p / n; for (let i = 0; i < n; i++) d.push({ principal: pp, interest: ip, total: pp + ip }); break;
            case 'fixed_per_installment': const fi = (p * r) / n; ti = fi * n; const pf = p / n; for (let i = 0; i < n; i++) d.push({ principal: pf, interest: fi, total: pf + fi }); break;
            case 'no_interest': const pz = p / n; for (let i = 0; i < n; i++) d.push({ principal: pz, interest: 0, total: pz }); break;
            default: const pd = p / n, id = (p * r) / n; ti = id * n; for (let i = 0; i < n; i++) d.push({ principal: pd, interest: id, total: pd + id });
        }
        return { totalInterest: Math.round(ti * 100) / 100, totalRepayment: Math.round((p + ti) * 100) / 100, details: d.map(x => ({ principal: Math.round(x.principal * 100) / 100, interest: Math.round(x.interest * 100) / 100, total: Math.round(x.total * 100) / 100 })) };
    }
}

class MoraEngine {
    static calculateMoraDays(dueDate) {
        const today = todayLocal();
        const due = parseLocalDate(dueDate);
        const diff = getCalendarDaysDiff(due, today);
        return Math.max(0, diff);
    }
    static calculateMoraAmount({ remainingAmount, moraType, moraRate, daysLate }) {
        if (daysLate <= 0 || remainingAmount <= 0) return 0;
        const base = Number(remainingAmount), rate = Number(moraRate);
        switch (moraType) {
            case 'percentage_daily': return Math.round(base * (rate / 100) * daysLate * 100) / 100;
            case 'percentage_weekly': const w = Math.floor(daysLate / 7); return w > 0 ? Math.round(base * (rate / 100) * w * 100) / 100 : 0;
            case 'percentage_monthly': const m = Math.floor(daysLate / 30); return m > 0 ? Math.round(base * (rate / 100) * m * 100) / 100 : 0;
            case 'fixed_daily': return Math.round(rate * daysLate * 100) / 100;
            case 'fixed_period': return Math.round(rate * 100) / 100;
            default: return 0;
        }
    }
    static calculateMoraRemaining(installment) {
        const totalMoraGenerated = installment.moraAmount || 0;
        const totalMoraPaid = installment.moraPaid || 0;
        return Math.max(0, totalMoraGenerated - totalMoraPaid);
    }
}

class PaymentEngine {
    static process({ installment, amount }) {
        let rem = Number(amount);
        const bd = { capital: 0, interest: 0, mora: 0 };
        const ta = installment.totalAmount || 0;
        const ia = installment.interest || 0;
        const ra = installment.remainingAmount || ta;
        const ma = MoraEngine.calculateMoraRemaining(installment);
        const totalDue = ra + ma;
        if (totalDue <= 0) {
            return { breakdown: bd, totalPaid: 0, newPaidAmount: installment.paidAmount || 0, newRemaining: 0, newMoraPaid: installment.moraPaid || 0, newStatus: 'paid', change: rem };
        }
        if (ma > 0 && rem > 0) {
            bd.mora = Math.round(Math.min(rem, ma) * 100) / 100;
            rem = Math.round((rem - bd.mora) * 100) / 100;
        }
        const ir = ta > 0 ? ia / ta : 0;
        const mi = ra * ir;
        if (mi > 0 && rem > 0) {
            bd.interest = Math.round(Math.min(rem, mi) * 100) / 100;
            rem = Math.round((rem - bd.interest) * 100) / 100;
        }
        if (rem > 0) {
            const mc = ra - mi;
            bd.capital = Math.round(Math.min(rem, Math.max(0, mc)) * 100) / 100;
            rem = Math.round((rem - bd.capital) * 100) / 100;
        }
        const totalPaidThisPayment = Math.round((bd.capital + bd.interest + bd.mora) * 100) / 100;
        const newPaidAmount = Math.round(((installment.paidAmount || 0) + bd.capital + bd.interest) * 100) / 100;
        const newMoraPaid = Math.round(((installment.moraPaid || 0) + bd.mora) * 100) / 100;
        const newRemaining = Math.round(Math.max(0, ta - newPaidAmount) * 100) / 100;
        let newStatus = 'pending';
        if (newRemaining <= 0.01 && MoraEngine.calculateMoraRemaining({ ...installment, moraPaid: newMoraPaid }) <= 0.01) {
            newStatus = 'paid';
        } else if (newPaidAmount > 0 && newRemaining > 0.01) {
            newStatus = 'partial';
        }
        if (newStatus !== 'paid' && newStatus !== 'partial' && getCalendarDaysDiff(parseLocalDate(installment.dueDate), todayLocal()) > 0) {
            newStatus = 'overdue';
        }
        return {
            breakdown: { capital: Math.round(bd.capital * 100) / 100, interest: Math.round(bd.interest * 100) / 100, mora: Math.round(bd.mora * 100) / 100 },
            totalPaid: totalPaidThisPayment,
            newPaidAmount,
            newMoraPaid,
            newRemaining,
            newStatus,
            change: Math.round(Math.max(0, rem) * 100) / 100
        };
    }
}

class FinanceEngine {
    static calculateMetrics({ installments, payments, loans, expenses, capitalMovements, year, month }) {
        const sd = new Date(Date.UTC(year, month - 1, 1, 12, 0, 0, 0));
        const ed = new Date(Date.UTC(year, month, 0, 23, 59, 59, 999));
        const mi = installments.filter(i => { const d = new Date(i.dueDate); return d >= sd && d <= ed; });
        const mp = payments.filter(p => { const d = new Date(p.paymentDate); return d >= sd && d <= ed; });
        const me = expenses.filter(e => { const d = new Date(e.date); return d >= sd && d <= ed; });
        const expectedAmount = mi.reduce((s, i) => s + (i.totalAmount || 0), 0);
        const collectedCapital = mp.reduce((s, p) => s + ((p.breakdown?.capital) || 0), 0);
        const collectedInterest = mp.reduce((s, p) => s + ((p.breakdown?.interest) || 0), 0);
        const collectedMora = mp.reduce((s, p) => s + ((p.breakdown?.mora) || 0), 0);
        const collectedAmount = Math.round((collectedCapital + collectedInterest + collectedMora) * 100) / 100;
        const totalExpenses = me.reduce((s, e) => s + (e.amount || 0), 0);
        const validLoanIds = new Set(loans.map(l => l.id));
        const validInstallmentIds = new Set(installments.map(i => i.id));
        const validExpenseIds = new Set(expenses.map(e => e.id));
        const allCapitalIn = capitalMovements.filter(m => {
            if (m.type !== 'initial' && m.type !== 'income') return false;
            if (m.referenceType && m.referenceId) {
                if (m.referenceType === 'loan' && !validLoanIds.has(m.referenceId)) return false;
                if (m.referenceType === 'expense' && !validExpenseIds.has(m.referenceId)) return false;
            }
            return true;
        }).reduce((s, m) => s + (m.amount || 0), 0);
        const allCapitalOut = capitalMovements.filter(m => {
            if (m.type !== 'loan' && m.type !== 'expense' && m.type !== 'withdrawal') return false;
            if (m.referenceType && m.referenceId) {
                if (m.referenceType === 'loan' && !validLoanIds.has(m.referenceId)) return false;
                if (m.referenceType === 'expense' && !validExpenseIds.has(m.referenceId)) return false;
            }
            return true;
        }).reduce((s, m) => s + (m.amount || 0), 0);
        const allPaymentsIn = capitalMovements.filter(m => {
            if (m.type !== 'payment') return false;
            if (m.referenceType === 'payment' && m.referenceId && !validInstallmentIds.has(m.referenceId)) return false;
            return true;
        }).reduce((s, m) => s + (m.amount || 0), 0);
        const totalCapital = Math.round((allCapitalIn - allCapitalOut + allPaymentsIn) * 100) / 100;
        const totalLent = loans.filter(l => l.status === 'active' || l.status === 'overdue').reduce((s, l) => s + (l.principal || 0), 0);
        const availableCapital = Math.round((totalCapital - totalLent) * 100) / 100;
        const overdueAmount = mi.filter(i => i.status === 'overdue').reduce((s, i) => s + (i.remainingAmount || i.totalAmount || 0) + MoraEngine.calculateMoraRemaining(i), 0);
        const pendingAmount = Math.round((expectedAmount - collectedAmount) * 100) / 100;
        const profit = Math.round((collectedInterest + collectedMora - totalExpenses) * 100) / 100;
        const compliance = expectedAmount > 0 ? Math.round((collectedAmount / expectedAmount) * 10000) / 100 : 0;
        return {
            expectedAmount: Math.round(expectedAmount * 100) / 100,
            collectedAmount,
            collectedCapital: Math.round(collectedCapital * 100) / 100,
            collectedInterest: Math.round(collectedInterest * 100) / 100,
            collectedMora: Math.round(collectedMora * 100) / 100,
            totalExpenses: Math.round(totalExpenses * 100) / 100,
            pendingAmount,
            overdueAmount: Math.round(overdueAmount * 100) / 100,
            totalCapital: Math.round(totalCapital * 100) / 100,
            totalLent: Math.round(totalLent * 100) / 100,
            availableCapital: Math.round(availableCapital * 100) / 100,
            profit,
            compliance
        };
    }
}

const AppContext = createContext();
const AppProvider = ({ children, user, onLogout }) => {
    const [clients, setClients] = useState([]);
    const [loans, setLoans] = useState([]);
    const [installments, setInstallments] = useState([]);
    const [payments, setPayments] = useState([]);
    const [expenses, setExpenses] = useState([]);
    const [capitalMovements, setCapitalMovements] = useState([]);
    const [expenseCategories, setExpenseCategories] = useState([]);
    const [collectionPeriods, setCollectionPeriods] = useState([]);
    const [auditLogs, setAuditLogs] = useState([]);
    const [config, setConfig] = useState(null);
    const [toasts, setToasts] = useState([]);
    const [loading, setLoading] = useState(true);
    const [refreshKey, setRefreshKey] = useState(0);

    const addToast = useCallback((msg, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(p => [...p, { id, msg, type }]);
        setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
    }, []);

    const refreshAllData = useCallback(async () => {
        if (!user?.id) return;
        setLoading(true);
        try {
            await initDatabase();
            const userId = user.id;
            await cleanOrphanCapitalMovements(userId);
            const [c, l, ec, cp] = await Promise.all([
                db.clients.where({ userId }).toArray(),
                db.loans.where({ userId }).toArray(),
                db.expenseCategories.toArray(),
                db.collectionPeriods.where({ userId }).toArray()
            ]);
            setClients(c);
            setLoans(l);
            setExpenseCategories(ec);
            setCollectionPeriods(cp);
            const loanIds = l.map(loan => loan.id);
            if (loanIds.length > 0) {
                const [i, p] = await Promise.all([
                    db.installments.where('loanId').anyOf(loanIds).toArray(),
                    db.payments.where('loanId').anyOf(loanIds).toArray()
                ]);
                for (const inst of i) {
                    if (inst.status === 'paid' || inst.status === 'cancelled') continue;
                    const loan = l.find(lo => lo.id === inst.loanId);
                    if (loan) {
                        const daysLate = MoraEngine.calculateMoraDays(inst.dueDate);
                        const totalMoraGenerated = MoraEngine.calculateMoraAmount({
                            remainingAmount: inst.remainingAmount || inst.totalAmount,
                            moraType: loan.moraType,
                            moraRate: loan.moraRate,
                            daysLate
                        });
                        const updateData = { moraDays: daysLate, moraAmount: totalMoraGenerated };
                        if (inst.moraPaid === undefined || inst.moraPaid === null) updateData.moraPaid = 0;
                        await db.installments.update(inst.id, updateData);
                        if (daysLate > 0 && inst.status !== 'paid' && inst.status !== 'cancelled' && inst.status !== 'partial') {
                            await db.installments.update(inst.id, { status: 'overdue' });
                        }
                    }
                }
                const updatedI = await db.installments.where('loanId').anyOf(loanIds).toArray();
                setInstallments(updatedI);
                setPayments(p);
                for (const loan of l) {
                    const loanInsts = updatedI.filter(inst => inst.loanId === loan.id);
                    const allPaid = loanInsts.every(inst => inst.status === 'paid' || inst.status === 'cancelled');
                    const hasOverdue = loanInsts.some(inst => inst.status === 'overdue');
                    let newStatus = loan.status;
                    if (allPaid && loan.status !== 'finished') {
                        newStatus = 'finished';
                        await db.loans.update(loan.id, { status: 'finished', updatedAt: new Date().toISOString() });
                    } else if (hasOverdue && loan.status === 'active') {
                        newStatus = 'overdue';
                        await db.loans.update(loan.id, { status: 'overdue', updatedAt: new Date().toISOString() });
                    } else if (!hasOverdue && loan.status === 'overdue') {
                        newStatus = 'active';
                        await db.loans.update(loan.id, { status: 'active', updatedAt: new Date().toISOString() });
                    }
                    if (newStatus !== loan.status) {
                        loan.status = newStatus;
                    }
                }
                setLoans([...l]);
            } else {
                setInstallments([]);
                setPayments([]);
            }
            const [e, cm, cfg] = await Promise.all([
                db.expenses.where({ userId }).toArray(),
                db.capitalMovements.where({ userId }).toArray(),
                db.settings.get(userId)
            ]);
            setExpenses(e);
            setCapitalMovements(cm);
            setConfig(cfg || null);
            try {
                const ar = await db.auditLog.where({ userId }).toArray();
                ar.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                setAuditLogs(ar.slice(0, 50));
            } catch (err) { console.error('[AUDIT]', err); }
            setRefreshKey(k => k + 1);
        } catch (err) {
            console.error('[APP] Error refresh:', err);
            addToast('Error al cargar datos: ' + (err.message || 'Error desconocido'), 'error');
        }
        setLoading(false);
    }, [user, addToast]);

    const addAuditLog = useCallback(async (et, eid, action, desc = '') => {
        if (!user?.id) return;
        try {
            await db.auditLog.add({
                userId: user.id, timestamp: new Date().toISOString(),
                entityType: et, entityId: eid, action, description: desc
            });
        } catch (err) { console.error('[APP] Audit log error:', err); }
    }, [user]);

    useEffect(() => { if (user) refreshAllData(); }, [user, refreshAllData]);

    const value = useMemo(() => ({
        user, onLogout, clients, loans, installments, payments, expenses,
        capitalMovements, expenseCategories, setExpenseCategories, collectionPeriods,
        auditLogs, config, setConfig, toasts, addToast, loading, refreshKey,
        refreshAllData, addAuditLog
    }), [user, onLogout, clients, loans, installments, payments, expenses,
        capitalMovements, expenseCategories, collectionPeriods, auditLogs,
        config, toasts, addToast, loading, refreshKey, refreshAllData, addAuditLog]);

    return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};

const LoginScreen = ({ onLogin }) => {
    const [doc, setDoc] = useState('');
    const [password, setPassword] = useState('');
    const [fullName, setFullName] = useState('');
    const [email, setEmail] = useState('');
    const [phone, setPhone] = useState('');
    const [confirmPassword, setConfirmPassword] = useState('');
    const [isRegistering, setIsRegistering] = useState(false);
    const [remember, setRemember] = useState(true);
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);
    const [showPassword, setShowPassword] = useState(false);

    const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        if (!doc.trim() || !password.trim()) { setError('Completa todos los campos requeridos.'); return; }
        const nd = doc.trim().replace(/\s+/g, '');
        if (isRegistering) {
            if (!fullName.trim()) { setError('El nombre completo es requerido.'); return; }
            if (password !== confirmPassword) { setError('Las contraseñas no coinciden.'); return; }
            if (password.length < 6) { setError('La contraseña debe tener al menos 6 caracteres.'); return; }
        }
        setLoading(true);
        try {
            await initDatabase();
            if (isRegistering) {
                const ex = await db.users.where({ document: nd }).first();
                if (ex) { setError('Esta cédula ya está registrada.'); setLoading(false); return; }
                if (email.trim()) {
                    const ee = await db.users.where({ email: email.trim().toLowerCase() }).first();
                    if (ee) { setError('Este correo ya está registrado.'); setLoading(false); return; }
                }
                const ph = await SecurityUtils.hashPassword(password);
                const uid = await db.users.add({ fullName: fullName.trim(), document: nd, email: email.trim().toLowerCase(), phone: phone.trim(), passwordHash: ph, createdAt: new Date().toISOString() });
                await verifyPersistence(db.users, uid);
                await SecurityUtils.createSession(uid, remember);
                onLogin({ id: uid, document: nd, fullName: fullName.trim(), email: email.trim().toLowerCase() });
            } else {
                const u = await db.users.where({ document: nd }).first();
                if (!u) { setError('No existe una cuenta con esta cédula.'); setLoading(false); return; }
                const v = await SecurityUtils.verifyPassword(password, u.passwordHash);
                if (!v) { setError('Contraseña incorrecta.'); setLoading(false); return; }
                await SecurityUtils.createSession(u.id, remember);
                onLogin(u);
            }
        } catch (err) { console.error('[AUTH ERROR]', err); setError(err.message || 'Error inesperado.'); }
        setLoading(false);
    };

    return (
        <div style={{ minHeight: '100vh', background: 'linear-gradient(160deg, #060610 0%, #0f0f24 40%, #060610 100%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px' }}>
            <div style={{ marginBottom: '36px', textAlign: 'center' }}>
                <div style={{ width: '60px', height: '60px', borderRadius: '16px', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', animation: 'pulse-glow 2s ease-in-out infinite' }}><IconSVG.TrendingUp /></div>
                <div style={{ fontSize: '32px', fontWeight: '800', letterSpacing: '-1.5px', color: 'var(--text-primary)' }}>LOANS W</div>
                <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '4px' }}>Sistema profesional de gestión de préstamos</div>
            </div>
            <form onSubmit={handleSubmit} style={{ width: '100%', maxWidth: '400px' }}>
                <div className="glass-card" style={{ padding: '24px', cursor: 'default' }}>
                    <div style={{ fontSize: '20px', fontWeight: '700', marginBottom: '20px', textAlign: 'center' }}>{isRegistering ? 'Crear cuenta' : 'Iniciar sesión'}</div>
                    {error && <div style={{ padding: '11px 14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '10px', color: 'var(--danger-light)', fontSize: '12px', marginBottom: '16px', lineHeight: '1.4' }}>{error}</div>}
                    {isRegistering && <div style={{ marginBottom: '12px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Nombre completo *</label><input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="glass-input" placeholder="Tu nombre completo" /></div>}
                    <div style={{ marginBottom: '12px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Número de cédula *</label><input type="text" value={doc} onChange={e => setDoc(e.target.value)} className="glass-input" placeholder="Ingresa tu cédula" autoComplete="username" /></div>
                    {isRegistering && <><div style={{ marginBottom: '12px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Correo electrónico</label><input type="email" value={email} onChange={e => setEmail(e.target.value)} className="glass-input" placeholder="tu@correo.com" autoComplete="email" /></div><div style={{ marginBottom: '12px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Teléfono</label><input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="glass-input" placeholder="3001234567" autoComplete="tel" /></div></>}
                    <div style={{ marginBottom: '12px', position: 'relative' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Contraseña *</label><input type={showPassword ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} className="glass-input" style={{ paddingRight: '42px' }} placeholder="••••••••" autoComplete={isRegistering ? 'new-password' : 'current-password'} /><button type="button" onClick={() => setShowPassword(!showPassword)} style={{ position: 'absolute', right: '12px', top: '32px', background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', padding: '4px' }}>{showPassword ? <IconSVG.EyeOff /> : <IconSVG.Eye />}</button></div>
                    {isRegistering && <div style={{ marginBottom: '16px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Confirmar contraseña *</label><input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="glass-input" placeholder="••••••••" autoComplete="new-password" /></div>}
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '18px' }}><input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} id="remember" style={{ accentColor: 'var(--accent)', width: '15px', height: '15px' }} /><label htmlFor="remember" style={{ fontSize: '12px', color: 'var(--text-secondary)', cursor: 'pointer' }}>Recordarme en este dispositivo</label></div>
                    <button type="submit" className="btn btn-primary" style={{ width: '100%', marginBottom: '12px' }} disabled={loading}>{loading ? <span className="spinner" style={{ width: '18px', height: '18px' }}></span> : isRegistering ? 'Crear cuenta' : 'Ingresar'}</button>
                    <button type="button" onClick={() => { setIsRegistering(!isRegistering); setError(''); }} className="btn btn-ghost" style={{ width: '100%', fontSize: '13px' }}>{isRegistering ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}</button>
                </div>
            </form>
            <div style={{ marginTop: '20px', fontSize: '11px', color: 'var(--text-muted)', textAlign: 'center' }}>Al registrarte aceptas los términos y condiciones de LOANS W.</div>
        </div>
    );
};

        installments, payments, loans, expenses, capitalMovements,
        year: now.getUTCFullYear(), month: now.getUTCMonth() + 1
    }), [installments, payments, loans, expenses, capitalMovements, refreshKey]);

const SimulatorPage = ({ onNavigate }) => {

    const runSimulation = useCallback((f) => {
        if (!f.principal || !f.interestRate || !f.installmentsCount || parseInt(f.installmentsCount) <= 0) { setSimulation(null); return; }
        const p = parseFloat(f.principal), r = parseFloat(f.interestRate), c = parseInt(f.installmentsCount);
        if (isNaN(p) || isNaN(r) || isNaN(c) || p <= 0 || c <= 0) { setSimulation(null); return; }
        const result = InterestEngine.calculate({ principal: p, rate: r, count: c, type: f.interestType });
        const schedule = ScheduleEngine.generate({ startDate: f.startDate, frequency: f.frequency, count: c, dueDateType: f.dueDateType });
        const scheduleDetails = schedule.map((date, i) => { const detail = result.details[i]; const balance = p - result.details.slice(0, i + 1).reduce((s, d) => s + d.principal, 0); const daysLate = i === 0 ? 0 : Math.max(0, getCalendarDaysDiff(schedule[i], todayLocal())); const hypotheticalMora = MoraEngine.calculateMoraAmount({ remainingAmount: detail.total, moraType: f.moraType, moraRate: parseFloat(f.moraRate), daysLate }); return { date, ...detail, balance: Math.max(0, balance), hypotheticalMora }; });
        setSimulation({ ...result, schedule, scheduleDetails });

ber" value={form.installmentsCount} onChange={e => uf('installmentsCount', e.target.value)} className="glass-input" placeholder="Ej: 10" /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Frecuencia</label><select value={form.frequency} onChange={e => uf('frequency', e.target.value)} className="glass-input"><option value="daily">Diaria</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly">Mensual</option></select></div></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Fecha de inicio</label><input type="date" value={form.startDate} onChange={e => uf('startDate', e.target.value)} className="glass-input" /></div><div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--text-secondary)', marginTop: '4px' }}>Configuración de mora</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><select value={form.moraType} onChange={e => uf('moraType', e.target.value)} className="glass-input"><option value="percentage_daily">% diario</option><option value="percentage_weekly">% semanal</option><option value="percentage_monthly">% mensual</option><option value="fixed_daily">Fijo/día</option><option value="fixed_period">Fijo/período</option></select><input type="number" value={form.moraRate} onChange={e => uf('moraRate', e.target.value)} className="glass-input" placeholder="Tasa" step="0.01" /></div></div>{simulation && (<><div className="glass-card" style={{ padding: '20px', marginBottom: '16px' }}><div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px' }}>Resumen de simulación</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div style={{ textAlign: 'center', padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: '10px' }}><div style={{ fontSize: '10px', color: 'var(--text-muted)', textTran const ClientsPage = ({ onNavigate }) => {
    const { clients, loans, refreshAllData, addToast, user, loading } = useApp();
    const [search, setSearch] = useState('');
    const [showForm, setShowForm] = useState(false);
    const [editing, setEditing] = useState(null);
    const filtered = clients.filter(c => (c.fullName || '').toLowerCase().includes(search.toLowerCase()) || (c.document || '').includes(search));
    const handleSave = async (data) => {
        if (!data.fullName?.trim()) { addToast('El nombre es requerido', 'error'); return; }
        try {
            await initDatabase();
            const docData = { ...data, userId: user.id, updatedAt: new Date().toISOString() };
            let savedId;
            if (editing) { await db.clients.update(editing.id, docData); savedId = editing.id; }
            else { docData.createdAt = new Date().toISOString(); savedId = await db.clients.add(docData); }
            await verifyPersistence(db.clients, savedId);
            await refreshAllData();
            addToast(editing ? 'Cliente actualizado correctamente' : 'Cliente creado correctamente', 'success');
            setShowForm(false); setEditing(null);
        } catch (err) { addToast(err.message || 'No se pudo guardar el cliente.', 'error'); }

At: new Date().toISOString() }); }); await verifyPersistence(db.loans, lid); await refreshAllData(); addToast('Préstamo creado exitosamente', 'success'); onNavigate('loanDetail', lid); } catch (err) { addToast(err.message || 'No se pudo crear el préstamo.', 'error'); } };

me="glass-input"><option value="daily">Diaria</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly">Mensual</option></select></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Fecha de inicio</label><input type="date" value={form.startDate} onChange={e => uf('startDate', e.target.value)} className="glass-input" /></div></div><div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--text-secondary)', marginTop: '4px' }}>Configuración de mora</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><select value={form.moraType} onChange={e => uf('moraType', e.target.value)} className="glass-input"><option value="percentage_daily">% diario</option><option value="percentage_weekly">% semanal</option><option value="percentage_monthly">% mensual</option><option value="fixed_daily">Fijo/día</option><option value="fixed_period">Fijo/período</option></select><input type="number" value={form.moraRate} onChange={e => uf('moraRate', e.target.value)} className="glass-input" placeholder="Tasa" step="0.01" /></div><button className="btn btn-success" style={{ width: '100%', marginTop: '8px' }} onClick={handleCreate} disabled={!form.clientId || !form.principal || !form.interestRate || !form.installmentsCount}><IconSVG.Check /> Crear préstamo</button></div></div>);

payment; updatedLoan.totalPaid = 0; updatedLoan.progress = 0; updatedLoan.status = 'active'; await db.installments.where({ loanId: loan.id }).delete(); const id = s.map((d, i) => ({ loanId: loan.id, number: i + 1, startDate: i === 0 ? form.startDate : formatDateLocal(s[i - 1]), dueDate: formatDateLocal(d), principal: r.details[i].principal, interest: r.details[i].interest, totalAmount: r.details[i].total, paidAmount: 0, remainingAmount: r.details[i].total, moraDays: 0, moraAmount: 0, moraPaid: 0, status: 'pending' })); await db.installments.bulkAdd(id); await db.capitalMovements.where({ referenceType: 'loan', referenceId: loan.id }).delete(); await db.capitalMovements.add({ userId: user.id, type: 'loan', amount: parseFloat(form.principal), date: new Date().toISOString(), description: `Préstamo ${loan.loanNumber} (editado)`, referenceType: 'loan', referenceId: loan.id, createdAt: new Date().toISOString() }); } await db.loans.update(loan.id, updatedLoan); }); await verifyPersistence(db.loans, loan.id); await refreshAllData(); addToast('Préstamo actualizado correctamente', 'success'); onNavigate('loanDetail', loan.id); } catch (err) { addToast(err.message || 'No se pudo actualizar el préstamo.', 'error'); } };

me="glass-input"><option value="daily">Diaria</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly">Mensual</option></select></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Fecha de inicio</label><input type="date" value={form.startDate} onChange={e => uf('startDate', e.target.value)} className="glass-input" /></div></div><div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--text-secondary)', marginTop: '4px' }}>Configuración de mora (siempre editable)</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><select value={form.moraType} onChange={e => uf('moraType', e.target.value)} className="glass-input"><option value="percentage_daily">% diario</option><option value="percentage_weekly">% semanal</option><option value="percentage_monthly">% mensual</option><option value="fixed_daily">Fijo/día</option><option value="fixed_period">Fijo/período</option></select><input type="number" value={form.moraRate} onChange={e => uf('moraRate', e.target.value)} className="glass-input" placeholder="Tasa" step="0.01" /></div><button className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }} onClick={handleUpdate} disabled={!form.principal || !form.interestRate || !form.installmentsCount}><IconSVG.Check /> Actualizar préstamo</button></div></div>);

    const handleDeleteLoan = async () => { setDeleting(true); try { await initDatabase(); const loanInsts = await db.installments.where({ loanId: loan.id }).toArray(); const instIds = loanInsts.map(i => i.id); await db.transaction('rw', db.loans, db.installments, db.payments, db.capitalMovements, db.auditLog, async () => { if (instIds.length > 0) { await db.payments.where('installmentId').anyOf(instIds).delete(); } await db.installments.where({ loanId: loan.id }).delete(); await db.capitalMovements.where({ referenceType: 'loan', referenceId: loan.id }).delete(); await db.capitalMovements.where({ referenceType: 'payment' }).filter(m => instIds.includes(m.referenceId)).delete(); await db.auditLog.where({ entityType: 'loan', entityId: loan.id }).delete(); await db.loans.delete(loan.id); }); await cleanOrphanCapitalMovements(user.id); await refreshAllData(); addToast('Préstamo eliminado correctamente. Capital y disponible recalculados.', 'success'); onNavigate('loans'); } catch (err) { console.error('[DELETE LOAN ERROR]', err); addToast('Error al eliminar el préstamo: ' + (err.message || 'Error desconocido'), 'error'); } setDeleting(false); setShowDeleteConfirm(false); };
    return (<div style={{ padding: '20px', paddingBottom: '120px' }}><button onClick={() => onNavigate('loans')} className="back-btn"><IconSVG.ArrowLeft /> Volver</button><div className="glass-card" style={{ padding: '20px', marginBottom: '16px' }}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px' }}><div><div style={{ fontSize: '18px', fontWeight: '700' }}>{client?.fullName}</div><div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>#{loan.loanNumber}</div></div><span className={`badge ${loan.status==='overdue'?'badge-danger':loan.status==='finished'?'badge-info':loan.status==='cancelled'?'badge-neutral':'badge-success'}`}>{getStatusLabel(loan.status)}</span></div><div className="progress-bar" style={{ height: '10px', marginBottom: '12px' }}><div className="progress-fill" style={{ width: `${Math.min(100, prog)}%` }} /></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', fontSize: '12px' }}><div><div style={{ color: 'var(--text-muted)' }}>Cobrado</div><div style={{ color: 'var(--success)', fontWeight: '600', fontSize: '15px' }}>{formatCurrency(loan.totalPaid || 0)}</div></div><div><div style={{ color: 'var(--text-muted)' }}>Pendiente</div><div style={{ color: 'var(--warning)', fontWeight: '600', fontSize: '15px' }}>{formatCurrency(loan.currentBalance || 0)}</div></div><div><div style={{ color: 'var(--text-muted)' }}>Total</div><div style={{ fontWeight: '600', fontSize: '15px' }}>{formatCurrency(loan.totalRepayment || 0)}</div></div></div><div style={{ marginTop: '14px', padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: '10px', display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', fontSize: '11px' }}><div><span style={{ color: 'var(--text-muted)' }}>Capital: </span><span style={{ fontWeight: '500' }}>{formatCurrency(loan.principal)}</span></div><div><span style={{ color: 'var(--text-muted)' }}>Interés: </span><span style={{ fontWeight: '500' }}>{loan.interestRate}  'var(--accent-light)' : isDueToday ? 'var(--warning)' : 'var(--text-primary)' }}>{ipa ? <IconSVG.Check /> : io ? '!' : ipart ? '◐' : inst.number}</div><div style={{ flex: 1 }}><div style={{ fontSize: '13px', fontWeight: '500' }}>Cuota {inst.number}</div><div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Vence: {formatDate(inst.dueDate)}{io && md > 0 && <span className="mora-badge" style={{ marginLeft: '6px', padding: '2px 6px', fontSize: '10px' }}>{md} días de mora</span>}{isDueToday && <span className="today-badge" style={{ marginLeft: '6px', padding: '2px 6px', fontSize: '10px' }}>Vence hoy</span>}{ipart && <span style={{ color: 'var(--accent-light)', marginLeft: '6px' }}>· Pago parcial</span>}</div></div><div style={{ textAlign: 'right' }}><div style={{ fontSize: '14px', fontWeight: '600' }}>{ipa ? formatCurrency(inst.totalAmount) : formatCurrency(twm)}</div>{ma > 0 && !ipa && <div style={{ fontSize: '10px', color: 'var(--danger-light)' }}>+{formatCurrency(ma)} mora</div>}{ipart && <div style={{ fontSize: '10px', color: 'var(--accent-light)' }}>Pagado: {formatCurrency(inst.paidAmount || 0)}</div>}</div>{!ipa && inst.status !== 'cancelled' && <button className="btn btn-success btn-sm" onClick={() => { setSelInst(inst); setShowPay(true); }}>Cobrar</button>}</div>); })}{showPay && selInst && <><div className="sheet-overlay" onClick={() => !processing && setShowPay(false)} /><div className="sheet-content"><div className="sheet-handle" /><div style={{ fontSize: '18px', fontWeight: '700', marginBottom: '16px' }}>Registrar cobro</div><div className="glass-card" style={{ padding: '14px', marginBottom: '16px' }}><div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>{client?.fullName}</div><div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Cuota {selInst.number} · Vence: {formatDate(selInst.dueDate)}</div>{MoraEngine.calculateMoraRemaining(selInst) > 0 && <div className="mora-badge" style={{ marginTop: '6px' }}>{selInst.moraDays || 0} día const PaymentForm = ({ inst, onSubmit, onCancel, processing }) => {
    const twm = (inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst);
    const [amt, setAmt] = useState(twm.toString());
    const [method, setMethod] = useState('Efectivo');
    const [note, setNote] = useState('');
    const [date, setDate] = useState(formatDateLocal(todayLocal()));
    const [error, setError] = useState('');
    return (<form onSubmit={e => { e.preventDefault(); const a = parseFloat(amt); if (!a || a <= 0) { setError('Monto inválido'); return; } if (a > twm + 0.01) { setError('Excede el total'); return; } onSubmit({ amount: a, method, note, date }); }} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>{error && <div style={{ padding: '10px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: '8px', color: '#f87171', fontSize: '12px' }}>{error}</div>}<div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Monto *</label><input type="number" value={amt} onChange={e => { setAmt(e.target.value); setError(''); }} className="glass-input" required autoFocus /><div style={{ fontSize: '10px', color: 'var(--text-muted)', marginTop: '4px' }}>Cuota: {formatCurrency(inst.remainingAmount || inst.totalAmount)}{MoraEngine.calculateMoraRemaining(inst) > 0 && <span style={{ color: 'var(--danger-light)' }}> + Mora: {formatCurrency(MoraEngine.calculateMoraRemaining(inst))}</span>}</div></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Método</label><select value={method} onChange={e => setMethod(e.target.value)} className="glass-input"><option>Efectivo</option><option>Transferencia</option><option>Nequi</option><option>Daviplata</option><option>Otro</option></select></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Fecha de pago</label><input type="date" value={date} onChange={e => setDate(e.target.value)} className="glass-input" /></div><div style={{ display: 'flex', gap: '10px', marginTop: '8px' }}><button type="button" className="btn btn-ghost" style={{ flex: 1 }} onClick={onCancel} disabled={processing}>Cancelar</button><button type="submit" className="btn btn-success" style={{ flex: 1 }} disabled={processing}>{processing ? 'Registrando...' : const CollectionsPage = ({ onNavigate }) => {
    const { loans, clients, installments } = useApp();
    const [filter, setFilter] = useState('all');
    const today = todayLocal();
    const data = loans.map(l => ({ ...l, _c: clients.find(c => c.id === l.clientId), _i: installments.filter(i => i.loanId === l.id) }));
    const dueToday = data.filter(l => l._i?.some(i => { if (i.status === 'paid' || i.status === 'cancelled') return false; const due = parseLocalDate(i.dueDate); return getCalendarDaysDiff(today, due) === 0; }));
    const overdue = data.filter(l => l.status === 'overdue' || l._i?.some(i => i.status === 'overdue'));
    const pending = data.filter(l => l.status === 'active' || l.status === 'overdue');
    const paid = data.filter(l => l.status === 'finished');
    const filtered = filter === 'today' ? dueToday : filter === 'overdue' ? overdue : filter === 'pending' ? pending : filter === 'paid' ? paid : data;
    return (<div style={{ padding: '20px', paddingBottom: '120px' }}><div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Cobros</div><div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>{[{id:'all',label:'Todos'},{id:'today',label:'Vence hoy'},{id:'pending',label:'Pendientes'},{id:'overdue',label:'Vencidas'},{id:'paid',label:'Pagados'}].map(f => <button key={f.id} onClick={() => setFilter(f.id)} className="btn btn-ghost btn-sm" style={{ background: filter === f.id ? 'rgba(99,102,241,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>{f.label}</button>)}</div>{filtered.length === 0 ? <EmptyState icon={<IconSVG.Receipt />} title="No hay cobros" description="No se encontraron cobros para este filtro" /> : filtered.map(l => { const pendingCount = l._i?.filter(i => i.status !== 'paid' && i.status !== 'cancelled').length || 0; const overdueCount = l._i?.filter(i => i.status === 'overdue').length || 0; const todayCount = l._i?.filter(i => { if (i.status === 'paid' || i.status === 'cancelled') return false; return getCalendarDaysDiff(today, parseLocalDate(i.dueDate)) === 0; }).length || 0; return (<div key={l.id} className="glass-card" onClick={() => onNavigate('loanDetail', l.id)} style={{ padding: '14px', marginBottom: '8px' }}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}><div><div style={{ fontWeight: '600' }}>{l._c?.fullName}</div><div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>#{l.loanNumber} · {pendingCount} cuotas pendientes</div></div><span style={{ fontWeight: '700', color: l.status === 'overdue' ? 'var(--danger)' : l.status === 'active' ? 'var(--warning)' : 'var(--success)' }}>{formatCurrency(l.currentBalance)}</span></div><div style={{ display: 'flex', gap: '8px', fontSize: '10px' }}>{todayCount > 0 && <span className="today-badge" style={{ padding: '2px 6px' }}>{todayCount} vence hoy</span>}{overdueCount > 0 && <span className="mora-badge" style={{ padding: '2px 6px' }}>{overdueCount} vencidas</span>}</div></div>); })}</div>);
};

const FinancePage = ({ onNavigate }) => {
    const { installments, payments, loans, expenses, capitalMovements, refreshKey } = useApp();

const ExpensesPage = ({ onNavigate }) => {
    const { expenses, expenseCategories, refreshAllData, addToast, user } = useApp();

    const [editing, setEditing] = useState(null);
    const [showDelete, setShowDelete] = useState(null);

    const thisMonth = expenses.filter(e => new Date(e.date).getUTCMonth() === now.getUTCMonth() && new Date(e.date).getUTCFullYear() === now.getUTCFullYear());
    const totalMonth = thisMonth.reduce((s, e) => s + (e.amount || 0), 0);
    const hs = async (data) => { if (!data.amount || data.amount <= 0) { addToast('Monto inválido', 'error'); return; } try { await initDatabase(); let savedId; if (editing) { const oldExpense = await db.expenses.get(editing.id); await db.expenses.update(editing.id, { ...data, updatedAt: new Date().toISOString() }); savedId = editing.id; if (oldExpense && oldExpense.capitalMovementId) { await db.capitalMovements.update(oldExpense.capitalMovementId, { amount: parseFloat(data.amount), date: data.date, description: `Gasto: ${data.category}` }); } else if (oldExpense) { const cmId = await db.capitalMovements.add({ userId: user.id, type: 'expense', amount: parseFloat(data.amount), date: data.date, description: `Gasto: ${data.category}`, referenceType: 'expense', referenceId: editing.id, createdAt: new Date().toISOString() }); await db.expenses.update(editing.id, { capitalMovementId: cmId }); } } else { savedId = await db.expenses.add({ ...data, userId: user.id, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }); const cmId = await db.capitalMovements.add({ userId: user.id, type: 'expense', amount: parseFloat(data.amount), date: data.date, description: `Gasto: ${data.category}`, referenceType: 'expense', referenceId: savedId, createdAt: new Date().toISOString() }); await db.expenses.update(savedId, { capitalMovementId: cmId }); } await verifyPersistence(db.expenses, savedId); await refreshAllData(); addToast(editing ? 'Gasto actualizado correctamente' : 'Gasto registrado correctamente', 'success'); setShowForm(false); setEditing(null); } catch (err) { addToast('No se pudo guardar el gasto.', 'error'); console.error('[EXPENSE SAVE ERROR]', err); } };

ame="modal-overlay" onClick={() => { setShowForm(false); setEditing(null); }}><div className="modal-content" onClick={e => e.stopPropagation()}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '18px' }}><div style={{ fontSize: '20px', fontWeight: '700' }}>{editing ? 'Editar gasto' : 'Registrar gasto'}</div><button onClick={() => { setShowForm(false); setEditing(null); }} className="btn btn-ghost btn-sm"><IconSVG.X /></button></div><ExpenseForm cats={expenseCategories} initial={editing} onSave={hs} onRefresh={refreshAllData} /></div></div>}{showDelete && <ConfirmDialog title="Eliminar gasto" message={`¿Eliminar gasto de ${formatCurrency(showDelete.amount)}?\n\nEsta acción eliminará el gasto y su movimiento de capital asociado.`} confirmLabel="Eliminar" confirmType="danger" onConfirm={hd} onCancel={() => setShowDelete(null)} />}</div>);

const ChangePasswordForm = ({ onSuccess }) => {
    const [cp, setCp] = useState('');
    const [np, setNp] = useState('');
    const [cf, setCf] = useState('');
    const [error, setError] = useState('');
    const [loading, setLoading] = useState(false);
    const { user } = useApp();
    const submit = async (e) => { e.preventDefault(); setError(''); if (!cp || !np || !cf) { setError('Completa todos los campos'); return; } if (np !== cf) { setError('No coinciden'); return; } if (np.length < 6) { setError('Mínimo 6 caracteres'); return; } setLoading(true); try { await initDatabase(); const u = await db.users.get(user.id); if (!u) { setError('Usuario no encontrado'); setLoading(false); return; } const v = await SecurityUtils.verifyPassword(cp, u.passwordHash); if (!v) { setError('Contraseña actual incorrecta'); setLoading(false); return; } const nh = await SecurityUtils.hashPassword(np); await db.users.update(user.id, { passwordHash: nh }); onSuccess(); } catch (err) { console.error('Error cambiando contraseña:', err); setError('Error al cambiar la contraseña'); } setLoading(false); };
    return (<form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>{error && <div style={{ padding: '10px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: '8px', color: '#f87171', fontSize: '12px' }}>{error}</div>}<div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Contraseña actual</label><input type="password" value={cp} onChange={e => setCp(e.target.value)} className="glass-input" required /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Nueva contraseña</label><input type="password" value={np} onChange={e => setNp(e.target.value)} className="glass-input" required /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Confirmar</label><input type="password" value={cf} onChange={e => setCf(e.target.value)} className="glass-input" required /></div><button type="submit" className="btn btn-primary" style={{ width: '100%' }} disabled={loading}>{loading ? 'Procesando...' : 'Actualizar contraseña'}</button></form>);

    const hl = useCallback((u) => { setUser(u); setAppState('main'); }, []);
    const hlo = useCallback(async () => { await SecurityUtils.destroySession(); setUser(null); setAppState('login'); }, []);
    const nav = useCallback((p, ...a) => { setPage(p); setParams(a); setShowFab(!['createLoan','editLoan','loanDetail','clientDetail','more','expenses','simulator'].includes(p)); window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);
    const fa = useCallback((a) => { if (a==='client') nav('clients'); else if (a==='loan') nav('createLoan'); else if (a==='payment') nav('collections'); else if (a==='expense') nav('expenses'); else if (a==='simulator') nav('simulator'); else if (a==='capital') nav('finance'); }, [nav]);
    const rp = () => { switch(page) { case 'dashboard': return <DashboardPage onNavigate={nav} />; case 'clients': return <ClientsPage onNavigate={nav} />; case 'clientDetail': return <ClientDetailPage id={params[0]} onNavigate={nav} />; case 'loans': return <LoansPage onNavigate={nav} />; case 'createLoan': return <CreateLoanPage preselectedClientId={params[0]} simulatorData={params[1]} onNavigate={nav} />; case 'editLoan': return <EditLoanPage id={params[0]} onNavigate={nav} />; case 'loanDetail': return <LoanDetailPage id={params[0]} onNavigate={nav} />; case 'collections': return <CollectionsPage onNavigate={nav} />; case 'finance': return <FinancePage onNavigate={nav} />; case 'expenses': return <ExpensesPage onNavigate={nav} />; case 'simulator': return <SimulatorPage onNavigate={nav} />; case 'more': return <MorePage onNavigate={nav} />; default: return <DashboardPage onNavigate={nav} />; } };
    if (appState === 'loading') return <LoadingScreen />;
    if (appState === 'login') return <LoginScreen onLogin={hl} />;
    return (<AppProvider user={user} onLogout={hlo}><div style={{ minHeight: '100vh', minHeight: '100dvh', background: 'var(--bg-deep)' }}>{rp()}{showFab && <FAB onAction={fa} />}<BottomNav page={page} onNavigate={nav} /><ToastContainer /></div></AppProvider>);
};

ReactDOM.render(<App />, document.getElementById('root'));
console.log('LOANS W v8.2 — Eliminación completa + Capital corregido + Preferencias arregladas');
</script>
</body>
</html>
