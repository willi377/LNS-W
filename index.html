    // ============================================================
    // 39. CHANGE PASSWORD FORM
    // ============================================================

    const ChangePasswordForm = ({ onSuccess }) => {
        const [np, setNp] = useState('');
        const [cf, setCf] = useState('');
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);

        const submit = async (e) => {
            e.preventDefault();
            setError('');
            if (!np || !cf) { setError('Completa todos los campos'); return; }
            if (np !== cf) { setError('No coinciden'); return; }
            if (np.length < 6) { setError('Mínimo 6 caracteres'); return; }
            setLoading(true);
            try {
                const sb = await waitForSupabase(5000);
                if (!sb) throw new Error('Supabase no disponible');
                const { error } = await sb.auth.updateUser({ password: np });
                if (error) throw error;
                onSuccess();
            } catch (err) { setError(err.message || 'Error al cambiar'); }
            setLoading(false);
        };

        return (
            <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {error && <div style={{ padding: '10px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: '8px', color: '#f87171', fontSize: '12px' }}>{error}</div>}
                <div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Nueva contraseña</label><input type="password" value={np} onChange={e => setNp(e.target.value)} className="glass-input" required /></div>
                <div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Confirmar</label><input type="password" value={cf} onChange={e => setCf(e.target.value)} className="glass-input" required /></div>
                <button type="submit" className="btn btn-primary" style={{ width: '100%' }} disabled={loading}>{loading ? 'Procesando...' : 'Actualizar'}</button>
            </form>
        );
    };

    // ============================================================
    // 40. NOTES PAGE
    // ============================================================

    const NotesPage = ({ onNavigate, initialAction, clearInitialAction }) => {
        const { notes, refreshAllData, addToast, user } = useApp();
        const [search, setSearch] = useState('');
        const [showForm, setShowForm] = useState(initialAction === 'new');
        const [editing, setEditing] = useState(null);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);

        useEffect(() => {
            if (initialAction === 'new') {
                setShowForm(true); setEditing(null);
                if (clearInitialAction) clearInitialAction();
            }
        }, [initialAction, clearInitialAction]);

        const filtered = useMemo(() => {
            let result = Array.isArray(notes) ? [...notes] : [];
            if (search.trim()) {
                const term = search.toLowerCase().trim();
                result = result.filter(n => (getSafeString(n.titulo)).toLowerCase().includes(term) || (getSafeString(n.contenido)).toLowerCase().includes(term));
            }
            result.sort((a, b) => {
                if (a.fijada && !b.fijada) return -1;
                if (!a.fijada && b.fijada) return 1;
                return new Date(b.fechaModificacion || b.fechaCreacion) - new Date(a.fechaModificacion || a.fechaCreacion);
            });
            return result;
        }, [notes, search]);

        const handleSave = async (data) => {
            if (!data.contenido || !data.contenido.trim()) { addToast('Contenido vacío', 'error'); return false; }
            try {
                await initDatabase();
                const now = new Date().toISOString();
                let savedId;
                if (editing) { await db.notes.update(editing.id, { titulo: (data.titulo || '').trim(), contenido: data.contenido, fechaModificacion: now, syncStatus: 'pending' }); savedId = editing.id; }
                else {
                    savedId = await db.notes.add({ userId: user.id, ownerId: user.id, ownerRole: user.role || 'lender', ownerCode: user.employeeCode || null, titulo: (data.titulo || '').trim(), contenido: data.contenido, fechaCreacion: now, fechaModificacion: now, fijada: false, syncStatus: 'pending', remoteId: null });
                }
                if (SyncAdapter.isOnline()) { const saved = await db.notes.get(savedId); await SyncAdapter.pushRecord('notes', saved); }
                await refreshAllData();
                setShowForm(false); setEditing(null);
                addToast(editing ? 'Actualizada' : 'Creada', 'success');
                return true;
            } catch (err) { addToast('Error', 'error'); return false; }
        };

        const handleTogglePin = async (note, e) => {
            if (e) e.stopPropagation();
            try {
                await db.notes.update(note.id, { fijada: !note.fijada, fechaModificacion: new Date().toISOString(), syncStatus: 'pending' });
                await refreshAllData();
                addToast(note.fijada ? 'Desfijada' : 'Fijada', 'success');
            } catch (err) { addToast('Error', 'error'); }
        };

        const handleDeleteConfirm = async () => {
            if (!showDeleteConfirm) return;
            try {
                if (showDeleteConfirm.remoteId && supabase) { try { await supabase.from('notes').delete().eq('id', showDeleteConfirm.remoteId); } catch (e) {} }
                await db.notes.delete(showDeleteConfirm.id);
                await refreshAllData();
                addToast('Nota eliminada', 'success');
                setShowDeleteConfirm(null);
            } catch (err) { addToast('Error', 'error'); }
        };

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('more')} className="back-btn"><IconSVG.ArrowLeft /> Volver</button>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                    <div style={{ fontSize: '26px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <span style={{ color: 'var(--accent-light)' }}><IconSVG.Note /></span> Notas
                    </div>
                    <button className="btn btn-primary btn-sm" onClick={() => { setEditing(null); setShowForm(true); }}><IconSVG.Plus /> Nueva</button>
                </div>
                <div style={{ position: 'relative', marginBottom: '14px' }}>
                    <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }}><IconSVG.Search /></span>
                    <input type="text" placeholder="Buscar..." value={search} onChange={e => setSearch(e.target.value)} className="glass-input" style={{ paddingLeft: '38px' }} />
                </div>
                {filtered.length === 0 ? (
                    <EmptyState icon={<IconSVG.Note />} title={search ? 'Sin resultados' : 'Sin notas'}
                        action={!search && (<button className="btn btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}><IconSVG.Plus /> Crear primera nota</button>)} />
                ) : filtered.map(note => (

    const NoteForm = ({ initial, onSave, onCancel }) => {
        const [titulo, setTitulo] = useState(getSafeString(initial?.titulo));
        const [contenido, setContenido] = useState(getSafeString(initial?.contenido));
        const [saving, setSaving] = useState(false);
        const textareaRef = useRef(null);

        useEffect(() => {
            if (!initial && textareaRef.current) setTimeout(() => textareaRef.current?.focus(), 300);
        }, [initial]);

        const handleSubmit = async (e) => {
            e.preventDefault();
            if (!contenido.trim()) return;
            setSaving(true);
            const result = await onSave({ titulo, contenido });
            setSaving(false);
            if (result === false) return;
        };

        return (
            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                <div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Título (opcional)</label><input type="text" value={titulo} onChange={e => setTitulo(e.target.value)} className="glass-input" maxLength={120} /></div>

        const [filterEmp, setFilterEmp] = useState('all');
        const empIds = (linkedEmployees || []).map(e => e.id);
        const allOwnerIds = [user.id, ...empIds];
        const visibleLoans = (loans || []).filter(l => allOwnerIds.includes(l.ownerId || l.userId));
        const filtered = filterEmp === 'all' ? visibleLoans : visibleLoans.filter(l => (l.ownerId || l.userId) === parseInt(filterEmp));
        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Préstamos del negocio</div>
                <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>
                    <button onClick={() => setFilterEmp('all')} className="btn btn-ghost btn-sm" style={{ background: filterEmp === 'all' ? 'rgba(245,158,11,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>Todos</button>
                    {(linkedEmployees || []).map(emp => (
                        <button key={emp.id} onClick={() => setFilterEmp(emp.id)} className="btn btn-ghost btn-sm"
                            style={{ background: filterEmp === String(emp.id) ? 'rgba(245,158,11,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>
                            {emp.fullName || emp.employeeCode}
                        </button>
                    ))}
                </div>
                {filtered.length === 0 ? (
                    <EmptyState icon={<IconSVG.Briefcase />} title="Sin préstamos" />
                ) : filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).map(l => {
                    const c = (clients || []).find(cl => cl.id === l.clientId);
                    const owner = (linkedEmployees || []).find(e => e.id === (l.ownerId || l.userId));
                    return (
                        <div key={l.id} className="glass-card" style={{ padding: '14px', marginBottom: '8px' }} onClick={() => onNavigate('loanDetail', l.id)}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                                <div>
                                    <div style={{ fontSize: '13px', fontWeight: '600' }}>{c?.fullName || 'Cliente'}</div>
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>#{l.loanNumber} · {owner ? owner.fullName || owner.employeeCode : 'Negocio'}</div>
                                </div>
                                <span className={`badge ${l.status === 'overdue' ? 'badge-danger' : l.status === 'lost' ? 'badge-loss' : l.status === 'finished' ? 'badge-info' : 'badge-success'}`}>{getStatusLabel(l.status)}</span>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--text-muted)' }}>
                                <span>{formatCurrency(l.totalPaid || 0)} / {formatCurrency(l.totalRepayment || 0)}</span>
                                <span>{(l.progress || 0).toFixed(0)}%</span>
                            </div>
                        </div>
                    );
                })}
            </div>
        );
    };

    const CobrosBossPage = ({ onNavigate }) => {
        const { user, payments, loans, clients, linkedEmployees } = useApp();
        const [filterPeriod, setFilterPeriod] = useState('month');
        const empIds = (linkedEmployees || []).map(e => e.id);
        const allOwnerIds = [user.id, ...empIds];
        const visibleLoans = (loans || []).filter(l => allOwnerIds.includes(l.ownerId || l.userId));
        const loanIds = visibleLoans.map(l => l.id);
        const visiblePayments = (payments || []).filter(p => loanIds.includes(p.loanId));
        const dateRange = useMemo(() => {
            const now = new Date();
            switch (filterPeriod) {
                case 'today': return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999)) };
                case 'week': const dow = now.getUTCDay() || 7; return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - dow + 1, 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999)) };
                default: return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999)) };
            }
        }, [filterPeriod]);
        const filtered = visiblePayments.filter(p => { const d = new Date(p.paymentDate || p.createdAt); return d >= dateRange.start && d <= dateRange.end; });
        const total = normalizeMoney(filtered.reduce((s, p) => s + (p.amount || 0), 0));
        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Cobros del negocio</div>
                <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>
                    {[{ id: 'today', label: 'Hoy' }, { id: 'week', label: 'Semana' }, { id: 'month', label: 'Mes' }].map(p => (
                        <button key={p.id} onClick={() => setFilterPeriod(p.id)} className="btn btn-ghost btn-sm"
                            style={{ background: filterPeriod === p.id ? 'rgba(245,158,11,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>{p.label}</button>
                    ))}
                </div>
                <div className="glass-card disabled" style={{ padding: '14px', marginBottom: '14px', textAlign: 'center' }}>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Total cobrado ({filtered.length} pagos)</div>
                    <AnimatedNumber value={total} style={{ fontSize: '22px', fontWeight: '700', color: 'var(--success)', display: 'block' }} />
                </div>
                {filtered.length === 0 ? (
                    <EmptyState icon={<IconSVG.Receipt />} title="Sin cobros" />
                ) : filtered.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate)).slice(0, 100).map(p => {
                    const loan = visibleLoans.find(l => l.id === p.loanId);
                    const client = loan ? (clients || []).find(c => c.id === loan.clientId) : null;
                    const owner = (linkedEmployees || []).find(e => e.id === (loan?.ownerId || loan?.userId));
                    return (
                        <div key={p.id} style={{ padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: 'var(--radius-sm)', marginBottom: '6px', borderLeft: `3px solid ${p.paymentType === 'full_installment' ? 'var(--success)' : 'var(--warning)'}` }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                                <div>
                                    <div style={{ fontSize: '12px', fontWeight: '500' }}>{client?.fullName || 'Cliente'}</div>
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{formatDateTime(p.paymentDate)} {owner ? `· ${owner.fullName || owner.employeeCode}` : ''}</div>
                                </div>
                                <div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--accent-light)' }}>{formatCurrency(p.amount)}</div>
                            </div>
                        </div>
                    );
                })}
            </div>
        );
    };

    const MoraBossPage = ({ onNavigate }) => {
        const { user, loans, clients, installments, linkedEmployees } = useApp();
        const [filterEmp, setFilterEmp] = useState('all');
        const empIds = (linkedEmployees || []).map(e => e.id);
        const allOwnerIds = [user.id, ...empIds];
        const visibleLoans = (loans || []).filter(l => allOwnerIds.includes(l.ownerId || l.userId));
        const loanIds = visibleLoans.map(l => l.id);
        const visibleInstallments = (installments || []).filter(i => loanIds.includes(i.loanId));
        const overdueList = visibleInstallments.filter(i => i.status === 'overdue');
        const moraByClient = useMemo(() => {
            const map = new Map();
            for (const inst of overdueList) {
                const loan = visibleLoans.find(l => l.id === inst.loanId);
                if (!loan) continue;
                if (filterEmp !== 'all' && (loan.ownerId || loan.userId) !== parseInt(filterEmp)) continue;
                const client = (clients || []).find(c => c.id === loan.clientId);
                if (!client) continue;
                const key = `${client.id}-${loan.id}`;
                if (!map.has(key)) {
                    const owner = (linkedEmployees || []).find(e => e.id === (loan.ownerId || loan.userId));
                    map.set(key, { client, loan, owner, installments: [], totalOverdue: 0, maxMoraDays: 0 });
                }
                const entry = map.get(key);
                entry.installments.push(inst);
                entry.totalOverdue += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst));
                entry.maxMoraDays = Math.max(entry.maxMoraDays, inst.moraDays || 0);
            }
            return Array.from(map.values()).sort((a, b) => b.maxMoraDays - a.maxMoraDays);
        }, [overdueList, visibleLoans, clients, linkedEmployees, filterEmp]);
        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Clientes en mora</div>
                <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>
                    <button onClick={() => setFilterEmp('all')} className="btn btn-ghost btn-sm" style={{ background: filterEmp === 'all' ? 'rgba(239,68,68,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>Todos</button>
                    {(linkedEmployees || []).map(emp => (
                        <button key={emp.id} onClick={() => setFilterEmp(emp.id)} className="btn btn-ghost btn-sm"
                            style={{ background: filterEmp === String(emp.id) ? 'rgba(239,68,68,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>
                            {emp.fullName || emp.employeeCode}
                        </button>
                    ))}
                </div>
                {moraByClient.length === 0 ? (
                    <EmptyState icon={<IconSVG.Check />} title="Sin clientes en mora" />
                ) : moraByClient.map((m, idx) => (
                    <div key={idx} style={{ padding: '14px', background: 'rgba(239,68,68,0.04)', border: '1px solid rgba(239,68,68,0.15)', borderLeft: '3px solid var(--danger)', borderRadius: 'var(--radius-md)', marginBottom: '8px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                            <div>
                                <div style={{ fontSize: '13px', fontWeight: '600' }}>{m.client.fullName || 'Cliente'}</div>
                                <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>#{m.loan.loanNumber} {m.owner ? `· ${m.owner.fullName || m.owner.employeeCode}` : ''}</div>
                            </div>
                            <span className="badge badge-danger">{m.maxMoraDays}d</span>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', fontSize: '11px' }}>
                            <div><div style={{ color: 'var(--text-muted)' }}>Vencido</div><div style={{ fontWeight: '700', color: 'var(--danger)' }}>{formatCurrency(m.totalOverdue)}</div></div>
                            <div><div style={{ color: 'var(--text-muted)' }}>Cuotas</div><div style={{ fontWeight: '700' }}>{m.installments.length}</div></div>
                        </div>
                    </div>
                ))}
            </div>
        );
    };

    // ============================================================
    // 45. MIGRATION PROMPT
    // ============================================================

    const MigrationPrompt = ({ onClose }) => {
        const { user, addToast, refreshAllData } = useApp();
        const [migrating, setMigrating] = useState(false);
        const [stats, setStats] = useState(null);

        const handleMigrate = async () => {
            setMigrating(true);
            try {
                const result = await SyncAdapter.migrateAllLocalToRemote(user.id);
                if (result.ok) { setStats(result.stats); addToast(`Migración: ${result.stats.ok} subidos`, 'success'); await refreshAllData(); }
                else { addToast('Error', 'error'); }
            } catch (err) { addToast('Error', 'error'); }
            setMigrating(false);
        };

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <div className="migration-card">
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '12px' }}>
                            <span style={{ color: 'var(--accent-light)' }}><IconSVG.Upload /></span>
                            <div style={{ fontSize: '18px', fontWeight: '700' }}>Subir datos a la nube</div>
                        </div>
                        <div style={{ fontSize: '13px', color: 'var(--text-secondary)', lineHeight: '1.6', marginBottom: '16px' }}>
                            Tienes datos guardados localmente. ¿Quieres subirlos a Supabase para verlos desde otros dispositivos?
                            <br /><br />Los datos locales NO se borran.
                        </div>
                        {stats && (
                            <div style={{ padding: '12px', background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.2)', borderRadius: '10px', fontSize: '12px', color: 'var(--success-light)', marginBottom: '12px' }}>
                                ✓ Total: {stats.total} · Subidos: {stats.ok} · Fallidos: {stats.failed}
                            </div>
                        )}
                        <div style={{ display: 'flex', gap: '10px' }}>
                            <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose} disabled={migrating}>Después</button>
                            <button className="btn btn-primary" style={{ flex: 1 }} onClick={handleMigrate} disabled={migrating}>
                                {migrating ? <span className="spinner" style={{ width: '16px', height: '16px' }}></span> : <><IconSVG.Upload /> Subir ahora</>}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // ============================================================
    // 46. APP PRINCIPAL
    // ============================================================

    const App = () => {
        const [appState, setAppState] = useState('loading');
        const [selectedRole, setSelectedRole] = useState(null);
        const [user, setUser] = useState(null);
        const [page, setPage] = useState('dashboard');
        const [params, setParams] = useState({});
        const [showFab, setShowFab] = useState(true);
        const [notesInitialAction, setNotesInitialAction] = useState(null);
        const [showMigrationPrompt, setShowMigrationPrompt] = useState(false);
        const [bootMessage, setBootMessage] = useState('Iniciando Loans W...');

        useEffect(() => {
            let cancelled = false;
            const boot = async () => {
                try {
                    console.log('[BOOT] Iniciando...');
                    setBootMessage('Abriendo base de datos...');
                    await initDatabase();

                    setBootMessage('Verificando conexión...');
                    let waited = 0;
                    while (!supabase && waited < 5000) { await new Promise(r => setTimeout(r, 300)); waited += 300; }

                    if (cancelled) return;

                    if (!supabase) {
                        console.warn('[BOOT] Supabase no disponible, modo local');
                        setBootMessage('Modo offline — Sin conexión a la nube');
                        // Buscar usuario local
                        const localUsers = await db.users.toArray();
                        if (localUsers.length > 0) {
                            setUser({ ...localUsers[0], _offlineMode: true });
                            setAppState('main');
                        } else {
                            setAppState('roleSelection');
                        }
                        return;
                    }

                    setBootMessage('Verificando sesión...');
                    const u = await AuthManager.getCurrentSession();
                    if (cancelled) return;

                    if (u) {
                        console.log('[BOOT] Sesión activa:', u.fullName);
                        setUser(u);
                        if (u.role === 'boss') setPage('panelJefe');
                        setAppState('main');
                    } else {
                        setAppState('roleSelection');
                    }
                } catch (err) {
                    console.error('[BOOT] Error:', err);
                    if (!cancelled) setAppState('roleSelection');
                }
            };
            boot();
            return () => { cancelled = true; };
        }, []);

        const handleSelectRole = useCallback((role) => { setSelectedRole(role); setAppState('login'); }, []);
        const handleBackToRoles = useCallback(() => { setSelectedRole(null); setAppState('roleSelection'); }, []);
        const handleLogin = useCallback((u) => { setUser(u); if (u.role === 'boss') setPage('panelJefe'); else setPage('dashboard'); setAppState('main'); }, []);
        const handleLogout = useCallback(async () => { await AuthManager.logout(); setUser(null); setSelectedRole(null); setPage('dashboard'); setAppState('roleSelection'); }, []);
        const handleUserUpdate = useCallback((updatedUser) => { setUser(updatedUser); }, []);

        const navigate = useCallback((p, ...a) => {
            setPage(p); setParams(a);
            const hideFabPages = ['createLoan', 'editLoan', 'loanDetail', 'clientDetail', 'more', 'expenses', 'simulator', 'notes', 'lostDebts', 'miCuentaEmpleado', 'perfilSupervision', 'panelJefe', 'empleadosBoss', 'prestamosBoss', 'cobrosBoss', 'moraBoss'];
            setShowFab(!hideFabPages.includes(p));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        const handleFabAction = useCallback((action) => {
            if (action === 'client') navigate('clients');
            else if (action === 'loan') navigate('createLoan');
            else if (action === 'payment') navigate('collections');
            else if (action === 'note') { setNotesInitialAction('new'); navigate('notes'); }
            else if (action === 'expense') navigate('expenses');
            else if (action === 'simulator') navigate('simulator');
            else if (action === 'addEmployee') navigate('empleadosBoss');
        }, [navigate]);

        const renderPage = () => {
            const content = (() => {
                if (user?.role === 'boss') {
                    switch (page) {
                        case 'panelJefe': return <PanelJefe onNavigate={navigate} />;
                        case 'empleadosBoss': return <EmpleadosBossPage onNavigate={navigate} />;
                        case 'prestamosBoss': return <PrestamosBossPage onNavigate={navigate} />;
                        case 'cobrosBoss': return <CobrosBossPage onNavigate={navigate} />;
                        case 'moraBoss': return <MoraBossPage onNavigate={navigate} />;
                        case 'perfilSupervision': return <PerfilSupervision employeeId={params[0]} onNavigate={navigate} />;
                        case 'loanDetail': return <LoanDetailPage id={params[0]} onNavigate={navigate} />;
                        case 'more': return <MorePage onNavigate={navigate} />;
                        case 'notes': return <NotesPage onNavigate={navigate} initialAction={notesInitialAction} clearInitialAction={() => setNotesInitialAction(null)} />;
                        default: return <PanelJefe onNavigate={navigate} />;
                    }
                }
                switch (page) {
                    case 'dashboard': return <DashboardPage onNavigate={navigate} />;
                    case 'clients': return <ClientsPage onNavigate={navigate} />;
                    case 'clientDetail': return <ClientDetailPage id={params[0]} onNavigate={navigate} />;
                    case 'loans': return <LoansPage onNavigate={navigate} />;
                    case 'createLoan': return <CreateLoanPage preselectedClientId={params[0]} simulatorData={params[1]} onNavigate={navigate} />;
                    case 'editLoan': return <EditLoanPage id={params[0]} onNavigate={navigate} />;
                    case 'loanDetail': return <LoanDetailPage id={params[0]} onNavigate={navigate} />;
                    case 'collections': return <CollectionsPage onNavigate={navigate} />;
                    case 'finance': return <FinancePage onNavigate={navigate} />;
                    case 'lostDebts': return <LostDebtsPage onNavigate={navigate} />;
                    case 'expenses': return <ExpensesPage onNavigate={navigate} />;
                    case 'simulator': return <SimulatorPage onNavigate={navigate} />;
                    case 'notes': return <NotesPage onNavigate={navigate} initialAction={notesInitialAction} clearInitialAction={() => setNotesInitialAction(null)} />;
                    case 'more': return <MorePage onNavigate={navigate} />;
                    case 'miCuentaEmpleado': return <MiCuentaEmpleado onNavigate={navigate} />;
                    default: return <DashboardPage onNavigate={navigate} />;
                }
            })();
            return <div key={page} className="page-transition">{content}</div>;
        };

        if (appState === 'loading') return <LoadingScreen message={bootMessage} />;
        if (appState === 'roleSelection') return <RoleSelectionScreen onSelectRole={handleSelectRole} />;
        if (appState === 'login') return <LoginScreen role={selectedRole} onLogin={handleLogin} onBackToRoles={handleBackToRoles} />;

        return (
            <AppProvider user={user} onLogout={handleLogout} onUserUpdate={handleUserUpdate}>
                <div style={{ minHeight: '100vh', minHeight: '100dvh', background: 'var(--bg-deep)' }}>
                    {user && user._offlineMode && (
                        <div style={{ padding: '8px 12px', background: 'rgba(245,158,11,0.15)', border: '1px solid rgba(245,158,11,0.3)', color: 'var(--warning-light)', fontSize: '11px', textAlign: 'center' }}>
                            ⚠️ Modo local — Sin conexión a Supabase. Los cambios no se sincronizarán.
                        </div>
                    )}
                    {renderPage()}
                    {showFab && <FAB onAction={handleFabAction} />}
                    <BottomNav page={page} onNavigate={navigate} />
                    <ToastContainer />
                    {showMigrationPrompt && <MigrationPrompt onClose={() => setShowMigrationPrompt(false)} />}
                </div>
            </AppProvider>
        );
    };

    // ============================================================
    // 47. ERROR BOUNDARY — FIX C (previene pantalla negra)
    // ============================================================

    class ErrorBoundary extends React.Component {
        constructor(props) {
            super(props);
            this.state = { hasError: false, error: null, errorInfo: null };
        }
        static getDerivedStateFromError(error) {
            return { hasError: true, error };
        }
        componentDidCatch(error, errorInfo) {
            console.error('[ERROR BOUNDARY]', error, errorInfo);
            this.setState({ errorInfo });
        }
        render() {
            if (this.state.hasError) {
                return (
                    <div style={{
                        minHeight: '100vh',
                        background: '#060610',
                        color: '#f1f5f9',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        justifyContent: 'center',
                        padding: '24px',
                        fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif'
                    }}>
                        <div style={{ fontSize: '56px', marginBottom: '16px' }}>⚠️</div>
                        <div style={{ fontSize: '20px', fontWeight: '700', marginBottom: '8px', textAlign: 'center' }}>Algo salió mal</div>
                        <div style={{ fontSize: '13px', color: '#94a3b8', marginBottom: '24px', maxWidth: '400px', textAlign: 'center', lineHeight: '1.6' }}>
                            {this.state.error?.message || 'Error inesperado en la aplicación.'}
                        </div>
                        <div style={{ display: 'flex', gap: '10px', marginBottom: '20px' }}>
                            <button
                                onClick={() => { this.setState({ hasError: false, error: null, errorInfo: null }); }}
                                style={{ padding: '11px 22px', borderRadius: '12px', fontSize: '14px', fontWeight: '600', background: 'rgba(255,255,255,0.04)', color: '#f1f5f9', border: '1px solid rgba(255,255,255,0.1)', cursor: 'pointer' }}>
                                Reintentar
                            </button>
                            <button
                                onClick={() => window.location.reload()}
                                style={{ padding: '11px 22px', borderRadius: '12px', fontSize: '14px', fontWeight: '600', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', color: '#fff', border: 'none', cursor: 'pointer' }}>
                                Recargar app
                            </button>
                        </div>
                        <details style={{ maxWidth: '500px', width: '100%', fontSize: '11px', color: '#64748b' }}>
                            <summary style={{ cursor: 'pointer', marginBottom: '8px' }}>Ver detalles técnicos</summary>
                            <pre style={{ background: 'rgba(255,255,255,0.03)', padding: '12px', borderRadius: '8px', overflow: 'auto', fontSize: '10px', lineHeight: '1.4' }}>
                                {String(this.state.error?.stack || this.state.error || '')}
                            </pre>
                        </details>
                    </div>
                );
            }
            return this.props.children;
        }
    }

    // ============================================================
    // 48. RENDER FINAL
    // ============================================================

    ReactDOM.render(
        <ErrorBoundary>
            <App />
        </ErrorBoundary>,
        document.getElementById('root')
    );

    console.log('========================================');
    console.log('LOANS W v12.1 — FIXES APLICADOS');
    console.log('========================================');
    console.log('✅ Fix A: waitForSupabase + retry en AuthManager');
    console.log('✅ Fix B: PerfilSupervision con hooks al inicio');
    console.log('✅ Fix C: ErrorBoundary global');
    console.log('========================================');
</script>
</body>
</html>
