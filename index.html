    const FinancePage = ({ onNavigate }) => {
        const { installments, payments, loans, expenses, capitalMovements, lostDebts, recoveryMovements, lossCompensations, refreshKey } = useApp();
        const [showNetProfitDetail, setShowNetProfitDetail] = useState(false);
        const now = new Date();
        const currentYear = now.getUTCFullYear();
        const currentMonth = now.getUTCMonth() + 1;

        const metrics = useMemo(() => {
            const safeLoans = Array.isArray(loans) ? loans.filter(l => l && typeof l === 'object') : [];
            const safeInstallments = Array.isArray(installments) ? installments.filter(i => i && typeof i === 'object') : [];
            const safePayments = Array.isArray(payments) ? payments.filter(p => p && typeof p === 'object') : [];
            const safeExpenses = Array.isArray(expenses) ? expenses.filter(e => e && typeof e === 'object') : [];
            const safeCapitalMovements = Array.isArray(capitalMovements) ? capitalMovements.filter(m => m && typeof m === 'object') : [];
            const safeLostDebts = Array.isArray(lostDebts) ? lostDebts.filter(d => d && typeof d === 'object') : [];

            const activeLoans = safeLoans.filter(l => l.status === 'active' || l.status === 'overdue');

            const allCapitalIn = normalizeMoney(safeCapitalMovements.filter(m => {
                if (m.type !== 'initial' && m.type !== 'income') return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const allCapitalOut = normalizeMoney(safeCapitalMovements.filter(m => {
                if (m.type !== 'loan' && m.type !== 'expense' && m.type !== 'withdrawal') return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const allPaymentsIn = normalizeMoney(safeCapitalMovements.filter(m => {
                if (m.type !== 'payment' && m.type !== 'recovery') return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const totalCapital = normalizeMoney(allCapitalIn - allCapitalOut + allPaymentsIn);
            const totalLent = normalizeMoney(activeLoans.reduce((s, l) => s + (Number(l?.principal) || 0), 0));
            const availableCapital = normalizeMoney(totalCapital - totalLent);

            const lossState = LossCompensationEngine.calculateState(
                safeLostDebts, recoveryMovements || [], lossCompensations || []
            );
            const totalLostCapital = lossState.totalLostCapital;
            const totalRecoveredCapital = lossState.totalRecovered;
            const totalPendingLost = lossState.totalPending;

            const monthPayments = safePayments.filter(p => {
                if (!p.paymentDate) return false;
                const d = new Date(p.paymentDate);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            let collectedCapital = 0, collectedInterest = 0, collectedMora = 0;
            for (const p of monthPayments) {
                const bd = p.breakdown || {};
                collectedCapital += normalizeMoney(bd.capital || 0);
                collectedInterest += normalizeMoney(bd.interest || 0);
                collectedMora += normalizeMoney(bd.mora || 0);
            }
            const collectedAmount = normalizeMoney(collectedCapital + collectedInterest + collectedMora);
            const collectedProfit = normalizeMoney(collectedInterest + collectedMora);

            const monthExpenses = safeExpenses.filter(e => {
                if (!e.date) return false;
                const d = new Date(e.date);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            const totalExpenses = normalizeMoney(monthExpenses.reduce((s, e) => s + (e.amount || 0), 0));

            const monthInstallments = safeInstallments.filter(i => {
                if (!i.dueDate) return false;
                const d = new Date(i.dueDate);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            const expectedAmount = normalizeMoney(monthInstallments.reduce((s, i) => s + (i.totalAmount || 0), 0));

            const monthCompensations = (lossCompensations || []).filter(c => {
                const d = new Date(c.appliedAt || c.createdAt);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            const monthInterestComp = normalizeMoney(
                monthCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0)
            );

            const availableProfit = normalizeMoney(collectedProfit - monthInterestComp - totalExpenses);
            const netProfit = normalizeMoney(availableProfit);

            return {
                totalCapital, totalLent, availableCapital,
                collectedAmount,
                collectedCapital: normalizeMoney(collectedCapital),
                collectedInterest: normalizeMoney(collectedInterest),
                collectedMora: normalizeMoney(collectedMora),
                collectedProfit,
                expectedAmount, totalExpenses,
                totalLostCapital, totalRecoveredCapital, totalPendingLost,
                monthInterestComp,
                availableProfit,
                netProfit,
                pending: normalizeMoney(expectedAmount - collectedAmount),
                compliance: expectedAmount > 0 ? normalizeMoney((collectedAmount / expectedAmount) * 100) : 0,
                lostDebtsCount: safeLostDebts.length,
                activeLoansCount: activeLoans.length
            };
        }, [loans, installments, payments, capitalMovements, expenses, lostDebts, recoveryMovements, lossCompensations, currentYear, currentMonth, refreshKey]);

        const porRecuperar = useMemo(() => {
            const safeLoans = Array.isArray(loans) ? loans.filter(l => l && typeof l === 'object') : [];
            const safeInstallments = Array.isArray(installments) ? installments.filter(i => i && typeof i === 'object') : [];
            const activeLoans = safeLoans.filter(l => l.status === 'active' || l.status === 'overdue');
            let total = 0;
            for (const loan of activeLoans) {
                const loanInsts = safeInstallments.filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled');
                for (const inst of loanInsts) {
                    total += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst));
                }
            }
            return normalizeMoney(total);
        }, [loans, installments, refreshKey]);

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Finanzas</div>

                <div className="glass-card disabled" style={{ padding: '20px', marginBottom: '14px', textAlign: 'center' }}>
                    <div style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>

                    </div>
                    <AnimatedNumber value={metrics.totalCapital}
                        duration={1100}
                        style={{ fontSize: '32px', fontWeight: '700', color: 'var(--accent-light)', display: 'block' }} />
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                    <div className="glass-card disabled" style={{ padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Capital prestado</div>
                        <AnimatedNumber value={metrics.totalLent}
                            style={{ fontSize: '18px', fontWeight: '700', display: 'block' }} />
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Disponible</div>
                        <AnimatedNumber value={metrics.availableCapital}
                            style={{ fontSize: '18px', fontWeight: '700', color: 'var(--success)', display: 'block' }} />
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Cobrado (mes)</div>
                        <AnimatedNumber value={metrics.collectedAmount}
                            style={{ fontSize: '18px', fontWeight: '700', color: 'var(--success)', display: 'block' }} />
                    </div>
                    <div className="glass-card" style={{ padding: '14px', textAlign: 'center' }}
                        onClick={() => setShowNetProfitDetail(true)}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Utilidad disponible</div>
                        <AnimatedNumber value={metrics.availableProfit}
                            style={{
                                fontSize: '18px', fontWeight: '700',
                                color: metrics.availableProfit >= 0 ? 'var(--success)' : 'var(--danger)',
                                display: 'block'
                            }} />
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)', marginTop: '2px' }}>
                            Toca para ver detalle
                        </div>
                    </div>
                </div>

                <div className="glass-card" style={{ padding: '16px', marginBottom: '14px' }}
                    onClick={() => onNavigate('collections')}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                        <span style={{
                            fontSize: '11px', color: 'var(--text-secondary)',
                            textTransform: 'uppercase', fontWeight: '600', letterSpacing: '0.04em'
                        }}>
                            Por recuperar (préstamos activos)
                        </span>
                        <span className="badge badge-info">{metrics.activeLoansCount} préstamos</span>
                    </div>
                    <AnimatedNumber value={porRecuperar}
                        style={{
                            fontSize: '24px', fontWeight: '700',
                            color: 'var(--accent-light)',
                            display: 'block', marginBottom: '4px'
                        }} />
                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                        Dinero pendiente de cobro. Disminuye con cada pago.
                    </div>
                </div>

                <div style={{ marginBottom: '14px' }}>
                    <div style={{
                        fontSize: '11px', fontWeight: '600',
                        color: 'var(--text-secondary)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em', marginBottom: '10px'
                    }}>
                        Pérdidas y recuperaciones
                    </div>

                    <div className="glass-card" style={{ padding: '16px', marginBottom: '8px' }}
                        onClick={() => onNavigate('lostDebts')}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <span style={{ color: 'var(--danger)' }}><IconSVG.Lost /></span>
                                <span style={{ fontSize: '14px', fontWeight: '600' }}>Pérdidas por recuperar</span>
                            </div>
                            <IconSVG.ArrowLeft />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', textAlign: 'center' }}>
                            <div>
                                <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Perdido</div>
                                <div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--danger-light)' }}>
                                    {formatCurrency(metrics.totalLostCapital)}
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Recuperado</div>
                                <div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--recovery)' }}>
                                    {formatCurrency(metrics.totalRecoveredCapital)}
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Pendiente</div>
                                <div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--warning)' }}>
                                    {formatCurrency(metrics.totalPendingLost)}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '12px' }}>
                    <div style={{
                        fontSize: '11px', fontWeight: '600',
                        color: 'var(--text-secondary)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.04em', marginBottom: '10px'
                    }}>
                        Ganancia generada este mes
                    </div>
                    <div className="financial-detail-row">
                        <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Intereses cobrados</span>
                        <span style={{ fontWeight: '600', color: 'var(--warning-light)' }}>
                            {formatCurrency(metrics.collectedInterest)}
                        </span>
                    </div>
                    <div className="financial-detail-row">
                        <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Mora cobrada</span>
                        <span style={{ fontWeight: '600', color: 'var(--danger-light)' }}>
                            {formatCurrency(metrics.collectedMora)}
                        </span>
                    </div>
                    <div className="financial-detail-row total">
                        <span style={{ color: 'var(--text-secondary)' }}>Total ganancia</span>
                        <span style={{ color: 'var(--success)' }}>{formatCurrency(metrics.collectedProfit)}</span>
                    </div>
                    {metrics.monthInterestComp > 0 && (
                        <>
                            <div className="financial-detail-row">
                                <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>→ Aplicado a pérdidas</span>
                                <span style={{ fontWeight: '600', color: 'var(--accent-light)' }}>
                                    −{formatCurrency(metrics.monthInterestComp)}
                                </span>
                            </div>
                            <div className="financial-detail-row">
                                <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>→ Utilidad disponible</span>
                                <span style={{ fontWeight: '600', color: metrics.availableProfit >= 0 ? 'var(--success)' : 'var(--danger)' }}>
                                    {formatCurrency(metrics.availableProfit)}
                                </span>
                            </div>
                        </>
                    )}
                </div>

                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '12px' }}>
                    <div style={{
                        fontSize: '11px', fontWeight: '600',
                        color: 'var(--text-secondary)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.04em', marginBottom: '10px'
                    }}>
                        Gastos del mes
                    </div>
                    <AnimatedNumber value={metrics.totalExpenses || 0}
                        style={{ fontSize: '22px', fontWeight: '700', color: 'var(--danger)', display: 'block' }} />
                </div>

                <button className="btn btn-primary" style={{ width: '100%', marginBottom: '8px' }} 
                    onClick={() => onNavigate('expenses')}>
                    <IconSVG.TrendingUp /> Ver gastos
                </button>
                <button className="btn btn-ghost" style={{ width: '100%' }} 
                    onClick={() => setShowNetProfitDetail(true)}>
                    <IconSVG.ChartBar /> Ver detalle de utilidad
                </button>

                <NetProfitDetailModal
                    isOpen={showNetProfitDetail}
                    onClose={() => setShowNetProfitDetail(false)}
                />
            </div>
        );
    };

    // ============================================================
    // 29. COMPONENT: EXPENSES PAGE
    // ============================================================

    const ExpensesPage = ({ onNavigate }) => {
        const { expenses, expenseCategories, refreshAllData, addToast, user } = useApp();
        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);
        const [showDelete, setShowDelete] = useState(null);

        const safeExpenses = useMemo(() => 
            Array.isArray(expenses) ? expenses.filter(e => e && typeof e === 'object') : []
        , [expenses]);

        const now = new Date();
        const thisMonth = safeExpenses.filter(e => {
            if (!e.date) return false;
            const d = new Date(e.date);
            return d.getUTCMonth() === now.getUTCMonth() && d.getUTCFullYear() === now.getUTCFullYear();
        });
        const totalMonth = normalizeMoney(thisMonth.reduce((s, e) => s + (e.amount || 0), 0));

        const handleSave = async (data) => {
            if (!data.amount || data.amount <= 0) { addToast('Monto inválido', 'error'); return; }
            try {
                await initDatabase();
                const amount = normalizeMoney(parseFloat(data.amount));
                let savedId;
                if (editing) {
                    const oldExpense = await db.expenses.get(editing.id);
                    await db.expenses.update(editing.id, { ...data, amount, updatedAt: new Date().toISOString() });
                    savedId = editing.id;
                    if (oldExpense && oldExpense.capitalMovementId) {
                        await db.capitalMovements.update(oldExpense.capitalMovementId, {
                            amount, date: data.date, description: `Gasto: ${data.category}`
                        });
                    }
                } else {
                    savedId = await db.expenses.add({
                        ...data, amount, userId: user.id,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                    const cmId = await db.capitalMovements.add({
                        userId: user.id, type: 'expense', amount, date: data.date,
                        description: `Gasto: ${data.category}`,
                        referenceType: 'expense', referenceId: savedId,
                        createdAt: new Date().toISOString()
                    });
                    await db.expenses.update(savedId, { capitalMovementId: cmId });
                }
                await verifyPersistence(db.expenses, savedId);
                await refreshAllData();
                addToast(editing ? 'Gasto actualizado' : 'Gasto registrado', 'success');
                setShowForm(false);
                setEditing(null);
            } catch (err) {
                addToast('No se pudo guardar el gasto.', 'error');
            }
        };

        const handleDelete = async () => {
            if (!showDelete) return;
            try {
                if (showDelete.capitalMovementId) {
                    await db.capitalMovements.delete(showDelete.capitalMovementId);
                }
                await db.expenses.delete(showDelete.id);
                await refreshAllData();
                addToast('Gasto eliminado', 'success');
                setShowDelete(null);
            } catch (err) {
                addToast('Error al eliminar.', 'error');
            }
        };

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('finance')} className="back-btn">
                    <IconSVG.ArrowLeft /> Volver
                </button>

                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px' }}>
                    <div style={{ fontSize: '26px', fontWeight: '700' }}>Gastos</div>
                    <button className="btn btn-primary btn-sm" onClick={() => { setEditing(null); setShowForm(true); }}>
                        <IconSVG.Plus /> Registrar
                    </button>
                </div>

                <div className="glass-card disabled" style={{ padding: '14px', marginBottom: '14px', textAlign: 'center' }}>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Total del mes</div>
                    <AnimatedNumber value={totalMonth}
                        style={{ fontSize: '22px', fontWeight: '700', color: 'var(--danger)', display: 'block' }} />
                </div>

                {safeExpenses.length === 0 ? (
                    <EmptyState icon={<IconSVG.TrendingUp />} title="Sin gastos"
                        action={<button className="btn btn-primary btn-sm" onClick={() => { setEditing(null); setShowForm(true); }}>
                            + Registrar gasto
                        </button>} />
                ) : (
                    safeExpenses.sort((a, b) => new Date(b.date) - new Date(a.date)).map(e => (
                        <div key={e.id} className="glass-card" style={{
                            padding: '12px', marginBottom: '6px',
                            display: 'flex', justifyContent: 'space-between', alignItems: 'center'
                        }}>
                            <div style={{ flex: 1 }}>
                                <div style={{ fontSize: '13px', fontWeight: '500' }}>{getSafeString(e.category, 'Sin categoría')}</div>
                                <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                    {formatDate(e.date)}{e.description ? ` · ${e.description}` : ''}
                                </div>
                            </div>
                            <div style={{ textAlign: 'right', marginRight: '8px' }}>
                                <div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--danger)' }}>
                                    -{formatCurrency(e.amount)}
                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '4px' }}>
                                <button className="btn btn-ghost btn-sm" style={{ padding: '6px 8px' }}
                                    onClick={() => { setEditing(e); setShowForm(true); }}>
                                    <IconSVG.Edit3 />
                                </button>
                                <button className="btn btn-ghost btn-sm" style={{ padding: '6px 8px', color: 'var(--danger)' }}
                                    onClick={() => setShowDelete(e)}>
                                    <IconSVG.Trash2 />
                                </button>
                            </div>
                        </div>
                    ))
                )}

                {showForm && (
                    <div className="modal-overlay" onClick={() => { setShowForm(false); setEditing(null); }}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '18px' }}>
                                <div style={{ fontSize: '20px', fontWeight: '700' }}>
                                    {editing ? 'Editar gasto' : 'Registrar gasto'}
                                </div>
                                <button onClick={() => { setShowForm(false); setEditing(null); }} className="btn btn-ghost btn-sm">
                                    <IconSVG.X />
                                </button>
                            </div>
                            <ExpenseForm cats={expenseCategories} initial={editing} onSave={handleSave} onRefresh={refreshAllData} />
                        </div>
                    </div>
                )}

                {showDelete && (
                    <ConfirmDialog
                        title="Eliminar gasto"
                        message={`¿Eliminar gasto de ${formatCurrency(showDelete.amount)}?`}
                        confirmLabel="Eliminar"
                        confirmType="danger"
                        onConfirm={handleDelete}
                        onCancel={() => setShowDelete(null)}
                    />
                )}
            </div>
        );
    };

    // ============================================================
    // 30. COMPONENT: EXPENSE FORM
    // ============================================================

        const [f, setF] = useState({
            amount: initial?.amount?.toString() || '',
            category: getSafeString(initial?.category) || (cats && cats.length > 0 ? cats[0].name : 'Otros'),
            date: initial?.date?.split('T')[0] || formatDateLocal(todayLocal()),
            time: getSafeString(initial?.time),
            description: getSafeString(initial?.description),
            provider: getSafeString(initial?.provider),
            paymentMethod: getSafeString(initial?.paymentMethod) || 'Efectivo',
            notes: getSafeString(initial?.notes)
        });

            if (!newCatName.trim()) return;
            try {
                await db.expenseCategories.add({ name: newCatName.trim() });
                if (onRefresh) await onRefresh();
                setF(prev => ({ ...prev, category: newCatName.trim() }));
                setNewCatName('');
                setShowNewCat(false);
                addToast('Categoría agregada', 'success');
            } catch {
                addToast('Error al agregar categoría', 'error');
            }
        };

        return (
            <form onSubmit={e => { e.preventDefault(); onSave({ ...f, amount: parseFloat(f.amount) }); }}
                style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                <div>
                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Monto *</label>
                    <input type="number" value={f.amount} onChange={e => setF({ ...f, amount: e.target.value })} 
                        className="glass-input" required autoFocus />
                </div>

                <div>
                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Categoría</label>
                    {!showNewCat ? (
                        <div style={{ display: 'flex', gap: '6px' }}>
                            <select value={f.category} onChange={e => setF({ ...f, category: e.target.value })} 
                                className="glass-input" style={{ flex: 1 }}>
                                {(cats || []).map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                            </select>
                            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setShowNewCat(true)}>
                                <IconSVG.Plus />
                            </button>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', gap: '6px' }}>
                            <input type="text" value={newCatName} onChange={e => setNewCatName(e.target.value)}
                                className="glass-input" style={{ flex: 1 }} placeholder="Nueva categoría" autoFocus />
                            <button type="button" className="btn btn-success btn-sm" onClick={handleAddCategory}>
                                <IconSVG.Check />
                            </button>
                            <button type="button" className="btn btn-ghost btn-sm" onClick={() => setShowNewCat(false)}>
                                <IconSVG.X />
                            </button>
                        </div>
                    )}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                    <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Fecha</label>
                        <input type="date" value={f.date} onChange={e => setF({ ...f, date: e.target.value })} className="glass-input" />
                    </div>
                    <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Hora</label>
                        <input type="time" value={f.time} onChange={e => setF({ ...f, time: e.target.value })} className="glass-input" />
                    </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                    <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Método</label>
                        <select value={f.paymentMethod} onChange={e => setF({ ...f, paymentMethod: e.target.value })} className="glass-input">
                            <option>Efectivo</option>
                            <option>Transferencia</option>
                            <option>Nequi</option>
                            <option>Daviplata</option>
                            <option>Tarjeta</option>
                            <option>Otro</option>
                        </select>
                    </div>

        });
        const [simulation, setSimulation] = useState(null);
        const quickAmounts = [100000, 200000, 300000, 500000, 600000, 1000000, 2000000];
        const uf = (f, v) => setForm(p => ({ ...p, [f]: v }));

        const runSimulation = useCallback((f) => {
            if (!f.principal || !f.interestRate || !f.installmentsCount || parseInt(f.installmentsCount) <= 0) {
                setSimulation(null); return;
            }
            const p = normalizeMoney(parseFloat(f.principal));
            const r = parseFloat(f.interestRate);
            const c = parseInt(f.installmentsCount);
            if (isNaN(p) || isNaN(r) || isNaN(c) || p <= 0 || c <= 0) { setSimulation(null); return; }
            const result = InterestEngine.calculate({ principal: p, rate: r, count: c, type: f.interestType });
            const schedule = ScheduleEngine.generate({
                startDate: f.startDate, frequency: f.frequency, count: c, dueDateType: f.dueDateType
            });
            const scheduleDetails = schedule.map((date, i) => {
                const detail = result.details[i];
                const balance = normalizeMoney(p - result.details.slice(0, i + 1).reduce((s, d) => s + d.principal, 0));
                const daysLate = i === 0 ? 0 : Math.max(0, getCalendarDaysDiff(schedule[i], todayLocal()));
                const hypotheticalMora = normalizeMoney(MoraEngine.calculateMoraAmount({
                    remainingAmount: detail.total, moraType: f.moraType,
                    moraRate: parseFloat(f.moraRate), daysLate
                }));
                return { date, ...detail, balance: Math.max(0, balance), hypotheticalMora };
            });
            setSimulation({ ...result, schedule, scheduleDetails });
        }, []);

        useEffect(() => { runSimulation(form); }, [form, runSimulation]);

    const ChangePasswordForm = ({ onSuccess }) => {
        const [cp, setCp] = useState('');
        const [np, setNp] = useState('');
        const [cf, setCf] = useState('');
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);
        const { user } = useApp();

        const submit = async (e) => {
            e.preventDefault();
            setError('');
            if (!cp || !np || !cf) { setError('Completa todos los campos'); return; }
            if (np !== cf) { setError('No coinciden'); return; }
            if (np.length < 6) { setError('Mínimo 6 caracteres'); return; }
            setLoading(true);
            try {
                await initDatabase();
                const u = await db.users.get(user.id);
                if (!u) { setError('Usuario no encontrado'); setLoading(false); return; }
                const v = await SecurityUtils.verifyPassword(cp, u.passwordHash);
                if (!v) { setError('Contraseña actual incorrecta'); setLoading(false); return; }
                const nh = await SecurityUtils.hashPassword(np);
                await db.users.update(user.id, { passwordHash: nh });
                onSuccess();
            } catch (err) {
                setError('Error al cambiar la contraseña');
            }
            setLoading(false);
        };

        return (
            <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {error && <div style={{
                    padding: '10px', background: 'rgba(239,68,68,0.1)',

    const NotesPage = ({ onNavigate, initialAction, clearInitialAction }) => {
        const { notes, refreshAllData, addToast, user } = useApp();
        const [search, setSearch] = useState('');
        const [showForm, setShowForm] = useState(initialAction === 'new');
        const [editing, setEditing] = useState(null);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(null);

        useEffect(() => {
            if (initialAction === 'new') {
                setShowForm(true);
                setEditing(null);
                if (clearInitialAction) clearInitialAction();
            }
        }, [initialAction, clearInitialAction]);

        const filtered = useMemo(() => {
            let result = Array.isArray(notes) ? [...notes] : [];
            if (search.trim()) {
                const term = search.toLowerCase().trim();
                result = result.filter(n => 
                    (getSafeString(n.titulo)).toLowerCase().includes(term) ||
                    (getSafeString(n.contenido)).toLowerCase().includes(term)
                );
            }
            result.sort((a, b) => {
                if (a.fijada && !b.fijada) return -1;
                if (!a.fijada && b.fijada) return 1;
                return new Date(b.fechaModificacion || b.fechaCreacion) - new Date(a.fechaModificacion || a.fechaCreacion);
            });
            return result;
        }, [notes, search]);

        const handleSave = async (data) => {
            if (!data.contenido || !data.contenido.trim()) {
                addToast('El contenido no puede estar vacío', 'error'); return false;
            }
            try {
                await initDatabase();
                const now = new Date().toISOString();
                if (editing) {
                    await db.notes.update(editing.id, {
                        titulo: (data.titulo || '').trim(),
                        contenido: data.contenido,
                        fechaModificacion: now,
                        fijada: data.fijada !== undefined ? data.fijada : editing.fijada
                    });
                    addToast('Nota actualizada', 'success');
                } else {
                    await db.notes.add({
                        userId: user.id,
                        titulo: (data.titulo || '').trim(),
                        contenido: data.contenido,
                        fechaCreacion: now,
                        fechaModificacion: now,
                        fijada: false
                    });
                    addToast('Nota creada', 'success');
                }
                await refreshAllData();
                setShowForm(false);
                setEditing(null);
                return true;
            } catch (err) {
                addToast('No se pudo guardar la nota', 'error');
                return false;
            }
        };

        const handleTogglePin = async (note, e) => {
            if (e) e.stopPropagation();
            try {
                await db.notes.update(note.id, {
                    fijada: !note.fijada,
                    fechaModificacion: new Date().toISOString()
                });
                await refreshAllData();
                addToast(note.fijada ? 'Nota desfijada' : 'Nota fijada', 'success');
            } catch (err) {
                addToast('No se pudo actualizar la nota', 'error');
            }
        };

        const handleDeleteConfirm = async () => {
            if (!showDeleteConfirm) return;
            try {
                await db.notes.delete(showDeleteConfirm.id);
                await refreshAllData();
                addToast('Nota eliminada', 'success');
                setShowDeleteConfirm(null);
            } catch (err) {
                addToast('No se pudo eliminar la nota', 'error');
            }
        };

            setEditing(note);
            setShowForm(true);

                    <button className="btn btn-primary btn-sm" onClick={() => { setEditing(null); setShowForm(true); }}>
                        <IconSVG.Plus /> Nueva nota
                    </button>
                </div>

                <div style={{ position: 'relative', marginBottom: '14px' }}>

            <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                <div>
                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px', fontWeight: '500' }}>
                        Título (opcional)
                    </label>
                    <input type="text" value={titulo} onChange={e => setTitulo(e.target.value)}
                        className="glass-input" placeholder="Ej: Pendientes del día..." maxLength={120} />
                </div>
                <div>
                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px', fontWeight: '500' }}>
                        Contenido *
                    </label>
                    <textarea ref={textareaRef} value={contenido}
                        onChange={e => setContenido(e.target.value)}
                        className="notes-textarea"
                        placeholder="Escribe aquí tus apuntes personales..." required />
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)', marginTop: '4px', textAlign: 'right' }}>
                        {contenido.length} caracteres
                    </div>
                </div>
                <div style={{ display: 'flex', gap: '10px' }}>
                    <button type="button" className="btn btn-ghost" style={{ flex: 1 }} onClick={onCancel} disabled={saving}>
                        Cancelar
                    </button>
                    <button type="submit" className="btn btn-success" style={{ flex: 1 }} disabled={saving || !contenido.trim()}>
                        {saving ? <span className="spinner" style={{ width: '18px', height: '18px' }}></span> :
                            <><IconSVG.Save /> {initial ? 'Guardar cambios' : 'Guardar nota'}</>}
                    </button>
                </div>
            </form>
        );
    };

    // ============================================================
    // 35. COMPONENT: BOTTOM NAV
    // ============================================================

    const BottomNav = ({ page, onNavigate }) => {
        const items = [
            { id: 'dashboard', label: 'Inicio', icon: <IconSVG.Home /> },
            { id: 'clients', label: 'Clientes', icon: <IconSVG.Users /> },
            { id: 'loans', label: 'Préstamos', icon: <IconSVG.Briefcase /> },
            { id: 'collections', label: 'Cobros', icon: <IconSVG.Receipt /> },
            { id: 'finance', label: 'Finanzas', icon: <IconSVG.TrendingUp /> },
            { id: 'more', label: 'Más', icon: <IconSVG.MoreHorizontal /> }
        ];

        return (
            <div className="bottom-nav">
                {items.map(item => (
                    <button key={item.id}
                        className={`nav-item ${page === item.id ? 'active' : ''}`}
                        onClick={() => onNavigate(item.id)}>
                        {item.icon}
                        <span>{item.label}</span>
                    </button>
                ))}
            </div>
        );
    };

    // ============================================================
    // 36. COMPONENT: FAB
    // ============================================================

    const FAB = ({ onAction }) => {
        const [open, setOpen] = useState(false);
        const actions = [
            { id: 'client', label: 'Nuevo cliente', icon: <IconSVG.User /> },
            { id: 'loan', label: 'Nuevo préstamo', icon: <IconSVG.DollarSign /> },
            { id: 'payment', label: 'Registrar cobro', icon: <IconSVG.Check /> },
            { id: 'note', label: 'Nueva nota', icon: <IconSVG.Note /> },
            { id: 'expense', label: 'Registrar gasto', icon: <IconSVG.TrendingUp /> },
            { id: 'simulator', label: 'Simulador', icon: <IconSVG.Calculator /> }
        ];

        return (
            <>
                {open && <div className="fab-overlay" onClick={() => setOpen(false)} />}
                {open && (
                    <div className="fab-menu">
                        {actions.map((a, i) => (
                            <button key={a.id}
                                className="fab-menu-item"
                                style={{ animationDelay: `${i * 0.04}s` }}
                                onClick={() => {
                                    setOpen(false);
                                    setTimeout(() => onAction(a.id), 100);
                                }}>
                                {a.icon}
                                <span>{a.label}</span>
                            </button>
                        ))}
                    </div>
                )}
                <button className="fab" onClick={() => setOpen(!open)}
                    style={{ transform: open ? 'rotate(45deg)' : 'rotate(0)' }}>
                    <IconSVG.Plus />
                </button>
            </>
        );
    };

    // ============================================================
    // 37. COMPONENT: MORE PAGE
    // ============================================================

    const MorePage = ({ onNavigate }) => {
        const { user, onLogout, addToast, config, refreshAllData, notes, lostDebts } = useApp();
        const [subpage, setSubpage] = useState('main');
        const [showPassword, setShowPassword] = useState(false);

        const handleExport = async () => {
            try {
                await initDatabase();
                const data = {
                    clients: await db.clients.where({ userId: user.id }).toArray(),
                    loans: await db.loans.where({ userId: user.id }).toArray(),
                    installments: await db.installments.toArray(),
                    payments: await db.payments.toArray(),
                    expenses: await db.expenses.where({ userId: user.id }).toArray(),
                    capitalMovements: await db.capitalMovements.where({ userId: user.id }).toArray(),
                    notes: await db.notes.where({ userId: user.id }).toArray(),
                    lostDebts: await db.lostDebts.where({ userId: user.id }).toArray(),
                    recoveryMovements: await db.recoveryMovements.where({ userId: user.id }).toArray(),
                    lossCompensations: await db.lossCompensations.where({ userId: user.id }).toArray(),
                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `loansw-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                addToast('Respaldo exportado correctamente', 'success');
            } catch {
                addToast('Error al exportar', 'error');
            }
        };

        if (subpage === 'security') {
            return (
                <div style={{ padding: '20px', paddingBottom: '120px' }}>
                    <button onClick={() => setSubpage('main')} className="back-btn">
                        <IconSVG.ArrowLeft /> Volver
                    </button>
                    <div style={{ fontSize: '24px', fontWeight: '700', marginBottom: '20px' }}>Seguridad</div>

                    <div className="glass-card" style={{ padding: '16px', marginBottom: '8px' }}
                        onClick={() => setShowPassword(true)}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                                <div style={{ fontSize: '14px', fontWeight: '500' }}>Cambiar contraseña</div>
                                <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Actualiza tu acceso</div>
                            </div>
                            <IconSVG.Lock />
                        </div>
                    </div>

                    <button className="btn btn-danger" style={{ width: '100%', marginTop: '16px' }} onClick={onLogout}>
                        <IconSVG.LogOut /> Cerrar sesión
                    </button>

                    {showPassword && (
                        <div className="modal-overlay" onClick={() => setShowPassword(false)}>
                            <div className="modal-content" onClick={e => e.stopPropagation()}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                                    <div style={{ fontSize: '18px', fontWeight: '700' }}>Cambiar contraseña</div>
                                    <button onClick={() => setShowPassword(false)} className="btn btn-ghost btn-sm">
                                        <IconSVG.X />
                                    </button>
                                </div>
                                <ChangePasswordForm onSuccess={() => {
                                    setShowPassword(false);
                                    addToast('Contraseña actualizada', 'success');
                                }} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        if (subpage === 'preferences') {
            return <PreferencesPage onBack={() => setSubpage('main')} initialConfig={config} />;
        }

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Ajustes</div>

                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '12px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                        <div style={{
                            width: '44px', height: '44px', borderRadius: '50%',
                            background: 'linear-gradient(135deg, #6366f1, #4f46e5)',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            fontSize: '18px', fontWeight: '700', color: 'white'
                        }}>
                            {getSafeInitial(user?.fullName || user?.document)}
                        </div>
                        <div style={{ flex: 1 }}>
                            <div style={{ fontSize: '15px', fontWeight: '600' }}>
                                {getSafeString(user?.fullName, 'Usuario')}
                            </div>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                                Doc: {getSafeString(user?.document, 'N/A')}
                            </div>
                        </div>
                    </div>
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                    {(lostDebts || []).length > 0 && (
                        <div className="glass-card" style={{ padding: '16px' }} onClick={() => onNavigate('lostDebts')}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <div style={{ color: 'var(--danger)' }}><IconSVG.Lost /></div>
                                    <div>
                                        <div style={{ fontSize: '14px', fontWeight: '500' }}>Pérdidas por recuperar</div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                            {lostDebts.length} {lostDebts.length === 1 ? 'deuda perdida' : 'deudas perdidas'}
                                        </div>
                                    </div>
                                </div>
                                <IconSVG.ArrowLeft />
                            </div>
                        </div>
                    )}

                    <div className="glass-card" style={{ padding: '16px' }} onClick={() => onNavigate('notes')}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                <div style={{ color: 'var(--accent-light)' }}><IconSVG.Note /></div>
                                <div>
                                    <div style={{ fontSize: '14px', fontWeight: '500' }}>Bloc de notas</div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                        {(notes || []).length > 0 ? `${notes.length} ${notes.length === 1 ? 'nota guardada' : 'notas guardadas'}` : 'Apuntes personales'}
                                    </div>
                                </div>
                            </div>
                            <IconSVG.ArrowLeft />
                        </div>
                    </div>

                    <div className="glass-card" style={{ padding: '16px' }} onClick={() => setSubpage('security')}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                <div style={{ color: 'var(--accent-light)' }}><IconSVG.Lock /></div>
                                <div>
                                    <div style={{ fontSize: '14px', fontWeight: '500' }}>Seguridad</div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Contraseña y sesiones</div>
                                </div>
                            </div>
                            <IconSVG.ArrowLeft />
                        </div>
                    </div>

                    <div className="glass-card" style={{ padding: '16px' }} onClick={() => setSubpage('preferences')}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                <div style={{ color: 'var(--accent-light)' }}><IconSVG.Settings /></div>
                                <div>
                                    <div style={{ fontSize: '14px', fontWeight: '500' }}>Preferencias</div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Moneda y configuración</div>
                                </div>
                            </div>
                            <IconSVG.ArrowLeft />
                        </div>
                    </div>

                    <div className="glass-card" style={{ padding: '16px' }} onClick={handleExport}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                <div style={{ color: 'var(--success)' }}><IconSVG.Download /></div>
                                <div>
                                    <div style={{ fontSize: '14px', fontWeight: '500' }}>Exportar respaldo</div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Descargar copia de seguridad</div>
                                </div>
                            </div>
                            <IconSVG.ArrowLeft />
                        </div>
                    </div>
                </div>

                <button className="btn btn-danger" style={{ width: '100%', marginTop: '24px' }} onClick={onLogout}>
                    <IconSVG.LogOut /> Cerrar sesión
                </button>

                <div style={{ marginTop: '24px', textAlign: 'center', fontSize: '11px', color: 'var(--text-muted)' }}>
                    LOANS W v10.4 · Sistema financiero completo
                </div>
            </div>
        );
    };

    // ============================================================
    // 38. APP PRINCIPAL (arranque estabilizado)
    // ============================================================

    const App = () => {
        const [appState, setAppState] = useState('loading');
        const [user, setUser] = useState(null);
        const [page, setPage] = useState('dashboard');
        const [params, setParams] = useState({});
        const [showFab, setShowFab] = useState(true);
        const [notesInitialAction, setNotesInitialAction] = useState(null);

        useEffect(() => {
            let cancelled = false;

            const boot = async () => {
                try {
                    console.log('[BOOT] Iniciando Loans W...');
                    await initDatabase();
                    console.log('[BOOT] Base de datos lista');
                    const u = await SecurityUtils.validateSession();
                    console.log('[BOOT] Sesión validada:', u ? (u.fullName || u.document) : 'sin sesión');
                    if (cancelled) return;
                    if (u) { setUser(u); setAppState('main'); }
                    else setAppState('login');
                } catch (err) {
                    console.error('[BOOT] Error en arranque:', err);
                    if (!cancelled) setAppState('login');
                }
            };

            boot();
            return () => { cancelled = true; };
        }, []);

        const handleLogin = useCallback((u) => {
            setUser(u);
            setAppState('main');
        }, []);

        const handleLogout = useCallback(async () => {
            await SecurityUtils.destroySession();
            setUser(null);
            setAppState('login');
        }, []);

        const navigate = useCallback((p, ...a) => {
            setPage(p);
            setParams(a);
            setShowFab(!['createLoan', 'editLoan', 'loanDetail', 'clientDetail', 'more', 'expenses', 'simulator', 'notes', 'lostDebts'].includes(p));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        const handleFabAction = useCallback((action) => {
            if (action === 'client') navigate('clients');
            else if (action === 'loan') navigate('createLoan');
            else if (action === 'payment') navigate('collections');
            else if (action === 'note') {
                setNotesInitialAction('new');
                navigate('notes');
            }
            else if (action === 'expense') navigate('expenses');
            else if (action === 'simulator') navigate('simulator');
            else if (action === 'capital') navigate('finance');
        }, [navigate]);

        const renderPage = () => {
            const content = (() => {
                switch (page) {
                    case 'dashboard': return <DashboardPage onNavigate={navigate} />;
                    case 'clients': return <ClientsPage onNavigate={navigate} />;
                    case 'clientDetail': return <ClientDetailPage id={params[0]} onNavigate={navigate} />;
                    case 'loans': return <LoansPage onNavigate={navigate} />;
                    case 'createLoan': return <CreateLoanPage preselectedClientId={params[0]} simulatorData={params[1]} onNavigate={navigate} />;
                    case 'editLoan': return <EditLoanPage id={params[0]} onNavigate={navigate} />;
                    case 'loanDetail': return <LoanDetailPage id={params[0]} onNavigate={navigate} />;
                    case 'collections': return <CollectionsPage onNavigate={navigate} />;
                    case 'finance': return <FinancePage onNavigate={navigate} />;
                    case 'lostDebts': return <LostDebtsPage onNavigate={navigate} />;
                    case 'expenses': return <ExpensesPage onNavigate={navigate} />;
                    case 'simulator': return <SimulatorPage onNavigate={navigate} />;
                    case 'notes': return <NotesPage onNavigate={navigate} initialAction={notesInitialAction} clearInitialAction={() => setNotesInitialAction(null)} />;
                    case 'more': return <MorePage onNavigate={navigate} />;
                    default: return <DashboardPage onNavigate={navigate} />;
                }
            })();

            return <div key={page} className="page-transition">{content}</div>;
        };

        if (appState === 'loading') return <LoadingScreen />;
        if (appState === 'login') return <LoginScreen onLogin={handleLogin} />;

        return (
            <AppProvider user={user} onLogout={handleLogout}>
                <div style={{ minHeight: '100vh', minHeight: '100dvh', background: 'var(--bg-deep)' }}>
                    {renderPage()}
                    {showFab && <FAB onAction={handleFabAction} />}
                    <BottomNav page={page} onNavigate={navigate} />
                    <ToastContainer />
                </div>
            </AppProvider>
        );
    };

    // ============================================================
    // RENDERIZAR APLICACIÓN
    // ============================================================

    ReactDOM.render(<App />, document.getElementById('root'));

    console.log('========================================');
    console.log('LOANS W v10.4 — ARRANQUE ESTABILIZADO');
    console.log('========================================');
    console.log('✅ Cobrar / Abonar separados');
console.log('✅ Compensación automática de pérdidas con intereses');
console.log('✅ DB v13 con upgrade explícito (evita migración colgada)');
console.log('✅ initDatabase con timeout defensivo + reintento');
console.log('✅ App con try/catch/finally y logs [BOOT]');
console.log('✅ Los datos existentes se conservan');
console.log('========================================');
</script>
</body>
</html>
