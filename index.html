    // ============================================================
    // 24. LOGIN SCREEN
    // ============================================================

    const LoginScreen = ({ role, onLogin, onBackToRoles }) => {
        const [doc, setDoc] = useState('');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState('');
        const [phone, setPhone] = useState('');
        const [confirmPassword, setConfirmPassword] = useState('');
        const [isRegistering, setIsRegistering] = useState(false);
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);
        const [showPassword, setShowPassword] = useState(false);
        const [generatedCode, setGeneratedCode] = useState(null);

        const roleConfig = {
            lender: { title: 'Prestamista', subtitle: 'Administra tu propio negocio', btnClass: 'btn-primary' },
            employee: { title: 'Empleado', subtitle: 'Registra tu actividad laboral', btnClass: 'btn-employee' },
            boss: { title: 'Jefe / Administrador', subtitle: 'Supervisa tu negocio', btnClass: 'btn-boss' }
        };
        const cfg = roleConfig[role] || roleConfig.lender;

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError('');
            if (!doc.trim() || !password.trim()) { setError('Completa todos los campos.'); return; }
            if (isRegistering) {
                if (!fullName.trim()) { setError('Nombre requerido.'); return; }
                if (password !== confirmPassword) { setError('Las contraseñas no coinciden.'); return; }
                if (password.length < 6) { setError('Contraseña muy corta (mínimo 6).'); return; }
            }
            setLoading(true);
            try {
                if (isRegistering) {
                    const user = await AuthManager.register({ document: doc, fullName, phone, role, password });
                    if (user.employeeCode) {
                        setGeneratedCode(user.employeeCode);
                        setTimeout(() => onLogin(user), 1800);
                    } else {
                        onLogin(user);
                    }
                } else {
                    const user = await AuthManager.login({ document: doc, password, expectedRole: role });
                    onLogin(user);
                }
            } catch (err) {
                console.error('[AUTH]', err);
                setError(err.message || 'Error inesperado.');
            }
            setLoading(false);
        };

        if (generatedCode) {
            return (
                <div className="role-screen">
                    <div style={{ maxWidth: '440px', width: '100%', textAlign: 'center' }}>
                        <div style={{ width: '80px', height: '80px', borderRadius: '50%', background: 'linear-gradient(135deg, #10b981, #059669)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px', animation: 'pulse-glow 2s ease-in-out infinite' }}>
                            <IconSVG.Check />
                        </div>
                        <div style={{ fontSize: '22px', fontWeight: '700', marginBottom: '8px' }}>¡Cuenta creada!</div>
                        <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '24px' }}>Este es tu código único de empleado. Guárdalo y compártelo con tu jefe.</div>
                        <div style={{ padding: '20px', background: 'linear-gradient(135deg, rgba(139,92,246,0.15), rgba(99,102,241,0.08))', border: '1px solid rgba(139,92,246,0.35)', borderRadius: '16px', marginBottom: '16px' }}>
                            <div style={{ fontSize: '10px', color: 'var(--employee)', textTransform: 'uppercase', letterSpacing: '0.08em', fontWeight: '700', marginBottom: '8px' }}>Tu código de empleado</div>
                            <div style={{ fontSize: '24px', fontWeight: '800', fontFamily: 'SF Mono, Courier New, monospace', letterSpacing: '1.5px', color: '#c4b5fd', wordBreak: 'break-all' }}>{generatedCode}</div>
                        </div>
                        <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Ingresando a la aplicación...</div>
                    </div>
                </div>
            );
        }

        return (
            <div style={{ minHeight: '100vh', background: 'linear-gradient(160deg, #060610 0%, #0f0f24 40%, #060610 100%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px' }}>
                <button onClick={onBackToRoles} style={{ position: 'absolute', top: '20px', left: '20px', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)', color: 'var(--text-secondary)', padding: '8px 14px', borderRadius: '10px', fontSize: '12px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <IconSVG.ArrowLeft /> Cambiar rol
                </button>
                <div style={{ marginBottom: '28px', textAlign: 'center' }}>
                    <div style={{ width: '60px', height: '60px', borderRadius: '16px', background: role === 'lender' ? 'linear-gradient(135deg, #6366f1, #4f46e5)' : role === 'employee' ? 'linear-gradient(135deg, #8b5cf6, #7c3aed)' : 'linear-gradient(135deg, #f59e0b, #d97706)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px', animation: 'pulse-glow 2s ease-in-out infinite' }}>
                        {role === 'lender' ? <IconSVG.Lender /> : role === 'employee' ? <IconSVG.Employee /> : <IconSVG.Boss />}
                    </div>
                    <div style={{ fontSize: '26px', fontWeight: '800', letterSpacing: '-1px' }}>{cfg.title}</div>
                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '4px' }}>{cfg.subtitle}</div>
                </div>
                <form onSubmit={handleSubmit} style={{ width: '100%', maxWidth: '400px' }}>
                    <div className="glass-card disabled" style={{ padding: '24px' }}>
                        <div style={{ fontSize: '18px', fontWeight: '700', marginBottom: '18px', textAlign: 'center' }}>{isRegistering ? 'Crear cuenta' : 'Iniciar sesión'}</div>
                        {error && <div style={{ padding: '11px 14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '10px', color: 'var(--danger-light)', fontSize: '12px', marginBottom: '14px', lineHeight: '1.4' }}>{error}</div>}
                        {isRegistering && <div style={{ marginBottom: '12px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Nombre completo *</label>
                            <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="glass-input" placeholder="Tu nombre completo" />
                        </div>}
                        <div style={{ marginBottom: '12px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Número de cédula *</label>
                            <input type="text" value={doc} onChange={e => setDoc(e.target.value)} className="glass-input" placeholder="Ingresa tu cédula" autoComplete="username" />
                        </div>
                        {isRegistering && <div style={{ marginBottom: '12px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Teléfono</label>
                            <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="glass-input" placeholder="3001234567" autoComplete="tel" />
                        </div>}
                        <div style={{ marginBottom: '12px', position: 'relative' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Contraseña *</label>
                            <input type={showPassword ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} className="glass-input" style={{ paddingRight: '42px' }} placeholder="••••••••" autoComplete={isRegistering ? 'new-password' : 'current-password'} />
                            <button type="button" onClick={() => setShowPassword(!showPassword)} style={{ position: 'absolute', right: '12px', top: '32px', background: 'none', border: 'none', color: 'var(--text-muted)', cursor: 'pointer', padding: '4px' }}>
                                {showPassword ? <IconSVG.EyeOff /> : <IconSVG.Eye />}
                            </button>
                        </div>
                        {isRegistering && <div style={{ marginBottom: '16px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Confirmar contraseña *</label>
                            <input type="password" value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} className="glass-input" placeholder="••••••••" autoComplete="new-password" />
                        </div>}
                        <button type="submit" className={`btn ${cfg.btnClass}`} style={{ width: '100%', marginBottom: '12px' }} disabled={loading}>
                            {loading ? <span className="spinner" style={{ width: '18px', height: '18px' }}></span> : isRegistering ? 'Crear cuenta' : 'Ingresar'}
                        </button>
                        <button type="button" onClick={() => { setIsRegistering(!isRegistering); setError(''); }} className="btn btn-ghost" style={{ width: '100%', fontSize: '13px' }}>
                            {isRegistering ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}
                        </button>
                        {role === 'employee' && isRegistering && (
                            <div style={{ marginTop: '14px', padding: '10px 12px', background: 'rgba(139,92,246,0.06)', border: '1px solid rgba(139,92,246,0.2)', borderRadius: '10px', fontSize: '11px', color: '#c4b5fd', lineHeight: '1.5', display: 'flex', alignItems: 'flex-start', gap: '8px' }}>
                                <span style={{ flexShrink: 0 }}><IconSVG.IdCard /></span>
                                <span>Al crear tu cuenta generaremos un <b>código único</b>. Compártelo con tu jefe.</span>
                            </div>
                        )}
                    </div>
                </form>
            </div>
        );
    };

    // ============================================================
    // 25. APP PROVIDER
    // ============================================================

    const AppProvider = ({ children, user, onLogout, onUserUpdate }) => {
        const [clients, setClients] = useState([]);
        const [loans, setLoans] = useState([]);
        const [installments, setInstallments] = useState([]);
        const [payments, setPayments] = useState([]);
        const [expenses, setExpenses] = useState([]);
        const [capitalMovements, setCapitalMovements] = useState([]);
        const [expenseCategories, setExpenseCategories] = useState([]);
        const [collectionPeriods, setCollectionPeriods] = useState([]);
        const [auditLogs, setAuditLogs] = useState([]);
        const [notes, setNotes] = useState([]);
        const [lostDebts, setLostDebts] = useState([]);
        const [recoveryMovements, setRecoveryMovements] = useState([]);
        const [lossCompensations, setLossCompensations] = useState([]);
        const [linkedEmployees, setLinkedEmployees] = useState([]);
        const [incomingRequests, setIncomingRequests] = useState([]);
        const [outgoingRequests, setOutgoingRequests] = useState([]);
        const [linkagesList, setLinkagesList] = useState([]);
        const [employeeActivity, setEmployeeActivity] = useState([]);
        const [config, setConfig] = useState(null);
        const [toasts, setToasts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [refreshKey, setRefreshKey] = useState(0);

        const addToast = useCallback((msg, type = 'info') => {
            const id = Date.now() + Math.random();
            setToasts(p => [...p, { id, msg, type }]);
            setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
        }, []);

        const getVisibleOwnerIds = useCallback((u = user) => {
            if (!u) return [];
            if (u.role === 'boss') {
                const linked = Array.isArray(u.linkedEmployeeIds) ? u.linkedEmployeeIds : [];
                return [u.id, ...linked];
            }
            return [u.id];
        }, [user]);

        const refreshAllData = useCallback(async () => {
            if (!user?.id) return;
            setLoading(true);
            try {
                await initDatabase();
                const userId = user.id;
                const visibleOwnerIds = getVisibleOwnerIds(user);
                await cleanOrphanCapitalMovements(userId);

                if (user.supabaseId) {
                    try {
                        const profile = await AuthManager.refreshProfile(user.supabaseId);
                        if (profile && onUserUpdate) {
                            onUserUpdate({ ...user, linkedBossIds: profile.linked_boss_ids || [], linkedEmployeeIds: profile.linked_employee_ids || [], employeeCode: profile.employee_code, role: profile.role });
                        }
                    } catch (e) {}
                }

                const [c, l, ec, cp, n, ld, rm, lc, e, cm, cfg] = await Promise.all([
                    db.clients.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.loans.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.expenseCategories.toArray(),
                    db.collectionPeriods.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.notes.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.lostDebts.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.recoveryMovements.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.lossCompensations.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.expenses.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.capitalMovements.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []),
                    db.settings.get(userId).catch(() => null)
                ]);

                setClients(c || []);
                setLoans(l || []);
                setExpenseCategories(ec || []);
                setCollectionPeriods(cp || []);
                setNotes(n || []);
                setLostDebts(ld || []);
                setRecoveryMovements(rm || []);
                setLossCompensations(lc || []);
                setExpenses(e || []);
                setCapitalMovements(cm || []);
                setConfig(cfg || null);

                const loanIds = (l || []).map(loan => loan.id);
                let i = [];
                let p = [];
                if (loanIds.length > 0) {
                    i = await db.installments.where('loanId').anyOf(loanIds).toArray().catch(() => []);
                    p = await db.payments.where('loanId').anyOf(loanIds).toArray().catch(() => []);

                    for (const inst of i) {
                        if (inst.status === 'paid' || inst.status === 'cancelled') continue;
                        const loan = (l || []).find(lo => lo.id === inst.loanId);
                        if (loan && loan.status !== 'lost') {
                            const updated = MoraEngine.updateMora(inst, loan);
                            if (updated.moraDays !== inst.moraDays || updated.moraAmount !== inst.moraAmount || updated.moraRemaining !== inst.moraRemaining || updated.status !== inst.status) {
                                await db.installments.update(inst.id, { moraDays: updated.moraDays, moraAmount: updated.moraAmount, moraRemaining: updated.moraRemaining, status: updated.status });
                            }
                        }
                    }

                    i = await db.installments.where('loanId').anyOf(loanIds).toArray().catch(() => []);
                    p = await db.payments.where('loanId').anyOf(loanIds).toArray().catch(() => []);

                    for (const loan of (l || [])) {
                        if (loan.status === 'lost' || loan.status === 'cancelled') continue;
                        const loanInsts = i.filter(inst => inst.loanId === loan.id);
                        const allPaid = loanInsts.every(inst => inst.status === 'paid' || inst.status === 'cancelled');
                        const hasOverdue = loanInsts.some(inst => inst.status === 'overdue');
                        let newStatus = loan.status;
                        if (allPaid && loan.status !== 'finished') newStatus = 'finished';
                        else if (hasOverdue && loan.status === 'active') newStatus = 'overdue';
                        else if (!hasOverdue && loan.status === 'overdue') newStatus = 'active';
                        if (newStatus !== loan.status) { await db.loans.update(loan.id, { status: newStatus, updatedAt: new Date().toISOString() }); loan.status = newStatus; }
                    }
                    setLoans([...(l || [])]);
                }
                setInstallments(i);
                setPayments(p);

                const [incoming, outgoing] = await Promise.all([
                    db.linkRequests.where('employeeId').equals(userId).toArray().catch(() => []),
                    db.linkRequests.where('bossId').equals(userId).toArray().catch(() => [])
                ]);
                setIncomingRequests(incoming || []);
                setOutgoingRequests(outgoing || []);

                const linkages = await db.linkages.filter(lk => (lk.bossId === userId || lk.employeeId === userId) && lk.status === 'active').toArray().catch(() => []);
                setLinkagesList(linkages || []);

                if (user.role === 'boss') {
                    const ids = Array.isArray(user.linkedEmployeeIds) ? user.linkedEmployeeIds : [];
                    const emps = ids.length > 0 ? await db.users.where('id').anyOf(ids).toArray().catch(() => []) : [];
                    setLinkedEmployees(emps || []);
                } else {
                    setLinkedEmployees([]);
                }

                try {
                    const ar = await db.auditLog.where({ userId }).toArray();
                    ar.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    setAuditLogs(ar.slice(0, 100));
                } catch (err) {}

                await CollectionHistoryEngine.reconcilePeriods(userId, p, visibleOwnerIds);
                setRefreshKey(prev => prev + 1);
            } catch (err) {
                console.error('[APP] Error refresh:', err);
                addToast('Error al cargar datos: ' + (err.message || ''), 'error');
            }
            setLoading(false);
        }, [user, addToast, getVisibleOwnerIds, onUserUpdate]);

        CollectionHistoryEngine.reconcilePeriods = async (userId, payments, ownerIds = null) => {
            try {
                const periods = CollectionHistoryEngine.getAvailablePeriods(payments);
                const visibleIds = Array.isArray(ownerIds) && ownerIds.length > 0 ? ownerIds : [userId];
                for (const period of periods) {
                    const [year, month] = period.split('-').map(Number);
                    const allLoans = await db.loans.where('userId').anyOf(visibleIds).toArray().catch(() => []);
                    const allInstallments = [];
                    for (const loan of allLoans) { const insts = await db.installments.where({ loanId: loan.id }).toArray(); allInstallments.push(...insts); }
                    const allClients = await db.clients.where('userId').anyOf(visibleIds).toArray().catch(() => []);
                    const summary = CollectionHistoryEngine.getPeriodSummary(payments, allInstallments, allLoans, allClients, year, month);
                    const existing = await db.collectionPeriods.where({ userId, year, month }).first().catch(() => null);
                    const periodData = {
                        userId, ownerId: userId, ownerRole: 'lender', year, month,
                        expectedAmount: summary.expectedAmount, collectedAmount: summary.collectedAmount,
                        pendingAmount: summary.pendingAmount, compliance: summary.compliance,
                        data: JSON.stringify({ collectedCapital: summary.collectedCapital, collectedInterest: summary.collectedInterest, collectedMora: summary.collectedMora, paymentsCount: summary.paymentsCount, clientsCount: summary.clientsCount }),
                        syncStatus: 'local', remoteId: null, updatedAt: new Date().toISOString()
                    };
                    if (existing) await db.collectionPeriods.update(existing.id, periodData);
                    else await db.collectionPeriods.add({ ...periodData, createdAt: new Date().toISOString() });
                }
            } catch (err) { console.error('[RECONCILE]', err); }
        };

        const addAuditLog = useCallback(async (et, eid, action, desc = '', before = null, after = null, details = null) => {
            if (!user?.id) return;
            try {
                await db.auditLog.add({ userId: user.id, timestamp: new Date().toISOString(), entityType: et, entityId: eid, action, description: desc, before: before ? JSON.stringify(before) : null, after: after ? JSON.stringify(after) : null, details: details ? JSON.stringify(details) : null });
            } catch (err) {}
        }, [user]);

        const applyInterestToLosses = useCallback(async (interestAmount, paymentInfo = {}) => {
            const interest = normalizeMoney(interestAmount);
            if (interest <= 0) return [];
            const visibleOwnerIds = getVisibleOwnerIds(user);
            const allLostDebts = await db.lostDebts.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []);
            const allRecoveries = await db.recoveryMovements.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []);
            const allCompensations = await db.lossCompensations.where('userId').anyOf(visibleOwnerIds).toArray().catch(() => []);
            const state = LossCompensationEngine.calculateState(allLostDebts, allRecoveries, allCompensations);
            if (!state.hasPendingLoss) return [];
            const sortedPending = state.perDebt.filter(d => !d.isFullyRecovered).sort((a, b) => new Date(a.lostAt) - new Date(b.lostAt));
            const distributions = LossCompensationEngine.distributeInterestToLosses(interest, sortedPending);
            if (distributions.length === 0) return [];
            const now = new Date().toISOString();
            const applied = [];
            for (const dist of distributions) {
                const debt = sortedPending.find(d => d.id === dist.lostDebtId);
                if (!debt) continue;
                const pendingBefore = debt.pending;
                const pendingAfter = normalizeMoney(Math.max(0, pendingBefore - dist.amount));
                await db.lossCompensations.add({
                    userId: user.id, ownerId: user.id, ownerRole: user.role || 'lender',
                    lostDebtId: debt.id, paymentId: paymentInfo.paymentId || null,
                    loanId: paymentInfo.loanId || null, clientId: paymentInfo.clientId || null, installmentId: paymentInfo.installmentId || null,
                    amountAppliedToLoss: dist.amount, interestGenerated: interest,
                    moraGenerated: 0, capitalReceived: 0, pendingBefore, pendingAfter,
                    appliedAt: now, description: paymentInfo.description || 'Compensación', syncStatus: 'local', remoteId: null, createdAt: now
                });
                await db.lostDebts.update(debt.id, {
                    recoveredInterest: normalizeMoney((debt.recoveredInterest || 0) + dist.amount),
                    status: pendingAfter <= 0.01 ? 'fully_recovered' : 'partial_recovered',
                    fullyRecoveredAt: pendingAfter <= 0.01 ? now : null, updatedAt: now
                });
                applied.push({ lostDebtId: debt.id, amount: dist.amount });
            }
            return applied;
        }, [user, getVisibleOwnerIds]);

        const sendLinkRequest = useCallback(async (employeeCode, message = '') => {
            if (!user || user.role !== 'boss') return { ok: false, error: 'Solo un jefe puede enviar.' };
            const code = String(employeeCode || '').trim().toUpperCase();
            if (!code) return { ok: false, error: 'Código inválido.' };
            const sb = await waitForSupabase(5000);
            let empRemote = null;
            if (sb) {
                const { data } = await sb.from('users').select('*').eq('employee_code', code).limit(1);
                if (data && data.length > 0) empRemote = data[0];
            }
            if (!empRemote) return { ok: false, error: 'No encontramos un empleado con ese código.' };
            if (empRemote.role !== 'employee') return { ok: false, error: 'No es cuenta de empleado.' };
            if (empRemote.id === user.supabaseId) return { ok: false, error: 'No puedes vincularte a ti mismo.' };
            const existing = await db.linkRequests.where({ bossId: user.id }).filter(r => r.status === 'pending' && r.employeeCode === code).first();
            if (existing) return { ok: false, error: 'Ya enviaste solicitud a este empleado.' };
            const localEmp = await db.users.where({ supabaseId: empRemote.id }).first();
            const empLocalId = localEmp?.id || null;
            const request = {
                bossId: user.id, employeeId: empLocalId, employeeCode: code,
                employeeSupabaseId: empRemote.id, bossSupabaseId: user.supabaseId,
                status: 'pending', message: message || '', createdAt: new Date().toISOString(),
                respondedAt: null, syncStatus: 'pending', remoteId: null
            };
            const id = await db.linkRequests.add(request);
            if (sb) {
                try {
                    const { data, error } = await sb.from('link_requests').insert({ boss_id: user.supabaseId, employee_id: empRemote.id, employee_code: code, status: 'pending', message: message || '' }).select('id').single();
                    if (!error && data) await db.linkRequests.update(id, { remoteId: data.id, syncStatus: 'synced' });
                } catch (e) {}
            }
            return { ok: true, request: { ...request, id }, employee: { ...empRemote, fullName: empRemote.full_name } };
        }, [user]);

        const respondLinkRequest = useCallback(async (requestId, accept) => {
            if (!user || user.role !== 'employee') return { ok: false, error: 'Solo empleado.' };
            const req = await db.linkRequests.get(requestId);
            if (!req) return { ok: false, error: 'Solicitud no encontrada.' };
            if (req.status !== 'pending') return { ok: false, error: 'Ya respondida.' };
            const now = new Date().toISOString();
            const sb = await waitForSupabase(5000);

            if (accept) {
                await db.linkRequests.update(requestId, { status: 'accepted', respondedAt: now, syncStatus: 'pending' });
                const linkageId = await db.linkages.add({
                    bossId: req.bossId, employeeId: user.id, employeeCode: req.employeeCode,
                    bossSupabaseId: req.bossSupabaseId, employeeSupabaseId: user.supabaseId,
                    linkedAt: now, unlinkedAt: null, status: 'active', syncStatus: 'pending', remoteId: null
                });
                const boss = await db.users.get(req.bossId);
                const emp = await db.users.get(user.id);
                if (boss) { const newList = Array.isArray(boss.linkedEmployeeIds) ? [...boss.linkedEmployeeIds] : []; if (!newList.includes(emp.id)) newList.push(emp.id); await db.users.update(boss.id, { linkedEmployeeIds: newList }); }
                if (emp) { const newList = Array.isArray(emp.linkedBossIds) ? [...emp.linkedBossIds] : []; if (!newList.includes(boss.id)) newList.push(boss.id); await db.users.update(emp.id, { linkedBossIds: newList }); }
                if (sb && boss && boss.supabaseId && emp && emp.supabaseId) {
                    try {
                        await sb.from('link_requests').update({ status: 'accepted', responded_at: now }).eq('id', req.remoteId || '');
                        const { data } = await sb.from('linkages').insert({ boss_id: boss.supabaseId, employee_id: emp.supabaseId, employee_code: req.employeeCode, status: 'active' }).select('id').single();
                        if (data) await db.linkages.update(linkageId, { remoteId: data.id, syncStatus: 'synced' });
                        const { data: bp } = await sb.from('users').select('linked_employee_ids').eq('id', boss.supabaseId).single();
                        const bossList = bp?.linked_employee_ids || [];
                        if (!bossList.includes(emp.supabaseId)) bossList.push(emp.supabaseId);
                        await sb.from('users').update({ linked_employee_ids: bossList }).eq('id', boss.supabaseId);
                        const { data: ep } = await sb.from('users').select('linked_boss_ids').eq('id', emp.supabaseId).single();
                        const empList = ep?.linked_boss_ids || [];
                        if (!empList.includes(boss.supabaseId)) empList.push(boss.supabaseId);
                        await sb.from('users').update({ linked_boss_ids: empList }).eq('id', emp.supabaseId);
                    } catch (e) {}
                }
                return { ok: true };
            } else {
                await db.linkRequests.update(requestId, { status: 'rejected', respondedAt: now, syncStatus: 'pending' });
                if (sb && req.remoteId) { try { await sb.from('link_requests').update({ status: 'rejected', responded_at: now }).eq('id', req.remoteId); } catch (e) {} }
                return { ok: true };
            }
        }, [user]);

        const unlinkBossEmployee = useCallback(async (bossId, employeeId) => {
            if (!user) return { ok: false };
            const isBoss = user.role === 'boss' && user.id === bossId;
            const isEmployee = user.role === 'employee' && user.id === employeeId;
            if (!isBoss && !isEmployee) return { ok: false, error: 'Sin permiso.' };
            const now = new Date().toISOString();
            const linkage = await db.linkages.where({ bossId, employeeId, status: 'active' }).first();
            if (linkage) await db.linkages.update(linkage.id, { status: 'inactive', unlinkedAt: now, syncStatus: 'pending' });
            const boss = await db.users.get(bossId);
            const emp = await db.users.get(employeeId);
            if (boss) { const newList = (boss.linkedEmployeeIds || []).filter(id => id !== employeeId); await db.users.update(boss.id, { linkedEmployeeIds: newList }); }
            if (emp) { const newList = (emp.linkedBossIds || []).filter(id => id !== bossId); await db.users.update(emp.id, { linkedBossIds: newList }); }
            if (supabase && boss?.supabaseId) { try { const { data: bp } = await supabase.from('users').select('linked_employee_ids').eq('id', boss.supabaseId).single(); const nl = (bp?.linked_employee_ids || []).filter(id => id !== emp?.supabaseId); await supabase.from('users').update({ linked_employee_ids: nl }).eq('id', boss.supabaseId); } catch (e) {} }
            if (supabase && emp?.supabaseId) { try { const { data: ep } = await supabase.from('users').select('linked_boss_ids').eq('id', emp.supabaseId).single(); const nl = (ep?.linked_boss_ids || []).filter(id => id !== boss?.supabaseId); await supabase.from('users').update({ linked_boss_ids: nl }).eq('id', emp.supabaseId); } catch (e) {} }
            if (supabase && linkage?.remoteId) { try { await supabase.from('linkages').update({ status: 'inactive', unlinked_at: now }).eq('id', linkage.remoteId); } catch (e) {} }
            return { ok: true };
        }, [user]);

        useEffect(() => { if (user) refreshAllData(); }, [user]);

        const value = useMemo(() => ({
            user, onLogout, clients, loans, installments, payments, expenses,
            capitalMovements, expenseCategories, setExpenseCategories,
            collectionPeriods, auditLogs, notes, setNotes,
            lostDebts, setLostDebts, recoveryMovements, setRecoveryMovements,
            lossCompensations, setLossCompensations,
            linkedEmployees, incomingRequests, outgoingRequests, linkagesList, employeeActivity, setEmployeeActivity,
            config, setConfig, toasts, addToast, loading, refreshKey,
            refreshAllData, addAuditLog, db, applyInterestToLosses,
            sendLinkRequest, respondLinkRequest, unlinkBossEmployee, getVisibleOwnerIds
        }), [user, onLogout, clients, loans, installments, payments, expenses, capitalMovements, expenseCategories, collectionPeriods, auditLogs, notes, lostDebts, recoveryMovements, lossCompensations, linkedEmployees, incomingRequests, outgoingRequests, linkagesList, employeeActivity, config, toasts, addToast, loading, refreshKey, refreshAllData, addAuditLog, applyInterestToLosses, sendLinkRequest, respondLinkRequest, unlinkBossEmployee, getVisibleOwnerIds]);

        return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    };

    const useApp = () => useContext(AppContext);

    // ============================================================
    // 26. DASHBOARD PAGE
    // ============================================================

    const DashboardPage = ({ onNavigate }) => {
        const { user, loans, installments, payments, expenses, capitalMovements, clients, lostDebts, recoveryMovements, lossCompensations, loading, refreshKey } = useApp();
        const now = new Date();
        const currentYear = now.getUTCFullYear();
        const currentMonth = now.getUTCMonth() + 1;

        const currentPeriodSummary = useMemo(() => CollectionHistoryEngine.getPeriodSummary(payments || [], installments || [], loans || [], clients || [], currentYear, currentMonth), [payments, installments, loans, clients, currentYear, currentMonth, refreshKey]);

        const metrics = useMemo(() => {
            const activeLoans = (loans || []).filter(l => l.status === 'active' || l.status === 'overdue');
            const allCapitalIn = normalizeMoney((capitalMovements || []).filter(m => m.type === 'initial' || m.type === 'income').reduce((s, m) => s + (m.amount || 0), 0));
            const allCapitalOut = normalizeMoney((capitalMovements || []).filter(m => m.type === 'loan' || m.type === 'expense' || m.type === 'withdrawal').reduce((s, m) => s + (m.amount || 0), 0));
            const allPaymentsIn = normalizeMoney((capitalMovements || []).filter(m => m.type === 'payment' || m.type === 'recovery').reduce((s, m) => s + (m.amount || 0), 0));
            const totalCapital = normalizeMoney(allCapitalIn - allCapitalOut + allPaymentsIn);
            const totalLent = normalizeMoney(activeLoans.reduce((s, l) => s + (Number(l?.principal) || 0), 0));
            const availableCapital = normalizeMoney(totalCapital - totalLent);
            let porRecuperar = 0;
            for (const loan of activeLoans) { const loanInsts = (installments || []).filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled'); for (const inst of loanInsts) porRecuperar += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst)); }
            porRecuperar = normalizeMoney(porRecuperar);
            const monthPayments = (payments || []).filter(p => { if (!p.paymentDate) return false; const d = new Date(p.paymentDate); return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear; });
            let collectedInterest = 0, collectedMora = 0;
            for (const p of monthPayments) { const bd = p.breakdown || {}; collectedInterest += normalizeMoney(bd.interest || 0); collectedMora += normalizeMoney(bd.mora || 0); }
            const grossProfit = normalizeMoney(collectedInterest + collectedMora);
            const monthExpenses = (expenses || []).filter(e => { if (!e.date) return false; const d = new Date(e.date); return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear; });
            const totalExpenses = normalizeMoney(monthExpenses.reduce((s, e) => s + (e.amount || 0), 0));
            const lossState = LossCompensationEngine.calculateState(lostDebts || [], recoveryMovements || [], lossCompensations || []);
            const monthCompensations = (lossCompensations || []).filter(c => { const d = new Date(c.appliedAt || c.createdAt); return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear; });
            const monthInterestComp = normalizeMoney(monthCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0));
            const availableProfit = normalizeMoney(grossProfit - monthInterestComp - totalExpenses);
            return { totalCapital, availableCapital, porRecuperar, monthInterestComp, netProfit: availableProfit, totalLostCapital: lossState.totalLostCapital, totalRecoveredCapital: lossState.totalRecovered, totalPendingLost: lossState.totalPending, lostDebtsCount: (lostDebts || []).length };
        }, [loans, installments, payments, capitalMovements, expenses, lostDebts, recoveryMovements, lossCompensations, currentYear, currentMonth, refreshKey]);

        const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches'; };

            const count = parseInt(form.installmentsCount);
            if (count <= 0 || count > 120) { addToast('Cuotas inválidas', 'error'); return; }
            try {
                await initDatabase();
                const installments = await db.installments.where({ loanId: loan.id }).toArray();
                const hasPayments = installments.some(inst => (inst.paidAmount || 0) > 0 || (inst.moraPaid || 0) > 0);
                if (hasPayments) {
                    const canEdit = form.principal === loan.principal?.toString() && form.interestType === loan.interestType && form.interestRate === loan.interestRate?.toString() && form.installmentsCount === loan.installmentsCount?.toString();

                        const s = ScheduleEngine.generate({ startDate: form.startDate, frequency: form.frequency, count, dueDateType: form.dueDateType });
                        Object.assign(updatedLoan, {
                            principal: p, interestType: form.interestType, interestRate: normalizeMoney(parseFloat(form.interestRate)),
                            installmentsCount: count, frequency: form.frequency, startDate: form.startDate, dueDateType: form.dueDateType,

                            paidAmount: 0, remainingAmount: r.details[i].total,

                        }));
                        await db.installments.bulkAdd(installmentsList);

        const loan = (loans || []).find(l => l && l.id === parseInt(id));

        const [editingPayment, setEditingPayment] = useState(null);
        const [deletingPayment, setDeletingPayment] = useState(null);
        const [viewingReceipt, setViewingReceipt] = useState(null);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
        const [deleting, setDeleting] = useState(false);

        const lostDebt = useMemo(() => (lostDebts || []).find(d => d.loanId === loan?.id), [lostDebts, loan]);
        const lostDebtStatus = useMemo(() => {
            if (!lostDebt) return null;
            const state = LossCompensationEngine.calculateState([lostDebt], recoveryMovements || [], lossCompensations || []);
            const pd = state.perDebt[0];
            if (!pd) return null;
            return { totalRecovered: pd.totalRecovered, recoveredCapital: pd.directRecovery, recoveredInterest: pd.interestRecovery, pendingCapital: pd.pending, isFullyRecovered: pd.isFullyRecovered };
        }, [lostDebt, recoveryMovements, lossCompensations]);

        if (!loan) return <div style={{ padding: '40px', textAlign: 'center' }}>Préstamo no encontrado</div>;

        const client = (clients || []).find(c => c.id === loan.clientId);
        const insts = (installments || []).filter(i => i.loanId === loan.id).sort((a, b) => a.number - b.number);
        const loanPayments = (payments || []).filter(p => p.loanId === loan.id);
        const prog = loan.totalRepayment > 0 ? normalizeMoney((loan.totalPaid || 0) / loan.totalRepayment * 100) : 0;
        const totalMoraLoan = normalizeMoney(insts.reduce((s, i) => s + MoraEngine.calculateMoraRemaining(i), 0));
        const isLost = loan.status === 'lost';

        const openCobrarModal = (inst) => { setSelectedInstallment(inst); setEditingPayment(null); setShowCobrarModal(true); };

        const handleCobroSuccess = () => { setShowCobrarModal(false); setSelectedInstallment(null); refreshAllData(); };
        const handleAbonoSuccess = () => { setShowAbonarModal(false); setSelectedInstallment(null); refreshAllData(); };

        const handleMarkAsLost = async (breakdown) => {
            try {
                await initDatabase();
                let lostDebtId;
                await db.transaction('rw', db.loans, db.lostDebts, db.auditLog, async () => {
                    lostDebtId = await db.lostDebts.add({
                        userId: user.id, ownerId: user.id, ownerRole: user.role || 'lender', ownerCode: user.employeeCode || null,
                        loanId: loan.id, clientId: loan.clientId, lostAt: new Date().toISOString(),
                        lostCapital: breakdown.lostCapital, lostExpectedProfit: breakdown.lostExpectedProfit,
                        totalExpected: breakdown.totalExpected, pendingBalanceAtLoss: breakdown.pendingBalance,
                        recoveredCapital: 0, recoveredInterest: 0, status: 'pending',
                        syncStatus: 'pending', remoteId: null,
                        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
                    });
                    await db.loans.update(loan.id, { status: 'lost', lostAt: new Date().toISOString(), updatedAt: new Date().toISOString(), syncStatus: 'pending' });
                });
                if (SyncAdapter.isOnline()) {
                    const savedLD = await db.lostDebts.get(lostDebtId);
                    await SyncAdapter.pushRecord('lostDebts', savedLD);
                    const savedLoan = await db.loans.get(loan.id);
                    await SyncAdapter.pushRecord('loans', savedLoan);
                }
                await logEmployeeActivity(user, 'marked_loan_as_lost', 'loan', loan.id, `Marcó ${loan.loanNumber} como perdida`, { loanId: loan.id });
                await refreshAllData();
                addToast('Marcado como perdida', 'warning');
                setShowLostDebtModal(false);
            } catch (err) { throw err; }
        };

        const handleDeleteLoan = async () => {
            setDeleting(true);
            try {
                await initDatabase();
                const loanInsts = await db.installments.where({ loanId: loan.id }).toArray();
                const instIds = loanInsts.map(i => i.id);
                await db.transaction('rw', db.loans, db.installments, db.payments, db.capitalMovements, db.lostDebts, db.recoveryMovements, db.lossCompensations, async () => {
                    if (instIds.length > 0) await db.payments.where('installmentId').anyOf(instIds).delete();
                    await db.installments.where({ loanId: loan.id }).delete();
                    await db.capitalMovements.where({ referenceType: 'loan', referenceId: loan.id }).delete();
                    await db.lossCompensations.where({ loanId: loan.id }).delete();
                    await db.recoveryMovements.where({ loanId: loan.id }).delete();
                    if (lostDebt) await db.lostDebts.delete(lostDebt.id);
                    await db.loans.delete(loan.id);
                    if (supabase && loan.remoteId) { try { await supabase.from('loans').delete().eq('id', loan.remoteId); } catch (e) {} }
                });
                await refreshAllData();
                addToast('Préstamo eliminado', 'success');
                onNavigate('loans');
            } catch (err) { addToast('Error', 'error'); }
            setDeleting(false);
            setShowDeleteConfirm(false);
        };

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('loans')} className="back-btn"><IconSVG.ArrowLeft /> Volver</button>
                {isLost && (
                    <div style={{ padding: '14px', background: 'rgba(220,38,38,0.08)', border: '1px solid rgba(220,38,38,0.25)', borderRadius: 'var(--radius-md)', marginBottom: '14px', display: 'flex', alignItems: 'center', gap: '10px' }}>
                        <IconSVG.Lost />
                        <div>
                            <div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--danger-light)' }}>Deuda perdida</div>
                            <div style={{ fontSize: '11px', color: 'var(--text-secondary)' }}>Marcada el {formatDate(loan.lostAt)}</div>
                        </div>
                    </div>
                )}
                <div className="glass-card disabled" style={{ padding: '20px', marginBottom: '16px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px' }}>
                        <div>
                            <div style={{ fontSize: '18px', fontWeight: '700' }}>{getSafeString(client?.fullName, 'Cliente')}</div>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>#{loan.loanNumber}</div>
                        </div>
                        <span className={`badge ${loan.status === 'overdue' ? 'badge-danger' : loan.status === 'lost' ? 'badge-loss' : loan.status === 'finished' ? 'badge-info' : 'badge-success'}`}>{getStatusLabel(loan.status)}</span>
                    </div>
                    <div className="progress-bar" style={{ height: '10px', marginBottom: '12px' }}>
                        <div className={`progress-fill ${isLost ? 'loss' : ''}`} style={{ width: `${Math.min(100, prog)}%` }} />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', fontSize: '12px' }}>
                        <div><div style={{ color: 'var(--text-muted)' }}>Cobrado</div><AnimatedNumber value={loan.totalPaid || 0} style={{ color: 'var(--success)', fontWeight: '600', fontSize: '15px', display: 'block' }} /></div>
                        <div><div style={{ color: 'var(--text-muted)' }}>Pendiente</div><AnimatedNumber value={loan.currentBalance || 0} style={{ color: 'var(--warning)', fontWeight: '600', fontSize: '15px', display: 'block' }} /></div>
                        <div><div style={{ color: 'var(--text-muted)' }}>Total</div><div style={{ fontWeight: '600', fontSize: '15px' }}>{formatCurrency(loan.totalRepayment || 0)}</div></div>
                    </div>
                    <div style={{ display: 'flex', gap: '8px', marginTop: '12px', flexWrap: 'wrap' }}>
                        {!isLost && (<>
                            <button className="btn btn-ghost btn-sm" onClick={() => onNavigate('editLoan', loan.id)}><IconSVG.Edit3 /> Editar</button>
                            <button className="btn btn-loss btn-sm" onClick={() => setShowLostDebtModal(true)}><IconSVG.Lost /> Marcar perdida</button>
                        </>)}
                        {isLost && lostDebtStatus && !lostDebtStatus.isFullyRecovered && (
                            <button className="btn btn-recovery btn-sm" onClick={() => setShowRecoveryModal(true)}><IconSVG.Recover /> Recuperar</button>
                        )}
                        <button className="btn btn-ghost btn-sm" style={{ color: 'var(--danger)' }} onClick={() => setShowDeleteConfirm(true)}><IconSVG.Trash2 /> Eliminar</button>
                    </div>
                </div>

                {!isLost && (
                    <>
                        <div style={{ fontSize: '16px', fontWeight: '600', marginBottom: '10px' }}>Plan de pagos</div>
                        {insts.map(inst => {
                            const ma = normalizeMoney(MoraEngine.calculateMoraRemaining(inst));
                            const ipa = inst.status === 'paid';
                            const io = inst.status === 'overdue';
                            const ipart = inst.status === 'partial';
                            const twm = normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + ma);
                            return (
                                <div key={inst.id} className="glass-card disabled" style={{ padding: '14px', marginBottom: '6px', display: 'flex', alignItems: 'center', gap: '12px', opacity: ipa ? 0.5 : 1, borderColor: io ? 'rgba(239,68,68,0.2)' : undefined }}>
                                    <div style={{ width: '36px', height: '36px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '14px', fontWeight: '600', background: ipa ? 'rgba(16,185,129,0.15)' : io ? 'rgba(239,68,68,0.15)' : ipart ? 'rgba(99,102,241,0.15)' : 'rgba(255,255,255,0.05)', color: ipa ? 'var(--success)' : io ? 'var(--danger)' : ipart ? 'var(--accent-light)' : 'var(--text-primary)', flexShrink: 0 }}>
                                        {ipa ? '✓' : io ? '!' : ipart ? '◐' : inst.number}
                                    </div>
                                    <div style={{ flex: 1, minWidth: 0 }}>
                                        <div style={{ fontSize: '13px', fontWeight: '500' }}>Cuota {inst.number}</div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Vence: {formatDate(inst.dueDate)}{io && inst.moraDays > 0 && <span style={{ color: 'var(--danger)', marginLeft: '6px' }}>· {inst.moraDays}d</span>}</div>
                                    </div>
                                    <div style={{ textAlign: 'right' }}><div style={{ fontSize: '14px', fontWeight: '600' }}>{ipa ? formatCurrency(inst.totalAmount) : formatCurrency(twm)}</div></div>
                                    {!ipa && inst.status !== 'cancelled' && (
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', flexShrink: 0 }}>
                                            <button className="btn btn-success btn-sm" onClick={() => openCobrarModal(inst)} style={{ padding: '6px 12px', fontSize: '11px', minHeight: 'auto' }}>Cobrar</button>
                                            <button className="btn btn-ghost btn-sm" onClick={() => openAbonarModal(inst)} style={{ padding: '6px 12px', fontSize: '11px', minHeight: 'auto', borderColor: 'var(--accent)', color: 'var(--accent-light)' }}>Abonar</button>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </>
                )}

                {loanPayments.length > 0 && (
                    <div style={{ marginTop: '16px' }}>
                        <div style={{ fontSize: '16px', fontWeight: '600', marginBottom: '10px' }}>Historial</div>
                        <PaymentHistory payments={loanPayments} installments={installments} loans={loans} clients={clients}
                            onEdit={openEditPayment} onDelete={setDeletingPayment} onViewReceipt={setViewingReceipt} />
                    </div>
                )}

                <CobrarModal isOpen={showCobrarModal} onClose={closeCobrarModal} installment={selectedInstallment} loan={loan} client={client} user={user}
                    onSuccess={handleCobroSuccess} onError={(err) => addToast('Error: ' + err.message, 'error')} />
                <AbonarModal isOpen={showAbonarModal} onClose={closeAbonarModal} installment={selectedInstallment} loan={loan} client={client} user={user}
                    onSuccess={handleAbonoSuccess} onError={(err) => addToast('Error: ' + err.message, 'error')} />
                <AbonarModal isOpen={showEditAbonarModal} onClose={closeEditAbonarModal} installment={selectedInstallment} loan={loan} client={client} user={user}
                    existingPayment={editingPayment} onSuccess={() => { closeEditAbonarModal(); refreshAllData(); }} onError={(err) => addToast('Error: ' + err.message, 'error')} />

                {showLostDebtModal && <MarkAsLostModal loan={loan} installments={insts} payments={loanPayments} isOpen={showLostDebtModal} onClose={() => setShowLostDebtModal(false)} onConfirm={handleMarkAsLost} />}
                {showRecoveryModal && lostDebt && <RecoveryModal lostDebt={lostDebt} loan={loan} client={client} isOpen={showRecoveryModal} onClose={() => setShowRecoveryModal(false)} onSuccess={() => { setShowRecoveryModal(false); refreshAllData(); }} />}
                {deletingPayment && <PaymentDelete payment={deletingPayment} isOpen={true} onClose={() => setDeletingPayment(null)} onSuccess={() => { setDeletingPayment(null); refreshAllData(); }} onError={(err) => addToast('Error: ' + err.message, 'error')} />}
                {viewingReceipt && (
                    <div className="modal-overlay" onClick={() => setViewingReceipt(null)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                                <div style={{ fontSize: '18px', fontWeight: '700' }}>Comprobante</div>
                                <button onClick={() => setViewingReceipt(null)} className="btn btn-ghost btn-sm"><IconSVG.X /></button>
                            </div>
                            <PaymentReceipt payment={{ ...viewingReceipt, clientName: client?.fullName, loanNumber: loan?.loanNumber, remainingBalance: loan?.currentBalance || 0 }} onClose={() => setViewingReceipt(null)} />
                        </div>
                    </div>
                )}
                {showDeleteConfirm && <ConfirmDialog title="Eliminar préstamo" message={`¿Eliminar el préstamo #${loan.loanNumber}?\n\nSe eliminará COMPLETAMENTE.`} confirmLabel="Eliminar" confirmType="danger" onConfirm={handleDeleteLoan} onCancel={() => setShowDeleteConfirm(false)} loading={deleting} />}
            </div>
        );
    };

    // ============================================================
    // 34. COLLECTIONS PAGE
    // ============================================================

    const CollectionsPage = ({ onNavigate }) => {
        const { loans, clients, installments } = useApp();
        const [filter, setFilter] = useState('all');
        const today = todayLocal();
        const activeLoans = (loans || []).filter(l => l.status !== 'lost' && l.status !== 'cancelled');
        const data = activeLoans.map(l => ({ ...l, _c: (clients || []).find(c => c.id === l.clientId), _i: (installments || []).filter(i => i.loanId === l.id) }));
        const dueToday = data.filter(l => l._i?.some(i => { if (i.status === 'paid' || i.status === 'cancelled') return false; return getCalendarDaysDiff(today, parseLocalDate(i.dueDate)) === 0; }));
        const overdue = data.filter(l => l.status === 'overdue' || l._i?.some(i => i.status === 'overdue'));
        const pending = data.filter(l => l.status === 'active' || l.status === 'overdue');
        const paid = data.filter(l => l.status === 'finished');
        const filtered = filter === 'today' ? dueToday : filter === 'overdue' ? overdue : filter === 'pending' ? pending : filter === 'paid' ? paid : data;
        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Cobros</div>
                <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>
                    {[{ id: 'all', label: 'Todos' }, { id: 'today', label: 'Hoy' }, { id: 'pending', label: 'Pendientes' }, { id: 'overdue', label: 'Vencidas' }, { id: 'paid', label: 'Pagados' }].map(f => (
                        <button key={f.id} onClick={() => setFilter(f.id)} className="btn btn-ghost btn-sm"
                            style={{ background: filter === f.id ? 'rgba(99,102,241,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>
                            {f.label}
                        </button>
                    ))}
                </div>
                {filtered.length === 0 ? (
                    <EmptyState icon={<IconSVG.Receipt />} title="No hay cobros" />
                ) : filtered.map(l => {
                    const pendingCount = l._i?.filter(i => i.status !== 'paid' && i.status !== 'cancelled').length || 0;
                    const overdueCount = l._i?.filter(i => i.status === 'overdue').length || 0;
                    const totalWithMora = normalizeMoney(l._i?.reduce((sum, i) => { if (i.status === 'paid' || i.status === 'cancelled') return sum; return sum + normalizeMoney((i.remainingAmount || i.totalAmount || 0) + MoraEngine.calculateMoraRemaining(i)); }, 0) || 0);
                    return (
                        <div key={l.id} className="glass-card" onClick={() => onNavigate('loanDetail', l.id)} style={{ padding: '14px', marginBottom: '8px' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                                <div>
                                    <div style={{ fontWeight: '600' }}>{getSafeString(l._c?.fullName, 'Cliente')}</div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>#{l.loanNumber} · {pendingCount} cuotas</div>
                                </div>
                                <span style={{ fontWeight: '700', color: l.status === 'overdue' ? 'var(--danger)' : l.status === 'active' ? 'var(--warning)' : 'var(--success)' }}>{formatCurrency(totalWithMora)}</span>
                            </div>
                            {overdueCount > 0 && <span className="badge badge-danger" style={{ padding: '2px 6px', fontSize: '10px' }}>{overdueCount} vencidas</span>}
                        </div>
                    );
                })}
            </div>
        );
    };

    // ============================================================
    // 35. FINANCE PAGE
    // ============================================================

    const FinancePage = ({ onNavigate }) => {
        const { installments, payments, loans, expenses, capitalMovements, lostDebts, recoveryMovements, lossCompensations, refreshKey } = useApp();
        const [showNetProfitDetail, setShowNetProfitDetail] = useState(false);
        const now = new Date();
        const currentYear = now.getUTCFullYear();
        const currentMonth = now.getUTCMonth() + 1;

        const metrics = useMemo(() => {
            const activeLoans = (loans || []).filter(l => l.status === 'active' || l.status === 'overdue');
            const allCapitalIn = normalizeMoney((capitalMovements || []).filter(m => m.type === 'initial' || m.type === 'income').reduce((s, m) => s + (m.amount || 0), 0));
            const allCapitalOut = normalizeMoney((capitalMovements || []).filter(m => m.type === 'loan' || m.type === 'expense' || m.type === 'withdrawal').reduce((s, m) => s + (m.amount || 0), 0));
            const allPaymentsIn = normalizeMoney((capitalMovements || []).filter(m => m.type === 'payment' || m.type === 'recovery').reduce((s, m) => s + (m.amount || 0), 0));
            const totalCapital = normalizeMoney(allCapitalIn - allCapitalOut + allPaymentsIn);
            const totalLent = normalizeMoney(activeLoans.reduce((s, l) => s + (Number(l?.principal) || 0), 0));
            const availableCapital = normalizeMoney(totalCapital - totalLent);
            const lossState = LossCompensationEngine.calculateState(lostDebts || [], recoveryMovements || [], lossCompensations || []);
            const monthPayments = (payments || []).filter(p => { if (!p.paymentDate) return false; const d = new Date(p.paymentDate); return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear; });
            let collectedCapital = 0, collectedInterest = 0, collectedMora = 0;
            for (const p of monthPayments) { const bd = p.breakdown || {}; collectedCapital += normalizeMoney(bd.capital || 0); collectedInterest += normalizeMoney(bd.interest || 0); collectedMora += normalizeMoney(bd.mora || 0); }
            const collectedAmount = normalizeMoney(collectedCapital + collectedInterest + collectedMora);
            const collectedProfit = normalizeMoney(collectedInterest + collectedMora);
            const monthExpenses = (expenses || []).filter(e => { if (!e.date) return false; const d = new Date(e.date); return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear; });
            const totalExpenses = normalizeMoney(monthExpenses.reduce((s, e) => s + (e.amount || 0), 0));
            const monthCompensations = (lossCompensations || []).filter(c => { const d = new Date(c.appliedAt || c.createdAt); return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear; });
            const monthInterestComp = normalizeMoney(monthCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0));
            const availableProfit = normalizeMoney(collectedProfit - monthInterestComp - totalExpenses);
            return { totalCapital, totalLent, availableCapital, collectedAmount, collectedInterest: normalizeMoney(collectedInterest), collectedMora: normalizeMoney(collectedMora), collectedProfit, totalExpenses, totalLostCapital: lossState.totalLostCapital, totalRecoveredCapital: lossState.totalRecovered, totalPendingLost: lossState.totalPending, monthInterestComp, availableProfit, netProfit: availableProfit, lostDebtsCount: (lostDebts || []).length, activeLoansCount: activeLoans.length };
        }, [loans, installments, payments, capitalMovements, expenses, lostDebts, recoveryMovements, lossCompensations, currentYear, currentMonth, refreshKey]);

        const porRecuperar = useMemo(() => {
            const activeLoans = (loans || []).filter(l => l.status === 'active' || l.status === 'overdue');
            let total = 0;
            for (const loan of activeLoans) { const loanInsts = (installments || []).filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled'); for (const inst of loanInsts) total += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst)); }
            return normalizeMoney(total);
        }, [loans, installments, refreshKey]);

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Finanzas</div>
                <div className="glass-card disabled" style={{ padding: '20px', marginBottom: '14px', textAlign: 'center' }}>
                    <div style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Capital total</div>
                    <AnimatedNumber value={metrics.totalCapital} duration={1100} style={{ fontSize: '32px', fontWeight: '700', color: 'var(--accent-light)', display: 'block' }} />
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                    <div className="glass-card disabled" style={{ padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Capital prestado</div>
                        <AnimatedNumber value={metrics.totalLent} style={{ fontSize: '18px', fontWeight: '700', display: 'block' }} />
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Disponible</div>
                        <AnimatedNumber value={metrics.availableCapital} style={{ fontSize: '18px', fontWeight: '700', color: 'var(--success)', display: 'block' }} />
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Cobrado (mes)</div>
                        <AnimatedNumber value={metrics.collectedAmount} style={{ fontSize: '18px', fontWeight: '700', color: 'var(--success)', display: 'block' }} />
                    </div>
                    <div className="glass-card" style={{ padding: '14px', textAlign: 'center' }} onClick={() => setShowNetProfitDetail(true)}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Utilidad disponible</div>
                        <AnimatedNumber value={metrics.availableProfit} style={{ fontSize: '18px', fontWeight: '700', color: metrics.availableProfit >= 0 ? 'var(--success)' : 'var(--danger)', display: 'block' }} />
                    </div>
                </div>
                <div className="glass-card" style={{ padding: '16px', marginBottom: '14px' }} onClick={() => onNavigate('collections')}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                        <span style={{ fontSize: '11px', color: 'var(--text-secondary)', textTransform: 'uppercase', fontWeight: '600' }}>Por recuperar (activos)</span>
                        <span className="badge badge-info">{metrics.activeLoansCount} préstamos</span>
                    </div>
                    <AnimatedNumber value={porRecuperar} style={{ fontSize: '24px', fontWeight: '700', color: 'var(--accent-light)', display: 'block', marginBottom: '4px' }} />
                </div>
                <div className="glass-card" style={{ padding: '16px', marginBottom: '14px' }} onClick={() => onNavigate('lostDebts')}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                            <span style={{ color: 'var(--danger)' }}><IconSVG.Lost /></span>
                            <span style={{ fontSize: '14px', fontWeight: '600' }}>Pérdidas y recuperaciones</span>
                        </div>
                        <IconSVG.ArrowLeft />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', textAlign: 'center' }}>
                        <div><div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>Perdido</div><div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--danger-light)' }}>{formatCurrency(metrics.totalLostCapital)}</div></div>
                        <div><div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>Recuperado</div><div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--recovery)' }}>{formatCurrency(metrics.totalRecoveredCapital)}</div></div>
                        <div><div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>Pendiente</div><div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--warning)' }}>{formatCurrency(metrics.totalPendingLost)}</div></div>
                    </div>
                </div>
                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '12px' }}>
                    <div style={{ fontSize: '11px', fontWeight: '600', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '10px' }}>Ganancia del mes</div>
                    <div className="financial-detail-row"><span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Intereses cobrados</span><span style={{ fontWeight: '600', color: 'var(--warning-light)' }}>{formatCurrency(metrics.collectedInterest)}</span></div>
                    <div className="financial-detail-row"><span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Mora cobrada</span><span style={{ fontWeight: '600', color: 'var(--danger-light)' }}>{formatCurrency(metrics.collectedMora)}</span></div>
                    <div className="financial-detail-row total"><span style={{ color: 'var(--text-secondary)' }}>Total ganancia</span><span style={{ color: 'var(--success)' }}>{formatCurrency(metrics.collectedProfit)}</span></div>
                </div>
                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '12px' }}>
                    <div style={{ fontSize: '11px', fontWeight: '600', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '10px' }}>Gastos del mes</div>
                    <AnimatedNumber value={metrics.totalExpenses || 0} style={{ fontSize: '22px', fontWeight: '700', color: 'var(--danger)', display: 'block' }} />
                </div>

        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);
        const [showDelete, setShowDelete] = useState(null);

        const now = new Date();
        const thisMonth = (expenses || []).filter(e => { if (!e.date) return false; const d = new Date(e.date); return d.getUTCMonth() === now.getUTCMonth() && d.getUTCFullYear() === now.getUTCFullYear(); });
        const totalMonth = normalizeMoney(thisMonth.reduce((s, e) => s + (e.amount || 0), 0));

        const handleSave = async (data) => {
            if (!data.amount || data.amount <= 0) { addToast('Monto inválido', 'error'); return; }
            try {
                await initDatabase();
                const amount = normalizeMoney(parseFloat(data.amount));
                let savedId;
                if (editing) { await db.expenses.update(editing.id, { ...data, amount, updatedAt: new Date().toISOString(), syncStatus: 'pending' }); savedId = editing.id; }
                else {
                    savedId = await db.expenses.add({ ...data, amount, userId: user.id, ownerId: user.id, ownerRole: user.role || 'lender', ownerCode: user.employeeCode || null, syncStatus: 'pending', remoteId: null, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
                }
                await verifyPersistence(db.expenses, savedId);
                if (SyncAdapter.isOnline()) { const saved = await db.expenses.get(savedId); await SyncAdapter.pushRecord('expenses', saved); }
                await refreshAllData();
                addToast(editing ? 'Actualizado' : 'Registrado', 'success');
                setShowForm(false); setEditing(null);
            } catch (err) { addToast('Error', 'error'); }
        };

        const handleDelete = async () => {
            if (!showDelete) return;
            try {
                if (showDelete.capitalMovementId) await db.capitalMovements.delete(showDelete.capitalMovementId);
                if (showDelete.remoteId && supabase) { try { await supabase.from('expenses').delete().eq('id', showDelete.remoteId); } catch (e) {} }
                await db.expenses.delete(showDelete.id);
                await refreshAllData();
                addToast('Gasto eliminado', 'success');
                setShowDelete(null);
            } catch (err) { addToast('Error', 'error'); }

                <div className="glass-card disabled" style={{ padding: '14px', marginBottom: '14px', textAlign: 'center' }}>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Total del mes</div>
                    <AnimatedNumber value={totalMonth} style={{ fontSize: '22px', fontWeight: '700', color: 'var(--danger)', display: 'block' }} />

                        <div style={{ fontSize: '14px', fontWeight: '700', color: 'var(--danger)', marginRight: '8px' }}>-{formatCurrency(e.amount)}</div>
