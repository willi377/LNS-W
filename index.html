<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060610">
    <title>LOANS W — Sistema Profesional de Abonos y Pagos v9.2</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.min.js"></script>
    <style>
        :root {
            --bg-deep: #060610;
            --bg-primary: #0a0a14;
            --bg-secondary: #0f0f1a;
            --bg-elevated: #141424;
            --glass: rgba(255,255,255,0.025);
            --glass-border: rgba(255,255,255,0.05);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99,102,241,0.3);
            --success: #10b981;
            --success-light: #34d399;
            --warning: #f59e0b;
            --warning-light: #fbbf24;
            --danger: #ef4444;
            --danger-light: #f87171;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --shadow-glow: 0 8px 32px rgba(99,102,241,0.15);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            min-height: 100dvh;
            letter-spacing: -0.01em;
        }
        #root {
            min-height: 100vh;
            min-height: 100dvh;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
            50% { box-shadow: 0 0 40px rgba(99,102,241,0.5); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes skeleton {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }

        .glass-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-lg);
            transition: all 0.25s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .glass-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-1px);
        }
        .glass-card:active {
            transform: scale(0.985);
        }
        .glass-card.disabled {
            cursor: default;
        }
        .glass-card.disabled:hover {
            transform: none;
        }

        .glass-input {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }
        .glass-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
            background: rgba(255,255,255,0.06);
        }
        .glass-input::placeholder {
            color: var(--text-muted);
        }
        .glass-input.error {
            border-color: var(--danger);
            box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
        }
        .glass-input.success {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
        }

        select.glass-input {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3csvg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 20px;
            padding-right: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            min-height: 44px;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--accent-light) 10%, transparent 10%);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.5s, opacity 1s;
        }
        .btn:active::after {
            transform: scale(4);
            opacity: 0.3;
            transition: 0s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: #fff;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: #fff;
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: #fff;
        }
        .btn-warning {
            background: linear-gradient(135deg, var(--warning), #d97706);
            color: #fff;
        }
        .btn-ghost {
            background: rgba(255,255,255,0.04);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.08);
        }
        .btn-sm {
            padding: 7px 14px;
            font-size: 12px;
            border-radius: var(--radius-sm);
            min-height: 34px;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 10px;
            border-radius: var(--radius-sm);
            min-height: 28px;
        }
        .btn-block {
            width: 100%;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .badge-success {
            background: rgba(16,185,129,0.12);
            color: var(--success-light);
            border: 1px solid rgba(16,185,129,0.2);
        }
        .badge-warning {
            background: rgba(245,158,11,0.12);
            color: var(--warning-light);
            border: 1px solid rgba(245,158,11,0.2);
        }
        .badge-danger {
            background: rgba(239,68,68,0.12);
            color: var(--danger-light);
            border: 1px solid rgba(239,68,68,0.2);
        }
        .badge-info {
            background: rgba(99,102,241,0.12);
            color: var(--accent-light);
            border: 1px solid rgba(99,102,241,0.2);
        }
        .badge-neutral {
            background: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .badge-purple {
            background: rgba(139,92,246,0.12);
            color: #a78bfa;
            border: 1px solid rgba(139,92,246,0.2);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s;
            background: linear-gradient(90deg, var(--accent), var(--accent-light), #a78bfa);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(6,6,16,0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
            z-index: 80;
            display: flex;
            justify-content: space-around;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 10px;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 500;
            border-radius: 12px;
            transition: all 0.2s;
            min-width: 50px;
        }
        .nav-item.active {
            color: var(--accent-light);
            background: rgba(99,102,241,0.08);
        }
        .nav-item:hover {
            color: var(--text-secondary);
        }

        .fab {
            position: fixed;
            bottom: calc(80px + env(safe-area-inset-bottom));
            right: 16px;
            width: 52px;
            height: 52px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none;
            color: #fff;
            cursor: pointer;
            z-index: 85;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(99,102,241,0.4);
            transition: all 0.3s;
        }
        .fab:active {
            transform: scale(0.9);
        }
        .fab-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 84;
            animation: fadeIn 0.2s;
        }
        .fab-menu {
            position: fixed;
            bottom: calc(150px + env(safe-area-inset-bottom));
            right: 16px;
            display: flex;
            flex-direction: column-reverse;
            gap: 6px;
            z-index: 86;
        }
        .fab-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 18px;
            border-radius: var(--radius-md);
            background: rgba(20,20,36,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            animation: fadeUp 0.3s forwards;
            opacity: 0;
        }
        .fab-menu-item:hover {
            background: rgba(30,30,50,0.95);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            animation: fadeUp 0.3s;
            margin: auto;
        }
        .modal-content::-webkit-scrollbar {
            width: 3px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
        }

        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 90;
            animation: fadeIn 0.2s;
        }
        .sheet-content {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-elevated);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
            z-index: 91;
            animation: slideUp 0.35s;
            max-height: 85vh;
            overflow-y: auto;
            border-top: 1px solid var(--glass-border);
        }
        .sheet-handle {
            width: 32px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 0 auto 14px;
        }

        .toast-container {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            width: calc(100% - 24px);
            max-width: 400px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            pointer-events: auto;
            animation: fadeUp 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid;
            word-break: break-word;
        }
        .toast-success {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.3);
            color: var(--success-light);
        }
        .toast-error {
            background: rgba(239,68,68,0.15);
            border-color: rgba(239,68,68,0.3);
            color: var(--danger-light);
        }
        .toast-info {
            background: rgba(99,102,241,0.15);
            border-color: rgba(99,102,241,0.3);
            color: var(--accent-light);
        }
        .toast-warning {
            background: rgba(245,158,11,0.15);
            border-color: rgba(245,158,11,0.3);
            color: var(--warning-light);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }

        .quick-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-width: 75px;
        }
        .quick-action:hover {
            background: rgba(255,255,255,0.06);
        }
        .quick-action:active {
            transform: scale(0.95);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            animation: fadeIn 0.4s;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner-lg {
            width: 36px;
            height: 36px;
            border-width: 4px;
        }
        .skeleton {
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius-md);
            animation: skeleton 1.5s infinite;
        }

        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 110;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s;
        }
        .confirm-dialog {
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            animation: fadeUp 0.3s;
            text-align: center;
        }

        .payment-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }
        .payment-type-item {
            padding: 12px 8px;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .payment-type-item:hover {
            background: rgba(255,255,255,0.06);
        }
        .payment-type-item.active {
            border-color: var(--accent);
            background: rgba(99,102,241,0.08);
            color: var(--accent-light);
        }
        .payment-type-item .icon {
            font-size: 22px;
            display: block;
            margin-bottom: 4px;
        }

        .receipt {
            background: var(--bg-primary);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin: 16px 0;
        }
        .receipt-title {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-light);
            margin-bottom: 4px;
        }
        .receipt-subtitle {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .receipt-divider {
            border: none;
            border-top: 1px dashed var(--glass-border);
            margin: 12px 0;
        }
        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
        }
        .receipt-row .label {
            color: var(--text-muted);
        }
        .receipt-row .value {
            font-weight: 500;
        }
        .receipt-row .value.highlight {
            color: var(--accent-light);
            font-size: 16px;
            font-weight: 700;
        }

        .history-item {
            border-left: 2px solid var(--glass-border);
            padding-left: 12px;
            margin-bottom: 12px;
        }
        .history-item.payment {
            border-left-color: var(--success);
        }
        .history-item.partial {
            border-left-color: var(--warning);
        }
        .history-item.overdue {
            border-left-color: var(--danger);
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flex-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .text-gradient {
            background: linear-gradient(135deg, var(--accent-light), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 12px; }
        .text-xs { font-size: 10px; }
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }

        .mora-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(239,68,68,0.12);
            color: var(--danger-light);
            border: 1px solid rgba(239,68,68,0.2);
        }
        .today-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(245,158,11,0.12);
            color: var(--warning-light);
            border: 1px solid rgba(245,158,11,0.2);
        }
        .partial-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(99,102,241,0.12);
            color: var(--accent-light);
            border: 1px solid rgba(99,102,241,0.2);
        }

        .amort-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .amort-table th,
        .amort-table td {
            padding: 8px 6px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .amort-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .amort-table td {
            color: var(--text-secondary);

    const parseLocalDate = (dateStr) => {
        if (!dateStr) return new Date();
        const parts = dateStr.split('T')[0].split('-').map(Number);
        return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0));
    };

    const getCalendarDaysDiff = (date1, date2) => {
        const utc1 = Date.UTC(date1.getUTCFullYear(), date1.getUTCMonth(), date1.getUTCDate());
        const utc2 = Date.UTC(date2.getUTCFullYear(), date2.getUTCMonth(), date2.getUTCDate());
        return Math.floor((utc2 - utc1) / (1000 * 60 * 60 * 24));
    };

    const formatDateLocal = (date) => {
        if (!date) return '';
        const d = new Date(date);
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    };

    const todayLocal = () => {
        const now = new Date();
        return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 12, 0, 0, 0));
    };

        if (!d) return '';

    };

    const formatDateTime = (d) => {
        if (!d) return '';
        const dt = new Date(d);

        const today = todayLocal();
        const due = parseLocalDate(d);

    // ============================================================
    // 3. CLASES Y MOTORES CON MONEDA NORMALIZADA

    // 3.1 MoraEngine
    class MoraEngine {
        static calculateMoraDays(dueDate) {
            const today = todayLocal();
            const due = parseLocalDate(dueDate);
            const diff = getCalendarDaysDiff(due, today);
            return Math.max(0, diff);
        }

        static calculateMoraAmount({ remainingAmount, moraType, moraRate, daysLate }) {
            if (daysLate <= 0 || remainingAmount <= 0) return 0;
            const base = normalizeMoney(Number(remainingAmount));
            const rate = Number(moraRate);
            let result = 0;
            switch (moraType) {
                case 'percentage_daily':
                    result = base * (rate / 100) * daysLate;
                    break;
                case 'percentage_weekly':
                    const w = Math.floor(daysLate / 7);
                    result = w > 0 ? base * (rate / 100) * w : 0;
                    break;
                case 'percentage_monthly':
                    const m = Math.floor(daysLate / 30);
                    result = m > 0 ? base * (rate / 100) * m : 0;
                    break;
                case 'fixed_daily':
                    result = rate * daysLate;
                    break;
                case 'fixed_period':
                    result = rate;
                    break;
                default:
                    return 0;
            }
            return normalizeMoney(result);
        }

        static calculateMoraRemaining(installment) {
            const totalMoraGenerated = normalizeMoney(installment.moraAmount || 0);
            const totalMoraPaid = normalizeMoney(installment.moraPaid || 0);
            return normalizeMoney(Math.max(0, totalMoraGenerated - totalMoraPaid));
        }

        static updateMora(installment, loan) {
            if (!installment || !loan) return installment;
            if (installment.status === 'paid' || installment.status === 'cancelled') return installment;

            const daysLate = this.calculateMoraDays(installment.dueDate);
            const remainingAmount = normalizeMoney(installment.remainingAmount || installment.totalAmount || 0);

            const totalMoraGenerated = this.calculateMoraAmount({
                remainingAmount: remainingAmount,
                moraType: loan.moraType,
                moraRate: loan.moraRate,
                daysLate
            });

            const moraPaid = normalizeMoney(installment.moraPaid || 0);
            const moraRemaining = normalizeMoney(Math.max(0, totalMoraGenerated - moraPaid));

            let status = installment.status;
            if (status !== 'paid' && status !== 'cancelled') {
                if (daysLate > 0 && (installment.remainingAmount || 0) > 0.01) {
                    status = 'overdue';
                } else if (status === 'overdue' && daysLate === 0) {
                    status = 'pending';
                }
            }

            return {
                ...installment,
                moraDays: daysLate,
                moraAmount: normalizeMoney(totalMoraGenerated),
                moraPaid: normalizeMoney(moraPaid),
                moraRemaining: normalizeMoney(moraRemaining),
                status
            };
        }
    }

    // 3.2 InterestEngine
    class InterestEngine {
        static calculate({ principal, rate, count, type }) {
            const p = normalizeMoney(Number(principal));
            const r = Number(rate) / 100;
            const n = Number(count);
            let ti = 0;
            const d = [];

            switch (type) {
                case 'on_principal':
                    ti = normalizeMoney(p * r);
                    const ip = normalizeMoney(ti / n);
                    const pp = normalizeMoney(p / n);
                    let totalCapital = 0;
                    let totalInterest = 0;
                    for (let i = 0; i < n; i++) {
                        let principalPart = pp;
                        let interestPart = ip;
                        if (i === n - 1) {
                            principalPart = normalizeMoney(p - totalCapital);
                            interestPart = normalizeMoney(ti - totalInterest);
                        }
                        d.push({
                            principal: normalizeMoney(principalPart),
                            interest: normalizeMoney(interestPart),
                            total: normalizeMoney(principalPart + interestPart)
                        });
                        totalCapital += principalPart;
                        totalInterest += interestPart;
                    }
                    break;

                case 'fixed_per_installment':
                    const fi = normalizeMoney((p * r) / n);
                    ti = normalizeMoney(fi * n);
                    const pf = normalizeMoney(p / n);
                    let totalCap = 0;
                    for (let i = 0; i < n; i++) {
                        let principalPart = pf;
                        if (i === n - 1) {
                            principalPart = normalizeMoney(p - totalCap);
                        }
                        d.push({
                            principal: normalizeMoney(principalPart),
                            interest: fi,
                            total: normalizeMoney(principalPart + fi)
                        });
                        totalCap += principalPart;
                    }
                    break;

                case 'no_interest':
                    const pz = normalizeMoney(p / n);
                    let totalCap2 = 0;
                    for (let i = 0; i < n; i++) {
                        let principalPart = pz;
                        if (i === n - 1) {
                            principalPart = normalizeMoney(p - totalCap2);
                        }
                        d.push({
                            principal: normalizeMoney(principalPart),
                            interest: 0,
                            total: normalizeMoney(principalPart)
                        });
                        totalCap2 += principalPart;
                    }
                    break;

                default:
                    const pd = normalizeMoney(p / n);
                    const id = normalizeMoney((p * r) / n);
                    ti = normalizeMoney(id * n);
                    let totalCap3 = 0;
                    let totalInt3 = 0;
                    for (let i = 0; i < n; i++) {
                        let principalPart = pd;
                        let interestPart = id;
                        if (i === n - 1) {
                            principalPart = normalizeMoney(p - totalCap3);
                            interestPart = normalizeMoney(ti - totalInt3);
                        }
                        d.push({
                            principal: normalizeMoney(principalPart),
                            interest: normalizeMoney(interestPart),
                            total: normalizeMoney(principalPart + interestPart)
                        });
                        totalCap3 += principalPart;
                        totalInt3 += interestPart;
                    }
            }

            return {
                totalInterest: normalizeMoney(ti),
                totalRepayment: normalizeMoney(p + ti),
                details: d.map(x => ({
                    principal: normalizeMoney(x.principal),
                    interest: normalizeMoney(x.interest),
                    total: normalizeMoney(x.total)
                }))
            };
        }
    }

    // 3.3 ScheduleEngine
    class ScheduleEngine {
        static generate({ startDate, frequency, count, dueDateType = 'fixed_day' }) {
            const dates = [];
            const start = parseLocalDate(startDate);
            for (let i = 0; i < count; i++) {
                let date;
                switch (frequency) {
                    case 'daily':
                        date = new Date(start);
                        date.setUTCDate(date.getUTCDate() + i);
                        break;
                    case 'weekly':
                        date = new Date(start);
                        date.setUTCDate(date.getUTCDate() + (i * 7));
                        break;
                    case 'biweekly':
                        date = new Date(start);
                        date.setUTCDate(date.getUTCDate() + (i * 14));
                        break;
                    case 'monthly':
                        if (dueDateType === 'end_of_period') {
                            date = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i + 1, 0, 12, 0, 0, 0));
                        } else {
                            const targetDay = start.getUTCDate();
                            date = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, 1, 12, 0, 0, 0));
                            const lastDay = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0, 12, 0, 0, 0)).getUTCDate();
                            date.setUTCDate(Math.min(targetDay, lastDay));
                        }
                        break;
                    default:
                        date = new Date(start);
                        date.setUTCDate(date.getUTCDate() + (i * 30));
                }
                date.setUTCHours(12, 0, 0, 0);
                dates.push(date);
            }
            return dates;
        }
    }

    // 3.4 PaymentDistributionEngine - DISTRIBUCIÓN DE PAGOS ENTRE CUOTAS
    class PaymentDistributionEngine {
        static distributePayment(installments, paymentAmount, selectedInstallmentId = null) {
            const remainingAmount = normalizeMoney(paymentAmount);
            if (remainingAmount <= 0) {
                return { distributed: [], remaining: 0, totalApplied: 0 };
            }

            const sortedInstallments = [...installments]
                .filter(i => i.status !== 'paid' && i.status !== 'cancelled')
                .sort((a, b) => a.number - b.number);

            let startIndex = 0;
            if (selectedInstallmentId) {
                const index = sortedInstallments.findIndex(i => i.id === selectedInstallmentId);
                if (index !== -1) {
                    startIndex = index;
                }
            }

            const orderedInstallments = [
                ...sortedInstallments.slice(startIndex),
                ...sortedInstallments.slice(0, startIndex)
            ];

            let remainingToDistribute = remainingAmount;
            const distributed = [];

            for (const installment of orderedInstallments) {
                const currentRemaining = normalizeMoney(installment.remainingAmount || installment.totalAmount || 0);
                
                if (currentRemaining <= 0) {
                    continue;
                }

                const applyAmount = normalizeMoney(Math.min(remainingToDistribute, currentRemaining));
                
                distributed.push({
                    installmentId: installment.id,
                    installmentNumber: installment.number,
                    previousRemaining: currentRemaining,
                    appliedAmount: applyAmount,
                    newRemaining: normalizeMoney(currentRemaining - applyAmount),
                    isFullyPaid: applyAmount >= currentRemaining
                });

                remainingToDistribute = normalizeMoney(remainingToDistribute - applyAmount);

                if (remainingToDistribute <= 0) {
                    break;
                }
            }

            const totalApplied = normalizeMoney(paymentAmount - remainingToDistribute);

            return {
                distributed,
                remaining: remainingToDistribute,
                totalApplied
            };
        }
    }

    // 3.5 PaymentEngine
    class PaymentEngine {
        static process({ installment, amount }) {
            let rem = normalizeMoney(Number(amount));
            const bd = { capital: 0, interest: 0, mora: 0 };
            const ta = normalizeMoney(installment.totalAmount || 0);
            const ia = normalizeMoney(installment.interest || 0);
            const ra = normalizeMoney(installment.remainingAmount || ta);
            const ma = normalizeMoney(MoraEngine.calculateMoraRemaining(installment));
            const totalDue = normalizeMoney(ra + ma);

            if (totalDue <= 0) {
                return {
                    breakdown: bd,
                    totalPaid: 0,
                    newPaidAmount: normalizeMoney(installment.paidAmount || 0),
                    newRemaining: 0,
                    newMoraPaid: normalizeMoney(installment.moraPaid || 0),
                    newStatus: 'paid',
                    change: rem,
                    isFullPayment: true
                };
            }

            let moraPaid = 0, interestPaid = 0, capitalPaid = 0;

            if (ma > 0 && rem > 0) {
                moraPaid = normalizeMoney(Math.min(rem, ma));
                rem = normalizeMoney(rem - moraPaid);
            }

            const ir = ta > 0 ? ia / ta : 0;
            const mi = normalizeMoney(ra * ir);
            if (mi > 0 && rem > 0) {
                interestPaid = normalizeMoney(Math.min(rem, mi));
                rem = normalizeMoney(rem - interestPaid);
            }

            const mc = normalizeMoney(ra - mi);
            if (rem > 0) {
                capitalPaid = normalizeMoney(Math.min(rem, Math.max(0, mc)));
                rem = normalizeMoney(rem - capitalPaid);
            }

            const totalPaidThisPayment = normalizeMoney(capitalPaid + interestPaid + moraPaid);
            const newPaidAmount = normalizeMoney((installment.paidAmount || 0) + capitalPaid + interestPaid);
            const newMoraPaid = normalizeMoney((installment.moraPaid || 0) + moraPaid);
            const newRemaining = normalizeMoney(Math.max(0, ta - newPaidAmount));

            let newStatus = 'pending';
            const moraRemaining = normalizeMoney(Math.max(0, (installment.moraAmount || 0) - newMoraPaid));
            if (newRemaining <= 0.01 && moraRemaining <= 0.01) {
                newStatus = 'paid';
            } else if (newPaidAmount > 0 && (newRemaining > 0.01 || moraRemaining > 0.01)) {
                newStatus = 'partial';
            } else if (MoraEngine.calculateMoraDays(installment.dueDate) > 0 && newRemaining > 0.01) {
                newStatus = 'overdue';
            }

            return {
                breakdown: {
                    capital: normalizeMoney(capitalPaid),
                    interest: normalizeMoney(interestPaid),
                    mora: normalizeMoney(moraPaid)
                },
                totalPaid: totalPaidThisPayment,
                newPaidAmount,
                newMoraPaid,
                newRemaining,
                newStatus,
                change: rem,
                isFullPayment: newStatus === 'paid'
            };
        }
    }

    // 3.6 FinanceEngine
    class FinanceEngine {
        static calculateMetrics({ installments, payments, loans, expenses, capitalMovements, year, month }) {
            const sd = new Date(Date.UTC(year, month - 1, 1, 12, 0, 0, 0));
            const ed = new Date(Date.UTC(year, month, 0, 23, 59, 59, 999));

            const mi = installments.filter(i => {
                const d = new Date(i.dueDate);
                return d >= sd && d <= ed;
            });

            const mp = payments.filter(p => {
                const d = new Date(p.paymentDate);
                return d >= sd && d <= ed;
            });

            const me = expenses.filter(e => {
                const d = new Date(e.date);
                return d >= sd && d <= ed;
            });

            const expectedAmount = normalizeMoney(mi.reduce((s, i) => s + (i.totalAmount || 0), 0));

            let collectedCapital = 0, collectedInterest = 0, collectedMora = 0;
            for (const p of mp) {
                const bd = p.breakdown || {};
                collectedCapital += normalizeMoney(bd.capital || 0);
                collectedInterest += normalizeMoney(bd.interest || 0);
                collectedMora += normalizeMoney(bd.mora || 0);
            }

            const collectedAmount = normalizeMoney(collectedCapital + collectedInterest + collectedMora);
            const totalExpenses = normalizeMoney(me.reduce((s, e) => s + (e.amount || 0), 0));

            const validLoanIds = new Set(loans.map(l => l.id));
            const validInstallmentIds = new Set(installments.map(i => i.id));
            const validExpenseIds = new Set(expenses.map(e => e.id));

            const allCapitalIn = normalizeMoney(capitalMovements.filter(m => {
                if (m.type !== 'initial' && m.type !== 'income') return false;
                if (m.referenceType && m.referenceId) {
                    if (m.referenceType === 'loan' && !validLoanIds.has(m.referenceId)) return false;
                    if (m.referenceType === 'expense' && !validExpenseIds.has(m.referenceId)) return false;
                }
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const allCapitalOut = normalizeMoney(capitalMovements.filter(m => {
                if (m.type !== 'loan' && m.type !== 'expense' && m.type !== 'withdrawal') return false;
                if (m.referenceType && m.referenceId) {
                    if (m.referenceType === 'loan' && !validLoanIds.has(m.referenceId)) return false;
                    if (m.referenceType === 'expense' && !validExpenseIds.has(m.referenceId)) return false;
                }
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const allPaymentsIn = normalizeMoney(capitalMovements.filter(m => {
                if (m.type !== 'payment') return false;
                if (m.referenceType === 'payment' && m.referenceId && !validInstallmentIds.has(m.referenceId)) return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const totalCapital = normalizeMoney(allCapitalIn - allCapitalOut + allPaymentsIn);
            const totalLent = normalizeMoney(loans.filter(l => l.status === 'active' || l.status === 'overdue')
                .reduce((s, l) => s + (l.principal || 0), 0));
            const availableCapital = normalizeMoney(totalCapital - totalLent);

            const overdueAmount = normalizeMoney(mi.filter(i => i.status === 'overdue' || i.status === 'partial')
                .reduce((s, i) => {
                    const rem = normalizeMoney(i.remainingAmount || i.totalAmount || 0);
                    const moraRem = normalizeMoney(MoraEngine.calculateMoraRemaining(i));
                    return s + rem + moraRem;
                }, 0));

            const pendingAmount = normalizeMoney(expectedAmount - collectedAmount);
            const profit = normalizeMoney(collectedInterest + collectedMora - totalExpenses);
            const compliance = expectedAmount > 0 ? normalizeMoney((collectedAmount / expectedAmount) * 100) : 0;

            return {
                expectedAmount: normalizeMoney(expectedAmount),
                collectedAmount: normalizeMoney(collectedAmount),
                collectedCapital: normalizeMoney(collectedCapital),
                collectedInterest: normalizeMoney(collectedInterest),
                collectedMora: normalizeMoney(collectedMora),
                totalExpenses: normalizeMoney(totalExpenses),
                pendingAmount: normalizeMoney(pendingAmount),
                overdueAmount: normalizeMoney(overdueAmount),
                totalCapital: normalizeMoney(totalCapital),
                totalLent: normalizeMoney(totalLent),
                availableCapital: normalizeMoney(availableCapital),
                profit: normalizeMoney(profit),
                compliance: normalizeMoney(compliance)
            };
        }
    }

    class SecurityUtils {
        static async hashPassword(pw) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pw + 'LoansW_Salt_2025');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return 'lw8_' + Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        static async verifyPassword(pw, hash) {
            return await this.hashPassword(pw) === hash;
        }

        static generateToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const array = new Uint8Array(64);
            crypto.getRandomValues(array);
            return Array.from(array, b => chars.charAt(b % chars.length)).join('');
        }

        static async createSession(userId, remember = false) {
            const token = this.generateToken();
            const expiresAt = new Date();
            expiresAt.setDate(expiresAt.getDate() + (remember ? 30 : 1));
            await db.sessions.add({
                userId,
                token,
                expiresAt: expiresAt.toISOString(),
                createdAt: new Date().toISOString()
            });
            (remember ? localStorage : sessionStorage).setItem('lw_session', JSON.stringify({ userId, token }));
        }

        static async validateSession() {
            try {
                let data = sessionStorage.getItem('lw_session');
                if (!data) data = localStorage.getItem('lw_session');
                if (!data) return null;
                const { userId, token } = JSON.parse(data);
                const session = await db.sessions.where({ userId, token }).first();
                if (!session || new Date(session.expiresAt) < new Date()) {
                    sessionStorage.removeItem('lw_session');
                    localStorage.removeItem('lw_session');
                    if (session) await db.sessions.delete(session.id);
                    return null;
                }
                return await db.users.get(userId);
            } catch {
                sessionStorage.removeItem('lw_session');
                localStorage.removeItem('lw_session');
                return null;
            }
        }

        static async destroySession() {
            const sources = [sessionStorage.getItem('lw_session'), localStorage.getItem('lw_session')];
            for (const src of sources) {
                if (src) {
                    try {
                        const { token } = JSON.parse(src);
                        await db.sessions.where({ token }).delete();
                    } catch {}
                }
            }
            sessionStorage.removeItem('lw_session');
            localStorage.removeItem('lw_session');
        }
    }

        collectionPeriods: '++id, userId, year, month, expectedAmount, collectedAmount, pendingAmount, overdueAmount, compliance, createdAt',

    }).upgrade(async tx => {
        console.log('[DB] Migrando a v9...');
        try {
            const payments = await tx.table('payments').toArray();
            for (const p of payments) {
                const update = {};
                if (!p.paymentType) update.paymentType = 'full_installment';
                if (!p.receiptNumber) update.receiptNumber = `REC-${Date.now().toString(36).toUpperCase()}`;
                if (p.isFullPayment === undefined) {
                    const bd = p.breakdown || {};
                    const total = normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0));
                    const amount = normalizeMoney(p.amount || 0);
                    update.isFullPayment = Math.abs(total - amount) < 0.01;
                }
                if (p.surplus === undefined) update.surplus = 0;
                if (!p.createdAt) update.createdAt = p.paymentDate || new Date().toISOString();
                if (!p.updatedAt) update.updatedAt = p.paymentDate || new Date().toISOString();
                if (Object.keys(update).length > 0) {
                    await tx.table('payments').update(p.id, update);
                }
            }

            const installments = await tx.table('installments').toArray();
            for (const inst of installments) {
                const moraRemaining = normalizeMoney((inst.moraAmount || 0) - (inst.moraPaid || 0));
                await tx.table('installments').update(inst.id, { moraRemaining: Math.max(0, moraRemaining) });
            }
        } catch (err) {
            console.error('[DB] Error en migración v9:', err);
        }
        console.log('[DB] Migración a v9 completada');
    });

    const cleanOrphanCapitalMovements = async (userId) => {
        if (!userId) return;
        try {
            const allMovements = await db.capitalMovements.where({ userId }).toArray();
            const allLoans = await db.loans.where({ userId }).toArray();
            const allExpenses = await db.expenses.where({ userId }).toArray();
            const loanIds = new Set(allLoans.map(l => l.id));
            const expenseIds = new Set(allExpenses.map(e => e.id));

            const allInstallments = [];
            for (const loan of allLoans) {
                const insts = await db.installments.where({ loanId: loan.id }).toArray();
                allInstallments.push(...insts);
            }
            const installmentIds = new Set(allInstallments.map(i => i.id));

            const toDelete = [];
            for (const mov of allMovements) {
                if (mov.referenceType === 'loan' && mov.referenceId && !loanIds.has(mov.referenceId)) {
                    toDelete.push(mov.id);
                } else if (mov.referenceType === 'payment' && mov.referenceId && !installmentIds.has(mov.referenceId)) {
                    toDelete.push(mov.id);
                } else if (mov.referenceType === 'expense' && mov.referenceId && !expenseIds.has(mov.referenceId)) {
                    toDelete.push(mov.id);
                }
            }

            if (toDelete.length > 0) {
                await db.capitalMovements.bulkDelete(toDelete);
                console.log(`[CLEAN] ${toDelete.length} movimientos huérfanos eliminados`);
            }
        } catch (err) {
            console.error('[CLEAN] Error limpiando huérfanos:', err);

    };

                    let i = await db.installments.where('loanId').anyOf(loanIds).toArray();
                    let p = await db.payments.where('loanId').anyOf(loanIds).toArray();

                    for (const inst of i) {
                        if (inst.status === 'paid' || inst.status === 'cancelled') continue;
                        const loan = l.find(lo => lo.id === inst.loanId);
                        if (loan) {
                            const updated = MoraEngine.updateMora(inst, loan);
                            if (updated.moraDays !== inst.moraDays || updated.moraAmount !== inst.moraAmount ||
                                updated.moraRemaining !== inst.moraRemaining || updated.status !== inst.status) {
                                await db.installments.update(inst.id, {
                                    moraDays: updated.moraDays,

                                    moraRemaining: updated.moraRemaining,

                                });

                    }

                    i = await db.installments.where('loanId').anyOf(loanIds).toArray();
                    setInstallments(i);
                    setPayments(p);

                    for (const loan of l) {
                        const loanInsts = i.filter(inst => inst.loanId === loan.id);
                        const allPaid = loanInsts.every(inst => inst.status === 'paid' || inst.status === 'cancelled');
                        const hasOverdue = loanInsts.some(inst => inst.status === 'overdue');
                        let newStatus = loan.status;

                        if (allPaid && loan.status !== 'finished') {
                            newStatus = 'finished';
                            await db.loans.update(loan.id, { status: 'finished', updatedAt: new Date().toISOString() });
                        } else if (hasOverdue && loan.status === 'active') {
                            newStatus = 'overdue';
                            await db.loans.update(loan.id, { status: 'overdue', updatedAt: new Date().toISOString() });
                        } else if (!hasOverdue && loan.status === 'overdue') {
                            newStatus = 'active';
                            await db.loans.update(loan.id, { status: 'active', updatedAt: new Date().toISOString() });
                        }

                        if (newStatus !== loan.status) {
                            loan.status = newStatus;
                        }
                    }
                    setLoans([...l]);
                } else {
                    setInstallments([]);
                    setPayments([]);
                }

                const [e, cm, cfg] = await Promise.all([
                    db.expenses.where({ userId }).toArray(),
                    db.capitalMovements.where({ userId }).toArray(),
                    db.settings.get(userId)
                ]);

                setExpenses(e);
                setCapitalMovements(cm);
                setConfig(cfg || null);

                try {
                    const ar = await db.auditLog.where({ userId }).toArray();
                    ar.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    setAuditLogs(ar.slice(0, 100));
                } catch (err) {
                    console.error('[AUDIT]', err);
                }

                setRefreshKey(k => k + 1);
            } catch (err) {
                console.error('[APP] Error refresh:', err);
                addToast('Error al cargar datos: ' + (err.message || 'Error desconocido'), 'error');
            }
            setLoading(false);
        }, [user, addToast]);

        const addAuditLog = useCallback(async (et, eid, action, desc = '', before = null, after = null, details = null) => {
            if (!user?.id) return;
            try {
                await db.auditLog.add({
                    userId: user.id,
                    timestamp: new Date().toISOString(),
                    entityType: et,
                    entityId: eid,
                    action,
                    description: desc,
                    before: before ? JSON.stringify(before) : null,
                    after: after ? JSON.stringify(after) : null,
                    details: details ? JSON.stringify(details) : null
                });
            } catch (err) {
                console.error('[APP] Audit log error:', err);
            }
        }, [user]);

        useEffect(() => {
            if (user) refreshAllData();
        }, [user]);

        const value = useMemo(() => ({
            user,
            onLogout,
            clients,
            loans,
            installments,
            payments,
            expenses,
            capitalMovements,
            expenseCategories,

            collectionPeriods,
            auditLogs,
            config,

            toasts,
            addToast,
            loading,
            refreshKey,
            refreshAllData,
            addAuditLog,
            db
        }), [user, onLogout, clients, loans, installments, payments, expenses,
            capitalMovements, expenseCategories, collectionPeriods, auditLogs,
            config, toasts, addToast, loading, refreshKey, refreshAllData, addAuditLog, db
        ]);

        return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    };

            if (payment.isFullPayment) return 'paid';
            const total = normalizeMoney((payment.breakdown?.capital || 0) + (payment.breakdown?.interest || 0) + (payment.breakdown?.mora || 0));
            const amount = normalizeMoney(payment.amount || 0);
            if (total >= amount) return 'paid';
            if (total > 0) return 'partial';
            return 'pending';
        };

        const getStatusBadge = (status) => {
            switch (status) {
                case 'paid':
                    return <span className="badge badge-success">Pagada</span>;
                case 'partial':
                    return <span className="badge badge-warning">Parcial</span>;
                case 'pending':
                    return <span className="badge badge-neutral">Pendiente</span>;
                default:
                    return <span className="badge badge-neutral">{status}</span>;

                <EmptyState

                                                <span style={{ color: 'var(--text-muted)' }}>Comprobante:</span>
