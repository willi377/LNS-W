    // ============================================================
    // 10. COMPONENT: PAYMENT HISTORY
    // ============================================================

    const PaymentHistory = ({ payments, installments, loans, clients, onEdit, onDelete, onViewReceipt }) => {
        const [expanded, setExpanded] = useState(null);

        if (!payments || payments.length === 0) {
            return (
                <EmptyState
                    icon={<IconSVG.History />}
                    title="Sin historial de pagos"
                    description="Aún no hay pagos registrados para este préstamo"
                />
            );
        }

        return (
            <div style={{ marginTop: '12px' }}>
                {payments.sort((a, b) => new Date(b.paymentDate || b.createdAt) - new Date(a.paymentDate || a.createdAt))
                    .map(payment => {
                        const isExpanded = expanded === payment.id;
                        const isCobro = payment.paymentType === 'full_installment';
                        const typeLabel = isCobro ? 'Cobro' : (PaymentAllocationEngine.PAYMENT_TYPE_LABELS[payment.paymentType] || 'Abono');
                        const borderColor = isCobro ? 'var(--success)' : 'var(--warning)';

                        return (
                            <div key={payment.id}
                                style={{
                                    padding: '12px',
                                    background: 'rgba(255,255,255,0.02)',
                                    borderRadius: 'var(--radius-sm)',
                                    marginBottom: '8px',
                                    cursor: 'pointer',
                                    borderLeft: `3px solid ${borderColor}`
                                }}
                                onClick={() => setExpanded(isExpanded ? null : payment.id)}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                    <div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                            <span className={`badge ${isCobro ? 'badge-success' : 'badge-warning'}`}
                                                style={{ padding: '2px 8px', fontSize: '10px' }}>
                                                {isCobro ? '✓ Cobro' : '◐ ' + typeLabel}
                                            </span>
                                            <span style={{ fontSize: '13px', fontWeight: '500' }}>
                                                {formatDateTime(payment.paymentDate || payment.createdAt)}
                                            </span>
                                        </div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                            {payment.method}
                                            {payment.receiptNumber ? ` · ${payment.receiptNumber}` : ''}
                                        </div>
                                    </div>
                                    <div style={{ textAlign: 'right' }}>
                                        <div style={{ fontSize: '16px', fontWeight: '700', color: 'var(--accent-light)' }}>
                                            {formatCurrency(payment.amount)}
                                        </div>
                                    </div>
                                </div>

                                {isExpanded && (
                                    <div style={{ marginTop: '12px', paddingTop: '12px', borderTop: '1px solid var(--glass-border)' }}>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '6px', fontSize: '12px' }}>
                                            <div>
                                                <span style={{ color: 'var(--text-muted)' }}>Capital: </span>
                                                <div style={{ color: 'var(--accent-light)', fontWeight: '600' }}>
                                                    {formatCurrency(payment.breakdown?.capital || 0)}
                                                </div>
                                            </div>
                                            <div>
                                                <span style={{ color: 'var(--text-muted)' }}>Intereses: </span>
                                                <div style={{ color: 'var(--warning-light)', fontWeight: '600' }}>
                                                    {formatCurrency(payment.breakdown?.interest || 0)}
                                                </div>
                                            </div>
                                            <div>
                                                <span style={{ color: 'var(--text-muted)' }}>Mora: </span>
                                                <div style={{ color: 'var(--danger-light)', fontWeight: '600' }}>
                                                    {formatCurrency(payment.breakdown?.mora || 0)}
                                                </div>
                                            </div>
                                        </div>

                                        {payment.note && (
                                            <div style={{ fontSize: '11px', color: 'var(--text-secondary)', marginTop: '8px', fontStyle: 'italic' }}>
                                                Nota: {payment.note}
                                            </div>
                                        )}

                                        <div style={{ display: 'flex', gap: '6px', marginTop: '10px', flexWrap: 'wrap' }}>
                                            <button className="btn btn-ghost btn-xs" onClick={(e) => { e.stopPropagation(); onViewReceipt(payment); }}>
                                                <IconSVG.FileText /> Recibo
                                            </button>
                                            <button className="btn btn-ghost btn-xs" onClick={(e) => { e.stopPropagation(); onEdit(payment); }}>
                                                <IconSVG.Edit3 /> Editar
                                            </button>
                                            <button className="btn btn-ghost btn-xs" style={{ color: 'var(--danger)' }}
                                                onClick={(e) => { e.stopPropagation(); onDelete(payment); }}>
                                                <IconSVG.Trash2 /> Eliminar
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })}
            </div>
        );
    };

    // ============================================================
    // 11. COMPONENT: COBRAR MODAL (pago completo de una cuota)
    // ============================================================

    const CobrarModal = ({
        isOpen, onClose, installment, loan, client, user,
        onSuccess, onError
    }) => {
        const { refreshAllData, addToast } = useApp();

        const [amount, setAmount] = useState('');
        const [method, setMethod] = useState('Efectivo');
        const [date, setDate] = useState(formatDateLocal(todayLocal()));
        const [note, setNote] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [step, setStep] = useState('form');
        const [result, setResult] = useState(null);

        const remainingCapital = normalizeMoney(installment?.remainingAmount || installment?.totalAmount || 0);
        const remainingMora = installment ? normalizeMoney(MoraEngine.calculateMoraRemaining(installment)) : 0;
        const totalDue = normalizeMoney(remainingCapital + remainingMora);

        useEffect(() => {
            if (isOpen) {
                setStep('form');
                setAmount(totalDue > 0 ? totalDue.toString() : '');
                setMethod('Efectivo');
                setDate(formatDateLocal(todayLocal()));
                setNote('');
                setError('');
                setResult(null);
            }
        }, [isOpen, totalDue]);

        if (!isOpen || !installment || !loan) return null;

        const generatePreview = () => {
            const amountValue = normalizeMoney(parseFloat(amount));
            if (!amountValue || amountValue <= 0) {
                setError('Ingresa un monto válido');
                return;
            }
            setError('');

            const paymentResult = PaymentEngine.process({ installment, amount: amountValue });

            const preview = {
                installmentId: installment.id,
                installmentNumber: installment.number,
                loanId: loan.id,
                clientName: client?.fullName || 'Cliente',
                loanNumber: loan?.loanNumber || 'N/A',
                receivedAmount: amountValue,
                date, method, note,
                allocation: paymentResult.breakdown,
                after: {
                    capital: normalizeMoney(remainingCapital - paymentResult.breakdown.capital),
                    mora: normalizeMoney(remainingMora - paymentResult.breakdown.mora),
                    total: paymentResult.newRemaining
                },
                isFullPayment: paymentResult.isFullPayment,
                newStatus: paymentResult.newStatus,
                surplus: paymentResult.change,
                receiptNumber: `COB-${Date.now().toString(36).toUpperCase()}`,
                timestamp: new Date().toISOString()
            };

            setResult(preview);
            setStep('preview');
        };

        const confirmCobro = async () => {
            if (!result) return;
            setLoading(true);
            setError('');

            try {
                await initDatabase();

                await db.transaction('rw',
                    db.payments, db.installments, db.loans,
                    db.capitalMovements, db.auditLog, db.lostDebts, db.recoveryMovements, db.lossCompensations,
                    async () => {

                    const paymentResult = PaymentEngine.process({
                        installment, amount: result.receivedAmount
                    });

                    const newPaidAmount = normalizeMoney(
                        (installment.paidAmount || 0) +
                        paymentResult.breakdown.capital +
                        paymentResult.breakdown.interest
                    );
                    const newMoraPaid = normalizeMoney(
                        (installment.moraPaid || 0) + paymentResult.breakdown.mora
                    );
                    const newRemaining = normalizeMoney(
                        Math.max(0, (installment.totalAmount || 0) - newPaidAmount)
                    );
                    const newMoraRemaining = normalizeMoney(
                        Math.max(0, (installment.moraAmount || 0) - newMoraPaid)
                    );

                    let instStatus = 'pending';
                    if (newRemaining <= 0.01 && newMoraRemaining <= 0.01) {
                        instStatus = 'paid';
                    } else if (newPaidAmount > 0 || newMoraPaid > 0) {
                        instStatus = 'partial';
                    } else if (MoraEngine.calculateMoraDays(installment.dueDate) > 0) {
                        instStatus = 'overdue';
                    }

                    await db.installments.update(installment.id, {
                        paidAmount: newPaidAmount,
                        remainingAmount: newRemaining,
                        moraPaid: newMoraPaid,
                        moraRemaining: newMoraRemaining,
                        status: instStatus
                    });

                    const paymentId = await db.payments.add({
                        loanId: loan.id,
                        clientId: client.id,
                        installmentId: installment.id,
                        amount: result.receivedAmount,
                        paymentDate: result.date,
                        method: result.method,
                        note: result.note || `Cobro cuota ${installment.number}`,
                        breakdown: paymentResult.breakdown,
                        paymentType: 'full_installment',
                        receiptNumber: result.receiptNumber,
                        isFullPayment: paymentResult.isFullPayment,
                        surplus: normalizeMoney(paymentResult.change),
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    await db.capitalMovements.add({
                        userId: user.id,
                        type: 'payment',
                        amount: result.receivedAmount,
                        date: result.date,
                        description: `Cobro cuota ${installment.number} - ${client.fullName}`,
                        referenceType: 'payment',
                        referenceId: paymentId,
                        createdAt: new Date().toISOString()
                    });

                    // === COMPENSACIÓN DE PÉRDIDAS CON INTERESES ===
                    if (paymentResult.breakdown.interest > 0) {
                        const interestToApply = normalizeMoney(paymentResult.breakdown.interest);
                        const allLostDebts = await db.lostDebts.where({ userId: user.id }).toArray();
                        const allRecoveries = await db.recoveryMovements.where({ userId: user.id }).toArray();
                        const allCompensations = await db.lossCompensations.where({ userId: user.id }).toArray();

                        const state = LossCompensationEngine.calculateState(allLostDebts, allRecoveries, allCompensations);
                        if (state.hasPendingLoss) {
                            const sortedPending = state.perDebt
                                .filter(d => !d.isFullyRecovered)
                                .sort((a, b) => new Date(a.lostAt) - new Date(b.lostAt));

                            const distributions = LossCompensationEngine.distributeInterestToLosses(interestToApply, sortedPending);
                            const now = new Date().toISOString();

                            for (const dist of distributions) {
                                const debt = sortedPending.find(d => d.id === dist.lostDebtId);
                                if (!debt) continue;
                                const pendingBefore = debt.pending;
                                const pendingAfter = normalizeMoney(Math.max(0, pendingBefore - dist.amount));

                                await db.lossCompensations.add({
                                    userId: user.id,
                                    lostDebtId: debt.id,
                                    paymentId,
                                    loanId: loan.id,
                                    clientId: client.id,
                                    installmentId: installment.id,
                                    amountAppliedToLoss: dist.amount,
                                    interestGenerated: interestToApply,
                                    moraGenerated: normalizeMoney(paymentResult.breakdown.mora || 0),
                                    capitalReceived: normalizeMoney(paymentResult.breakdown.capital || 0),
                                    pendingBefore,
                                    pendingAfter,
                                    appliedAt: now,
                                    description: `Cobro cuota ${installment.number} — ${client.fullName}`,
                                    createdAt: now
                                });

                                await db.lostDebts.update(debt.id, {
                                    recoveredInterest: normalizeMoney((debt.recoveredInterest || 0) + dist.amount),
                                    status: pendingAfter <= 0.01 ? 'fully_recovered' : 'partial_recovered',
                                    fullyRecoveredAt: pendingAfter <= 0.01 ? now : null,
                                    updatedAt: now
                                });
                            }
                        }
                    }
                    // === FIN COMPENSACIÓN ===

                    const allInsts = await db.installments.where({ loanId: loan.id }).toArray();
                    const loanPayments = await db.payments.where({ loanId: loan.id }).toArray();

                    let totalPaid = 0;
                    for (const p of loanPayments) {
                        const bd = p.breakdown || {};
                        totalPaid += normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0));
                    }
                    totalPaid = normalizeMoney(totalPaid);

                    const currentBalance = normalizeMoney(
                        Math.max(0, (loan.totalRepayment || 0) - totalPaid)
                    );
                    const progress = loan.totalRepayment > 0
                        ? normalizeMoney((totalPaid / loan.totalRepayment) * 100)
                        : 0;

                    const allPaid = allInsts.every(i => i.status === 'paid' || i.status === 'cancelled');
                    const hasOverdue = allInsts.some(i => i.status === 'overdue');
                    let loanStatus = loan.status;
                    if (allPaid) loanStatus = 'finished';
                    else if (hasOverdue) loanStatus = 'overdue';
                    else if (loan.status === 'overdue') loanStatus = 'active';

                    await db.loans.update(loan.id, {
                        totalPaid, currentBalance, progress,
                        status: loanStatus,
                        updatedAt: new Date().toISOString()
                    });

                    await db.auditLog.add({
                        userId: user.id,
                        timestamp: new Date().toISOString(),
                        entityType: 'payment',
                        entityId: paymentId,
                        action: 'cobro_registered',
                        description: `Cobro de cuota ${installment.number} por ${formatCurrency(result.receivedAmount)}`,
                        after: JSON.stringify({
                            amount: result.receivedAmount,
                            breakdown: paymentResult.breakdown,
                            newStatus: instStatus
                        })
                    });
                });

                await refreshAllData();
                setResult(prev => ({ ...prev, id: 'saved' }));
                setStep('receipt');
                addToast('Cobro registrado correctamente', 'success');
                if (onSuccess) onSuccess(result);
            } catch (err) {
                console.error('[COBRAR ERROR]', err);
                setError(err.message || 'Error al registrar el cobro');
                if (onError) onError(err);
            }
            setLoading(false);
        };

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>

                    {step === 'form' && (
                        <>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                                <div>
                                    <div style={{ fontSize: '20px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                        <span style={{ color: 'var(--success)' }}><IconSVG.Check /></span>
                                        Cobrar cuota
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '2px' }}>
                                        {client?.fullName} · #{loan.loanNumber}
                                    </div>
                                </div>
                                <button onClick={onClose} className="btn btn-ghost btn-sm">
                                    <IconSVG.X />
                                </button>
                            </div>

                            <div style={{
                                padding: '16px',
                                background: 'rgba(16,185,129,0.05)',
                                border: '1px solid rgba(16,185,129,0.15)',
                                borderRadius: 'var(--radius-md)',
                                marginBottom: '16px'
                            }}>
                                <div style={{ fontSize: '11px', color: 'var(--success)', fontWeight: '600', textTransform: 'uppercase', marginBottom: '8px' }}>
                                    Cuota #{installment.number}
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Capital pendiente</span>
                                    <span style={{ fontWeight: '600' }}>{formatCurrency(remainingCapital)}</span>
                                </div>
                                {remainingMora > 0 && (
                                    <div className="financial-detail-row">
                                        <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Mora acumulada</span>
                                        <span style={{ fontWeight: '600', color: 'var(--danger-light)' }}>
                                            {formatCurrency(remainingMora)}
                                        </span>
                                    </div>
                                )}
                                <div className="financial-detail-row total">
                                    <span style={{ color: 'var(--text-secondary)' }}>Valor de la cuota</span>
                                    <span style={{ color: 'var(--accent-light)' }}>{formatCurrency(totalDue)}</span>
                                </div>
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                <div>
                                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                        Valor recibido *
                                    </label>
                                    <input type="number" value={amount}
                                        onChange={(e) => { setAmount(e.target.value); setError(''); }}
                                        className={`glass-input ${error ? 'error' : ''}`}
                                        min="0" step="100" autoFocus />
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Precargado con el saldo. Puedes modificarlo.
                                    </div>
                                </div>
                                <div>
                                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                        Método
                                    </label>
                                    <select value={method} onChange={e => setMethod(e.target.value)} className="glass-input">
                                        <option>Efectivo</option>
                                        <option>Transferencia</option>
                                        <option>Nequi</option>
                                        <option>Daviplata</option>
                                        <option>Tarjeta</option>
                                        <option>Otro</option>
                                    </select>
                                </div>
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginTop: '10px' }}>
                                <div>
                                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                        Fecha de pago
                                    </label>
                                    <input type="date" value={date} onChange={e => setDate(e.target.value)} className="glass-input" />
                                </div>
                                <div>
                                    <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                        Observación
                                    </label>
                                    <input type="text" value={note} onChange={e => setNote(e.target.value)}
                                        className="glass-input" placeholder="Opcional" />
                                </div>
                            </div>

                            {error && (
                                <div style={{
                                    marginTop: '12px', padding: '10px',
                                    background: 'rgba(239,68,68,0.1)',
                                    border: '1px solid rgba(239,68,68,0.25)',
                                    borderRadius: '8px', color: 'var(--danger-light)', fontSize: '12px'
                                }}>{error}</div>
                            )}

                            <div style={{ display: 'flex', gap: '10px', marginTop: '18px' }}>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>
                                    Cancelar
                                </button>
                                <button className="btn btn-success" style={{ flex: 1 }} onClick={generatePreview}>
                                    <IconSVG.Eye /> Ver resumen
                                </button>
                            </div>
                        </>
                    )}

                    {step === 'preview' && result && (
                        <>
                            <button className="back-btn" onClick={() => setStep('form')} style={{ marginBottom: '12px' }}>
                                <IconSVG.ArrowLeft /> Volver
                            </button>

                            <div style={{ fontSize: '18px', fontWeight: '700', marginBottom: '14px' }}>
                                Resumen del cobro
                            </div>

                            <div style={{
                                background: 'var(--bg-primary)',
                                border: '1px solid var(--glass-border)',
                                borderRadius: 'var(--radius-lg)',
                                padding: '20px'
                            }}>
                                <div style={{ fontSize: '11px', color: 'var(--text-muted)', textAlign: 'center', marginBottom: '12px' }}>
                                    {result.receiptNumber}
                                </div>

                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Cliente</span>
                                    <span style={{ fontWeight: '500' }}>{result.clientName}</span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Cuota</span>
                                    <span style={{ fontWeight: '500' }}>#{result.installmentNumber}</span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Valor recibido</span>
                                    <span style={{ fontWeight: '700', color: 'var(--accent-light)', fontSize: '16px' }}>
                                        {formatCurrency(result.receivedAmount)}
                                    </span>
                                </div>

                                <hr style={{ border: 'none', borderTop: '1px dashed var(--glass-border)', margin: '12px 0' }} />

                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>→ Capital</span>
                                    <span style={{ color: 'var(--accent-light)' }}>
                                        {formatCurrency(result.allocation.capital)}
                                    </span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>→ Intereses</span>
                                    <span style={{ color: 'var(--warning-light)' }}>
                                        {formatCurrency(result.allocation.interest)}
                                    </span>
                                </div>
                                {result.allocation.mora > 0 && (
                                    <div className="financial-detail-row">
                                        <span style={{ color: 'var(--text-muted)' }}>→ Mora</span>
                                        <span style={{ color: 'var(--danger-light)' }}>
                                            {formatCurrency(result.allocation.mora)}
                                        </span>
                                    </div>
                                )}

                                <hr style={{ border: 'none', borderTop: '1px dashed var(--glass-border)', margin: '12px 0' }} />

                                <div className="financial-detail-row total">
                                    <span style={{ color: 'var(--text-secondary)' }}>Saldo después</span>
                                    <span style={{
                                        color: result.after.total <= 0 ? 'var(--success)' : 'var(--text-primary)'
                                    }}>
                                        {formatCurrency(result.after.total)}
                                    </span>
                                </div>

                                {result.isFullPayment && (
                                    <div style={{
                                        marginTop: '12px', padding: '8px 12px',
                                        background: 'rgba(16,185,129,0.1)',
                                        borderRadius: 'var(--radius-sm)',
                                        color: 'var(--success-light)',
                                        fontSize: '12px', fontWeight: '600',
                                        textAlign: 'center'
                                    }}>
                                        ✓ Cuota completamente pagada
                                    </div>
                                )}

                                {!result.isFullPayment && (
                                    <div style={{
                                        marginTop: '12px', padding: '8px 12px',
                                        background: 'rgba(245,158,11,0.1)',
                                        borderRadius: 'var(--radius-sm)',
                                        color: 'var(--warning-light)',
                                        fontSize: '12px', fontWeight: '500',
                                        textAlign: 'center'
                                    }}>
                                        Abono parcial — quedará pendiente {formatCurrency(result.after.total)}
                                    </div>
                                )}

                                {result.surplus > 0.01 && (
                                    <div style={{
                                        marginTop: '12px', padding: '8px 12px',
                                        background: 'rgba(99,102,241,0.1)',
                                        borderRadius: 'var(--radius-sm)',
                                        color: 'var(--accent-light)',
                                        fontSize: '12px', fontWeight: '500',
                                        textAlign: 'center'
                                    }}>
                                        Excedente: {formatCurrency(result.surplus)} (no se distribuye automáticamente)
                                    </div>
                                )}
                            </div>

                            <div style={{ display: 'flex', gap: '10px', marginTop: '16px' }}>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setStep('form')} disabled={loading}>
                                    <IconSVG.ArrowLeft /> Editar
                                </button>
                                <button className="btn btn-success" style={{ flex: 1 }} onClick={confirmCobro} disabled={loading}>
                                    {loading
                                        ? <span className="spinner" style={{ width: '18px', height: '18px' }}></span>
                                        : <><IconSVG.Check /> Confirmar cobro</>}
                                </button>
                            </div>
                        </>
                    )}

                    {step === 'receipt' && result && (
                        <>
                            <div style={{
                                padding: '12px', background: 'rgba(16,185,129,0.08)',
                                border: '1px solid rgba(16,185,129,0.15)',
                                borderRadius: 'var(--radius-md)', marginBottom: '16px',
                                color: 'var(--success-light)',
                                fontSize: '14px', fontWeight: '600', textAlign: 'center'
                            }}>
                                ✓ Cobro registrado correctamente
                            </div>
                            <PaymentReceipt
                                payment={{
                                    ...result,
                                    clientName: client?.fullName,
                                    loanNumber: loan?.loanNumber,
                                    remainingBalance: result.after?.total || 0
                                }}
                                onClose={onClose}
                            />
                        </>
                    )}
                </div>
            </div>
        );
    };

    // ============================================================
    // 12. COMPONENT: ABONAR MODAL (pago parcial con distribución)
    // ============================================================

    const AbonarModal = ({
        isOpen, onClose, installment, loan, client, user,
        onSuccess, onError, existingPayment = null
    }) => {
        const { refreshAllData, addToast, installments: allInstallments } = useApp();

        const [step, setStep] = useState('form');
        const [paymentType, setPaymentType] = useState('custom');
        const [amount, setAmount] = useState('');
        const [method, setMethod] = useState('Efectivo');
        const [date, setDate] = useState(formatDateLocal(todayLocal()));
        const [note, setNote] = useState('');
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [previewResult, setPreviewResult] = useState(null);
        const [receiptData, setReceiptData] = useState(null);

        const remainingCapital = normalizeMoney(installment?.remainingAmount || installment?.totalAmount || 0);
        const remainingMora = installment ? normalizeMoney(MoraEngine.calculateMoraRemaining(installment)) : 0;
        const totalDue = normalizeMoney(remainingCapital + remainingMora);

        useEffect(() => {
            if (isOpen) {
                setStep('form');
                setPaymentType(existingPayment?.paymentType || 'custom');
                setAmount(existingPayment?.amount?.toString() || '');
                setMethod(existingPayment?.method || 'Efectivo');
                setDate(existingPayment?.paymentDate
                    ? formatDateLocal(existingPayment.paymentDate)
                    : formatDateLocal(todayLocal()));
                setNote(existingPayment?.note || '');
                setError('');
                setPreviewResult(null);
                setReceiptData(null);
            }
        }, [isOpen, existingPayment]);

        if (!isOpen || !installment || !loan) return null;

        const generatePreview = () => {
            const amountValue = normalizeMoney(parseFloat(amount));
            if (!amountValue || amountValue <= 0) {
                setError('Ingresa un monto válido');
                return;
            }
            setError('');

            try {
                const pendingInstallments = (allInstallments || [])
                    .filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled')
                    .sort((a, b) => a.number - b.number);

                if (pendingInstallments.length === 0) {
                    setError('No hay cuotas pendientes para este préstamo');
                    return;
                }

                const distribution = PaymentDistributionEngine.distributePayment(
                    pendingInstallments, amountValue, installment.id
                );

                if (distribution.distributed.length === 0) {
                    setError('No se pudo aplicar el abono a ninguna cuota');
                    return;
                }

                const breakdown = { capital: 0, interest: 0, mora: 0 };
                let totalApplied = 0;
                const details = [];

                for (const dist of distribution.distributed) {
                    const inst = allInstallments.find(i => i.id === dist.installmentId);
                    if (!inst) continue;

                    const result = PaymentEngine.process({
                        installment: inst, amount: dist.appliedAmount
                    });

                    breakdown.capital = normalizeMoney(breakdown.capital + result.breakdown.capital);
                    breakdown.interest = normalizeMoney(breakdown.interest + result.breakdown.interest);
                    breakdown.mora = normalizeMoney(breakdown.mora + result.breakdown.mora);
                    totalApplied = normalizeMoney(totalApplied + result.totalPaid);

                    details.push({
                        installmentNumber: inst.number,
                        installmentId: inst.id,
                        applied: dist.appliedAmount,
                        isFullyPaid: dist.isFullyPaid,
                        newRemaining: dist.newRemaining,
                        breakdown: result.breakdown
                    });
                }

                const preview = {
                    installmentId: installment.id,
                    installmentNumber: installment.number,
                    loanId: loan.id,
                    clientName: client?.fullName || 'Cliente',
                    loanNumber: loan?.loanNumber || 'N/A',
                    paymentType,
                    receivedAmount: amountValue,
                    date, method, note,
                    allocation: breakdown,
                    totalApplied: normalizeMoney(totalApplied),
                    surplus: normalizeMoney(amountValue - totalApplied),
                    distribution: details,
                    receiptNumber: `ABO-${Date.now().toString(36).toUpperCase()}`,
                    timestamp: new Date().toISOString()
                };

                setPreviewResult(preview);
                setStep('preview');
            } catch (err) {
                console.error('[ABONAR PREVIEW ERROR]', err);
                setError(err.message || 'Error al generar la vista previa');
            }
        };

        const confirmAbono = async () => {
            if (!previewResult) return;
            setLoading(true);
            setError('');

            try {
                await initDatabase();

                await db.transaction('rw',
                    db.payments, db.installments, db.loans,
                    db.capitalMovements, db.auditLog, db.lostDebts, db.recoveryMovements, db.lossCompensations,
                    async () => {

                    const allLoanInstallments = await db.installments
                        .where({ loanId: loan.id }).toArray();

                    const receipts = [];

                    for (const dist of previewResult.distribution) {
                        const inst = allLoanInstallments.find(i => i.id === dist.installmentId);
                        if (!inst) continue;

                        const paymentResult = PaymentEngine.process({
                            installment: inst, amount: dist.applied
                        });

                        const newPaidAmount = normalizeMoney(
                            (inst.paidAmount || 0) +
                            paymentResult.breakdown.capital +
                            paymentResult.breakdown.interest
                        );
                        const newMoraPaid = normalizeMoney(
                            (inst.moraPaid || 0) + paymentResult.breakdown.mora
                        );
                        const newRemaining = normalizeMoney(
                            Math.max(0, (inst.totalAmount || 0) - newPaidAmount)
                        );
                        const newMoraRemaining = normalizeMoney(
                            Math.max(0, (inst.moraAmount || 0) - newMoraPaid)
                        );

                        let instStatus = 'pending';
                        if (newRemaining <= 0.01 && newMoraRemaining <= 0.01) instStatus = 'paid';
                        else if (newPaidAmount > 0 || newMoraPaid > 0) instStatus = 'partial';
                        else if (MoraEngine.calculateMoraDays(inst.dueDate) > 0) instStatus = 'overdue';

                        await db.installments.update(inst.id, {
                            paidAmount: newPaidAmount,
                            remainingAmount: newRemaining,
                            moraPaid: newMoraPaid,
                            moraRemaining: newMoraRemaining,
                            status: instStatus
                        });

                        const receiptNumber = `${previewResult.receiptNumber}-C${inst.number}`;
                        const paymentId = await db.payments.add({
                            loanId: loan.id,
                            clientId: client.id,
                            installmentId: inst.id,
                            amount: dist.applied,
                            paymentDate: previewResult.date,
                            method: previewResult.method,
                            note: previewResult.note || `Abono cuota ${inst.number}`,
                            breakdown: paymentResult.breakdown,
                            paymentType: previewResult.paymentType,
                            receiptNumber,
                            isFullPayment: dist.isFullyPaid,
                            surplus: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        });

                        await db.capitalMovements.add({
                            userId: user.id,
                            type: 'payment',
                            amount: dist.applied,
                            date: previewResult.date,
                            description: `Abono cuota ${inst.number} - ${client.fullName}`,
                            referenceType: 'payment',
                            referenceId: paymentId,
                            createdAt: new Date().toISOString()
                        });

                        // === COMPENSACIÓN DE PÉRDIDAS POR INTERÉS DE ESTE ABONO ===
                        if (paymentResult.breakdown.interest > 0) {
                            const interestToApply = normalizeMoney(paymentResult.breakdown.interest);
                            const allLostDebts = await db.lostDebts.where({ userId: user.id }).toArray();
                            const allRecoveries = await db.recoveryMovements.where({ userId: user.id }).toArray();
                            const allCompensations = await db.lossCompensations.where({ userId: user.id }).toArray();

                            const state = LossCompensationEngine.calculateState(allLostDebts, allRecoveries, allCompensations);
                            if (state.hasPendingLoss) {
                                const sortedPending = state.perDebt
                                    .filter(d => !d.isFullyRecovered)
                                    .sort((a, b) => new Date(a.lostAt) - new Date(b.lostAt));

                                const distributions = LossCompensationEngine.distributeInterestToLosses(interestToApply, sortedPending);
                                const now = new Date().toISOString();

                                for (const d of distributions) {
                                    const debt = sortedPending.find(x => x.id === d.lostDebtId);
                                    if (!debt) continue;
                                    const pendingBefore = debt.pending;
                                    const pendingAfter = normalizeMoney(Math.max(0, pendingBefore - d.amount));

                                    await db.lossCompensations.add({
                                        userId: user.id,
                                        lostDebtId: debt.id,
                                        paymentId,
                                        loanId: loan.id,
                                        clientId: client.id,
                                        installmentId: inst.id,
                                        amountAppliedToLoss: d.amount,
                                        interestGenerated: interestToApply,
                                        moraGenerated: normalizeMoney(paymentResult.breakdown.mora || 0),
                                        capitalReceived: normalizeMoney(paymentResult.breakdown.capital || 0),
                                        pendingBefore,
                                        pendingAfter,
                                        appliedAt: now,
                                        description: `Abono cuota ${inst.number} — ${client.fullName}`,
                                        createdAt: now
                                    });

                                    await db.lostDebts.update(debt.id, {
                                        recoveredInterest: normalizeMoney((debt.recoveredInterest || 0) + d.amount),
                                        status: pendingAfter <= 0.01 ? 'fully_recovered' : 'partial_recovered',
                                        fullyRecoveredAt: pendingAfter <= 0.01 ? now : null,
                                        updatedAt: now
                                    });
                                }
                            }
                        }
                        // === FIN COMPENSACIÓN ===

                        receipts.push({
                            installmentNumber: inst.number,
                            applied: dist.applied,
                            breakdown: paymentResult.breakdown,
                            isFullPayment: dist.isFullyPaid,
                            newRemaining,
                            receiptNumber
                        });
                    }

                    const refreshedInsts = await db.installments.where({ loanId: loan.id }).toArray();
                    const loanPayments = await db.payments.where({ loanId: loan.id }).toArray();

                    let totalPaid = 0;
                    for (const p of loanPayments) {
                        const bd = p.breakdown || {};
                        totalPaid += normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0));
                    }
                    totalPaid = normalizeMoney(totalPaid);

                    const currentBalance = normalizeMoney(
                        Math.max(0, (loan.totalRepayment || 0) - totalPaid)
                    );
                    const progress = loan.totalRepayment > 0
                        ? normalizeMoney((totalPaid / loan.totalRepayment) * 100)
                        : 0;

                    const allPaid = refreshedInsts.every(i => i.status === 'paid' || i.status === 'cancelled');
                    const hasOverdue = refreshedInsts.some(i => i.status === 'overdue');
                    let loanStatus = loan.status;
                    if (allPaid) loanStatus = 'finished';
                    else if (hasOverdue) loanStatus = 'overdue';
                    else if (loan.status === 'overdue') loanStatus = 'active';

                    await db.loans.update(loan.id, {
                        totalPaid, currentBalance, progress,
                        status: loanStatus,
                        updatedAt: new Date().toISOString()
                    });

                    await db.auditLog.add({
                        userId: user.id,
                        timestamp: new Date().toISOString(),
                        entityType: 'payment',
                        entityId: `abono-${Date.now()}`,
                        action: 'abono_registered',
                        description: `Abono de ${formatCurrency(previewResult.receivedAmount)} distribuido en ${receipts.length} cuota(s)`,
                        after: JSON.stringify({
                            received: previewResult.receivedAmount,
                            breakdown: previewResult.allocation,
                            installments: receipts
                        })
                    });

                    setReceiptData({
                        ...previewResult,
                        receipts
                    });
                });

                await refreshAllData();
                setStep('receipt');
                addToast(
                    `Abono registrado y distribuido en ${previewResult.distribution.length} cuota(s)`,
                    'success'
                );
                if (onSuccess) onSuccess(previewResult);
            } catch (err) {
                console.error('[ABONAR ERROR]', err);
                setError(err.message || 'Error al registrar el abono');
                if (onError) onError(err);
            }
            setLoading(false);
        };

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>

                    {step === 'form' && (
                        <>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                                <div>
                                    <div style={{ fontSize: '20px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                        <span style={{ color: 'var(--accent-light)' }}><IconSVG.Receipt /></span>
                                        {existingPayment ? 'Editar abono' : 'Registrar abono'}
                                    </div>
                                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginTop: '2px' }}>
                                        {client?.fullName} · #{loan.loanNumber}
                                    </div>
                                </div>
                                <button onClick={onClose} className="btn btn-ghost btn-sm">
                                    <IconSVG.X />
                                </button>
                            </div>

                            <div style={{
                                padding: '14px',
                                background: 'rgba(99,102,241,0.05)',
                                border: '1px solid rgba(99,102,241,0.15)',
                                borderRadius: 'var(--radius-md)',
                                marginBottom: '14px'
                            }}>
                                <div style={{ fontSize: '11px', color: 'var(--accent-light)', fontWeight: '600', textTransform: 'uppercase', marginBottom: '8px' }}>
                                    Cuota #{installment.number} seleccionada
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Saldo de esta cuota</span>
                                    <span style={{ fontWeight: '600' }}>{formatCurrency(totalDue)}</span>
                                </div>
                            </div>

                            {!existingPayment && (
                                <>
                                    <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px' }}>
                                        Tipo de abono:
                                    </div>
                                    <PaymentTypes selected={paymentType} onSelect={setPaymentType} />
                                </>
                            )}

                            <div style={{ marginTop: '16px' }}>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                    <div>
                                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                            Valor del abono *
                                        </label>
                                        <input type="number" value={amount}
                                            onChange={(e) => { setAmount(e.target.value); setError(''); }}
                                            className={`glass-input ${error ? 'error' : ''}`}
                                            placeholder="Ej: 100000" min="0" step="100" autoFocus />
                                    </div>
                                    <div>
                                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                            Método
                                        </label>
                                        <select value={method} onChange={e => setMethod(e.target.value)} className="glass-input">
                                            <option>Efectivo</option>
                                            <option>Transferencia</option>
                                            <option>Nequi</option>
                                            <option>Daviplata</option>
                                            <option>Tarjeta</option>
                                            <option>Otro</option>
                                        </select>
                                    </div>
                                </div>

                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginTop: '10px' }}>
                                    <div>
                                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                            Fecha
                                        </label>
                                        <input type="date" value={date} onChange={e => setDate(e.target.value)} className="glass-input" />
                                    </div>
                                    <div>
                                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                            Observación
                                        </label>
                                        <input type="text" value={note} onChange={e => setNote(e.target.value)}
                                            className="glass-input" placeholder="Opcional" />
                                    </div>
                                </div>
                            </div>

                            {error && (
                                <div style={{
                                    marginTop: '12px', padding: '10px',
                                    background: 'rgba(239,68,68,0.1)',
                                    border: '1px solid rgba(239,68,68,0.25)',
                                    borderRadius: '8px', color: 'var(--danger-light)', fontSize: '12px'
                                }}>{error}</div>
                            )}

                            <div style={{ display: 'flex', gap: '10px', marginTop: '18px' }}>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>
                                    Cancelar
                                </button>
                                <button className="btn btn-primary" style={{ flex: 1 }} onClick={generatePreview}>
                                    <IconSVG.Eye /> Ver distribución
                                </button>
                            </div>
                        </>
                    )}

                    {step === 'preview' && previewResult && (
                        <>
                            <button className="back-btn" onClick={() => setStep('form')} style={{ marginBottom: '12px' }}>
                                <IconSVG.ArrowLeft /> Volver
                            </button>

                            <div style={{ fontSize: '18px', fontWeight: '700', marginBottom: '14px' }}>
                                Resumen del abono
                            </div>

                            <div style={{
                                background: 'var(--bg-primary)',
                                border: '1px solid var(--glass-border)',
                                borderRadius: 'var(--radius-lg)',
                                padding: '20px', marginBottom: '12px'
                            }}>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Cliente</span>
                                    <span style={{ fontWeight: '500' }}>{previewResult.clientName}</span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Valor recibido</span>
                                    <span style={{ fontWeight: '700', color: 'var(--accent-light)', fontSize: '16px' }}>
                                        {formatCurrency(previewResult.receivedAmount)}
                                    </span>
                                </div>

                                <hr style={{ border: 'none', borderTop: '1px dashed var(--glass-border)', margin: '12px 0' }} />

                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>→ Capital</span>
                                    <span style={{ color: 'var(--accent-light)' }}>
                                        {formatCurrency(previewResult.allocation.capital)}
                                    </span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>→ Intereses</span>
                                    <span style={{ color: 'var(--warning-light)' }}>
                                        {formatCurrency(previewResult.allocation.interest)}
                                    </span>
                                </div>
                                {previewResult.allocation.mora > 0 && (
                                    <div className="financial-detail-row">
                                        <span style={{ color: 'var(--text-muted)' }}>→ Mora</span>
                                        <span style={{ color: 'var(--danger-light)' }}>
                                            {formatCurrency(previewResult.allocation.mora)}
                                        </span>
                                    </div>
                                )}

                                {previewResult.surplus > 0.01 && (
                                    <div className="financial-detail-row">
                                        <span style={{ color: 'var(--text-muted)' }}>→ Excedente (no aplicado)</span>
                                        <span style={{ color: 'var(--text-muted)' }}>
                                            {formatCurrency(previewResult.surplus)}
                                        </span>
                                    </div>
                                )}
                            </div>

                            <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px' }}>
                                Distribución entre cuotas
                            </div>

                            {previewResult.distribution.map((d, idx) => (
                                <div key={idx} style={{
                                    padding: '12px',
                                    background: d.isFullyPaid
                                        ? 'rgba(16,185,129,0.05)'
                                        : 'rgba(245,158,11,0.05)',
                                    border: `1px solid ${d.isFullyPaid
                                        ? 'rgba(16,185,129,0.2)'
                                        : 'rgba(245,158,11,0.2)'}`,
                                    borderRadius: 'var(--radius-md)',
                                    marginBottom: '6px'
                                }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                            <span style={{
                                                fontWeight: '600',
                                                color: d.isFullyPaid ? 'var(--success)' : 'var(--warning)'
                                            }}>
                                                Cuota {d.installmentNumber}
                                            </span>
                                            <span className={`badge ${d.isFullyPaid ? 'badge-success' : 'badge-warning'}`}
                                                style={{ padding: '2px 8px', fontSize: '10px' }}>
                                                {d.isFullyPaid ? 'Pagada completa' : 'Abono parcial'}
                                            </span>
                                        </div>
                                        <span style={{ fontWeight: '700', color: 'var(--accent-light)' }}>
                                            {formatCurrency(d.applied)}
                                        </span>
                                    </div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                        Saldo restante: <span style={{ fontWeight: '600', color: d.newRemaining <= 0 ? 'var(--success)' : 'var(--warning)' }}>
                                            {formatCurrency(d.newRemaining)}
                                        </span>
                                    </div>
                                </div>
                            ))}

                            <div style={{ display: 'flex', gap: '10px', marginTop: '16px' }}>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setStep('form')} disabled={loading}>
                                    <IconSVG.ArrowLeft /> Editar
                                </button>
                                <button className="btn btn-primary" style={{ flex: 1 }} onClick={confirmAbono} disabled={loading}>
                                    {loading
                                        ? <span className="spinner" style={{ width: '18px', height: '18px' }}></span>
                                        : <><IconSVG.Check /> Confirmar abono</>}
                                </button>
                            </div>
                        </>
                    )}

                    {step === 'receipt' && receiptData && (
                        <>
                            <div style={{
                                padding: '12px', background: 'rgba(16,185,129,0.08)',
                                border: '1px solid rgba(16,185,129,0.15)',
                                borderRadius: 'var(--radius-md)', marginBottom: '16px',
                                color: 'var(--success-light)',
                                fontSize: '14px', fontWeight: '600', textAlign: 'center'
                            }}>
                                ✓ Abono registrado y distribuido
                            </div>

                            <div style={{
                                background: 'var(--bg-primary)',
                                border: '1px solid var(--glass-border)',
                                borderRadius: 'var(--radius-lg)',
                                padding: '20px'
                            }}>
                                <div style={{ textAlign: 'center', marginBottom: '12px' }}>
                                    <div style={{ fontSize: '16px', fontWeight: '700', color: 'var(--accent-light)' }}>
                                        LOANS W
                                    </div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                        {receiptData.receiptNumber}
                                    </div>
                                </div>

                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Cliente</span>
                                    <span style={{ fontWeight: '500' }}>{receiptData.clientName}</span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Préstamo</span>
                                    <span style={{ fontWeight: '500' }}>#{receiptData.loanNumber}</span>
                                </div>
                                <div className="financial-detail-row">
                                    <span style={{ color: 'var(--text-muted)' }}>Valor total</span>
                                    <span style={{ fontWeight: '700', color: 'var(--accent-light)', fontSize: '16px' }}>
                                        {formatCurrency(receiptData.receivedAmount)}
                                    </span>
                                </div>

                                <hr style={{ border: 'none', borderTop: '1px dashed var(--glass-border)', margin: '12px 0' }} />

                                {receiptData.receipts.map((r, idx) => (
                                    <div key={idx} style={{
                                        padding: '10px', marginBottom: '6px',
                                        background: r.isFullPayment ? 'rgba(16,185,129,0.05)' : 'rgba(245,158,11,0.05)',
                                        borderRadius: 'var(--radius-sm)'
                                    }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                            <span style={{ fontWeight: '600', fontSize: '12px' }}>
                                                Cuota {r.installmentNumber}
                                            </span>
                                            <span style={{ fontWeight: '700', color: 'var(--accent-light)', fontSize: '13px' }}>
                                                {formatCurrency(r.applied)}
                                            </span>
                                        </div>
                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '3px' }}>
                                            Saldo restante: {formatCurrency(r.newRemaining)} · {r.isFullPayment ? '✓ Pagada' : '◐ Parcial'}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>
                                    Cerrar
                                </button>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => window.print()}>
                                    <IconSVG.Printer /> Imprimir
                                </button>
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    };

    // ============================================================
    // 13. COMPONENT: PAYMENT DELETE
    // ============================================================

    const PaymentDelete = ({ payment, isOpen, onClose, onSuccess, onError }) => {
        const { refreshAllData, addToast } = useApp();
        const [loading, setLoading] = useState(false);

        if (!payment || !isOpen) return null;

        const handleDelete = async () => {
            setLoading(true);
            try {
                await initDatabase();
                const loan = await db.loans.get(payment.loanId);
                const installment = await db.installments.get(payment.installmentId);

                if (!loan || !installment) throw new Error('Datos no encontrados');

                await db.transaction('rw', db.payments, db.installments, db.loans, db.capitalMovements, db.auditLog, db.lossCompensations, async () => {
                    const bd = payment.breakdown || {};
                    const capitalPaid = normalizeMoney(bd.capital || 0);
                    const interestPaid = normalizeMoney(bd.interest || 0);
                    const moraPaid = normalizeMoney(bd.mora || 0);

                    const linkedCompensations = await db.lossCompensations.where({ paymentId: payment.id }).toArray();
                    for (const comp of linkedCompensations) {
                        const debt = await db.lostDebts.get(comp.lostDebtId);
                        if (debt) {
                            await db.lostDebts.update(comp.lostDebtId, {
                                recoveredInterest: normalizeMoney(Math.max(0, (debt.recoveredInterest || 0) - comp.amountAppliedToLoss)),
                                updatedAt: new Date().toISOString()
                            });
                        }
                        await db.lossCompensations.delete(comp.id);
                    }

                    const newPaidAmount = normalizeMoney(Math.max(0, (installment.paidAmount || 0) - capitalPaid - interestPaid));
                    const newMoraPaid = normalizeMoney(Math.max(0, (installment.moraPaid || 0) - moraPaid));
                    const newRemaining = normalizeMoney(Math.min(
                        installment.totalAmount || 0,
                        (installment.remainingAmount || 0) + capitalPaid + interestPaid
                    ));

                    let status = 'pending';
                    if (newRemaining <= 0.01) status = 'paid';
                    else {
                        const daysLate = MoraEngine.calculateMoraDays(installment.dueDate);
                        if (daysLate > 0) status = 'overdue';
                    }

                    await db.installments.update(installment.id, {
                        paidAmount: newPaidAmount,
                        remainingAmount: newRemaining,
                        moraPaid: newMoraPaid,
                        moraRemaining: normalizeMoney(Math.max(0, (installment.moraAmount || 0) - newMoraPaid)),
                        status
                    });

                    const totalPaid = normalizeMoney(Math.max(0, (loan.totalPaid || 0) - (payment.amount || 0)));
                    const currentBalance = normalizeMoney(Math.max(0, (loan.totalRepayment || 0) - totalPaid));
                    const progress = loan.totalRepayment > 0 ? normalizeMoney((totalPaid / loan.totalRepayment) * 100) : 0;

                    await db.loans.update(loan.id, {
                        totalPaid, currentBalance, progress,
                        updatedAt: new Date().toISOString()
                    });

                    await db.capitalMovements.where({ referenceType: 'payment', referenceId: payment.id }).delete();
                    await db.payments.delete(payment.id);
                });

                await refreshAllData();
                addToast('Pago eliminado correctamente', 'success');
                if (onSuccess) onSuccess();
                onClose();
            } catch (err) {
                console.error('[DELETE PAYMENT ERROR]', err);
                addToast('Error al eliminar el pago', 'error');
                if (onError) onError(err);
            }
            setLoading(false);
        };

        return (
            <div className="confirm-overlay" onClick={onClose}>
                <div className="confirm-dialog" onClick={e => e.stopPropagation()}>
                    <div style={{ fontSize: '36px', marginBottom: '10px', color: 'var(--danger)' }}>

                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '16px', lineHeight: '1.5' }}>
                        ¿Eliminar el pago de {formatCurrency(payment.amount)}?

                        note: note || `Recuperación de pérdida`,
                        userId: user.id,
                        createdAt: new Date().toISOString()
                    });

                    const newRecoveredCapital = normalizeMoney((lostDebt.recoveredCapital || 0) + amountValue);

                    const allRecoveries = await db.recoveryMovements.where({ userId: user.id }).toArray();
                    const allCompensations = await db.lossCompensations.where({ userId: user.id }).toArray();
                    const thisRecoveredDirect = normalizeMoney(
                        allRecoveries.filter(r => r.lostDebtId === lostDebt.id)
                            .reduce((s, r) => s + normalizeMoney(r.capitalRecovered || r.amount || 0), 0)
                    );
                    const thisInterestComp = normalizeMoney(
                        allCompensations.filter(c => c.lostDebtId === lostDebt.id)
                            .reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0)
                    );
                    const totalRecoveredDebt = normalizeMoney(thisRecoveredDirect + thisInterestComp);
                    const isFullyRecovered = totalRecoveredDebt >= (lostDebt.lostCapital || 0) - 0.01;

                    await db.lostDebts.update(lostDebt.id, {
                        recoveredCapital: newRecoveredCapital,
