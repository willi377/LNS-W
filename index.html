<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060610">
    <title>LOANS W — Sistema Financiero Completo v10.4</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.min.js"></script>
    <style>
        :root {
            --bg-deep: #060610;
            --bg-primary: #0a0a14;
            --bg-secondary: #0f0f1a;
            --bg-elevated: #141424;
            --glass: rgba(255,255,255,0.025);
            --glass-border: rgba(255,255,255,0.05);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-dark: #4f46e5;
            --accent-glow: rgba(99,102,241,0.3);
            --success: #10b981;
            --success-light: #34d399;
            --warning: #f59e0b;
            --warning-light: #fbbf24;
            --danger: #ef4444;
            --danger-light: #f87171;
            --loss: #dc2626;
            --recovery: #22c55e;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            min-height: 100dvh;
        }
        #root { min-height: 100vh; min-height: 100dvh; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 20px var(--accent-glow); } 50% { box-shadow: 0 0 40px rgba(99,102,241,0.5); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes skeleton { 0% { opacity: 0.3; } 50% { opacity: 0.6; } 100% { opacity: 0.3; } }
        @keyframes slideInRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes buttonRelease { 0% { transform: scale(0.96); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        @keyframes progressGrow { from { width: 0%; } }

        .glass-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-lg);
            transition: all 0.25s;
            cursor: pointer;
            touch-action: manipulation;
        }
        .glass-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); transform: translateY(-1px); }
        .glass-card:active { transform: scale(0.985); }
        .glass-card.disabled { cursor: default; }
        .glass-card.disabled:hover { transform: none; }

        .glass-input {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 15px;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }
        .glass-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); background: rgba(255,255,255,0.06); }
        .glass-input::placeholder { color: var(--text-muted); }
        .glass-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.12); }

        .notes-textarea {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            padding: 16px;
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.7;
            width: 100%;
            min-height: 280px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
            resize: vertical;
        }
        .notes-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }

        select.glass-input {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3csvg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 20px;
            padding-right: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            outline: none;
            touch-action: manipulation;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            min-height: 44px;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--accent-light) 10%, transparent 10%);
            transform: scale(0);
            opacity: 0;
            transition: transform 0.5s, opacity 1s;
        }
        .btn:active::after { transform: scale(4); opacity: 0.3; transition: 0s; }
        .btn:active { transform: scale(0.96); }
        .btn:not(:active) { animation: buttonRelease 0.25s ease-out; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; box-shadow: 0 4px 16px var(--accent-glow); }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: #fff; }
        .btn-recovery { background: linear-gradient(135deg, var(--recovery), #16a34a); color: #fff; }
        .btn-loss { background: linear-gradient(135deg, var(--loss), #991b1b); color: #fff; }
        .btn-ghost { background: rgba(255,255,255,0.04); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); }
        .btn-ghost:hover { background: rgba(255,255,255,0.08); }
        .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: var(--radius-sm); min-height: 34px; }
        .btn-xs { padding: 4px 10px; font-size: 10px; border-radius: var(--radius-sm); min-height: 28px; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .badge-success { background: rgba(16,185,129,0.12); color: var(--success-light); border: 1px solid rgba(16,185,129,0.2); }
        .badge-warning { background: rgba(245,158,11,0.12); color: var(--warning-light); border: 1px solid rgba(245,158,11,0.2); }
        .badge-danger { background: rgba(239,68,68,0.12); color: var(--danger-light); border: 1px solid rgba(239,68,68,0.2); }
        .badge-info { background: rgba(99,102,241,0.12); color: var(--accent-light); border: 1px solid rgba(99,102,241,0.2); }
        .badge-neutral { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }
        .badge-loss { background: rgba(220,38,38,0.12); color: #fca5a5; border: 1px solid rgba(220,38,38,0.25); }
        .badge-recovery { background: rgba(34,197,94,0.12); color: #86efac; border: 1px solid rgba(34,197,94,0.25); }

        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s;
            background: linear-gradient(90deg, var(--accent), var(--accent-light), #a78bfa);
            background-size: 200% 100%;
            animation: progressGrow 1s ease-out, shimmer 3s infinite;
        }
        .progress-fill.loss { background: linear-gradient(90deg, #dc2626, #f87171); }
        .progress-fill.recovery { background: linear-gradient(90deg, #16a34a, #4ade80); }

        .page-transition { animation: slideInRight 0.28s cubic-bezier(0.22, 1, 0.36, 1); will-change: transform, opacity; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(6,6,16,0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
            z-index: 80; display: flex; justify-content: space-around;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 2px; padding: 6px 10px; cursor: pointer;
            background: transparent; border: none;
            color: var(--text-muted); font-size: 10px; font-weight: 500;
            border-radius: 12px; transition: all 0.2s; min-width: 50px;
        }
        .nav-item.active { color: var(--accent-light); background: rgba(99,102,241,0.08); }

        .fab {
            position: fixed; bottom: calc(80px + env(safe-area-inset-bottom));
            right: 16px; width: 52px; height: 52px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            border: none; color: #fff; cursor: pointer; z-index: 85;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 32px rgba(99,102,241,0.4);
            transition: all 0.3s;
        }
        .fab:active { transform: scale(0.9); }
        .fab-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 84; animation: fadeIn 0.2s; }
        .fab-menu {
            position: fixed; bottom: calc(150px + env(safe-area-inset-bottom));
            right: 16px; display: flex; flex-direction: column-reverse; gap: 6px; z-index: 86;
        }
        .fab-menu-item {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 18px; border-radius: var(--radius-md);
            background: rgba(20,20,36,0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary); font-size: 13px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
            animation: fadeUp 0.3s forwards; opacity: 0;
        }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.2s; overflow-y: auto;
        }
        .modal-content {
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            padding: 24px;
            width: 100%; max-width: 600px;
            max-height: 85vh; overflow-y: auto;
            animation: fadeUp 0.3s; margin: auto;
        }

        .toast-container {
            position: fixed; top: 12px; left: 50%;
            transform: translateX(-50%); z-index: 200;
            display: flex; flex-direction: column; gap: 6px;
            pointer-events: none; width: calc(100% - 24px); max-width: 400px;
        }
        .toast {
            padding: 12px 20px; border-radius: var(--radius-md);
            font-size: 13px; font-weight: 500;
            pointer-events: auto; animation: fadeUp 0.3s;
            backdrop-filter: blur(20px); border: 1px solid;
            word-break: break-word;
        }
        .toast-success { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.3); color: var(--success-light); }
        .toast-error { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: var(--danger-light); }
        .toast-info { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.3); color: var(--accent-light); }
        .toast-warning { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.3); color: var(--warning-light); }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 12px; margin-bottom: 14px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm); transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }

        .empty-state { text-align: center; padding: 50px 20px; animation: fadeIn 0.4s; }
        .spinner { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        .spinner-lg { width: 36px; height: 36px; border-width: 4px; }
        .skeleton { background: rgba(255,255,255,0.04); border-radius: var(--radius-md); animation: skeleton 1.5s infinite; }

        .confirm-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 110; display: flex; align-items: center; justify-content: center;
            padding: 20px; animation: fadeIn 0.2s;
        }
        .confirm-dialog {
            background: var(--bg-elevated);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 24px; width: 100%; max-width: 400px;
            animation: fadeUp 0.3s; text-align: center;
        }

        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .gap-1 { gap: 4px; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 12px; }
        .text-xs { font-size: 10px; }
        .mt-1 { margin-top: 4px; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-1 { margin-bottom: 4px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }

        .note-card { padding: 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
        .note-card.pinned { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.03); }
        .note-content-preview {
            font-size: 12px; color: var(--text-secondary); margin-top: 4px;
            line-height: 1.5; overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; word-break: break-word;
        }

        .loss-card {
            border-left: 3px solid var(--loss);
            padding: 14px; margin-bottom: 8px;
            background: rgba(220,38,38,0.04);
            border-radius: var(--radius-md);
        }
        .loss-card.recovered {
            border-left-color: var(--recovery);
            background: rgba(34,197,94,0.04);
        }

        .financial-detail-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }
        .financial-detail-row:last-child { border-bottom: none; }
        .financial-detail-row.total {
            padding-top: 14px; margin-top: 8px;
            border-top: 2px solid var(--glass-border);
            border-bottom: none;
            font-size: 16px; font-weight: 700;
        }

        @media (max-width: 480px) {
            .modal-content { padding: 16px; max-width: 100%; margin: 0; border-radius: var(--radius-lg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .page-transition, .progress-fill, .btn:not(:active) { animation: none !important; }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    // ======================================================
    // LOANS W v10.4 - SISTEMA FINANCIERO COMPLETO
    // CON COMPENSACIÓN DE PÉRDIDAS VÍA INTERESES
    // Y ARRANQUE ESTABILIZADO
    // ============================================================

    const { useState, useEffect, useMemo, useCallback, useContext, createContext, useRef } = React;

    // ============================================================
    // 1. UTILIDADES BASE CON VALIDACIONES DEFENSIVAS
    // ============================================================

    const parseLocalDate = (dateStr) => {
        if (!dateStr) return new Date();
        const str = String(dateStr);
        const parts = str.split('T')[0].split('-').map(Number);
        if (parts.length < 3 || isNaN(parts[0]) || isNaN(parts[1]) || isNaN(parts[2])) return new Date();
        return new Date(Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0));
    };

    const getCalendarDaysDiff = (date1, date2) => {
        const utc1 = Date.UTC(date1.getUTCFullYear(), date1.getUTCMonth(), date1.getUTCDate());
        const utc2 = Date.UTC(date2.getUTCFullYear(), date2.getUTCMonth(), date2.getUTCDate());
        return Math.floor((utc2 - utc1) / (1000 * 60 * 60 * 24));
    };

    const formatDateLocal = (date) => {
        if (!date) return '';
        const d = new Date(date);
        if (isNaN(d.getTime())) return '';
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`;
    };

    const todayLocal = () => {
        const now = new Date();
        return new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 12, 0, 0, 0));
    };

    const formatDate = (d) => {
        if (!d) return '';
        const dt = new Date(d);
        if (isNaN(dt.getTime())) return '';
        return dt.toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'UTC' });
    };

    const formatDateTime = (d) => {
        if (!d) return '';
        const dt = new Date(d);
        if (isNaN(dt.getTime())) return '';
        return dt.toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
    };

    const formatRelativeDate = (d) => {
        if (!d) return '';
        const now = new Date();
        const date = new Date(d);
        if (isNaN(date.getTime())) return '';
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        if (diffMins < 1) return 'Ahora';
        if (diffMins < 60) return `Hace ${diffMins} min`;
        if (diffHours < 24) return `Hace ${diffHours} h`;
        if (diffDays < 7) return `Hace ${diffDays} d`;
        return formatDate(d);
    };

    const getMonthName = (month) => {
        const names = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        return names[month - 1] || month;
    };

    const getRelativeDay = (d) => {
        const today = todayLocal();
        const due = parseLocalDate(d);
        const diff = getCalendarDaysDiff(today, due);
        if (diff === 0) return 'Hoy';
        if (diff === 1) return 'Mañana';
        if (diff < 0) return `Hace ${Math.abs(diff)} días`;
        return `En ${diff} días`;
    };

    const getStatusLabel = (s) => ({
        paid: 'Pagada',
        pending: 'Pendiente',
        partial: 'Parcial',
        overdue: 'Vencida',
        active: 'Activo',
        finished: 'Finalizado',
        cancelled: 'Cancelado',
        lost: 'Deuda perdida',
        recovered: 'Recuperado'
    }[s] || s);

    const getSafeInitial = (fullName) => {
        if (typeof fullName !== 'string') return '?';
        const trimmed = fullName.trim();
        if (!trimmed) return '?';
        const initial = trimmed[0];
        return (typeof initial === 'string' && initial) ? initial.toUpperCase() : '?';
    };

    const getSafeString = (val, fallback = '') => {
        if (val === null || val === undefined) return fallback;
        if (typeof val === 'string') return val;
        if (typeof val === 'number') return String(val);
        return fallback;
    };

    // ============================================================
    // 1.1 NORMALIZACIÓN MONETARIA
    // ============================================================

    const MONETARY_CONFIG = {
        useDecimals: false,
        decimalPlaces: 0,
        currencySymbol: '$',
        thousandsSeparator: '.',
        decimalSeparator: ','
    };

    const normalizeMoney = (value) => {
        if (value === null || value === undefined || isNaN(value)) return 0;
        const num = Number(value);
        if (isNaN(num)) return 0;
        if (MONETARY_CONFIG.useDecimals) return Math.round(num * 100) / 100;
        return Math.round(num);
    };

    const formatCurrency = (value) => {
        const normalized = normalizeMoney(value);
        if (MONETARY_CONFIG.useDecimals) {
            return MONETARY_CONFIG.currencySymbol + ' ' + 
                new Intl.NumberFormat('es-CO', {
                    minimumFractionDigits: MONETARY_CONFIG.decimalPlaces,
                    maximumFractionDigits: MONETARY_CONFIG.decimalPlaces
                }).format(normalized);
        }
        return MONETARY_CONFIG.currencySymbol + ' ' + 
            new Intl.NumberFormat('es-CO', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(normalized);
    };

    // ============================================================
    // 1.2 HOOK: CONTEO PROGRESIVO
    // ============================================================

    const useCountUp = (target, duration = 900, enabled = true) => {
        const [value, setValue] = useState(enabled ? 0 : target);
        const startTimeRef = useRef(null);
        const frameRef = useRef(null);
        const prevTargetRef = useRef(target);

        useEffect(() => {
            if (!enabled) { setValue(target); return; }
            if (prevTargetRef.current === target && value === target) return;
            prevTargetRef.current = target;
            startTimeRef.current = null;

            const animate = (timestamp) => {
                if (!startTimeRef.current) startTimeRef.current = timestamp;
                const progress = Math.min((timestamp - startTimeRef.current) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                setValue(Math.floor(target * eased));
                if (progress < 1) frameRef.current = requestAnimationFrame(animate);
                else setValue(target);
            };
            frameRef.current = requestAnimationFrame(animate);
            return () => { if (frameRef.current) cancelAnimationFrame(frameRef.current); };
        }, [target, duration, enabled]);

        return value;
    };

    const AnimatedNumber = ({ value, duration = 900, style = {} }) => {
        const animatedValue = useCountUp(normalizeMoney(value || 0), duration);
        return <span style={style}>{formatCurrency(animatedValue)}</span>;
    };

    class MoraEngine {
        static calculateMoraDays(dueDate) {
            const today = todayLocal();
            const due = parseLocalDate(dueDate);
            return Math.max(0, getCalendarDaysDiff(due, today));
        }

        static calculateMoraAmount({ remainingAmount, moraType, moraRate, daysLate }) {
            if (daysLate <= 0 || remainingAmount <= 0) return 0;
            const base = normalizeMoney(Number(remainingAmount));
            const rate = Number(moraRate) || 0;
            let result = 0;
            switch (moraType) {
                case 'percentage_daily': result = base * (rate / 100) * daysLate; break;
                case 'percentage_weekly': const w = Math.floor(daysLate / 7); result = w > 0 ? base * (rate / 100) * w : 0; break;
                case 'percentage_monthly': const m = Math.floor(daysLate / 30); result = m > 0 ? base * (rate / 100) * m : 0; break;
                case 'fixed_daily': result = rate * daysLate; break;
                case 'fixed_period': result = rate; break;
                default: return 0;
            }
            return normalizeMoney(result);
        }

        static calculateMoraRemaining(installment) {
            if (!installment) return 0;
            return normalizeMoney(Math.max(0, normalizeMoney(installment.moraAmount || 0) - normalizeMoney(installment.moraPaid || 0)));
        }

        static updateMora(installment, loan) {
            if (!installment || !loan) return installment;
            if (installment.status === 'paid' || installment.status === 'cancelled') return installment;

            const daysLate = this.calculateMoraDays(installment.dueDate);
            const remainingAmount = normalizeMoney(installment.remainingAmount || installment.totalAmount || 0);
            const totalMoraGenerated = this.calculateMoraAmount({
                remainingAmount, moraType: loan.moraType, moraRate: loan.moraRate, daysLate
            });

            const moraPaid = normalizeMoney(installment.moraPaid || 0);
            const moraRemaining = normalizeMoney(Math.max(0, totalMoraGenerated - moraPaid));

            let status = installment.status;
            if (status !== 'paid' && status !== 'cancelled') {
                if (daysLate > 0 && (installment.remainingAmount || 0) > 0.01) status = 'overdue';
                else if (status === 'overdue' && daysLate === 0) status = 'pending';
            }

            return {
                ...installment,
                moraDays: daysLate,
                moraAmount: normalizeMoney(totalMoraGenerated),
                moraPaid: normalizeMoney(moraPaid),
                moraRemaining: normalizeMoney(moraRemaining),
                status
            };
        }
    }

    class InterestEngine {
        static calculate({ principal, rate, count, type }) {
            const p = normalizeMoney(Number(principal));
            const r = Number(rate) / 100;
            const n = Number(count);
            let ti = 0;
            const d = [];

            switch (type) {
                case 'on_principal':
                    ti = normalizeMoney(p * r);
                    const ip = normalizeMoney(ti / n);
                    const pp = normalizeMoney(p / n);
                    let tc = 0, tint = 0;
                    for (let i = 0; i < n; i++) {
                        let ppart = pp, ipart = ip;
                        if (i === n - 1) { ppart = normalizeMoney(p - tc); ipart = normalizeMoney(ti - tint); }
                        d.push({ principal: normalizeMoney(ppart), interest: normalizeMoney(ipart), total: normalizeMoney(ppart + ipart) });
                        tc += ppart; tint += ipart;
                    }
                    break;
                case 'fixed_per_installment':
                    const fi = normalizeMoney((p * r) / n);
                    ti = normalizeMoney(fi * n);
                    const pf = normalizeMoney(p / n);
                    let tc2 = 0;
                    for (let i = 0; i < n; i++) {
                        let ppart = pf;
                        if (i === n - 1) ppart = normalizeMoney(p - tc2);
                        d.push({ principal: normalizeMoney(ppart), interest: fi, total: normalizeMoney(ppart + fi) });
                        tc2 += ppart;
                    }
                    break;
                case 'no_interest':
                    const pz = normalizeMoney(p / n);
                    let tc3 = 0;
                    for (let i = 0; i < n; i++) {
                        let ppart = pz;
                        if (i === n - 1) ppart = normalizeMoney(p - tc3);
                        d.push({ principal: normalizeMoney(ppart), interest: 0, total: normalizeMoney(ppart) });
                        tc3 += ppart;
                    }
                    break;
                default:
                    const pd = normalizeMoney(p / n);
                    const id = normalizeMoney((p * r) / n);
                    ti = normalizeMoney(id * n);
                    let tc4 = 0, tint4 = 0;
                    for (let i = 0; i < n; i++) {
                        let ppart = pd, ipart = id;
                        if (i === n - 1) { ppart = normalizeMoney(p - tc4); ipart = normalizeMoney(ti - tint4); }
                        d.push({ principal: normalizeMoney(ppart), interest: normalizeMoney(ipart), total: normalizeMoney(ppart + ipart) });
                        tc4 += ppart; tint4 += ipart;
                    }
            }

            return {
                totalInterest: normalizeMoney(ti),
                totalRepayment: normalizeMoney(p + ti),
                details: d.map(x => ({ principal: normalizeMoney(x.principal), interest: normalizeMoney(x.interest), total: normalizeMoney(x.total) }))
            };
        }
    }

    class ScheduleEngine {
        static generate({ startDate, frequency, count, dueDateType = 'fixed_day' }) {
            const dates = [];
            const start = parseLocalDate(startDate);
            for (let i = 0; i < count; i++) {
                let date;
                switch (frequency) {
                    case 'daily': date = new Date(start); date.setUTCDate(date.getUTCDate() + i); break;
                    case 'weekly': date = new Date(start); date.setUTCDate(date.getUTCDate() + (i * 7)); break;
                    case 'biweekly': date = new Date(start); date.setUTCDate(date.getUTCDate() + (i * 14)); break;
                    case 'monthly':
                        if (dueDateType === 'end_of_period') {
                            date = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i + 1, 0, 12, 0, 0, 0));
                        } else {
                            const targetDay = start.getUTCDate();
                            date = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, 1, 12, 0, 0, 0));
                            const lastDay = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0, 12, 0, 0, 0)).getUTCDate();
                            date.setUTCDate(Math.min(targetDay, lastDay));
                        }
                        break;
                    default: date = new Date(start); date.setUTCDate(date.getUTCDate() + (i * 30));
                }
                date.setUTCHours(12, 0, 0, 0);
                dates.push(date);
            }
            return dates;
        }
    }

    class PaymentDistributionEngine {
        static distributePayment(installments, paymentAmount, selectedInstallmentId = null) {
            const remainingAmount = normalizeMoney(paymentAmount);
            if (remainingAmount <= 0) return { distributed: [], remaining: 0, totalApplied: 0 };

            const sortedInstallments = [...installments]
                .filter(i => i.status !== 'paid' && i.status !== 'cancelled')
                .sort((a, b) => a.number - b.number);

            let startIndex = 0;
            if (selectedInstallmentId) {
                const index = sortedInstallments.findIndex(i => i.id === selectedInstallmentId);
                if (index !== -1) startIndex = index;
            }

            const orderedInstallments = [...sortedInstallments.slice(startIndex), ...sortedInstallments.slice(0, startIndex)];
            let remainingToDistribute = remainingAmount;
            const distributed = [];

            for (const installment of orderedInstallments) {
                const currentRemaining = normalizeMoney(installment.remainingAmount || installment.totalAmount || 0);
                if (currentRemaining <= 0) continue;
                const applyAmount = normalizeMoney(Math.min(remainingToDistribute, currentRemaining));
                distributed.push({
                    installmentId: installment.id,
                    installmentNumber: installment.number,
                    previousRemaining: currentRemaining,
                    appliedAmount: applyAmount,
                    newRemaining: normalizeMoney(currentRemaining - applyAmount),
                    isFullyPaid: applyAmount >= currentRemaining
                });
                remainingToDistribute = normalizeMoney(remainingToDistribute - applyAmount);
                if (remainingToDistribute <= 0) break;
            }

            return { distributed, remaining: remainingToDistribute, totalApplied: normalizeMoney(paymentAmount - remainingToDistribute) };
        }
    }

    class PaymentEngine {
        static process({ installment, amount }) {
            let rem = normalizeMoney(Number(amount));
            const bd = { capital: 0, interest: 0, mora: 0 };
            const ta = normalizeMoney(installment.totalAmount || 0);
            const ia = normalizeMoney(installment.interest || 0);
            const ra = normalizeMoney(installment.remainingAmount || ta);
            const ma = normalizeMoney(MoraEngine.calculateMoraRemaining(installment));
            const totalDue = normalizeMoney(ra + ma);

            if (totalDue <= 0) {
                return {
                    breakdown: bd, totalPaid: 0,
                    newPaidAmount: normalizeMoney(installment.paidAmount || 0),
                    newRemaining: 0,
                    newMoraPaid: normalizeMoney(installment.moraPaid || 0),
                    newStatus: 'paid', change: rem, isFullPayment: true
                };
            }

            let moraPaid = 0, interestPaid = 0, capitalPaid = 0;
            if (ma > 0 && rem > 0) { moraPaid = normalizeMoney(Math.min(rem, ma)); rem = normalizeMoney(rem - moraPaid); }
            const ir = ta > 0 ? ia / ta : 0;
            const mi = normalizeMoney(ra * ir);
            if (mi > 0 && rem > 0) { interestPaid = normalizeMoney(Math.min(rem, mi)); rem = normalizeMoney(rem - interestPaid); }
            const mc = normalizeMoney(ra - mi);
            if (rem > 0) { capitalPaid = normalizeMoney(Math.min(rem, Math.max(0, mc))); rem = normalizeMoney(rem - capitalPaid); }

            const totalPaidThisPayment = normalizeMoney(capitalPaid + interestPaid + moraPaid);
            const newPaidAmount = normalizeMoney((installment.paidAmount || 0) + capitalPaid + interestPaid);
            const newMoraPaid = normalizeMoney((installment.moraPaid || 0) + moraPaid);
            const newRemaining = normalizeMoney(Math.max(0, ta - newPaidAmount));

            let newStatus = 'pending';
            const moraRemaining = normalizeMoney(Math.max(0, (installment.moraAmount || 0) - newMoraPaid));
            if (newRemaining <= 0.01 && moraRemaining <= 0.01) newStatus = 'paid';
            else if (newPaidAmount > 0 && (newRemaining > 0.01 || moraRemaining > 0.01)) newStatus = 'partial';
            else if (MoraEngine.calculateMoraDays(installment.dueDate) > 0 && newRemaining > 0.01) newStatus = 'overdue';

            return {
                breakdown: { capital: normalizeMoney(capitalPaid), interest: normalizeMoney(interestPaid), mora: normalizeMoney(moraPaid) },
                totalPaid: totalPaidThisPayment, newPaidAmount, newMoraPaid, newRemaining, newStatus,
                change: rem, isFullPayment: newStatus === 'paid'
            };
        }
    }

    class CollectionHistoryEngine {
        static getPeriodSummary(payments, installments, loans, clients, year, month) {
            const sd = new Date(Date.UTC(year, month - 1, 1, 12, 0, 0, 0));
            const ed = new Date(Date.UTC(year, month, 0, 23, 59, 59, 999));

            const periodPayments = payments.filter(p => {
                if (!p || !p.paymentDate) return false;
                const d = new Date(p.paymentDate);
                return d >= sd && d <= ed;
            });

            let totalCapital = 0, totalInterest = 0, totalMora = 0;
            const paymentsByClient = {};

            for (const p of periodPayments) {
                const bd = p.breakdown || {};
                const cap = normalizeMoney(bd.capital || 0);
                const int = normalizeMoney(bd.interest || 0);
                const mor = normalizeMoney(bd.mora || 0);
                totalCapital += cap; totalInterest += int; totalMora += mor;

                const clientId = p.clientId;
                if (!paymentsByClient[clientId]) paymentsByClient[clientId] = { clientId, total: 0, payments: [] };
                paymentsByClient[clientId].total += cap + int + mor;
                paymentsByClient[clientId].payments.push({
                    id: p.id, amount: cap + int + mor, capital: cap, interest: int, mora: mor,
                    date: p.paymentDate, method: p.method, loanId: p.loanId, installmentId: p.installmentId, note: p.note
                });
            }

            const totalCollected = normalizeMoney(totalCapital + totalInterest + totalMora);
            const periodInstallments = installments.filter(i => {
                if (!i || !i.dueDate) return false;
                const d = new Date(i.dueDate);
                return d >= sd && d <= ed && i.status !== 'cancelled';
            });
            const expectedAmount = normalizeMoney(periodInstallments.reduce((s, i) => s + (i.totalAmount || 0), 0));

            return {
                year, month, monthName: getMonthName(month),
                startDate: sd.toISOString(), endDate: ed.toISOString(),
                expectedAmount, collectedAmount: totalCollected,
                collectedCapital: normalizeMoney(totalCapital),
                collectedInterest: normalizeMoney(totalInterest),
                collectedMora: normalizeMoney(totalMora),
                pendingAmount: normalizeMoney(expectedAmount - totalCollected),
                compliance: expectedAmount > 0 ? normalizeMoney((totalCollected / expectedAmount) * 100) : 0,
                paymentsCount: periodPayments.length,
                clientsCount: Object.keys(paymentsByClient).length,
                paymentsByClient,
                payments: periodPayments.sort((a, b) => new Date(a.paymentDate) - new Date(b.paymentDate))
            };
        }

        static getAvailablePeriods(payments) {
            const periods = new Set();
            for (const p of payments) {
                if (!p || !p.paymentDate) continue;
                const d = new Date(p.paymentDate);
                if (isNaN(d.getTime())) continue;
                periods.add(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`);
            }
            return Array.from(periods).sort();
        }
    }

    class LossCompensationEngine {
        static calculateState(lostDebts, recoveryMovements, lossCompensations) {
            const safeLost = Array.isArray(lostDebts) ? lostDebts : [];
            const safeRecoveries = Array.isArray(recoveryMovements) ? recoveryMovements : [];
            const safeCompensations = Array.isArray(lossCompensations) ? lossCompensations : [];

            const totalLostCapital = normalizeMoney(
                safeLost.reduce((s, d) => s + normalizeMoney(d.lostCapital || 0), 0)
            );
            const totalExpectedProfitLost = normalizeMoney(
                safeLost.reduce((s, d) => s + normalizeMoney(d.lostExpectedProfit || 0), 0)
            );

            const totalDirectRecovery = normalizeMoney(
                safeRecoveries.reduce((s, r) => s + normalizeMoney(r.capitalRecovered || r.amount || 0), 0)
            );

            const totalInterestCompensation = normalizeMoney(
                safeCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0)
            );

            const totalRecovered = normalizeMoney(totalDirectRecovery + totalInterestCompensation);
            const totalPending = normalizeMoney(Math.max(0, totalLostCapital - totalRecovered));

            const perDebt = safeLost.map(ld => {
                const directRec = normalizeMoney(
                    safeRecoveries
                        .filter(r => r.lostDebtId === ld.id)
                        .reduce((s, r) => s + normalizeMoney(r.capitalRecovered || r.amount || 0), 0)
                );
                const intRec = normalizeMoney(
                    safeCompensations
                        .filter(c => c.lostDebtId === ld.id)
                        .reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0)
                );
                const totalRec = normalizeMoney(directRec + intRec);
                const pending = normalizeMoney(Math.max(0, (ld.lostCapital || 0) - totalRec));
                const percentage = (ld.lostCapital || 0) > 0
                    ? normalizeMoney((totalRec / ld.lostCapital) * 100)
                    : 0;

                return {
                    ...ld,
                    directRecovery: directRec,
                    interestRecovery: intRec,
                    totalRecovered: totalRec,
                    pending,
                    percentage,
                    isFullyRecovered: pending <= 0.01
                };
            });

            return {
                totalLostCapital,
                totalExpectedProfitLost,
                totalDirectRecovery,
                totalInterestCompensation,
                totalRecovered,
                totalPending,
                recoveryPercentage: totalLostCapital > 0
                    ? normalizeMoney((totalRecovered / totalLostCapital) * 100)
                    : 0,
                perDebt,
                hasPendingLoss: totalPending > 0.01
            };
        }

        static distributeInterestToLosses(interestAmount, perDebtSorted) {
            const distributions = [];
            let remaining = normalizeMoney(interestAmount);
            if (remaining <= 0) return distributions;

            for (const debt of perDebtSorted) {
                if (remaining <= 0) break;
                if (debt.pending <= 0.01) continue;
                const apply = normalizeMoney(Math.min(remaining, debt.pending));
                if (apply <= 0) continue;
                distributions.push({ lostDebtId: debt.id, amount: apply });
                remaining = normalizeMoney(remaining - apply);
            }

            return distributions;
        }
    }

    class LostDebtEngine {
        static calculateLossBreakdown(loan, installments, payments) {
            const originalCapital = normalizeMoney(loan.principal || 0);
            const expectedProfit = normalizeMoney((loan.totalRepayment || 0) - originalCapital);
            const totalExpected = normalizeMoney(loan.totalRepayment || 0);
            
            let alreadyCollectedCapital = 0, alreadyCollectedInterest = 0, alreadyCollectedMora = 0;
            for (const p of payments) {
                const bd = p.breakdown || {};
                alreadyCollectedCapital += normalizeMoney(bd.capital || 0);
                alreadyCollectedInterest += normalizeMoney(bd.interest || 0);
                alreadyCollectedMora += normalizeMoney(bd.mora || 0);
            }

            const alreadyCollected = normalizeMoney(alreadyCollectedCapital + alreadyCollectedInterest + alreadyCollectedMora);
            const pendingBalance = normalizeMoney(Math.max(0, totalExpected - alreadyCollected));
            const lostCapital = normalizeMoney(Math.max(0, originalCapital - alreadyCollectedCapital));
            const lostExpectedProfit = normalizeMoney(Math.max(0, expectedProfit - alreadyCollectedInterest));
            const initialPendingLoss = lostCapital;

            return {
                originalCapital, expectedProfit, totalExpected,
                alreadyCollectedCapital: normalizeMoney(alreadyCollectedCapital),
                alreadyCollectedInterest: normalizeMoney(alreadyCollectedInterest),
                alreadyCollectedMora: normalizeMoney(alreadyCollectedMora),
                alreadyCollected, pendingBalance,
                lostCapital, lostExpectedProfit, initialPendingLoss
            };
        }

        static calculateLostDebtStatus(lostDebt, recoveryMovements) {
            const recoveredCapital = normalizeMoney(lostDebt.recoveredCapital || 0);
            const recoveredInterest = normalizeMoney(lostDebt.recoveredInterest || 0);
            const totalRecovered = normalizeMoney(recoveredCapital + recoveredInterest);
            const pendingCapital = normalizeMoney(Math.max(0, (lostDebt.lostCapital || 0) - recoveredCapital));
            const pendingExpectedProfit = normalizeMoney(Math.max(0, (lostDebt.lostExpectedProfit || 0) - recoveredInterest));
            const isFullyRecovered = pendingCapital <= 0.01;

            return {
                totalRecovered, recoveredCapital, recoveredInterest,
                pendingCapital, pendingExpectedProfit, isFullyRecovered,
                recoveryPercentage: lostDebt.lostCapital > 0 
                    ? normalizeMoney((recoveredCapital / lostDebt.lostCapital) * 100) 
                    : 0
            };
        }
    }

    class SecurityUtils {
        static async hashPassword(pw) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pw + 'LoansW_Salt_2025');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return 'lw8_' + Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        static async verifyPassword(pw, hash) {
            return await this.hashPassword(pw) === hash;
        }

        static generateToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const array = new Uint8Array(64);
            crypto.getRandomValues(array);
            return Array.from(array, b => chars.charAt(b % chars.length)).join('');
        }

        static async createSession(userId, remember = false) {
            const token = this.generateToken();
            const expiresAt = new Date();
            expiresAt.setDate(expiresAt.getDate() + (remember ? 30 : 1));
            await db.sessions.add({
                userId, token,
                expiresAt: expiresAt.toISOString(),
                createdAt: new Date().toISOString()
            });
            (remember ? localStorage : sessionStorage).setItem('lw_session', JSON.stringify({ userId, token }));
        }

        static async validateSession() {
            try {
                let data = sessionStorage.getItem('lw_session');
                if (!data) data = localStorage.getItem('lw_session');
                if (!data) return null;
                const { userId, token } = JSON.parse(data);
                const session = await db.sessions.where({ userId, token }).first();
                if (!session || new Date(session.expiresAt) < new Date()) {
                    sessionStorage.removeItem('lw_session');
                    localStorage.removeItem('lw_session');
                    if (session) await db.sessions.delete(session.id);
                    return null;
                }
                return await db.users.get(userId);
            } catch (err) {
                console.warn('[SESSION] Error validando sesión:', err);
                sessionStorage.removeItem('lw_session');
                localStorage.removeItem('lw_session');
                return null;
            }
        }

        static async destroySession() {
            const sources = [sessionStorage.getItem('lw_session'), localStorage.getItem('lw_session')];
            for (const src of sources) {
                if (src) {
                    try {
                        const { token } = JSON.parse(src);
                        await db.sessions.where({ token }).delete();
                    } catch {}
                }
            }
            sessionStorage.removeItem('lw_session');
            localStorage.removeItem('lw_session');
        }
    }

            }
        } catch (err) {
            console.error('[CLEAN] Error limpiando huérfanos:', err);
        }
    };

    // ============================================================
    // 6. APP CONTEXT
    // ============================================================

    const AppContext = createContext();

    const AppProvider = ({ children, user, onLogout }) => {
        const [clients, setClients] = useState([]);
        const [loans, setLoans] = useState([]);
        const [installments, setInstallments] = useState([]);
        const [payments, setPayments] = useState([]);
        const [expenses, setExpenses] = useState([]);
        const [capitalMovements, setCapitalMovements] = useState([]);
        const [expenseCategories, setExpenseCategories] = useState([]);
        const [collectionPeriods, setCollectionPeriods] = useState([]);
        const [auditLogs, setAuditLogs] = useState([]);
        const [notes, setNotes] = useState([]);
        const [lostDebts, setLostDebts] = useState([]);
        const [recoveryMovements, setRecoveryMovements] = useState([]);
        const [lossCompensations, setLossCompensations] = useState([]);
        const [config, setConfig] = useState(null);
        const [toasts, setToasts] = useState([]);
        const [loading, setLoading] = useState(true);
        const [refreshKey, setRefreshKey] = useState(0);

        const addToast = useCallback((msg, type = 'info') => {
            const id = Date.now() + Math.random();
            setToasts(p => [...p, { id, msg, type }]);
            setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
        }, []);

        const refreshAllData = useCallback(async () => {
            if (!user?.id) return;
            setLoading(true);
            try {
                await initDatabase();
                const userId = user.id;
                await cleanOrphanCapitalMovements(userId);

                const [c, l, ec, cp, n, ld, rm, lc] = await Promise.all([
                    db.clients.where({ userId }).toArray(),
                    db.loans.where({ userId }).toArray(),
                    db.expenseCategories.toArray(),
                    db.collectionPeriods.where({ userId }).toArray(),
                    db.notes.where({ userId }).toArray(),
                    db.lostDebts.where({ userId }).toArray(),
                    db.recoveryMovements.where({ userId }).toArray(),
                    db.lossCompensations.where({ userId }).toArray()
                ]);

                setClients(c);
                setLoans(l);
                setExpenseCategories(ec);
                setCollectionPeriods(cp);
                setNotes(n);
                setLostDebts(ld);
                setRecoveryMovements(rm);
                setLossCompensations(lc);

                const loanIds = l.map(loan => loan.id);
                let i = [];
                let p = [];
                
                if (loanIds.length > 0) {
                    i = await db.installments.where('loanId').anyOf(loanIds).toArray();
                    p = await db.payments.where('loanId').anyOf(loanIds).toArray();

                    for (const inst of i) {
                        if (inst.status === 'paid' || inst.status === 'cancelled') continue;
                        const loan = l.find(lo => lo.id === inst.loanId);
                        if (loan && loan.status !== 'lost') {
                            const updated = MoraEngine.updateMora(inst, loan);
                            if (updated.moraDays !== inst.moraDays || updated.moraAmount !== inst.moraAmount ||
                                updated.moraRemaining !== inst.moraRemaining || updated.status !== inst.status) {
                                await db.installments.update(inst.id, {
                                    moraDays: updated.moraDays,
                                    moraAmount: updated.moraAmount,
                                    moraRemaining: updated.moraRemaining,
                                    status: updated.status
                                });
                            }
                        }
                    }

                    i = await db.installments.where('loanId').anyOf(loanIds).toArray();
                    p = await db.payments.where('loanId').anyOf(loanIds).toArray();

                    for (const loan of l) {
                        if (loan.status === 'lost' || loan.status === 'cancelled') continue;

                        const loanInsts = i.filter(inst => inst.loanId === loan.id);
                        const allPaid = loanInsts.every(inst => inst.status === 'paid' || inst.status === 'cancelled');
                        const hasOverdue = loanInsts.some(inst => inst.status === 'overdue');
                        let newStatus = loan.status;

                        if (allPaid && loan.status !== 'finished') {
                            newStatus = 'finished';
                            await db.loans.update(loan.id, { status: 'finished', updatedAt: new Date().toISOString() });
                        } else if (hasOverdue && loan.status === 'active') {
                            newStatus = 'overdue';
                            await db.loans.update(loan.id, { status: 'overdue', updatedAt: new Date().toISOString() });
                        } else if (!hasOverdue && loan.status === 'overdue') {
                            newStatus = 'active';
                            await db.loans.update(loan.id, { status: 'active', updatedAt: new Date().toISOString() });
                        }

                        if (newStatus !== loan.status) loan.status = newStatus;

                        const loanPayments = p.filter(pay => pay.loanId === loan.id);
                        let totalPaidFromPayments = 0;
                        for (const pay of loanPayments) {
                            const bd = pay.breakdown || {};
                            totalPaidFromPayments += normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0));
                        }
                        
                        const newTotalPaid = normalizeMoney(totalPaidFromPayments);
                        const newCurrentBalance = normalizeMoney(Math.max(0, (loan.totalRepayment || 0) - newTotalPaid));
                        const newProgress = loan.totalRepayment > 0 ? normalizeMoney((newTotalPaid / loan.totalRepayment) * 100) : 0;

                        if (Math.abs(newTotalPaid - (loan.totalPaid || 0)) > 0.01) {
                            await db.loans.update(loan.id, {
                                totalPaid: newTotalPaid,
                                currentBalance: newCurrentBalance,
                                progress: newProgress
                            });
                            loan.totalPaid = newTotalPaid;
                            loan.currentBalance = newCurrentBalance;
                            loan.progress = newProgress;
                        }
                    }
                    setLoans([...l]);
                }

                setInstallments(i);
                setPayments(p);

                const [e, cm, cfg] = await Promise.all([
                    db.expenses.where({ userId }).toArray(),
                    db.capitalMovements.where({ userId }).toArray(),
                    db.settings.get(userId)
                ]);

                setExpenses(e);
                setCapitalMovements(cm);
                setConfig(cfg || null);

                try {
                    const ar = await db.auditLog.where({ userId }).toArray();
                    ar.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    setAuditLogs(ar.slice(0, 100));
                } catch (err) {
                    console.error('[AUDIT]', err);
                }

                await CollectionHistoryEngine.reconcilePeriods(userId, p);

                setRefreshKey(prev => prev + 1);

            } catch (err) {
                console.error('[APP] Error refresh:', err);
                addToast('Error al cargar datos: ' + (err.message || 'Error desconocido'), 'error');
            }
            setLoading(false);
        }, [user, addToast]);

        CollectionHistoryEngine.reconcilePeriods = async (userId, payments) => {
            try {
                const periods = CollectionHistoryEngine.getAvailablePeriods(payments);
                for (const period of periods) {
                    const [year, month] = period.split('-').map(Number);
                    const allLoans = await db.loans.where({ userId }).toArray();
                    const allInstallments = [];
                    for (const loan of allLoans) {
                        const insts = await db.installments.where({ loanId: loan.id }).toArray();
                        allInstallments.push(...insts);
                    }
                    const allClients = await db.clients.where({ userId }).toArray();
                    
                    const summary = CollectionHistoryEngine.getPeriodSummary(
                        payments, allInstallments, allLoans, allClients, year, month
                    );
                    
                    const existing = await db.collectionPeriods.where({ userId, year, month }).first();
                    const periodData = {
                        expectedAmount: summary.expectedAmount,
                        collectedAmount: summary.collectedAmount,
                        pendingAmount: summary.pendingAmount,
                        compliance: summary.compliance,
                        data: JSON.stringify({
                            collectedCapital: summary.collectedCapital,
                            collectedInterest: summary.collectedInterest,
                            collectedMora: summary.collectedMora,
                            paymentsCount: summary.paymentsCount,
                            clientsCount: summary.clientsCount,
                            paymentsByClient: summary.paymentsByClient
                        }),
                        updatedAt: new Date().toISOString()
                    };
                    
                    if (existing) {
                        await db.collectionPeriods.update(existing.id, periodData);
                    } else {
                        await db.collectionPeriods.add({
                            userId, year, month, ...periodData,
                            createdAt: new Date().toISOString()
                        });
                    }
                }
            } catch (err) {
                console.error('[RECONCILE] Error:', err);
            }
        };

        const addAuditLog = useCallback(async (et, eid, action, desc = '', before = null, after = null, details = null) => {
            if (!user?.id) return;
            try {
                await db.auditLog.add({
                    userId: user.id,
                    timestamp: new Date().toISOString(),
                    entityType: et, entityId: eid, action,
                    description: desc,
                    before: before ? JSON.stringify(before) : null,
                    after: after ? JSON.stringify(after) : null,
                    details: details ? JSON.stringify(details) : null
                });
            } catch (err) {
                console.error('[APP] Audit log error:', err);
            }
        }, [user]);

        const applyInterestToLosses = useCallback(async (interestAmount, paymentInfo = {}) => {
            const interest = normalizeMoney(interestAmount);
            if (interest <= 0) return [];

            const allLostDebts = await db.lostDebts.where({ userId: user.id }).toArray();
            const allRecoveries = await db.recoveryMovements.where({ userId: user.id }).toArray();
            const allCompensations = await db.lossCompensations.where({ userId: user.id }).toArray();

            const state = LossCompensationEngine.calculateState(allLostDebts, allRecoveries, allCompensations);
            if (!state.hasPendingLoss) return [];

            const sortedPending = state.perDebt
                .filter(d => !d.isFullyRecovered)
                .sort((a, b) => new Date(a.lostAt) - new Date(b.lostAt));

            const distributions = LossCompensationEngine.distributeInterestToLosses(interest, sortedPending);
            if (distributions.length === 0) return [];

            const now = new Date().toISOString();
            const applied = [];

            for (const dist of distributions) {
                const debt = sortedPending.find(d => d.id === dist.lostDebtId);
                if (!debt) continue;

                const pendingBefore = debt.pending;
                const pendingAfter = normalizeMoney(Math.max(0, pendingBefore - dist.amount));

                await db.lossCompensations.add({
                    userId: user.id,
                    lostDebtId: debt.id,
                    paymentId: paymentInfo.paymentId || null,
                    loanId: paymentInfo.loanId || null,
                    clientId: paymentInfo.clientId || null,
                    installmentId: paymentInfo.installmentId || null,
                    amountAppliedToLoss: dist.amount,
                    interestGenerated: interest,
                    moraGenerated: 0,
                    capitalReceived: 0,
                    pendingBefore,
                    pendingAfter,
                    appliedAt: now,
                    description: paymentInfo.description || 'Compensación automática vía intereses',
                    createdAt: now
                });

                await db.lostDebts.update(debt.id, {
                    recoveredInterest: normalizeMoney((debt.recoveredInterest || 0) + dist.amount),
                    status: pendingAfter <= 0.01 ? 'fully_recovered' : 'partial_recovered',
                    fullyRecoveredAt: pendingAfter <= 0.01 ? now : null,
                    updatedAt: now
                });

                applied.push({ lostDebtId: debt.id, amount: dist.amount });
            }

            return applied;
        }, [user]);

        useEffect(() => {
            if (user) refreshAllData();
        }, [user]);

        const value = useMemo(() => ({
            user, onLogout, clients, loans, installments, payments, expenses,
            capitalMovements, expenseCategories, setExpenseCategories,
            collectionPeriods, auditLogs, notes, setNotes, 
            lostDebts, setLostDebts, recoveryMovements, setRecoveryMovements,
            lossCompensations, setLossCompensations,
            config, setConfig, toasts, addToast, loading, refreshKey, 
            refreshAllData, addAuditLog, db, applyInterestToLosses
        }), [user, onLogout, clients, loans, installments, payments, expenses,
            capitalMovements, expenseCategories, collectionPeriods, auditLogs, notes,
            lostDebts, recoveryMovements, lossCompensations,
            config, toasts, addToast, loading, refreshKey, refreshAllData, addAuditLog, db, applyInterestToLosses
        ]);

        return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
    };

    const useApp = () => useContext(AppContext);

    // ============================================================
    // 7. COMPONENTES UI BASE
    // ============================================================

    const ToastContainer = () => {
        const { toasts } = useApp();
        if (!toasts.length) return null;
        return <div className="toast-container">
            {toasts.map(t => <div key={t.id} className={`toast toast-${t.type}`}>{t.msg}</div>)}
        </div>;
    };

    const LoadingScreen = () => <div style={{
        minHeight: '100vh', display: 'flex', flexDirection: 'column',

    const ConfirmDialog = ({ title, message, confirmLabel, confirmType, onConfirm, onCancel, loading }) => (
        <div className="confirm-overlay" onClick={onCancel}>
            <div className="confirm-dialog" onClick={e => e.stopPropagation()}>
                <div style={{
                    fontSize: '36px', marginBottom: '10px',
                    color: confirmType === 'danger' ? 'var(--danger)' :
                           confirmType === 'loss' ? 'var(--loss)' : 'var(--warning)'
                }}>
                    <IconSVG.AlertTriangle />
                </div>
                <div style={{ fontSize: '18px', fontWeight: '700', marginBottom: '6px' }}>{title}</div>
                <div style={{
                    fontSize: '13px', color: 'var(--text-secondary)',
                    marginBottom: '20px', lineHeight: '1.5', whiteSpace: 'pre-wrap'
                }}>{message}</div>
                <div style={{ display: 'flex', gap: '10px' }}>
                    <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onCancel} disabled={loading}>
                        Cancelar
                    </button>
                    <button className={`btn ${confirmType === 'danger' ? 'btn-danger' : confirmType === 'loss' ? 'btn-loss' : 'btn-primary'}`}
                        style={{ flex: 1 }} onClick={onConfirm} disabled={loading}>
                        {loading ? 'Procesando...' : confirmLabel || 'Confirmar'}
                    </button>
                </div>
            </div>
        </div>
    );

    // ============================================================
    // 8. COMPONENT: PAYMENT TYPES
    // ============================================================

    const PaymentTypes = ({ selected, onSelect, disabled = false }) => {
        const types = [
            { id: 'full_installment', label: 'Pago de cuota', icon: '📋' },

                    >
                        <span style={{ fontSize: '22px', display: 'block', marginBottom: '4px' }}>{type.icon}</span>
                        <div>{type.label}</div>
                    </div>
                ))}
            </div>
        );
    };

    // ============================================================
    // 9. COMPONENT: PAYMENT RECEIPT
    // ============================================================

    const PaymentReceipt = ({ payment, onClose, onPrint, onShare }) => {
        if (!payment) return null;

        const handlePrint = () => {
            window.print();
            if (onPrint) onPrint();
        };

        const handleShare = async () => {
            try {
                const text = `LOANS W - COMPROBANTE DE PAGO\n\n` +
                    `Cliente: ${payment.clientName}\n` +
                    `Préstamo: ${payment.loanNumber}\n` +
                    `Fecha: ${formatDateTime(payment.paymentDate || payment.date)}\n` +
                    `Comprobante: ${payment.receiptNumber}\n\n` +
                    `Valor: ${formatCurrency(payment.amount || payment.receivedAmount)}\n\n` +
                    `Capital: ${formatCurrency(payment.breakdown?.capital || 0)}\n` +
                    `Intereses: ${formatCurrency(payment.breakdown?.interest || 0)}\n` +
                    `Mora: ${formatCurrency(payment.breakdown?.mora || 0)}\n\n` +
                    `Método: ${payment.method}\n` +
                    `Saldo pendiente: ${formatCurrency(payment.remainingBalance || 0)}\n\n` +
                    `---\nLOANS W`;

                if (navigator.share) {
                    await navigator.share({ title: `Comprobante - ${payment.receiptNumber}`, text });
                } else {

                <div style={{
                    background: 'var(--bg-primary)',

                    {payment.remainingBalance !== undefined && (

                            <span style={{ color: 'var(--text-muted)' }}>Saldo pendiente</span>
                            <span style={{ fontWeight: '500', color: payment.remainingBalance <= 0 ? 'var(--success)' : 'var(--text-primary)' }}>
                                {formatCurrency(payment.remainingBalance)}
