    const SimulatorPage = ({ onNavigate }) => {
        const [form, setForm] = useState({
            principal: '1000000',
            interestType: 'on_principal',
            interestRate: '20',
            installmentsCount: '10',
            frequency: 'monthly',
            startDate: formatDateLocal(todayLocal()),
            dueDateType: 'fixed_day',
            moraType: 'percentage_daily',
            moraRate: '0.5'
        });
        const [simulation, setSimulation] = useState(null);
        const { addToast } = useApp();

        const quickAmounts = [100000, 200000, 300000, 500000, 600000, 1000000, 2000000];

        const uf = (f, v) => setForm(p => ({ ...p, [f]: v }));

        const runSimulation = useCallback((f) => {
            if (!f.principal || !f.interestRate || !f.installmentsCount || parseInt(f.installmentsCount) <= 0) {
                setSimulation(null);
                return;
            }
            const p = normalizeMoney(parseFloat(f.principal));
            const r = parseFloat(f.interestRate);
            const c = parseInt(f.installmentsCount);
            if (isNaN(p) || isNaN(r) || isNaN(c) || p <= 0 || c <= 0) {
                setSimulation(null);
                return;
            }
            const result = InterestEngine.calculate({
                principal: p,
                rate: r,
                count: c,
                type: f.interestType
            });
            const schedule = ScheduleEngine.generate({
                startDate: f.startDate,
                frequency: f.frequency,
                count: c,
                dueDateType: f.dueDateType
            });
            const scheduleDetails = schedule.map((date, i) => {
                const detail = result.details[i];
                const balance = normalizeMoney(p - result.details.slice(0, i + 1).reduce((s, d) => s + d.principal, 0));
                const daysLate = i === 0 ? 0 : Math.max(0, getCalendarDaysDiff(schedule[i], todayLocal()));
                const hypotheticalMora = normalizeMoney(MoraEngine.calculateMoraAmount({
                    remainingAmount: detail.total,
                    moraType: f.moraType,
                    moraRate: parseFloat(f.moraRate),
                    daysLate
                }));
                return { date, ...detail, balance: Math.max(0, balance), hypotheticalMora };
            });
            setSimulation({ ...result, schedule, scheduleDetails });
        }, []);

        useEffect(() => { runSimulation(form); }, [form, runSimulation]);

        const handleCreateLoan = () => {
            if (!simulation) return;
            onNavigate('createLoan', null, {
                principal: form.principal,
                interestType: form.interestType,
                interestRate: form.interestRate,
                installmentsCount: form.installmentsCount,
                frequency: form.frequency,
                startDate: form.startDate,
                dueDateType: form.dueDateType,
                moraType: form.moraType,
                moraRate: form.moraRate
            });
        };

        const handleCopy = () => {
            if (!simulation) return;
            const text =
                `SIMULACIÓN LOANS W\nMonto: ${formatCurrency(normalizeMoney(parseFloat(form.principal)))}\nInterés: ${form.interestRate}%\nCuotas: ${form.installmentsCount}\nTotal a pagar: ${formatCurrency(simulation.totalRepayment)}\nCuota: ${formatCurrency(simulation.details[0]?.total || 0)}`;
            navigator.clipboard.writeText(text).then(() => addToast('Copiado al portapapeles', 'success')).catch(() => {});
        };

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('loans')} className="back-btn">
                    <IconSVG.ArrowLeft /> Volver
                </button>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>
                    <IconSVG.Calculator /> Simulador de préstamo
                </div>

                <div className="glass-card" style={{ padding: '20px', marginBottom: '16px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                            Monto del préstamo
                        </label>
                        <input
                            type="number"
                            value={form.principal}
                            onChange={e => uf('principal', e.target.value)}
                            className="glass-input"
                            placeholder="Ej: 1000000"
                        />
                    </div>
                    <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                        {quickAmounts.map(a => (
                            <button key={a} className="btn btn-ghost btn-sm" onClick={() => uf('principal', a.toString())}
                                style={{ fontSize: '11px', padding: '6px 10px' }}>
                                {formatCurrency(a)}
                            </button>
                        ))}
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Tipo de interés
                            </label>
                            <select value={form.interestType} onChange={e => uf('interestType', e.target.value)} className="glass-input">
                                <option value="on_principal">Sobre capital inicial</option>
                                <option value="fixed_per_installment">Fijo por cuota</option>
                                <option value="no_interest">Sin interés</option>
                            </select>
                        </div>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Tasa (%)
                            </label>
                            <input
                                type="number"
                                value={form.interestRate}
                                onChange={e => uf('interestRate', e.target.value)}
                                className="glass-input"
                                placeholder="Ej: 20"
                            />
                        </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                N° de cuotas
                            </label>
                            <input
                                type="number"
                                value={form.installmentsCount}
                                onChange={e => uf('installmentsCount', e.target.value)}
                                className="glass-input"
                                placeholder="Ej: 10"
                            />
                        </div>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Frecuencia
                            </label>
                            <select value={form.frequency} onChange={e => uf('frequency', e.target.value)} className="glass-input">
                                <option value="daily">Diaria</option>
                                <option value="weekly">Semanal</option>
                                <option value="biweekly">Quincenal</option>
                                <option value="monthly">Mensual</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                            Fecha de inicio
                        </label>
                        <input
                            type="date"
                            value={form.startDate}
                            onChange={e => uf('startDate', e.target.value)}
                            className="glass-input"
                        />
                    </div>

                    <div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--text-secondary)', marginTop: '4px' }}>
                        Configuración de mora
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                        <select value={form.moraType} onChange={e => uf('moraType', e.target.value)} className="glass-input">
                            <option value="percentage_daily">% diario</option>
                            <option value="percentage_weekly">% semanal</option>
                            <option value="percentage_monthly">% mensual</option>
                            <option value="fixed_daily">Fijo/día</option>
                            <option value="fixed_period">Fijo/período</option>
                        </select>
                        <input
                            type="number"
                            value={form.moraRate}
                            onChange={e => uf('moraRate', e.target.value)}
                            className="glass-input"
                            placeholder="Tasa"
                            step="0.01"
                        />
                    </div>
                </div>

                {simulation && (
                    <>
                        <div className="glass-card" style={{ padding: '20px', marginBottom: '16px' }}>
                            <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '12px' }}>
                                Resumen de simulación
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                <div style={{ textAlign: 'center', padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: '10px' }}>
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>
                                        Monto solicitado
                                    </div>
                                    <div style={{ fontSize: '16px', fontWeight: '700' }}>
                                        {formatCurrency(normalizeMoney(parseFloat(form.principal)))}
                                    </div>
                                </div>
                                <div style={{ textAlign: 'center', padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: '10px' }}>
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>
                                        Total intereses
                                    </div>
                                    <div style={{ fontSize: '16px', fontWeight: '700', color: 'var(--warning)' }}>
                                        {formatCurrency(simulation.totalInterest)}
                                    </div>
                                </div>
                                <div style={{ textAlign: 'center', padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: '10px' }}>
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>
                                        Total a pagar
                                    </div>
                                    <div style={{ fontSize: '16px', fontWeight: '700', color: 'var(--accent-light)' }}>
                                        {formatCurrency(simulation.totalRepayment)}
                                    </div>
                                </div>
                                <div style={{ textAlign: 'center', padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: '10px' }}>
                                    <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>
                                        Valor de cuota
                                    </div>
                                    <div style={{ fontSize: '16px', fontWeight: '700' }}>
                                        {formatCurrency(simulation.details[0]?.total || 0)}
                                    </div>
                                </div>
                            </div>

                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', marginTop: '12px' }}>
                                <div style={{ textAlign: 'center', fontSize: '11px' }}>
                                    <div style={{ color: 'var(--text-muted)' }}>Cuotas</div>
                                    <div style={{ fontWeight: '600' }}>{simulation.scheduleDetails.length}</div>
                                </div>
                                <div style={{ textAlign: 'center', fontSize: '11px' }}>
                                    <div style={{ color: 'var(--text-muted)' }}>Primera cuota</div>
                                    <div style={{ fontWeight: '600' }}>{formatDate(simulation.schedule[0])}</div>
                                </div>
                                <div style={{ textAlign: 'center', fontSize: '11px' }}>
                                    <div style={{ color: 'var(--text-muted)' }}>Última cuota</div>
                                    <div style={{ fontWeight: '600' }}>{formatDate(simulation.schedule[simulation.schedule.length - 1])}</div>
                                </div>
                            </div>
                        </div>

                        <div className="glass-card" style={{ padding: '16px', marginBottom: '16px' }}>
                            <div style={{ fontSize: '14px', fontWeight: '600', marginBottom: '8px' }}>
                                Tabla de amortización
                            </div>
                            <div style={{ maxHeight: '300px', overflow: 'auto' }}>
                                <table className="amort-table">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>Fecha</th>
                                            <th>Capital</th>
                                            <th>Interés</th>
                                            <th>Total</th>
                                            <th>Saldo</th>
                                            <th>Mora hip.</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {simulation.scheduleDetails.map((inst, i) => (
                                            <tr key={i}>
                                                <td>{i + 1}</td>
                                                <td>{formatDate(inst.date)}</td>
                                                <td>{formatCurrency(inst.principal)}</td>
                                                <td>{formatCurrency(inst.interest)}</td>
                                                <td style={{ fontWeight: '600', color: 'var(--text-primary)' }}>
                                                    {formatCurrency(inst.total)}
                                                </td>
                                                <td style={{ color: inst.balance <= 0 ? 'var(--success)' : 'var(--text-secondary)' }}>
                                                    {formatCurrency(Math.max(0, inst.balance))}
                                                </td>
                                                <td style={{
                                                    color: inst.hypotheticalMora > 0 ? 'var(--danger)' : 'var(--text-muted)',
                                                    fontSize: '10px'
                                                }}>
                                                    {inst.hypotheticalMora > 0 ? formatCurrency(inst.hypotheticalMora) : '-'}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                            <button className="btn btn-success" onClick={handleCreateLoan}>
                                <IconSVG.Check /> Crear préstamo con esta simulación
                            </button>
                            <button className="btn btn-ghost btn-sm" onClick={handleCopy}>
                                <IconSVG.Copy /> Copiar resumen
                            </button>
                            <button className="btn btn-ghost btn-sm" onClick={() => window.print()}>
                                <IconSVG.Printer /> Imprimir
                            </button>
                            <button className="btn btn-ghost btn-sm" onClick={() => {
                                const f = {
                                    principal: '1000000',
                                    interestType: 'on_principal',
                                    interestRate: '20',
                                    installmentsCount: '10',
                                    frequency: 'monthly',
                                    startDate: formatDateLocal(todayLocal()),
                                    dueDateType: 'fixed_day',
                                    moraType: 'percentage_daily',
                                    moraRate: '0.5'
                                };
                                setForm(f);
                            }}>
                                Limpiar
                            </button>
                        </div>
                    </>
                )}
            </div>
        );
    };

    // ============================================================
    // 32. APP PRINCIPAL
    // ============================================================

    const App = () => {
        const [appState, setAppState] = useState('loading');
        const [user, setUser] = useState(null);
        const [page, setPage] = useState('dashboard');
        const [params, setParams] = useState({});
        const [showFab, setShowFab] = useState(true);

        useEffect(() => {
            initDatabase()
                .then(() => SecurityUtils.validateSession())
                .then(u => {
                    if (u) {
                        setUser(u);
                        setAppState('main');
                    } else setAppState('login');
                })
                .catch(() => setAppState('login'));
        }, []);

        const handleLogin = useCallback((u) => {
            setUser(u);
            setAppState('main');
        }, []);

        const handleLogout = useCallback(async () => {
            await SecurityUtils.destroySession();
            setUser(null);
            setAppState('login');
        }, []);

        const navigate = useCallback((p, ...a) => {
            setPage(p);
            setParams(a);
            setShowFab(!['createLoan', 'editLoan', 'loanDetail', 'clientDetail', 'more', 'expenses', 'simulator'].includes(p));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        const handleFabAction = useCallback((action) => {
            if (action === 'client') navigate('clients');
            else if (action === 'loan') navigate('createLoan');
            else if (action === 'payment') navigate('collections');
            else if (action === 'expense') navigate('expenses');
            else if (action === 'simulator') navigate('simulator');
            else if (action === 'capital') navigate('finance');
        }, [navigate]);

        const renderPage = () => {
            switch (page) {
                case 'dashboard':
                    return <DashboardPage onNavigate={navigate} />;
                case 'clients':
                    return <ClientsPage onNavigate={navigate} />;
                case 'clientDetail':
                    return <ClientDetailPage id={params[0]} onNavigate={navigate} />;
                case 'loans':
                    return <LoansPage onNavigate={navigate} />;
                case 'createLoan':
                    return <CreateLoanPage preselectedClientId={params[0]} simulatorData={params[1]} onNavigate={navigate} />;
                case 'editLoan':
                    return <EditLoanPage id={params[0]} onNavigate={navigate} />;
                case 'loanDetail':
                    return <LoanDetailPage id={params[0]} onNavigate={navigate} />;
                case 'collections':
                    return <CollectionsPage onNavigate={navigate} />;
                case 'finance':
                    return <FinancePage onNavigate={navigate} />;
                case 'expenses':
                    return <ExpensesPage onNavigate={navigate} />;
                case 'simulator':
                    return <SimulatorPage onNavigate={navigate} />;
                case 'more':
                    return <MorePage onNavigate={navigate} />;
                default:
                    return <DashboardPage onNavigate={navigate} />;
            }
        };

        if (appState === 'loading') return <LoadingScreen />;
        if (appState === 'login') return <LoginScreen onLogin={handleLogin} />;

        return (
            <AppProvider user={user} onLogout={handleLogout}>
                <div style={{ minHeight: '100vh', minHeight: '100dvh', background: 'var(--bg-deep)' }}>
                    {renderPage()}
                    {showFab && <FAB onAction={handleFabAction} />}
                    <BottomNav page={page} onNavigate={navigate} />
                    <ToastContainer />
                </div>
            </AppProvider>
        );
    };

    // ============================================================
    // RENDERIZAR APLICACIÓN
    // ============================================================

    ReactDOM.render(<App />, document.getElementById('root'));

    console.log('========================================');
    console.log('LOANS W v9.2 — SISTEMA PROFESIONAL DE ABONOS Y PAGOS');
    console.log('CON DISTRIBUCIÓN CORREGIDA');
    console.log('========================================');
    console.log('✅ PaymentDistributionEngine - Distribución de pagos entre cuotas');
    console.log('✅ Valor recibido: usa remainingAmount en lugar de totalAmount');
    console.log('✅ 6 tipos de abono: Cuota, Capital, Intereses, Mora, Capital+Intereses, Personalizado');
    console.log('✅ MONEDA NORMALIZADA - Todos los valores se redondean a pesos');
    console.log('✅ Distribución por orden de vencimiento (cuota más antigua primero)');
    console.log('✅ Vista previa antes de guardar');
    console.log('✅ Recibo con impresión y compartir');
    console.log('✅ Historial completo de pagos');
    console.log('✅ Edición y eliminación de pagos');
    console.log('✅ Auditoría completa');
    console.log('✅ Persistencia en IndexedDB');
    console.log('========================================');
</script>
</body>
</html>
