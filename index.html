    const LostDebtsPage = ({ onNavigate }) => {
        const { lostDebts, recoveryMovements, lossCompensations, loans, clients, loading, refreshKey } = useApp();
        const [filter, setFilter] = useState('all');
        const [recoveryTarget, setRecoveryTarget] = useState(null);
        const [search, setSearch] = useState('');
        const [showHistory, setShowHistory] = useState(false);

        const enrichedDebts = useMemo(() => {
            const globalState = LossCompensationEngine.calculateState(lostDebts, recoveryMovements, lossCompensations);
            return globalState.perDebt.map(ld => {
                const loan = loans.find(l => l.id === ld.loanId);
                const client = clients.find(c => c.id === ld.clientId);
                const status = {
                    totalRecovered: ld.totalRecovered,
                    recoveredCapital: ld.directRecovery,
                    recoveredInterest: ld.interestRecovery,
                    pendingCapital: ld.pending,
                    isFullyRecovered: ld.isFullyRecovered,
                    recoveryPercentage: ld.percentage
                };
                return { ...ld, _loan: loan, _client: client, _status: status };
            });
        }, [lostDebts, loans, clients, recoveryMovements, lossCompensations, refreshKey]);

        const filtered = useMemo(() => {
            let result = [...enrichedDebts];
            
            if (filter === 'pending') result = result.filter(d => !d._status.isFullyRecovered);
            else if (filter === 'recovered') result = result.filter(d => d._status.isFullyRecovered);
            else if (filter === 'partial') result = result.filter(d => d._status.totalRecovered > 0 && !d._status.isFullyRecovered);
            
            if (search.trim()) {
                const term = search.toLowerCase().trim();
                result = result.filter(d => 
                    (d._client?.fullName || '').toLowerCase().includes(term) ||
                    (d._loan?.loanNumber || '').toLowerCase().includes(term)
                );
            }
            
            result.sort((a, b) => {
                if (a._status.isFullyRecovered && !b._status.isFullyRecovered) return 1;
                if (!a._status.isFullyRecovered && b._status.isFullyRecovered) return -1;
                return new Date(b.lostAt) - new Date(a.lostAt);
            });
            
            return result;
        }, [enrichedDebts, filter, search]);

        const totals = useMemo(() => {
            let totalLost = 0, totalDirect = 0, totalInterestComp = 0, totalPending = 0;
            for (const d of enrichedDebts) {
                totalLost += normalizeMoney(d.lostCapital || 0);
                totalDirect += normalizeMoney(d._status.recoveredCapital || 0);
                totalInterestComp += normalizeMoney(d._status.recoveredInterest || 0);
                totalPending += normalizeMoney(d._status.pendingCapital || 0);
            }
            return {
                totalLost: normalizeMoney(totalLost),
                totalDirect: normalizeMoney(totalDirect),
                totalInterestComp: normalizeMoney(totalInterestComp),
                totalRecovered: normalizeMoney(totalDirect + totalInterestComp),
                totalPending: normalizeMoney(totalPending)
            };
        }, [enrichedDebts, refreshKey]);

        const compensationHistory = useMemo(() => {
            if (!showHistory) return [];
            return [...lossCompensations].sort((a, b) =>
                new Date(b.appliedAt || b.createdAt) - new Date(a.appliedAt || a.createdAt)
            );
        }, [lossCompensations, showHistory]);

        if (loading) return <div style={{ padding: '20px' }}>{[1, 2, 3].map(i => <SkeletonCard key={i} />)}</div>;

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('finance')} className="back-btn">
                    <IconSVG.ArrowLeft /> Volver a Finanzas
                </button>

                <div style={{ marginBottom: '14px' }}>
                    <div style={{ fontSize: '26px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '8px' }}>

    const NetProfitDetailModal = ({ isOpen, onClose }) => {
        const { payments, expenses, lostDebts, recoveryMovements, lossCompensations, refreshKey } = useApp();
        const [period, setPeriod] = useState('month');
        const [customStart, setCustomStart] = useState(formatDateLocal(todayLocal()));
        const [customEnd, setCustomEnd] = useState(formatDateLocal(todayLocal()));

        const metrics = useMemo(() => {
            if (!isOpen) return null;
            
            const now = new Date();
            let startDate, endDate;
            
            switch (period) {
                case 'today':
                    startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0));
                    endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999));
                    break;
                case 'week':
                    const dayOfWeek = now.getUTCDay() || 7;
                    startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - dayOfWeek + 1, 0, 0, 0));
                    endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999));
                    break;
                case 'month':
                    startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0));
                    endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999));
                    break;
                case 'year':
                    startDate = new Date(Date.UTC(now.getUTCFullYear(), 0, 1, 0, 0, 0));
                    endDate = new Date(Date.UTC(now.getUTCFullYear(), 11, 31, 23, 59, 59, 999));
                    break;
                case 'custom':
                    startDate = parseLocalDate(customStart);
                    endDate = parseLocalDate(customEnd);
                    endDate.setUTCHours(23, 59, 59, 999);
                    break;
                default:
                    startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0));
                    endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999));
            }

            const periodPayments = payments.filter(p => {
                const d = new Date(p.paymentDate);
                return d >= startDate && d <= endDate;
            });

            let collectedInterest = 0, collectedMora = 0, collectedCapital = 0;
            for (const p of periodPayments) {
                const bd = p.breakdown || {};
                collectedCapital += normalizeMoney(bd.capital || 0);
                collectedInterest += normalizeMoney(bd.interest || 0);
                collectedMora += normalizeMoney(bd.mora || 0);
            }

            const periodExpenses = expenses.filter(e => {
                const d = new Date(e.date);
                return d >= startDate && d <= endDate;
            });
            const totalExpenses = normalizeMoney(periodExpenses.reduce((s, e) => s + (e.amount || 0), 0));

            const periodRecoveries = recoveryMovements.filter(r => {
                const d = new Date(r.recoveryDate);
                return d >= startDate && d <= endDate;
            });
            const totalRecoveries = normalizeMoney(periodRecoveries.reduce((s, r) => s + (r.amount || 0), 0));

            const periodCompensations = lossCompensations.filter(c => {
                const d = new Date(c.appliedAt || c.createdAt);
                return d >= startDate && d <= endDate;
            });
            const periodInterestComp = normalizeMoney(
                periodCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0)
            );

            const lossState = LossCompensationEngine.calculateState(
                lostDebts, recoveryMovements, lossCompensations
            );
            const totalPendingLoss = lossState.totalPending;

            const grossProfit = normalizeMoney(collectedInterest + collectedMora);
            const availableProfit = normalizeMoney(grossProfit - periodInterestComp - totalExpenses);

            return {
                grossProfit,
                collectedInterest: normalizeMoney(collectedInterest),
                collectedMora: normalizeMoney(collectedMora),
                collectedCapital: normalizeMoney(collectedCapital),
                totalExpenses,
                totalRecoveries,
                periodInterestComp,
                totalPendingLoss,
                totalLostCapital: lossState.totalLostCapital,
                totalRecoveredGlobal: lossState.totalRecovered,
                availableProfit,
                netProfit: availableProfit,
                compensationsCount: periodCompensations.length,
                expensesCount: periodExpenses.length,
                paymentsCount: periodPayments.length,
                recoveriesCount: periodRecoveries.length
            };
        }, [isOpen, period, customStart, customEnd, payments, expenses, lostDebts, recoveryMovements, lossCompensations, refreshKey]);

        if (!isOpen || !metrics) return null;

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <div style={{ color: 'var(--success)' }}><IconSVG.ChartBar /></div>
                            <div style={{ fontSize: '20px', fontWeight: '700' }}>
                                Detalle de Utilidad Neta
                            </div>
                        </div>
                        <button onClick={onClose} className="btn btn-ghost btn-sm">
                            <IconSVG.X />
                        </button>
                    </div>

                    <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto', flexWrap: 'wrap' }}>
                        {[
                            { id: 'today', label: 'Hoy' },
                            { id: 'week', label: 'Semana' },
                            { id: 'month', label: 'Mes' },
                            { id: 'year', label: 'Año' },
                            { id: 'custom', label: 'Personalizado' }
                        ].map(p => (
                            <button key={p.id} onClick={() => setPeriod(p.id)} className="btn btn-ghost btn-sm"
                                style={{
                                    background: period === p.id ? 'rgba(99,102,241,0.15)' : 'transparent',
                                    whiteSpace: 'nowrap'
                                }}>
                                {p.label}
                            </button>
                        ))}
                    </div>

                    {period === 'custom' && (
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                            <div>
                                <label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>Desde</label>
                                <input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)}
                                    className="glass-input" style={{ fontSize: '13px', padding: '8px 12px' }} />
                            </div>
                            <div>
                                <label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>Hasta</label>
                                <input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)}
                                    className="glass-input" style={{ fontSize: '13px', padding: '8px 12px' }} />
                            </div>
                        </div>
                    )}

                    <div style={{
                        background: 'var(--bg-primary)',
                        border: '1px solid var(--glass-border)',
                        borderRadius: 'var(--radius-lg)',
                        padding: '20px', marginBottom: '14px'
                    }}>
                        <div style={{ fontSize: '13px', fontWeight: '700', color: 'var(--accent-light)', marginBottom: '14px' }}>
                            Utilidad disponible del período
                        </div>

                        <div className="financial-detail-row">
                            <div>
                                <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Ganancias generadas</div>
                                <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>
                                    Intereses + mora cobrados ({metrics.paymentsCount} pagos)
                                </div>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--success)' }}>
                                    +{formatCurrency(metrics.grossProfit)}
                                </div>
                                <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>
                                    Int: {formatCurrency(metrics.collectedInterest)} · Mora: {formatCurrency(metrics.collectedMora)}
                                </div>
                            </div>
                        </div>

                        <div className="financial-detail-row">
                            <div>
                                <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>− Intereses aplicados a recuperar pérdidas</div>
                                <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>
                                    {metrics.compensationsCount} compensación(es) en el período
                                </div>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--accent-light)' }}>
                                    −{formatCurrency(metrics.periodInterestComp)}
                                </div>
                            </div>
                        </div>

                        <div className="financial-detail-row">
                            <div>
                                <div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>− Gastos</div>
                                <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>
                                    {metrics.expensesCount} gastos registrados
                                </div>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--danger)' }}>
                                    −{formatCurrency(metrics.totalExpenses)}
                                </div>
                            </div>
                        </div>

                        <div className="financial-detail-row total">
                            <div style={{ color: 'var(--text-secondary)' }}>= Utilidad disponible</div>
                            <div style={{
                                color: metrics.availableProfit >= 0 ? 'var(--success)' : 'var(--danger)',
                                fontSize: '20px'
                            }}>
                                {formatCurrency(metrics.availableProfit)}
                            </div>
                        </div>

                        <div style={{
                            marginTop: '12px', padding: '12px',
                            background: 'rgba(220,38,38,0.05)',
                            border: '1px solid rgba(220,38,38,0.15)',
                            borderRadius: 'var(--radius-sm)'
                        }}>
                            <div className="financial-detail-row" style={{ borderBottom: 'none', padding: '4px 0' }}>
                                <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Pérdida pendiente global</span>
                                <span style={{
                                    fontWeight: '700',
                                    color: metrics.totalPendingLoss > 0 ? 'var(--danger)' : 'var(--recovery)'
                                }}>
                                    {formatCurrency(metrics.totalPendingLoss)}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div style={{
                        padding: '12px 14px',
                        background: 'rgba(99,102,241,0.05)',
                        border: '1px solid rgba(99,102,241,0.15)',

    const LoginScreen = ({ onLogin }) => {
        const [doc, setDoc] = useState('');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState('');
        const [email, setEmail] = useState('');
        const [phone, setPhone] = useState('');
        const [confirmPassword, setConfirmPassword] = useState('');
        const [isRegistering, setIsRegistering] = useState(false);
        const [remember, setRemember] = useState(true);
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);
        const [showPassword, setShowPassword] = useState(false);

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError('');
            if (!doc.trim() || !password.trim()) { setError('Completa todos los campos requeridos.'); return; }
            const nd = doc.trim().replace(/\s+/g, '');
            if (isRegistering) {
                if (!fullName.trim()) { setError('El nombre completo es requerido.'); return; }
                if (password !== confirmPassword) { setError('Las contraseñas no coinciden.'); return; }
                if (password.length < 6) { setError('La contraseña debe tener al menos 6 caracteres.'); return; }
            }
            setLoading(true);
            try {
                await initDatabase();
                if (isRegistering) {
                    const ex = await db.users.where({ document: nd }).first();
                    if (ex) { setError('Esta cédula ya está registrada.'); setLoading(false); return; }
                    if (email.trim()) {
                        const ee = await db.users.where({ email: email.trim().toLowerCase() }).first();
                        if (ee) { setError('Este correo ya está registrado.'); setLoading(false); return; }
                    }
                    const ph = await SecurityUtils.hashPassword(password);
                    const uid = await db.users.add({
                        fullName: fullName.trim(), document: nd,
                        email: email.trim().toLowerCase(), phone: phone.trim(),
                        passwordHash: ph, createdAt: new Date().toISOString()
                    });
                    await verifyPersistence(db.users, uid);
                    await SecurityUtils.createSession(uid, remember);
                    onLogin({ id: uid, document: nd, fullName: fullName.trim(), email: email.trim().toLowerCase() });
                } else {
                    const u = await db.users.where({ document: nd }).first();
                    if (!u) { setError('No existe una cuenta con esta cédula.'); setLoading(false); return; }
                    const v = await SecurityUtils.verifyPassword(password, u.passwordHash);
                    if (!v) { setError('Contraseña incorrecta.'); setLoading(false); return; }
                    await SecurityUtils.createSession(u.id, remember);
                    onLogin(u);
                }
            } catch (err) {
                console.error('[AUTH ERROR]', err);
                setError(err.message || 'Error inesperado.');
            }
            setLoading(false);
        };

        return (
            <div style={{
                minHeight: '100vh',
                background: 'linear-gradient(160deg, #060610 0%, #0f0f24 40%, #060610 100%)',
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center', padding: '24px'
            }}>
                <div style={{ marginBottom: '36px', textAlign: 'center' }}>
                    <div style={{
                        width: '60px', height: '60px', borderRadius: '16px',
                        background: 'linear-gradient(135deg, #6366f1, #4f46e5)',
                        display: 'flex', alignItems: 'center', justifyContent: 'center',
                        margin: '0 auto 16px', animation: 'pulse-glow 2s ease-in-out infinite'
                    }}>
                        <IconSVG.TrendingUp />
                    </div>
                    <div style={{ fontSize: '32px', fontWeight: '800', letterSpacing: '-1.5px' }}>
                        LOANS W
                    </div>
                    <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '4px' }}>
                        Sistema financiero completo
                    </div>
                </div>
                <form onSubmit={handleSubmit} style={{ width: '100%', maxWidth: '400px' }}>
                    <div className="glass-card disabled" style={{ padding: '24px' }}>
                        <div style={{ fontSize: '20px', fontWeight: '700', marginBottom: '20px', textAlign: 'center' }}>
                            {isRegistering ? 'Crear cuenta' : 'Iniciar sesión'}
                        </div>
                        {error && <div style={{
                            padding: '11px 14px',
                            background: 'rgba(239,68,68,0.08)',
                            border: '1px solid rgba(239,68,68,0.2)',
                            borderRadius: '10px',
                            color: 'var(--danger-light)',
                            fontSize: '12px', marginBottom: '16px', lineHeight: '1.4'
                        }}>{error}</div>}
                        {isRegistering && <div style={{ marginBottom: '12px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Nombre completo *</label>
                            <input type="text" value={fullName} onChange={e => setFullName(e.target.value)}
                                className="glass-input" placeholder="Tu nombre completo" />
                        </div>}
                        <div style={{ marginBottom: '12px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Número de cédula *</label>
                            <input type="text" value={doc} onChange={e => setDoc(e.target.value)}
                                className="glass-input" placeholder="Ingresa tu cédula" autoComplete="username" />
                        </div>
                        {isRegistering && <>
                            <div style={{ marginBottom: '12px' }}>
                                <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Correo electrónico</label>
                                <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                                    className="glass-input" placeholder="tu@correo.com" autoComplete="email" />
                            </div>
                            <div style={{ marginBottom: '12px' }}>
                                <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Teléfono</label>
                                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)}
                                    className="glass-input" placeholder="3001234567" autoComplete="tel" />
                            </div>
                        </>}
                        <div style={{ marginBottom: '12px', position: 'relative' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Contraseña *</label>
                            <input type={showPassword ? 'text' : 'password'} value={password}
                                onChange={e => setPassword(e.target.value)} className="glass-input"
                                style={{ paddingRight: '42px' }} placeholder="••••••••"
                                autoComplete={isRegistering ? 'new-password' : 'current-password'} />
                            <button type="button" onClick={() => setShowPassword(!showPassword)}
                                style={{
                                    position: 'absolute', right: '12px', top: '32px',
                                    background: 'none', border: 'none',
                                    color: 'var(--text-muted)', cursor: 'pointer', padding: '4px'
                                }}>
                                {showPassword ? <IconSVG.EyeOff /> : <IconSVG.Eye />}
                            </button>
                        </div>
                        {isRegistering && <div style={{ marginBottom: '16px' }}>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Confirmar contraseña *</label>
                            <input type="password" value={confirmPassword}
                                onChange={e => setConfirmPassword(e.target.value)}
                                className="glass-input" placeholder="••••••••" autoComplete="new-password" />
                        </div>}
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '18px' }}>
                            <input type="checkbox" checked={remember}
                                onChange={e => setRemember(e.target.checked)} id="remember"
                                style={{ accentColor: 'var(--accent)', width: '15px', height: '15px' }} />
                            <label htmlFor="remember" style={{ fontSize: '12px', color: 'var(--text-secondary)', cursor: 'pointer' }}>
                                Recordarme en este dispositivo
                            </label>
                        </div>
                        <button type="submit" className="btn btn-primary"
                            style={{ width: '100%', marginBottom: '12px' }} disabled={loading}>
                            {loading ? <span className="spinner" style={{ width: '18px', height: '18px' }}></span> :
                                isRegistering ? 'Crear cuenta' : 'Ingresar'}
                        </button>
                        <button type="button"
                            onClick={() => { setIsRegistering(!isRegistering); setError(''); }}
                            className="btn btn-ghost" style={{ width: '100%', fontSize: '13px' }}>
                            {isRegistering ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate'}
                        </button>
                    </div>
                </form>
            </div>
        );
    };

    // ============================================================
    // 19. COMPONENT: DASHBOARD PAGE
    // ============================================================

    const DashboardPage = ({ onNavigate }) => {
        const { 
            loans, installments, payments, expenses, capitalMovements, 
            clients, lostDebts, recoveryMovements, lossCompensations, loading, refreshKey 
        } = useApp();
        const now = new Date();
        const currentYear = now.getUTCFullYear();
        const currentMonth = now.getUTCMonth() + 1;

        const safeLoans = useMemo(() => Array.isArray(loans) ? loans.filter(l => l && typeof l === 'object') : [], [loans]);
        const safeInstallments = useMemo(() => Array.isArray(installments) ? installments.filter(i => i && typeof i === 'object') : [], [installments]);
        const safePayments = useMemo(() => Array.isArray(payments) ? payments.filter(p => p && typeof p === 'object') : [], [payments]);
        const safeExpenses = useMemo(() => Array.isArray(expenses) ? expenses.filter(e => e && typeof e === 'object') : [], [expenses]);
        const safeCapitalMovements = useMemo(() => Array.isArray(capitalMovements) ? capitalMovements.filter(m => m && typeof m === 'object') : [], [capitalMovements]);
        const safeLostDebts = useMemo(() => Array.isArray(lostDebts) ? lostDebts.filter(d => d && typeof d === 'object') : [], [lostDebts]);

        const currentPeriodSummary = useMemo(() => {
            return CollectionHistoryEngine.getPeriodSummary(
                safePayments, safeInstallments, safeLoans, clients || [], currentYear, currentMonth
            );
        }, [safePayments, safeInstallments, safeLoans, clients, currentYear, currentMonth, refreshKey]);

        const metrics = useMemo(() => {
            const activeLoans = safeLoans.filter(l => l.status === 'active' || l.status === 'overdue');

            const allCapitalIn = normalizeMoney(safeCapitalMovements.filter(m => {
                if (m.type !== 'initial' && m.type !== 'income') return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const allCapitalOut = normalizeMoney(safeCapitalMovements.filter(m => {
                if (m.type !== 'loan' && m.type !== 'expense' && m.type !== 'withdrawal') return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const allPaymentsIn = normalizeMoney(safeCapitalMovements.filter(m => {
                if (m.type !== 'payment' && m.type !== 'recovery') return false;
                return true;
            }).reduce((s, m) => s + (m.amount || 0), 0));

            const totalCapital = normalizeMoney(allCapitalIn - allCapitalOut + allPaymentsIn);
            const totalLent = normalizeMoney(activeLoans.reduce((s, l) => s + (Number(l?.principal) || 0), 0));
            const availableCapital = normalizeMoney(totalCapital - totalLent);

            let porRecuperar = 0;
            for (const loan of activeLoans) {
                const loanInsts = safeInstallments.filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled');
                for (const inst of loanInsts) {
                    porRecuperar += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst));
                }
            }
            porRecuperar = normalizeMoney(porRecuperar);

            const monthPayments = safePayments.filter(p => {
                if (!p.paymentDate) return false;
                const d = new Date(p.paymentDate);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            let collectedInterest = 0, collectedMora = 0, collectedAmount = 0;
            for (const p of monthPayments) {
                const bd = p.breakdown || {};
                collectedInterest += normalizeMoney(bd.interest || 0);
                collectedMora += normalizeMoney(bd.mora || 0);
                collectedAmount += normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0));
            }
            const grossProfit = normalizeMoney(collectedInterest + collectedMora);

            const monthExpenses = safeExpenses.filter(e => {
                if (!e.date) return false;
                const d = new Date(e.date);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            const totalExpenses = normalizeMoney(monthExpenses.reduce((s, e) => s + (e.amount || 0), 0));

            const lossState = LossCompensationEngine.calculateState(
                safeLostDebts, recoveryMovements || [], lossCompensations || []
            );
            const totalLostCapital = lossState.totalLostCapital;
            const totalRecoveredCapital = lossState.totalRecovered;
            const totalPendingLost = lossState.totalPending;

            const monthCompensations = (lossCompensations || []).filter(c => {
                const d = new Date(c.appliedAt || c.createdAt);
                return d.getUTCMonth() === currentMonth - 1 && d.getUTCFullYear() === currentYear;
            });
            const monthInterestComp = normalizeMoney(
                monthCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0)
            );

            const availableProfit = normalizeMoney(grossProfit - monthInterestComp - totalExpenses);
            const netProfit = normalizeMoney(availableProfit);

            return {
                totalCapital, availableCapital, porRecuperar, collectedAmount, grossProfit,
                totalExpenses,
                monthInterestComp,
                availableProfit,
                netProfit,
                totalLostCapital, totalRecoveredCapital, totalPendingLost,
                lostDebtsCount: safeLostDebts.length
            };
        }, [safeLoans, safeInstallments, safePayments, safeCapitalMovements, safeExpenses, safeLostDebts, recoveryMovements, lossCompensations, currentYear, currentMonth, refreshKey]);

        const today = todayLocal();
        const dueToday = useMemo(() => safeInstallments.filter(i => {
            if (i.status === 'paid' || i.status === 'cancelled') return false;
            const due = parseLocalDate(i.dueDate);
            return getCalendarDaysDiff(today, due) === 0;
        }), [safeInstallments, refreshKey]);

        const overdueList = useMemo(() => safeInstallments.filter(i => i.status === 'overdue')
            .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate)), [safeInstallments, refreshKey]);

        const totalMora = useMemo(() => safeInstallments
            .filter(i => i.status === 'overdue' || i.status === 'partial')
            .reduce((s, i) => s + MoraEngine.calculateMoraRemaining(i), 0), [safeInstallments, refreshKey]);

        const recentPayments = useMemo(() => safePayments
            .sort((a, b) => new Date(b.paymentDate || b.createdAt) - new Date(a.paymentDate || a.createdAt))
            .slice(0, 5), [safePayments, refreshKey]);

        const alerts = useMemo(() => {
            const a = [];
            if (overdueList.length > 0) a.push({ type: 'danger', msg: `${overdueList.length} cuotas vencidas`, icon: <IconSVG.Clock /> });
            if (totalMora > 0) a.push({ type: 'danger', msg: `Mora acumulada: ${formatCurrency(totalMora)}`, icon: <IconSVG.AlertTriangle /> });
            if (dueToday.length > 0) a.push({ type: 'warning', msg: `${dueToday.length} cuotas vencen hoy`, icon: <IconSVG.Calendar /> });
            if (metrics.totalPendingLost > 0) a.push({ 
                type: 'warning', 
                msg: `Pérdidas por recuperar: ${formatCurrency(metrics.totalPendingLost)}`, 
                icon: <IconSVG.Lost /> 
            });
            return a;
        }, [overdueList, totalMora, dueToday, metrics.totalPendingLost]);

        const greeting = () => {
            const h = new Date().getHours();
            return h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches';
        };

        if (loading) return <div style={{ padding: '20px' }}>{[1, 2, 3, 4].map(i => <SkeletonCard key={i} />)}</div>;

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ marginBottom: '18px' }}>
                    <div style={{ fontSize: '26px', fontWeight: '700' }}>{greeting()}</div>
                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginTop: '2px' }}>
                        Panel de control financiero
                    </div>
                </div>

                <div style={{ marginBottom: '14px' }}>
                    <div style={{
                        fontSize: '11px', fontWeight: '600',
                        color: 'var(--text-secondary)',
                        textTransform: 'uppercase',
                        letterSpacing: '0.05em', marginBottom: '10px'
                    }}>
                        Resumen financiero
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                        <div className="glass-card" style={{ padding: '14px' }} onClick={() => onNavigate('finance')}>
                            <div className="flex-center gap-1 mb-1">
                                <IconSVG.Wallet />
                                <span style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Capital total</span>
                            </div>
                            <AnimatedNumber value={metrics.totalCapital}
                                style={{ fontSize: '19px', fontWeight: '700', color: 'var(--accent-light)', display: 'block' }} />
                        </div>
                        <div className="glass-card" style={{ padding: '14px' }}>
                            <div className="flex-center gap-1 mb-1">
                                <IconSVG.Shield />
                                <span style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Disponible</span>
                            </div>
                            <AnimatedNumber value={metrics.availableCapital}
                                style={{
                                    fontSize: '19px', fontWeight: '700',
                                    color: metrics.availableCapital >= 0 ? 'var(--success)' : 'var(--danger)',
                                    display: 'block'
                                }} />
                        </div>
                        <div className="glass-card" style={{ padding: '14px' }} onClick={() => onNavigate('collections')}>
                            <div className="flex-center gap-1 mb-1">
                                <IconSVG.Receipt />
                                <span style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Por recuperar</span>
                            </div>
                            <AnimatedNumber value={metrics.porRecuperar}
                                style={{ fontSize: '19px', fontWeight: '700', color: 'var(--warning)', display: 'block' }} />
                        </div>
                        <div className="glass-card" style={{ padding: '14px' }} onClick={() => onNavigate('finance')}>
                            <div className="flex-center gap-1 mb-1">
                                <IconSVG.TrendingUp />
                                <span style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Utilidad neta</span>
                            </div>
                            <AnimatedNumber value={metrics.netProfit}
                                style={{
                                    fontSize: '19px', fontWeight: '700',
                                    color: metrics.netProfit >= 0 ? 'var(--success)' : 'var(--danger)',
                                    display: 'block'
                                }} />
                        </div>
                    </div>
                    {metrics.monthInterestComp > 0 && (
                        <div style={{
                            marginTop: '8px', padding: '10px 12px',
                            background: 'rgba(99,102,241,0.06)',
                            border: '1px solid rgba(99,102,241,0.15)',
                            borderRadius: 'var(--radius-sm)',
                            fontSize: '11px', color: 'var(--text-secondary)',
                            display: 'flex', justifyContent: 'space-between', alignItems: 'center'
                        }}>
                            <span>Intereses aplicados a pérdidas este mes</span>
                            <span style={{ fontWeight: '700', color: 'var(--accent-light)' }}>
                                {formatCurrency(metrics.monthInterestComp)}
                            </span>
                        </div>
                    )}
                </div>

                <div className="glass-card" style={{ padding: '16px', marginBottom: '14px' }} onClick={() => onNavigate('collections')}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                        <span style={{
                            fontSize: '11px', color: 'var(--text-secondary)',
                            textTransform: 'uppercase', fontWeight: '600',
                            letterSpacing: '0.04em'
                        }}>
                            Progreso de cobros - {getMonthName(currentMonth)} {currentYear}
                        </span>
                        <span className="badge badge-info">
                            {currentPeriodSummary.compliance.toFixed(0)}%
                        </span>
                    </div>
                    <div style={{ fontSize: '22px', fontWeight: '700', marginBottom: '4px' }}>
                        <AnimatedNumber value={currentPeriodSummary.collectedAmount} />
                        <span style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: '400' }}>
                            {' '}de {formatCurrency(currentPeriodSummary.expectedAmount)}
                        </span>
                    </div>
                    <div className="progress-bar" style={{ height: '9px', marginBottom: '8px' }}>
                        <div
                            className="progress-fill"
                            style={{ width: `${Math.min(100, currentPeriodSummary.compliance)}%` }}
                        />
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: 'var(--text-muted)' }}>
                        <span>Cobrado: <span style={{ color: 'var(--success)', fontWeight: '600' }}>
                            {formatCurrency(currentPeriodSummary.collectedAmount)}
                        </span></span>
                        <span>Pendiente: <span style={{ color: 'var(--warning)', fontWeight: '600' }}>
                            {formatCurrency(currentPeriodSummary.pendingAmount)}
                        </span></span>
                        <span>Pagos: <span style={{ fontWeight: '600' }}>{currentPeriodSummary.paymentsCount}</span></span>
                    </div>
                    {currentPeriodSummary.collectedAmount > currentPeriodSummary.expectedAmount && currentPeriodSummary.expectedAmount > 0 && (
                        <div style={{
                            marginTop: '8px', padding: '6px 12px',
                            background: 'rgba(16,185,129,0.08)',
                            borderRadius: 'var(--radius-sm)',
                            color: 'var(--success-light)',
                            fontSize: '11px', fontWeight: '500', textAlign: 'center'
                        }}>
                            Meta superada en {formatCurrency(currentPeriodSummary.collectedAmount - currentPeriodSummary.expectedAmount)}
                        </div>
                    )}
                </div>

                {metrics.lostDebtsCount > 0 && (
                    <div className="glass-card" style={{ padding: '14px', marginBottom: '14px' }}
                        onClick={() => onNavigate('lostDebts')}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <span style={{ color: 'var(--danger)' }}><IconSVG.Lost /></span>
                                <span style={{ fontSize: '13px', fontWeight: '600' }}>Pérdidas y recuperaciones</span>
                            </div>
                            <IconSVG.ArrowLeft />
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px', textAlign: 'center' }}>
                            <div>
                                <div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>Perdido</div>
                                <div style={{ fontSize: '13px', fontWeight: '700', color: 'var(--danger-light)' }}>
                                    {formatCurrency(metrics.totalLostCapital)}
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>Recuperado</div>
                                <div style={{ fontSize: '13px', fontWeight: '700', color: 'var(--recovery)' }}>
                                    {formatCurrency(metrics.totalRecoveredCapital)}
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>Pendiente</div>
                                <div style={{ fontSize: '13px', fontWeight: '700', color: 'var(--warning)' }}>
                                    {formatCurrency(metrics.totalPendingLost)}
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {alerts.length > 0 && (
                    <div style={{ marginBottom: '14px' }}>
                        <div className="flex-center gap-1 mb-2">
                            <IconSVG.Bell />
                            <span style={{
                                fontSize: '11px', fontWeight: '600',
                                color: 'var(--text-secondary)',
                                textTransform: 'uppercase', letterSpacing: '0.04em'
                            }}>
                                Atención
                            </span>
                        </div>
                        {alerts.map((a, i) => (
                            <div key={i} className="glass-card" style={{
                                padding: '10px', marginBottom: '6px',
                                display: 'flex', alignItems: 'center', gap: '8px',
                                borderColor: a.type === 'danger' ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.2)'
                            }}>
                                <span style={{ color: a.type === 'danger' ? 'var(--danger)' : 'var(--warning)' }}>{a.icon}</span>
                                <span style={{ fontSize: '12px', color: a.type === 'danger' ? 'var(--danger-light)' : 'var(--warning-light)' }}>
                                    {a.msg}
                                </span>
                            </div>
                        ))}
                    </div>
                )}

                {recentPayments.length > 0 && (
                    <div style={{ marginBottom: '14px' }}>
                        <div className="flex-center gap-1 mb-2">
                            <IconSVG.History />
                            <span style={{
                                fontSize: '11px', fontWeight: '600',
                                color: 'var(--text-secondary)',
                                textTransform: 'uppercase', letterSpacing: '0.04em'
                            }}>
                                Pagos recientes
                            </span>
                        </div>
                        {recentPayments.map(p => {
                            const loan = safeLoans.find(l => l.id === p.loanId);
                            const client = (clients || []).find(c => c.id === p.clientId);
                            return (
                                <div key={p.id} className="glass-card" style={{ padding: '10px', marginBottom: '4px' }}
                                    onClick={() => loan && onNavigate('loanDetail', loan.id)}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div>
                                            <div style={{ fontSize: '13px', fontWeight: '500' }}>{client?.fullName || 'Cliente'}</div>
                                            <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                                {formatDate(p.paymentDate || p.createdAt)}
                                            </div>
                                        </div>
                                        <span style={{ fontSize: '14px', fontWeight: '700', color: 'var(--success)' }}>
                                            {formatCurrency(p.amount)}
                                        </span>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                )}

                {safeInstallments.length > 0 && (
                    <div style={{ marginBottom: '14px' }}>
                        <div className="flex-center gap-1 mb-2" style={{ justifyContent: 'space-between' }}>
                            <span style={{
                                fontSize: '11px', fontWeight: '600',
                                color: 'var(--text-secondary)',
                                textTransform: 'uppercase', letterSpacing: '0.04em'
                            }}>
                                Próximos cobros
                            </span>
                        </div>
                        {safeInstallments
                            .filter(i => {
                                if (i.status === 'paid' || i.status === 'cancelled') return false;
                                const due = parseLocalDate(i.dueDate);
                                const nw = new Date(today);
                                nw.setUTCDate(nw.getUTCDate() + 7);
                                return due >= today && due <= nw;
                            })
                            .sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))
                            .slice(0, 5)
                            .map(inst => {
                                const loan = safeLoans.find(l => l.id === inst.loanId);
                                const client = (clients || []).find(c => c.id === loan?.clientId);
                                const totalWithMora = normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst));

                                    <div key={inst.id} className="glass-card" onClick={() => loan && onNavigate('loanDetail', loan.id)}

                                        </div>
                                        <span style={{ fontSize: '14px', fontWeight: '700', color: 'var(--accent-light)' }}>

                )}

    // ============================================================

    const ClientsPage = ({ onNavigate }) => {
        const { clients, loans, refreshAllData, addToast, user, loading } = useApp();
        const [search, setSearch] = useState('');
        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);

        const safeClients = useMemo(() => 
            Array.isArray(clients) ? clients.filter(c => c && typeof c === 'object') : []
        , [clients]);

        const filtered = safeClients.filter(c =>
            (getSafeString(c.fullName)).toLowerCase().includes(search.toLowerCase()) ||
            (getSafeString(c.document)).includes(search)
        );

        const handleSave = async (data) => {
            if (!data.fullName?.trim()) { addToast('El nombre es requerido', 'error'); return; }
            try {
                await initDatabase();
                const docData = { ...data, userId: user.id, updatedAt: new Date().toISOString() };
                let savedId;
                if (editing) {
                    await db.clients.update(editing.id, docData);
                    savedId = editing.id;
                } else {
                    docData.createdAt = new Date().toISOString();
                    savedId = await db.clients.add(docData);
                }
                await verifyPersistence(db.clients, savedId);
                await refreshAllData();
                addToast(editing ? 'Cliente actualizado' : 'Cliente creado', 'success');
                setShowForm(false);
                setEditing(null);
            } catch (err) {
                addToast(err.message || 'No se pudo guardar el cliente.', 'error');
            }
        };

        if (loading) return <div style={{ padding: '20px' }}>{[1, 2, 3].map(i => <SkeletonCard key={i} />)}</div>;

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                    <div style={{ fontSize: '26px', fontWeight: '700' }}>Clientes</div>

                        onChange={e => setSearch(e.target.value)} className="glass-input"
                        style={{ paddingLeft: '38px' }} />
                </div>

                {filtered.length === 0 ? (
                    <EmptyState icon={<IconSVG.Users />} title="No hay clientes"
                        description="Comienza agregando tu primer cliente"
                        action={<button className="btn btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}>
                            + Agregar cliente
                        </button>} />
                ) : (
                    filtered.map(c => {
                        const cl = (loans || []).filter(l => l.clientId === c.id);
                        const ac = cl.filter(l => l.status === 'active' || l.status === 'overdue').length;
                        const lostCount = cl.filter(l => l.status === 'lost').length;
                        return (
                            <div key={c.id} className="glass-card" onClick={() => onNavigate('clientDetail', c.id)}
                                style={{ padding: '14px', marginBottom: '8px', display: 'flex', alignItems: 'center', gap: '12px' }}>
                                <div style={{
                                    width: '42px', height: '42px', borderRadius: '50%',
                                    background: 'linear-gradient(135deg, #6366f1, #4f46e5)',
                                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                                    fontSize: '18px', fontWeight: '700', color: 'white', flexShrink: 0
                                }}>
                                    {getSafeInitial(c.fullName)}
                                </div>
                                <div style={{ flex: 1, minWidth: 0 }}>
                                    <div className="truncate" style={{ fontWeight: '600', fontSize: '14px' }}>
                                        {getSafeString(c.fullName, 'Sin nombre')}
                                    </div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                        {getSafeString(c.document, 'No registrado')}
                                    </div>
                                </div>
                                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                                    <div style={{ fontSize: '12px', fontWeight: '600', color: ac > 0 ? 'var(--success)' : 'var(--text-muted)' }}>
                                        {ac} activos
                                    </div>
                                    {lostCount > 0 && (
                                        <div style={{ fontSize: '10px', color: 'var(--danger)' }}>
                                            {lostCount} perdidos
                                        </div>
                                    )}
                                </div>
                            </div>
                        );
                    })
                )}

                {showForm && (
                    <div className="modal-overlay" onClick={() => setShowForm(false)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
                                <div style={{ fontSize: '20px', fontWeight: '700' }}>
                                    {editing ? 'Editar cliente' : 'Nuevo cliente'}
                                </div>
                                <button onClick={() => setShowForm(false)} className="btn btn-ghost btn-sm">
                                    <IconSVG.X />
                                </button>
                            </div>
                            <ClientForm initial={editing} onSave={handleSave} />
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ============================================================

    const ClientDetailPage = ({ id, onNavigate }) => {
        const { clients, loans, refreshAllData, addToast } = useApp();
        const [showEdit, setShowEdit] = useState(false);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

        const client = (clients || []).find(c => c && c.id === parseInt(id));
        
        if (!client) {
            return (
                <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>
                    <div style={{ fontSize: '48px', marginBottom: '14px', opacity: 0.25 }}>
                        <IconSVG.Users />
                    </div>
                    <div style={{ fontSize: '17px', fontWeight: '600', marginBottom: '6px' }}>
                        Cliente no encontrado
                    </div>
                    <button className="btn btn-ghost" style={{ marginTop: '16px' }}
                        onClick={() => onNavigate('clients')}>
                        <IconSVG.ArrowLeft /> Volver a clientes
                    </button>
                </div>
            );
        }

        const safeClient = {
            id: client.id,
            fullName: getSafeString(client.fullName, 'Sin nombre'),
            document: getSafeString(client.document, 'No registrado'),
            phone: getSafeString(client.phone, 'No registrado'),
            email: getSafeString(client.email),
            address: getSafeString(client.address),
            city: getSafeString(client.city),
            neighborhood: getSafeString(client.neighborhood),
            company: getSafeString(client.company),
            occupation: getSafeString(client.occupation),
            references: getSafeString(client.references),
            notes: getSafeString(client.notes)
        };

        const cl = Array.isArray(loans) ? loans.filter(l => l && l.clientId === safeClient.id) : [];
        
        const tl = normalizeMoney(cl.reduce((s, l) => s + (Number(l?.principal) || 0), 0));
        const tp = normalizeMoney(cl
            .filter(l => l && (l.status === 'active' || l.status === 'overdue'))
            .reduce((s, l) => s + (Number(l?.currentBalance) || 0), 0));
        const ac = cl.filter(l => l && (l.status === 'active' || l.status === 'overdue'));

        const handleUpdate = async (data) => {
            try {
                await initDatabase();
                await db.clients.update(parseInt(id), { ...data, updatedAt: new Date().toISOString() });
                await verifyPersistence(db.clients, parseInt(id));
                await refreshAllData();
                addToast('Cliente actualizado', 'success');
                setShowEdit(false);
            } catch (err) {
                addToast('Error al actualizar.', 'error');
            }
        };

        const handleDelete = async () => {
            try {
                if (cl.length > 0) { 
                    addToast('No se puede eliminar: tiene préstamos asociados.', 'error'); 
                    return; 
                }
                await initDatabase();
                await db.clients.delete(parseInt(id));
                await refreshAllData();
                addToast('Cliente eliminado', 'success');
                onNavigate('clients');
            } catch {
                addToast('Error al eliminar.', 'error');
            }
            setShowDeleteConfirm(false);
        };

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('clients')} className="back-btn">
                    <IconSVG.ArrowLeft /> Volver
                </button>

                <div className="glass-card disabled" style={{ padding: '20px', marginBottom: '14px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                        <div className="flex-center gap-3">
                            <div style={{
                                width: '56px', height: '56px', borderRadius: '50%',
                                background: 'linear-gradient(135deg, #6366f1, #4f46e5)',
                                display: 'flex', alignItems: 'center', justifyContent: 'center',
                                fontSize: '24px', fontWeight: '700', color: 'white', flexShrink: 0
                            }}>
                                {getSafeInitial(safeClient.fullName)}
                            </div>
                            <div>
                                <div style={{ fontSize: '20px', fontWeight: '700' }}>{safeClient.fullName}</div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                                    {safeClient.document} · {safeClient.phone}
                                </div>
                                {safeClient.email && (
                                    <div style={{ fontSize: '11px', color: 'var(--accent-light)' }}>
                                        {safeClient.email}
                                    </div>
                                )}
                            </div>
                        </div>
                        <div style={{ display: 'flex', gap: '6px' }}>
                            <button className="btn btn-ghost btn-sm" onClick={() => setShowEdit(true)}>
                                <IconSVG.Edit3 />
                            </button>
                            <button className="btn btn-ghost btn-sm" style={{ color: 'var(--danger)' }} 
                                onClick={() => setShowDeleteConfirm(true)}>
                                <IconSVG.Trash2 />
                            </button>
                        </div>
                    </div>

                    {(safeClient.address || safeClient.city || safeClient.neighborhood || 
                      safeClient.company || safeClient.references || safeClient.notes) && (
                        <div style={{
                            marginTop: '14px', padding: '12px',
                            background: 'rgba(255,255,255,0.02)',
                            borderRadius: '10px',
                            fontSize: '12px', color: 'var(--text-secondary)'
                        }}>
                            {safeClient.address && (
                                <div>
                                    <IconSVG.MapPin /> {safeClient.address}
                                    {safeClient.neighborhood ? `, ${safeClient.neighborhood}` : ''}
                                    {safeClient.city ? `, ${safeClient.city}` : ''}
                                </div>
                            )}
                            {safeClient.company && (
                                <div style={{ marginTop: '4px' }}>
                                    <IconSVG.Building /> {safeClient.company}
                                    {safeClient.occupation ? ` — ${safeClient.occupation}` : ''}
                                </div>
                            )}
                            {safeClient.references && (
                                <div style={{ marginTop: '4px' }}>Ref: {safeClient.references}</div>
                            )}
                            {safeClient.notes && (
                                <div style={{ marginTop: '4px', fontStyle: 'italic' }}>{safeClient.notes}</div>
                            )}
                        </div>
                    )}
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                    <div className="glass-card disabled" style={{ padding: '12px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total prestado</div>
                        <AnimatedNumber value={tl} style={{ fontSize: '17px', fontWeight: '700', display: 'block' }} />
                    </div>
                    <div className="glass-card disabled" style={{ padding: '12px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Pendiente</div>
                        <AnimatedNumber value={tp} style={{ fontSize: '17px', fontWeight: '700', color: 'var(--warning)', display: 'block' }} />
                    </div>
                    <div className="glass-card disabled" style={{ padding: '12px', textAlign: 'center' }}>
                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Préstamos activos</div>
                        <div style={{ fontSize: '17px', fontWeight: '700' }}>{ac.length}</div>

                    <div className="glass-card disabled" style={{ padding: '12px', textAlign: 'center' }}>

                        <div style={{ fontSize: '17px', fontWeight: '700' }}>{cl.length}</div>

                    <button className="btn btn-primary btn-sm" 
                        onClick={() => onNavigate('createLoan', safeClient.id)}>
                        <IconSVG.Plus /> Nuevo
                    </button>
                </div>

                {cl.length === 0 ? (
                    <EmptyState icon={<IconSVG.Briefcase />} title="Sin préstamos"
                        action={<button className="btn btn-primary btn-sm" 
                            onClick={() => onNavigate('createLoan', safeClient.id)}>
                            + Nuevo préstamo
                        </button>} />
                ) : (
                    cl.map(loan => {
                        const loanTotal = Number(loan.totalRepayment) || 0;
                        const loanPaid = Number(loan.totalPaid) || 0;
                        const prog = loanTotal > 0 ? normalizeMoney((loanPaid / loanTotal) * 100) : 0;
                        const isLost = loan.status === 'lost';
                        return (
                            <div key={loan.id} className="glass-card"

                                style={{

    // ============================================================

    const LoanDetailPage = ({ id, onNavigate }) => {
        const { loans, clients, installments, payments, lostDebts, recoveryMovements, lossCompensations, refreshAllData, addToast, user } = useApp();
        const loan = (loans || []).find(l => l && l.id === parseInt(id));

        const [showEditAbonarModal, setShowEditAbonarModal] = useState(false);
        const [showLostDebtModal, setShowLostDebtModal] = useState(false);
        const [showRecoveryModal, setShowRecoveryModal] = useState(false);
        const [selectedInstallment, setSelectedInstallment] = useState(null);
        const [editingPayment, setEditingPayment] = useState(null);
        const [deletingPayment, setDeletingPayment] = useState(null);
        const [viewingReceipt, setViewingReceipt] = useState(null);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
        const [deleting, setDeleting] = useState(false);

        if (!loan) return <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>Préstamo no encontrado</div>;

        const client = (clients || []).find(c => c.id === loan.clientId);
        const insts = (installments || []).filter(i => i.loanId === loan.id).sort((a, b) => a.number - b.number);
        const loanPayments = (payments || []).filter(p => p.loanId === loan.id);
        const prog = loan.totalRepayment > 0 ? normalizeMoney((loan.totalPaid || 0) / loan.totalRepayment * 100) : 0;
        const totalMoraLoan = normalizeMoney(insts.reduce((s, i) => s + MoraEngine.calculateMoraRemaining(i), 0));
        const isLost = loan.status === 'lost';

        const lostDebt = (lostDebts || []).find(d => d.loanId === loan.id);

        const lostDebtStatus = useMemo(() => {
            if (!lostDebt) return null;
            const state = LossCompensationEngine.calculateState(
                [lostDebt], recoveryMovements || [], lossCompensations || []
            );
            const pd = state.perDebt[0];
            if (!pd) return LostDebtEngine.calculateLostDebtStatus(lostDebt, recoveryMovements);
            return {
                totalRecovered: pd.totalRecovered,
                recoveredCapital: pd.directRecovery,
                recoveredInterest: pd.interestRecovery,
                pendingCapital: pd.pending,
                pendingExpectedProfit: normalizeMoney(Math.max(0, (lostDebt.lostExpectedProfit || 0) - pd.interestRecovery)),
                isFullyRecovered: pd.isFullyRecovered,
                recoveryPercentage: pd.percentage
            };
        }, [lostDebt, recoveryMovements, lossCompensations]);

        const openCobrarModal = (installment) => {
            setSelectedInstallment(installment);
            setEditingPayment(null);
            setShowCobrarModal(true);
        };

        const openAbonarModal = (installment) => {
            setSelectedInstallment(installment);
            setEditingPayment(null);
            setShowAbonarModal(true);
        };

        const openEditPayment = (payment) => {
            setEditingPayment(payment);
            setSelectedInstallment(installments.find(i => i.id === payment.installmentId));
            setShowEditAbonarModal(true);
        };

        const closeCobrarModal = () => {
            setShowCobrarModal(false);
            setSelectedInstallment(null);
        };

        const closeAbonarModal = () => {
            setShowAbonarModal(false);
            setSelectedInstallment(null);
        };

        const closeEditAbonarModal = () => {
            setShowEditAbonarModal(false);
            setEditingPayment(null);
            setSelectedInstallment(null);
        };

        const handleCobroSuccess = () => {
            setShowCobrarModal(false);
            setSelectedInstallment(null);
            refreshAllData();
        };

        const handleAbonoSuccess = () => {
            setShowAbonarModal(false);
            setSelectedInstallment(null);
            refreshAllData();
        };

        const handleMarkAsLost = async (breakdown) => {
            try {
                await initDatabase();

                await db.transaction('rw', db.loans, db.lostDebts, db.auditLog, async () => {
                    const lostDebtId = await db.lostDebts.add({
                        userId: user.id,
                        loanId: loan.id,
                        clientId: loan.clientId,
                        lostAt: new Date().toISOString(),
                        lostCapital: breakdown.lostCapital,
                        lostExpectedProfit: breakdown.lostExpectedProfit,
                        totalExpected: breakdown.totalExpected,
                        pendingBalanceAtLoss: breakdown.pendingBalance,
                        recoveredCapital: 0,
                        recoveredInterest: 0,
                        status: 'pending',
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    await db.loans.update(loan.id, {
                        status: 'lost',
                        lostAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });

                    await db.auditLog.add({

                        })
                    });

                    if (instIds.length > 0) {

                    await db.installments.where({ loanId: loan.id }).delete();
                    await db.capitalMovements.where({ referenceType: 'loan', referenceId: loan.id }).delete();

                    if (paymentMovements.length > 0) {

    const CollectionsPage = ({ onNavigate }) => {
        const { loans, clients, installments } = useApp();
        const [filter, setFilter] = useState('all');
        const today = todayLocal();

        const activeLoans = (loans || []).filter(l => l && l.status !== 'lost' && l.status !== 'cancelled');

        const data = activeLoans.map(l => ({
            ...l,
            _c: (clients || []).find(c => c.id === l.clientId),
            _i: (installments || []).filter(i => i.loanId === l.id)
        }));

        const dueToday = data.filter(l => l._i?.some(i => {
            if (i.status === 'paid' || i.status === 'cancelled') return false;
            return getCalendarDaysDiff(today, parseLocalDate(i.dueDate)) === 0;
        }));

        const overdue = data.filter(l => l.status === 'overdue' || l._i?.some(i => i.status === 'overdue'));
        const pending = data.filter(l => l.status === 'active' || l.status === 'overdue');
        const paid = data.filter(l => l.status === 'finished');

        const filtered = filter === 'today' ? dueToday : filter === 'overdue' ? overdue :
            filter === 'pending' ? pending : filter === 'paid' ? paid : data;

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Cobros</div>

                        { id: 'today', label: 'Vence hoy' },

                        <button key={f.id} onClick={() => setFilter(f.id)} className="btn btn-ghost btn-sm"

                                background: filter === f.id ? 'rgba(99,102,241,0.15)' : 'transparent',

                            }}>
                            {f.label}
                        </button>
                    ))}
                </div>

                {filtered.length === 0 ? (
                    <EmptyState icon={<IconSVG.Receipt />} title="No hay cobros"
                        description="No se encontraron cobros para este filtro" />
                ) : (
                    filtered.map(l => {
                        const pendingCount = l._i?.filter(i => i.status !== 'paid' && i.status !== 'cancelled').length || 0;
                        const overdueCount = l._i?.filter(i => i.status === 'overdue').length || 0;
                        const totalWithMora = normalizeMoney(l._i?.reduce((sum, i) => {
                            if (i.status === 'paid' || i.status === 'cancelled') return sum;
                            return sum + normalizeMoney((i.remainingAmount || i.totalAmount || 0) + MoraEngine.calculateMoraRemaining(i));

                                        color: l.status === 'overdue' ? 'var(--danger)' :
