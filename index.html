    loans: '++id, userId, clientId, loanNumber, principal, interestType, interestRate, installmentsCount, frequency, startDate, dueDateType, moraType, moraRate, status, totalRepayment, totalPaid, currentBalance, progress, createdAt, updatedAt',

    users: '++id, &document, email, createdAt', clients: '++id, userId, fullName, document, phone, email, address, city, neighborhood, company, occupation, references, notes, status, photo, createdAt, updatedAt',
    loans: '++id, userId, clientId, loanNumber, principal, interestType, interestRate, installmentsCount, frequency, startDate, dueDateType, moraType, moraRate, status, totalRepayment, totalPaid, currentBalance, progress, createdAt, updatedAt',
    installments: '++id, loanId, number, startDate, dueDate, principal, interest, totalAmount, paidAmount, remainingAmount, moraDays, moraAmount, status',
    payments: '++id, loanId, clientId, installmentId, amount, paymentDate, method, note, breakdown, createdAt',
    capitalMovements: '++id, userId, type, amount, date, description, createdAt',
    expenses: '++id, userId, category, amount, date, time, description, provider, paymentMethod, notes, receiptPhoto, createdAt, updatedAt',
    expenseCategories: '++id, name', settings: '&userId',
    auditLog: '++id, userId, timestamp, entityType, entityId, action, description',
    sessions: '++id, userId, token, expiresAt, createdAt',
    collectionPeriods: '++id, userId, year, month, expectedAmount, collectedAmount, pendingAmount, overdueAmount, compliance, createdAt'
}).upgrade(async tx => { const all = await tx.table('settings').toArray(); if (all.length > 0) { const c = { userId: all[0].userId }; all.forEach(s => Object.assign(c, s)); await tx.table('settings').clear(); await tx.table('settings').put(c); } console.log('[DB] v2->v3'); });

const initDatabase = async () => { if (!db.isOpen()) await db.open(); const tables = db.tables.map(t => t.name); const required = ['users','sessions','clients','loans','installments','payments','capitalMovements','expenses','expenseCategories','settings','auditLog','collectionPeriods']; const missing = required.filter(t => !tables.includes(t)); if (missing.length) throw new Error(`Tablas faltantes: ${missing.join(', ')}`); return db; };
const verifyPersistence = async (table, id) => { const record = await table.get(id); if (!record) throw new Error('La operación no pudo verificarse en la base de datos.'); return record; };
const initCategories = async () => { const count = await db.expenseCategories.count(); if (count === 0) await db.expenseCategories.bulkAdd([{name:'Combustible'},{name:'Transporte'},{name:'Papelería'},{name:'Publicidad'},{name:'Salarios'},{name:'Comisiones'},{name:'Arriendo'},{name:'Servicios'},{name:'Internet'},{name:'Mantenimiento'},{name:'Impuestos'},{name:'Intereses bancarios'},{name:'Pérdidas'},{name:'Inversión'},{name:'Otros'}]); };
initDatabase().then(() => initCategories()).catch(err => console.error('[DB ERROR]', err));

class SecurityUtils {
    static async hashPassword(pw) { const encoder = new TextEncoder(); const data = encoder.encode(pw + 'LoansW_Salt_2025'); const hashBuffer = await crypto.subtle.digest('SHA-256', data); return 'lw6_' + Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join(''); }
    static async verifyPassword(pw, hash) { return await this.hashPassword(pw) === hash; }
    static generateToken() { const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'; const array = new Uint8Array(64); crypto.getRandomValues(array); return Array.from(array, b => chars.charAt(b % chars.length)).join(''); }
    static async createSession(userId, remember = false) { const token = this.generateToken(); const expiresAt = new Date(); expiresAt.setDate(expiresAt.getDate() + (remember ? 30 : 1)); await db.sessions.add({ userId, token, expiresAt: expiresAt.toISOString(), createdAt: new Date().toISOString() }); (remember ? localStorage : sessionStorage).setItem('lw_session', JSON.stringify({ userId, token })); }
    static async validateSession() { try { let data = sessionStorage.getItem('lw_session'); if (!data) data = localStorage.getItem('lw_session'); if (!data) return null; const { userId, token } = JSON.parse(data); const session = await db.sessions.where({ userId, token }).first(); if (!session || new Date(session.expiresAt) < new Date()) { sessionStorage.removeItem('lw_session'); localStorage.removeItem('lw_session'); if (session) await db.sessions.delete(session.id); return null; } return await db.users.get(userId); } catch { sessionStorage.removeItem('lw_session'); localStorage.removeItem('lw_session'); return null; } }
    static async destroySession() { const sources = [sessionStorage.getItem('lw_session'), localStorage.getItem('lw_session')]; for (const src of sources) { if (src) { try { const { token } = JSON.parse(src); await db.sessions.where({ token }).delete(); } catch {} } } sessionStorage.removeItem('lw_session'); localStorage.removeItem('lw_session'); }
}

class ScheduleEngine { static generate({ startDate, frequency, count, dueDateType = 'fixed_day' }) { const dates = []; const start = new Date(startDate); start.setHours(12,0,0,0); for (let i = 0; i < count; i++) { let date; switch (frequency) { case 'daily': date = new Date(start); date.setDate(date.getDate() + i); break; case 'weekly': date = new Date(start); date.setDate(date.getDate() + (i * 7)); break; case 'biweekly': date = new Date(start); date.setDate(date.getDate() + (i * 14)); break; case 'monthly': if (dueDateType === 'end_of_period') date = new Date(start.getFullYear(), start.getMonth() + i + 1, 0); else { const td = start.getDate(); date = new Date(start.getFullYear(), start.getMonth() + i, 1); const ld = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate(); date.setDate(Math.min(td, ld)); } break; default: date = new Date(start); date.setDate(date.getDate() + (i * 30)); } date.setHours(12,0,0,0); dates.push(date); } return dates; } }
class InterestEngine { static calculate({ principal, rate, count, type }) { let ti = 0; const d = []; const p = Number(principal), r = Number(rate) / 100, n = Number(count); switch (type) { case 'on_principal': ti = p * r; const ip = ti / n, pp = p / n; for (let i = 0; i < n; i++) d.push({ principal: pp, interest: ip, total: pp + ip }); break; case 'fixed_per_installment': const fi = (p * r) / n; ti = fi * n; const pf = p / n; for (let i = 0; i < n; i++) d.push({ principal: pf, interest: fi, total: pf + fi }); break; case 'no_interest': const pz = p / n; for (let i = 0; i < n; i++) d.push({ principal: pz, interest: 0, total: pz }); break; default: const pd = p / n, id = (p * r) / n; ti = id * n; for (let i = 0; i < n; i++) d.push({ principal: pd, interest: id, total: pd + id }); } return { totalInterest: Math.round(ti * 100) / 100, totalRepayment: Math.round((p + ti) * 100) / 100, details: d.map(x => ({ principal: Math.round(x.principal * 100) / 100, interest: Math.round(x.interest * 100) / 100, total: Math.round(x.total * 100) / 100 })) }; } }
class MoraEngine { static calculateMoraDays(dueDate) { const now = new Date(); now.setHours(0,0,0,0); const due = new Date(dueDate); due.setHours(0,0,0,0); if (now <= due) return 0; return Math.floor((now - due) / (1000 * 60 * 60 * 24)); } static calculateMoraAmount({ remainingAmount, moraType, moraRate, daysLate }) { if (daysLate <= 0 || remainingAmount <= 0) return 0; const base = Number(remainingAmount), rate = Number(moraRate); switch (moraType) { case 'percentage_daily': return Math.round(base * (rate / 100) * daysLate * 100) / 100; case 'percentage_weekly': const w = Math.floor(daysLate / 7); return w > 0 ? Math.round(base * (rate / 100) * w * 100) / 100 : 0; case 'percentage_monthly': const m = Math.floor(daysLate / 30); return m > 0 ? Math.round(base * (rate / 100) * m * 100) / 100 : 0; case 'fixed_daily': return Math.round(rate * daysLate * 100) / 100; case 'fixed_period': return Math.round(rate * 100) / 100; default: return 0; } } }
class PaymentEngine { static process({ installment, amount }) { let rem = Number(amount); const bd = { capital: 0, interest: 0, mora: 0 }; const ta = installment.totalAmount || 0, ia = installment.interest || 0, ra = installment.remainingAmount || ta, ma = installment.moraAmount || 0; if (ta <= 0 && ma <= 0) return { breakdown: bd, totalPaid: 0, newPaidAmount: installment.paidAmount || 0, newRemaining: 0, newStatus: 'paid', change: rem }; if (ma > 0 && rem > 0) { bd.mora = Math.round(Math.min(rem, ma) * 100) / 100; rem = Math.round((rem - bd.mora) * 100) / 100; } const ir = ta > 0 ? ia / ta : 0; const mi = ra * ir; if (mi > 0 && rem > 0) { bd.interest = Math.round(Math.min(rem, mi) * 100) / 100; rem = Math.round((rem - bd.interest) * 100) / 100; } if (rem > 0) { const mc = ra - mi; bd.capital = Math.round(Math.min(rem, Math.max(0, mc)) * 100) / 100; rem = Math.round((rem - bd.capital) * 100) / 100; } const tp = Math.round((bd.capital + bd.interest + bd.mora) * 100) / 100; const npa = Math.round(((installment.paidAmount || 0) + tp) * 100) / 100; const nr = Math.round(Math.max(0, ta - npa + (ma - bd.mora)) * 100) / 100; let ns = 'pending'; if (nr <= 0.01 && (ma - bd.mora) <= 0.01) ns = 'paid'; else if (npa > 0) ns = 'partial'; if (ns !== 'paid' && new Date(installment.dueDate) < new Date() && ns !== 'partial') ns = 'overdue'; return { breakdown: { capital: Math.round(bd.capital * 100) / 100, interest: Math.round(bd.interest * 100) / 100, mora: Math.round(bd.mora * 100) / 100 }, totalPaid: tp, newPaidAmount: npa, newRemaining: nr, newStatus: ns, change: Math.round(Math.max(0, rem) * 100) / 100 }; } }
class FinanceEngine { static calculateMetrics({ installments, payments, loans, expenses, capitalMovements, year, month }) { const sd = new Date(year, month - 1, 1), ed = new Date(year, month, 0, 23, 59, 59); const mi = installments.filter(i => { const d = new Date(i.dueDate); return d >= sd && d <= ed; }); const mp = payments.filter(p => { const d = new Date(p.paymentDate); return d >= sd && d <= ed; }); const me = expenses.filter(e => { const d = new Date(e.date); return d >= sd && d <= ed; }); const ea = mi.reduce((s, i) => s + (i.totalAmount || 0), 0); const ca = mp.reduce((s, p) => s + (p.amount || 0), 0); const ci = mp.reduce((s, p) => s + ((p.breakdown?.interest) || 0), 0); const cm = mp.reduce((s, p) => s + ((p.breakdown?.mora) || 0), 0); const te = me.reduce((s, e) => s + (e.amount || 0), 0); const oa = mi.filter(i => i.status === 'overdue').reduce((s, i) => s + (i.remainingAmount || i.totalAmount || 0) + (i.moraAmount || 0), 0); const tc = capitalMovements.reduce((s, m) => { if (m.type === 'income' || m.type === 'payment') return s + (m.amount || 0); return s - (m.amount || 0); }, 0); const tl = loans.filter(l => l.status === 'active').reduce((s, l) => s + (l.principal || 0), 0); return { expectedAmount: Math.round(ea * 100) / 100, collectedAmount: Math.round(ca * 100) / 100, collectedInterest: Math.round(ci * 100) / 100, collectedMora: Math.round(cm * 100) / 100, totalExpenses: Math.round(te * 100) / 100, pendingAmount: Math.round((ea - ca) * 100) / 100, overdueAmount: Math.round(oa * 100) / 100, totalCapital: Math.round(tc * 100) / 100, totalLent: Math.round(tl * 100) / 100, availableCapital: Math.round((tc - tl + ca) * 100) / 100, profit: Math.round((ci + cm - te) * 100) / 100, compliance: ea > 0 ? Math.round((ca / ea) * 10000) / 100 : 0 }; } }

const formatCurrency = (a) => { if (a === null || a === undefined || isNaN(a)) return '$ 0'; return '$ ' + new Intl.NumberFormat('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Math.round(a)); };
const formatDate = (d) => { if (!d) return ''; return new Date(d).toLocaleDateString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit' }); };
const getRelativeDay = (d) => { const today = new Date(); today.setHours(0,0,0,0); const due = new Date(d); due.setHours(0,0,0,0); const diff = Math.floor((due - today) / (1000 * 60 * 60 * 24)); if (diff === 0) return 'Hoy'; if (diff === 1) return 'Mañana'; if (diff < 0) return `Hace ${Math.abs(diff)} días`; return `En ${diff} días`; };
const getStatusLabel = (s) => ({ paid: 'Pagada', pending: 'Pendiente', partial: 'Parcial', overdue: 'Vencida', active: 'Activo', finished: 'Finalizado', cancelled: 'Cancelado' }[s] || s);

// CONTEXTO GLOBAL - refreshAllData() CORREGIDO
// ========================================
const AppContext = createContext();
const AppProvider = ({ children, user, onLogout }) => {
    const [clients, setClients] = useState([]); const [loans, setLoans] = useState([]); const [installments, setInstallments] = useState([]);
    const [payments, setPayments] = useState([]); const [expenses, setExpenses] = useState([]); const [capitalMovements, setCapitalMovements] = useState([]);
    const [expenseCategories, setExpenseCategories] = useState([]); const [collectionPeriods, setCollectionPeriods] = useState([]);
    const [auditLogs, setAuditLogs] = useState([]); const [config, setConfig] = useState(null); const [toasts, setToasts] = useState([]);
    const [loading, setLoading] = useState(true); const [refreshKey, setRefreshKey] = useState(0);

    const addToast = useCallback((msg, type = 'info') => { const id = Date.now(); setToasts(p => [...p, { id, msg, type }]); setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500); }, []);

    // CORREGIDO: refreshAllData con consultas independientes y compatibles con Dexie 3
    const refreshAllData = useCallback(async () => {
        if (!user?.id) return;
        setLoading(true);
        let hasError = false;
        
        try {
            await initDatabase();
            const userId = user.id;
            
            // Carga de datos principales (independiente del auditLog)
            try {
                const [c, l, ec, cp] = await Promise.all([
                    db.clients.where({ userId }).toArray(),
                    db.loans.where({ userId }).toArray(),
                    db.expenseCategories.toArray(),
                    db.collectionPeriods.where({ userId }).toArray()
                ]);
                
                setClients(c);
                setLoans(l);
                setExpenseCategories(ec);
                setCollectionPeriods(cp);
                
                // Cargar cuotas y pagos basados en los préstamos del usuario
                const loanIds = l.map(loan => loan.id);
                if (loanIds.length > 0) {
                    const [i, p] = await Promise.all([
                        db.installments.where('loanId').anyOf(loanIds).toArray(),
                        db.payments.where('loanId').anyOf(loanIds).toArray()
                    ]);
                    setInstallments(i);
                    setPayments(p);
                    
                    // Actualizar mora
                    for (const inst of i) {
                        if (inst.status === 'paid' || inst.status === 'cancelled') continue;
                        const loan = l.find(lo => lo.id === inst.loanId);
                        if (loan) {
                            const daysLate = MoraEngine.calculateMoraDays(inst.dueDate);
                            const moraAmount = MoraEngine.calculateMoraAmount({ remainingAmount: inst.remainingAmount || inst.totalAmount, moraType: loan.moraType, moraRate: loan.moraRate, daysLate });
                            if (daysLate !== inst.moraDays || moraAmount !== inst.moraAmount) {
                                await db.installments.update(inst.id, { moraDays: daysLate, moraAmount });
                                if (daysLate > 0 && inst.status !== 'paid' && inst.status !== 'cancelled' && inst.status !== 'partial')
                                    await db.installments.update(inst.id, { status: 'overdue' });
                            }
                        }
                    }
                } else {
                    setInstallments([]);
                    setPayments([]);
                }
            } catch (err) {
                console.error('[REFRESH ERROR - Datos principales]:', err);
                hasError = true;
            }
            
            // Carga de gastos y capital (independiente)
            try {
                const [e, cm] = await Promise.all([
                    db.expenses.where({ userId }).toArray(),
                    db.capitalMovements.where({ userId }).toArray()
                ]);
                setExpenses(e);
                setCapitalMovements(cm);
            } catch (err) {
                console.error('[REFRESH ERROR - Gastos/Capital]:', err);
                hasError = true;
            }
            
            // Carga de configuración (independiente)
            try {
                const cfg = await db.settings.get(userId);
                setConfig(cfg || {});
            } catch (err) {
                console.error('[REFRESH ERROR - Configuración]:', err);
                hasError = true;
            }
            
            // Carga de auditLog (independiente - CORREGIDO para Dexie 3)
            try {
                const auditRows = await db.auditLog.where({ userId }).toArray();
                // Ordenar en memoria (compatible con Dexie 3)
                auditRows.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                const al = auditRows.slice(0, 50);
                setAuditLogs(al);
            } catch (err) {
                console.error('[REFRESH ERROR - AuditLog]:', err);
                // El auditLog es secundario; no debe bloquear la UI
                setAuditLogs([]);
            }
            
            setRefreshKey(k => k + 1);
            
            if (hasError) {
                console.warn('[REFRESH] Algunas consultas fallaron, pero los datos principales se cargaron.');
            }
        } catch (err) {
            console.error('[REFRESH ERROR - Crítico]:', err);
            addToast('Error al cargar los datos. Verifica el almacenamiento local.', 'error');
        }
        setLoading(false);
    }, [user, addToast]);

    const addAuditLog = useCallback(async (entityType, entityId, action, description = '') => {
        if (!user?.id) return;
        try { await db.auditLog.add({ userId: user.id, timestamp: new Date().toISOString(), entityType, entityId, action, description }); } catch (err) { console.error('[APP] Audit log error:', err); }
    }, [user]);

    useEffect(() => { if (user) refreshAllData(); }, [user, refreshAllData]);

    const value = useMemo(() => ({
        user, onLogout, clients, loans, installments, payments, expenses, capitalMovements,
        expenseCategories, setExpenseCategories, collectionPeriods, auditLogs,
        config, setConfig, toasts, addToast, loading, refreshKey, refreshAllData, addAuditLog
    }), [user, onLogout, clients, loans, installments, payments, expenses, capitalMovements, expenseCategories, collectionPeriods, auditLogs, config, toasts, addToast, loading, refreshKey, refreshAllData, addAuditLog]);

    return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
};
const useApp = () => useContext(AppContext);

const ToastContainer = () => { const { toasts } = useApp(); if (!toasts.length) return null; return <div className="toast-container">{toasts.map(t => <div key={t.id} className={`toast toast-${t.type}`}>{t.msg}</div>)}</div>; };

            const handleSubmit = async (e) => { e.preventDefault(); setError(''); if (!doc.trim() || !password.trim()) { setError('Completa todos los campos requeridos.'); return; } const nd = doc.trim().replace(/\s+/g, ''); if (isRegistering) { if (!fullName.trim()) { setError('El nombre completo es requerido.'); return; } if (password !== confirmPassword) { setError('Las contraseñas no coinciden.'); return; } if (password.length < 6) { setError('La contraseña debe tener al menos 6 caracteres.'); return; } } setLoading(true); try { await initDatabase(); if (isRegistering) { const ex = await db.users.where({ document: nd }).first(); if (ex) { setError('Esta cédula ya está registrada.'); setLoading(false); return; } if (email.trim()) { const ee = await db.users.where({ email: email.trim().toLowerCase() }).first(); if (ee) { setError('Este correo ya está registrado.'); setLoading(false); return; } } const ph = await SecurityUtils.hashPassword(password); const uid = await db.users.add({ fullName: fullName.trim(), document: nd, email: email.trim().toLowerCase(), phone: phone.trim(), passwordHash: ph, createdAt: new Date().toISOString() }); await verifyPersistence(db.users, uid); await SecurityUtils.createSession(uid, remember); onLogin({ id: uid, document: nd, fullName: fullName.trim(), email: email.trim().toLowerCase() }); } else { const u = await db.users.where({ document: nd }).first(); if (!u) { setError('No existe una cuenta con esta cédula.'); setLoading(false); return; } const v = await SecurityUtils.verifyPassword(password, u.passwordHash); if (!v) { setError('Contraseña incorrecta.'); setLoading(false); return; } await SecurityUtils.createSession(u.id, remember); onLogin(u); } } catch (err) { console.error('[AUTH ERROR]', err); setError(err.message || 'Error inesperado. Intenta nuevamente.'); } setLoading(false); };
            return (<div style={{ minHeight: '100vh', background: 'linear-gradient(160deg, #060610 0%, #0f0f24 40%, #060610 100%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px' }}><div style={{ marginBottom: '36px', textAlign: 'center' }}><div style={{ width: '60px', height: '60px', borderRadius: '16px', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', animation: 'pulse-glow 2s ease-in-out infinite' }}><IconSVG.TrendingUp /></div><div style={{ fontSize: '32px', fontWeight: '800', letterSpacing: '-1.5px', color: 'var(--text-primary)' }}>LOANS W</div><div style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '4px' }}>Sistema profesional de gestión de préstamos</div></div><form onSubmit={handleSubmit} style={{ width: '100%', maxWidth: '400px' }}><div className="glass-card" style={{ padding: '24px', cursor: 'default' }}><div style={{ fontSize: '20px', fontWeight: '700', marginBottom: '20px', textAlign: 'center' }}>{isRegistering ? 'Crear cuenta' : 'Iniciar sesión'}</div>{error && <div style={{ padding: '11px 14px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '10px', color: 'var(--danger-light)', fontSize: '12px', marginBottom: '16px', lineHeight: '1.4' }}>{error}</div>}{isRegistering && <div style={{ marginBottom: '12px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Nombre completo *</label><input type="text" value={fullName} onChange={e => setFullName(e.target.value)} className="glass-input" placeholder="Tu nombre completo" /></div>}<div style={{ marginBottom: '12px' }}><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px', fontWeight: '500' }}>Número de cédula *</label><input type="text" value={doc} onChange={e => setDoc(e.ta         // ========================================

            const upcomingCollections = useMemo(() => { const today = new Date(); today.setHours(0,0,0,0); const nw = new Date(today); nw.setDate(nw.getDate() + 7); return installments.filter(i => { if (i.status === 'paid' || i.status === 'cancelled') return false; const due = new Date(i.dueDate); due.setHours(0,0,0,0); return due >= today && due <= nw; }).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate)).slice(0, 5); }, [installments, refreshKey]);

/div><div style={{ fontSize: '19px', fontWeight: '700', color: metrics.profit >= 0 ? 'var(--success)' : 'var(--danger)' }}>{formatCurrency(metrics.profit)}</div></div></div></div><div className="glass-card" style={{ padding: '16px', marginBottom: '14px' }} onClick={() => onNavigate('collections')}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}><span style={{ fontSize: '11px', color: 'var(--text-secondary)', textTransform: 'uppercase', fontWeight: '600', letterSpacing: '0.04em' }}>Progreso de cobros</span><span className="badge badge-info">{metrics.compliance.toFixed(0)}%</span></div><div style={{ fontSize: '22px', fontWeight: '700', marginBottom: '4px' }}>{formatCurrency(metrics.collectedAmount)} <span style={{ fontSize: '12px', color: 'var(--text-muted)', fontWeight: '400' }}>de {formatCurrency(metrics.expectedAmount)}</span></div><div className="progress-bar" style={{ height: '9px', marginBottom: '8px' }}><div className="progress-fill" style={{ width: `${Math.min(100, metrics.compliance)}%` }} /></div><div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: 'var(--text-muted)' }}><span>Cobrado: <span style={{ color: 'var(--success)', fontWeight: '600' }}>{formatCurrency(metrics.collectedAmount)}</span></span><span>Vencido: <span style={{ color: 'var(--danger)', fontWeight: '600' }}>{formatCurrency(metrics.overdueAmount)}</span></span></div></div><div style={{ marginBottom: '14px' }}><div style={{ fontSize: '11px', fontWeight: '600', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: '8px' }}>Acciones rápidas</div><div style={{ display: 'flex', gap: '8px', overflow: 'auto', paddingBottom: '4px' }}>{[{ label: 'Cliente', icon: <IconSVG.User />, action: 'client' },{ label: 'Préstamo', icon: <IconSVG.DollarSign />, action: 'loan' },{ label: 'Cobro', icon: <IconSVG.Check />, action: 'payment' },{ label: 'Gasto', icon: <IconSVG.TrendingUp />, action: 'expense' }].map((a, i) => (<div key={i} className="quick-action" onClick={() => { if (a.action === 'client') onNavigate('clients'); else if (a.action === 'loan') onNavigate('createLoan'); else if (a.action === 'payment') onNavigate('collections'); else if (a.action === 'expense') onNavigate('expenses'); }}><div style={{ color: 'var(--accent-light)' }}>{a.icon}</div><span style={{ fontSize: '11px', fontWeight: '500', whiteSpace: 'nowrap' }}>{a.label}</span></div>))}</div></div>{alerts.length > 0 && <div style={{ marginBottom: '14px' }}><div className="flex-center gap-1 mb-2"><IconSVG.Bell /><span style={{ fontSize: '11px', fontWeight: '600', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Atención</span></div>{alerts.map((a, i) => <div key={i} className="glass-card" style={{ padding: '10px', marginBottom: '6px', display: 'flex', alignItems: 'center', gap: '8px', borderColor: a.type === 'danger' ? 'rgba(239,68,68,0.2)' : 'rgba(245,158,11,0.2)' }}><span style={{ color: a.type === 'danger' ? 'var(--danger)' : 'var(--warning)' }}>{a.icon}</span><span style={{ fontSize: '12px', color: a.type === 'danger' ? 'var(--danger-light)' : 'var(--warning-light)' }}>{a.msg}</span></div>)}</div>}{upcomingCollections.length > 0 && <div style={{ marginBottom: '14px' }}><div className="flex-center gap-1 mb-2" style={{ justifyContent: 'space-between' }}><span style={{ fontSize: '11px', fontWeight: '600', color: 'var(--text-secondary)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Próximos cobros</span><span className="badge badge-info">{upcomingCollections.length}</span></div>{upcomingCollections.map(inst => { const loan = loans.find(l => l.id === inst.loanId); const client = clients.find(c => c.id === loan?.clientId); return <div key={inst.id} className="glass-card" onClick={() => onNavigate('loanDetail', loan?.id)} style={{ padding: '10px', marginBottom: '4px', display: 'flex', justifyContent: 'space-between', alignI 'es-CO', { hour: '2-digit', minute: '2-digit' })}</div></div>)}</div>}</div>);

        const ClientsPage = ({ onNavigate }) => {
            const { clients, loans, refreshAllData, addToast, user, loading } = useApp(); const [search, setSearch] = useState(''); const [showForm, setShowForm] = useState(false); const [editing, setEditing] = useState(null);
            const filtered = clients.filter(c => (c.fullName || '').toLowerCase().includes(search.toLowerCase()) || (c.document || '').includes(search));
            const handleSave = async (data) => {
                if (!data.fullName?.trim()) { addToast('El nombre es requerido', 'error'); return; }
                try {
                    await initDatabase(); const docData = { ...data, userId: user.id, updatedAt: new Date().toISOString() }; let savedId;
                    if (editing) { await db.clients.update(editing.id, docData); savedId = editing.id; }
                    else { docData.createdAt = new Date().toISOString(); savedId = await db.clients.add(docData); }
                    await verifyPersistence(db.clients, savedId);
                    await refreshAllData();
                    addToast(editing ? 'Cliente actualizado correctamente' : 'Cliente creado correctamente', 'success');
                    setShowForm(false); setEditing(null);
                } catch (err) { console.error('[CLIENT ERROR]', err); addToast(err.message || 'No se pudo guardar el cliente.', 'error'); }

ame="glass-input" /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Ciudad</label><input type="text" value={f.city} onChange={e => setF({...f, city: e.target.value})} className="glass-input" /></div></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Barrio</label><input type="text" value={f.neighborhood} onChange={e => setF({...f, neighborhood: e.target.value})} className="glass-input" /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Empresa</label><input type="text" value={f.company} onChange={e => setF({...f, company: e.target.value})} className="glass-input" /></div></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Ocupación</label><input type="text" value={f.occupation} onChange={e => setF({...f, occupation: e.target.value})} className="glass-input" /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Referencias</label><input type="text" value={f.references} onChange={e => setF({...f, references: e.target.value})} className="glass-input" /></div></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Notas</label><textarea value={f.notes} onChange={e => setF({...f, notes: e.target.value})} className="glass-input" rows="2" /></div><button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '6px' }}>{initial ? 'Actualizar cliente' : 'Crear cliente'}</button></form>; };

        const ClientDetailPage = ({ id, onNavigate }) => {

>}</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}><div className="glass-card" style={{ padding: '12px', textAlign: 'center' }}><div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total prestado</div><div style={{ fontSize: '17px', fontWeight: '700' }}>{formatCurrency(totalLent)}</div></div><div className="glass-card" style={{ padding: '12px', textAlign: 'center' }}><div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Pendiente</div><div style={{ fontSize: '17px', fontWeight: '700', color: 'var(--warning)' }}>{formatCurrency(totalPending)}</div></div><div className="glass-card" style={{ padding: '12px', textAlign: 'center' }}><div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Préstamos activos</div><div style={{ fontSize: '17px', fontWeight: '700' }}>{activeLoans.length}</div></div><div className="glass-card" style={{ padding: '12px', textAlign: 'center' }}><div style={{ fontSize: '10px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Total préstamos</div><div style={{ fontSize: '17px', fontWeight: '700' }}>{clientLoans.length}</div></div></div><div style={{ fontSize: '15px', fontWeight: '600', marginBottom: '10px' }}>Préstamos del cliente</div>{clientLoans.length === 0 ? <EmptyState icon={<IconSVG.Briefcase />} title="Sin préstamos" action={<button className="btn btn-primary btn-sm" onClick={() => onNavigate('createLoan', client.id)}>+ Nuevo préstamo</button>} /> : clientLoans.map(loan => { const prog = loan.totalRepayment > 0 ? ((loan.totalPaid || 0) / loan.totalRepayment) * 100 : 0; return <div key={loan.id} className="glass-card" onClick={() => onNavigate('loanDetail', loan.id)} style={{ padding: '14px', marginBottom: '6px' }}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}><span style={{ fontWeight: '600' }}>#{loan.loanNumber}</span><span className={`badge ${loan.status === 'overdue' ? 'badge-danger' : loan.status === 'finished' ? 'badge-info' : 'badge-success'}`}>{getStatusLabel(loan.status)}</span></div><div className="progress-bar" style={{ marginBottom: '6px' }}><div className="progress-fill" style={{ width: `${Math.min(100, prog)}%` }} /></div><div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{formatCurrency(loan.totalPaid || 0)} / {formatCurrency(loan.totalRepayment)}</div></div>; })}{showEdit && <div className="modal-overlay" onClick={() => setShowEdit(false)}><div className="modal-content" onClick={e => e.stopPropagation()}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}><div style={{ fontSize: '20px', fontWeight: '700' }}>Editar cliente</div><button onClick={() => setShowEdit(false)} className="btn btn-ghost btn-sm"><IconSVG.X /></button></div><ClientForm initial={client} onSave={handleUpdate} /></div></div>}</div>);

        // ========================================
        // PRÉSTAMOS
        // ========================================
        const LoansPage = ({ onNavigate }) => { const { loans, clients, loading } = useApp(); const [filter, setFilter] = useState('all'); const filtered = loans.filter(l => filter === 'all' ? true : l.status === filter); if (loading) return <div style={{ padding: '20px' }}>{[1,2,3].map(i => <SkeletonCard key={i} />)}</div>; return (<div style={{ padding: '20px', paddingBottom: '120px' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}><div style={{ fontSize: '26px', fontWeight: '700' }}>Préstamos</div><button className="btn btn-primary btn-sm" onClick={() => onNavigate('createLoan')}><IconSVG.Plus /> Nuevo</button></div><div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>{['all','active','overdue','finished','cancelled'].map(f => <button key={f} onClick={() => setFilter(f)} className="btn btn-ghost btn-sm" style={{ background: filter === f ? 'rgba(99,102,241,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>{f==='all'?'Todos':f==='active'?'Activos':f==='overdue'?'Vencidos':f==='finished'?'Finalizados':'Cancelados'}</button>)}</div>{filtered.length===0?<EmptyState icon={<IconSVG.Briefcase />} title="No hay préstamos" action={<button className="btn btn-primary" onClick={() => onNavigate('createLoan')}>+ Crear préstamo</button>}/>:filtered.map(l=>{const c=clients.find(cl=>cl.id===l.clientId);const prog=l.totalRepayment>0?((l.totalPaid||0)/l.totalRepayment)*100:0;return <div key={l.id} className="glass-card" onClick={()=>onNavigate('loanDetail',l.id)} style={{padding:'16px',marginBottom:'8px'}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:'8px'}}><div><div style={{fontWeight:'600',fontSize:'14px'}}>{c?.fullName||'Cliente'}</div><div style={{fontSize:'11px',color:'var(--text-muted)'}}>#{l.loanNumber}</div></div><span className={`badge ${l.status==='overdue'?'badge-danger':l.status==='finished'?'badge-info':l.status==='cancelled'?'badge-neutral':'badge-success'}`}>{getStatusLabel(l.status)}</span></div><div className="progress-bar" style={{marginBottom:'8px'}}><div className="progress-fill" style={{width:`${prog}%`}}/></div><div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'var(--text-muted)'}}><span>{formatCurrency(l.totalPaid||0)} / {formatCurrency(l.totalRepayment)}</span><span>{prog.toFixed(0)}%</span></div></div>;})}</div>); };

        const CreateLoanPage = ({ onNavigate, preselectedClientId }) => {
            const { clients, refreshAllData, addToast, user } = useApp(); const [form, setForm] = useState({ clientId: preselectedClientId || '', principal: '', interestType: 'on_principal', interestRate: '20', installmentsCount: '5', frequency: 'monthly', startDate: new Date().toISOString().split('T')[0], dueDateType: 'fixed_day', moraType: 'percentage_daily', moraRate: '0.5' }); const uf = (f, v) => setForm(p => ({ ...p, [f]: v }));
            const handleCreate = async () => { if (!form.clientId || !form.principal || !form.interestRate || !form.installmentsCount) { addToast('Completa todos los campos requeridos', 'error'); return; } const count = parseInt(form.installmentsCount); if (count <= 0 || count > 120) { addToast('Número de cuotas inválido', 'error'); return; } try { await initDatabase(); const r = InterestEngine.calculate({ principal: parseFloat(form.principal), rate: parseFloat(form.interestRate), count, type: form.interestType }); const s = ScheduleEngine.generate({ startDate: form.startDate, frequency: form.frequency, count, dueDateType: form.dueDateType }); const ld = { userId: user.id, clientId: parseInt(form.clientId), loanNumber: `LW-${Date.now().toString(36).toUpperCase()}`, principal: parseFloat(form.principal), interestType: form.interestType, interestRate: parseFloat(form.interestRate), installmentsCount: count, frequency: form.frequency, startDate: form.startDate, dueDateType: form.dueDateType, moraType: form.moraType, moraRate: parseFloat(form.moraRate), status: 'active', totalRepayment: r.totalRepayment, totalPaid: 0, currentBalance: r.totalRepayment, progress: 0, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }; let lid; await db.transaction('rw', db.loans, db.installments, db.capitalMovements, async () => { lid = await db.loans.add(ld); const id = s.map((d, i) => ({ loanId: lid, number: i + 1, startDate: i === 0 ? form.startDate : s[i - 1].toISOString(), dueDate: d.toISOString(), principal: r.details[i].principal, interest: r.details[i].interest, totalAmount: r.details[i].total, paidAmount: 0, remainingAmount: r.details[i].total, moraDays: 0, moraAmount: 0, status: 'pending' })); await db.installments.bulkAdd(id); await db.capitalMovements.add({ userId: user.id, type: 'loan', amount: parseFloat(form.principal), date: new Date().toISOString(), description: `Préstamo ${ld.loanNumber}`, createdAt: new Date().toISOString() }); }); await verifyPersistence(db.loans, lid); await refreshAllData(); addToast('Préstamo creado exitosamente', 'success'); onNavigate('loanDetail', lid); } catch (err) { addToast(err.message || 'No se pudo crear el préstamo.', 'error'); } };
            return (<div style={{ padding: '20px', paddingBottom: '120px' }}><button onClick={() => onNavigate('loans')} className="back-btn"><IconSVG.ArrowLeft /> Volver</button><div style={{ fontSize: '24px', fontWeight: '700', marginBottom: '16px' }}>Nuevo préstamo</div><div className="glass-card" style={{ padding: '20px', display: 'flex', flexDirection: 'column', gap: '12px' }}><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Cliente *</label><select value={form.clientId} onChange={e => uf('clientId', e.target.value)} className="glass-input"><option value="">Seleccionar cliente...</option>{clients.map(c => <option key={c.id} value={c.id}>{c.fullName}</option>)}</select></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Monto del préstamo *</label><input type="number" value={form.principal} onChange={e => uf('principal', e.target.value)} className="glass-input" placeholder="Ej: 500000" /></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Tasa de interés (%) *</label><input type="number" value={form.interestRate} onChange={e => uf('interestRate', e.target.value)} className="glass-input" placeholder="Ej: 20" /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Número de cuotas *</label><input type="number" value={form.installmentsCount} onChange={e => uf('installmentsCount', e.target.value)} className="glass-input" placeholder="Ej: 5" /></div></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Frecuencia</label><select value={form.frequency} onChange={e => uf('frequency', e.target.value)} className="glass-input"><option value="daily">Diaria</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly">Mensual</option></select></div><div style={{ fontSize: '13px', fontWeight: '600', color: 'var(--text-secondary)', marginTop: '8px' }}>Configuración de mora</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><select value={form.moraType} onChange={e => uf('moraType', e.target.value)} className="glass-input"><option value="percentage_daily">% diario</option><option value="percentage_weekly">% semanal</option><option value="percentage_monthly">% mensual</option><option value="fixed_daily">Fijo/día</option></select><input type="number" value={form.moraRate} onChange={e => uf('moraRate', e.target.value)} className="glass-input" placeholder="Tasa" step="0.01" /></div><button className="btn btn-success" style={{ width: '100%', marginTop: '8px' }} onClick={handleCreate} disabled={!form.clientId || !form.principal || !form.interestRate || !form.installmentsCount}><IconSVG.Check /> Crear préstamo</button></div></div>);

        const LoanDetailPage = ({ id, onNavigate }) => {
            const { loans, clients, installments, payments, refreshAllData, addToast, user } = useApp(); const loan = loans.find(l => l.id === parseInt(id)); const [showPay, setShowPay] = useState(false); const [selInst, setSelInst] = useState(null); const [processing, setProcessing] = useState(false);
            if (!loan) return <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>Préstamo no encontrado</div>; const client = clients.find(c => c.id === loan.clientId); const insts = installments.filter(i => i.loanId === loan.id).sort((a, b) => a.number - b.number); const prog = loan.totalRepayment > 0 ? ((loan.totalPaid || 0) / loan.totalRepayment) * 100 : 0;
            const hp = async (data) => { if (!selInst) return; setProcessing(true); try { await initDatabase(); const r = PaymentEngine.process({ installment: selInst, amount: data.amount }); await db.transaction('rw', db.installments, db.payments, db.loans, db.capitalMovements, async () => { await db.installments.update(selInst.id, { paidAmount: r.newPaidAmount, remainingAmount: r.newRemaining, status: r.newStatus, moraAmount: Math.max(0, (selInst.moraAmount || 0) - (r.breakdown.mora || 0)), moraDays: r.newStatus === 'paid' ? 0 : selInst.moraDays }); await db.payments.add({ loanId: loan.id, clientId: loan.clientId, installmentId: selInst.id, amount: r.totalPaid, paymentDate: data.date, method: data.method, note: data.note || '', breakdown: r.breakdown, createdAt: new Date().toISOString() }); const ntp = Math.round(((loan.totalPaid || 0) + r.totalPaid) * 100) / 100; await db.loans.update(loan.id, { totalPaid: ntp, currentBalance: Math.round((loan.totalRepayment - ntp) * 100) / 100, progress: loan.totalRepayment > 0 ? ntp / loan.totalRepayment : 0, updatedAt: new Date().toISOString() }); await db.capitalMovements.add({ userId: user.id, type: 'payment', amount: r.totalPaid, date: data.date, description: `Pago ${client?.fullName || 'Cliente'} - ${loan.loanNumber}`, createdAt: new Date().toISOString() }); }); const ui = await db.installments.where({ loanId: loan.id }).toArray(); const ap = ui.every(i => i.status === 'paid' || i.status === 'cancelled'); const ho = ui.some(i => i.status === 'overdue'); await db.loans.update(loan.id, { status: ap ? 'finished' : ho ? 'overdue' : 'active' }); await refreshAllData(); addToast(`Cobro registrado: ${formatCurrency(r.totalPaid)}`, 'success'); setShowPay(false); setSelInst(null); } catch (err) { addToast('No se pudo registrar el pago.', 'error'); } setProcessing(false); };

            if (subpage === 'security') return (<div style={{ padding: '20px', paddingBottom: '120px' }}><button onClick={() => setSubpage('main')} className="back-btn"><IconSVG.ArrowLeft /> Volver</button><div style={{ fontSize: '24px', fontWeight: '700', marginBottom: '20px' }}>Seguridad</div><div className="glass-card" style={{ padding: '16px', marginBottom: '8px' }} onClick={() => setShowPassword(true)}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontSize: '14px', fontWeight: '500' }}>Cambiar contraseña</div><div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Actualiza tu acceso</div></div><IconSVG.Lock /></div></div><button className="btn btn-danger" style={{ width: '100%', marginTop: '16px' }} onClick={onLogout}><IconSVG.LogOut /> Cerrar sesión</button>{showPassword && <div className="modal-overlay" onClick={() => setShowPassword(false)}><div className="modal-content" onClick={e => e.stopPropagation()}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}><div style={{ fontSize: '18px', fontWeight: '700' }}>Cambiar contraseña</div><button onClick={() => setShowPassword(false)} className="btn btn-ghost btn-sm"><IconSVG.X /></button></div><ChangePasswordForm onSuccess={() => { setShowPassword(false); addToast('Contraseña actualizada', 'success'); }} /></div></div>}</div>);
            if (subpage === 'preferences') { const [lp, setLp] = useState({ defaultInterestRate: config?.defaultInterestRate || 20, defaultFrequency: config?.defaultFrequency || 'monthly', defaultInstallments: config?.defaultInstallments || 5 }); const hs = async () => { try { await initDatabase(); const ex = await db.settings.get(user.id); const nc = { ...(ex || {}), ...lp, userId: user.id }; await db.settings.put(nc); await verifyPersistence(db.settings, user.id); await refreshAllData(); addToast('Preferencias guardadas correctamente', 'success'); } catch (err) { console.error('[SETTINGS]', err); addToast('No se pudieron guardar.', 'error'); } }; return (<div style={{ padding: '20px', paddingBottom: '120px' }}><button onClick={() => setSubpage('main')} className="back-btn"><IconSVG.ArrowLeft /> Volver</button><div style={{ fontSize: '24px', fontWeight: '700', marginBottom: '20px' }}>Preferencias</div><div className="glass-card" style={{ padding: '20px', display: 'flex', flexDirection: 'column', gap: '12px' }}><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Tasa predeterminada (%)</label><input type="number" value={lp.defaultInterestRate} onChange={e => setLp({...lp, defaultInterestRate: parseFloat(e.target.value) || 0})} className="glass-input" min="0" max="100" step="0.1" /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Frecuencia predeterminada</label><select value={lp.defaultFrequency} onChange={e => setLp({...lp, defaultFrequency: e.target.value})} className="glass-input"><option value="daily">Diaria</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly">Mensual</option></select></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Cuotas predeterminadas</label><input type="number" value={lp.defaultInstallments} onChange={e => setLp({...lp, defaultInstallments: parseInt(e.target.value) || 1})} className="glass-input" min="1" max="120" /></div><button className="btn btn-primary" style={{ width: '100%', marginTop: '8px' }} onClick={hs}><IconSVG.Check /> Guardar preferencias</button></div></div>); }
            return (<div style={{ padding: '20px', paddingBottom: '120px' }}><div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>Ajustes</div><div className="glass-card" style={{ padding: '16px', marginBottom: '12px' }}><div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}><div style={{ width: '44px', height: '44px', borderRadius: '50%', background: 'linear-gradient(135deg, #6366f1, #4f46e5)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px', fontWeight: '700', color: 'white' }}>{(user?.fullName || user?.document || '?')[0].toUpperCase()}</div><div style={{ flex: 1 }}><div style={{ fontSize: '15px', fontWeight: '600' }}>{user?.fullName || 'Usuario'}</div><div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Doc: {user?.document || 'N/A'}</div></div></div></div><div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}><div className="glass-card" style={{ padding: '16px' }} onClick={() => setSubpage('security')}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}><div style={{ color: 'var(--accent-light)' }}><IconSVG.Lock /></div><div><div style={{ fontSize: '14px', fontWeight: '500' }}>Seguridad</div><div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Contraseña y sesiones</div></div></div><IconSVG.ArrowLeft /></div></div><div className="glass-card" style={{ padding: '16px' }} onClick={() => setSubpage('preferences')}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}><div style={{ color: 'var(--accent-light)' }}><IconSVG.Settings /></div><div><div style={{ fontSize: '14px', fontWeight: '500' }}>Preferencias</div><div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Moneda y configuración</div></div></div><IconSVG.ArrowLeft /></div></div><div className="glass-card" style={{ padding: '16px' }} onClick={handleExport}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}><div style={{ color: 'var(--success)' }}><IconSVG.Download /></div><div><div style={{ fontSize: '14px', fontWeight: '500' }}>Exportar respaldo</div><div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>Descargar copia de seguridad</div></div></div><IconSVG.ArrowLeft /></div></div></div><button className="btn btn-danger" style={{ width: '100%', marginTop: '24px' }} onClick={onLogout}><IconSVG.LogOut /> Cerrar sesión</button><div style={{ marginTop: '24px', textAlign: 'center', fontSize: '11px', color: 'var(--text-muted)' }}>LOANS W v6.0 · Build {DB_VERSION} · IndexedDB</div></div>);
        };

        const ChangePasswordForm = ({ onSuccess }) => { const [cp, setCp] = useState(''); const [np, setNp] = useState(''); const [cf, setCf] = useState(''); const [error, setError] = useState(''); const [loading, setLoading] = useState(false); const { user } = useApp(); const submit = async (e) => { e.preventDefault(); setError(''); if (!cp || !np || !cf) { setError('Completa todos los campos'); return; } if (np !== cf) { setError('No coinciden'); return; } if (np.length < 6) { setError('Mínimo 6 caracteres'); return; } setLoading(true); try { await initDatabase(); const u = await db.users.get(user.id); if (!u) { setError('Usuario no encontrado'); setLoading(false); return; } const v = await SecurityUtils.verifyPassword(cp, u.passwordHash); if (!v) { setError('Contraseña actual incorrecta'); setLoading(false); return; } const nh = await SecurityUtils.hashPassword(np); await db.users.update(user.id, { passwordHash: nh }); onSuccess(); } catch (err) { console.error('Error cambiando contraseña:', err); setError('Error al cambiar la contraseña'); } setLoading(false); }; return <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>{error && <div style={{ padding: '10px', background: 'rgba(239,68,68,0.1)', border: '1px solid rgba(239,68,68,0.25)', borderRadius: '8px', color: '#f87171', fontSize: '12px' }}>{error}</div>}<div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Contraseña actual</label><input type="password" value={cp} onChange={e => setCp(e.target.value)} className="glass-input" required /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Nueva contraseña</label><input type="password" value={np} onChange={e => setNp(e.target.value)} className="glass-input" required /></div><div><label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>Confirmar</label><input type="password" value={cf} onChange={e => setCf(e.target.value)} className="glass-input" required /></div><button type="submit" className="btn btn-primary" style={{ width: '100%' }} disabled={loading}>{loading ? 'Procesando...' : 'Actualizar contraseña'}</button></form>; };

        // ========================================
        // APP PRINCIPAL
        // ========================================
        const App = () => {
            const [appState, setAppState] = useState('loading'); const [user, setUser] = useState(null); const [page, setPage] = useState('dashboard'); const [params, setParams] = useState({}); const [showFab, setShowFab] = useState(true);
            useEffect(() => { initDatabase().then(() => SecurityUtils.validateSession()).then(u => { if (u) { setUser(u); setAppState('main'); } else setAppState('login'); }).catch(() => setAppState('login')); }, []);
            const hl = useCallback((u) => { setUser(u); setAppState('main'); }, []);
            const hlo = useCallback(async () => { await SecurityUtils.destroySession(); setUser(null); setAppState('login'); }, []);
            const nav = useCallback((p, ...a) => { setPage(p); setParams(a); setShowFab(!['createLoan','loanDetail','clientDetail','more','expenses'].includes(p)); window.scrollTo({ top: 0, behavior: 'smooth' }); }, []);
            const fa = useCallback((a) => { if (a==='client') nav('clients'); else if (a==='loan') nav('createLoan'); else if (a==='payment') nav('collections'); else if (a==='expense') nav('expenses'); else if (a==='capital') nav('finance'); }, [nav]);
            const rp = () => { switch(page) { case 'dashboard': return <DashboardPage onNavigate={nav} />; case 'clients': return <ClientsPage onNavigate={nav} />; case 'clientDetail': return <ClientDetailPage id={params[0]} onNavigate={nav} />; case 'loans': return <LoansPage onNavigate={nav} />; case 'createLoan': return <CreateLoanPage preselectedClientId={params[0]} onNavigate={nav} />; case 'loanDetail': return <LoanDetailPage id={params[0]} onNavigate={nav} />; case 'collections': return <CollectionsPage onNavigate={nav} />; case 'finance': return <FinancePage onNavigate={nav} />; case 'expenses': return <ExpensesPage onNavigate={nav} />; case 'more': return <MorePage onNavigate={nav} />; default: return <DashboardPage onNavigate={nav} />; } };
            if (appState === 'loading') return <LoadingScreen />;
            if (appState === 'login') return <LoginScreen onLogin={hl} />;
            return (<AppProvider user={user} onLogout={hlo}><div style={{ minHeight: '100vh', minHeight: '100dvh', background: 'var(--bg-deep)' }}>{rp()}{showFab && <FAB onAction={fa} />}<BottomNav page={page} onNavigate={nav} /><ToastContainer /></div></AppProvider>);
        };

        ReactDOM.render(<App />, document.getElementById('root'));
        console.log('LOANS W v6.0 — Dexie 3 compatible — refreshAllData corregido');
    </script>
</body>
</html>
