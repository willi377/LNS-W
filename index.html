                                                    {payment.receiptNumber}
                                                </span>
                                            </div>
                                        </div>

                                        {payment.note && (
                                            <div style={{
                                                marginTop: '8px',
                                                fontSize: '11px',
                                                color: 'var(--text-muted)',
                                                fontStyle: 'italic'
                                            }}>
                                                {payment.note}
                                            </div>
                                        )}

                                        <div style={{ display: 'flex', gap: '6px', marginTop: '10px' }}>
                                            <button
                                                className="btn btn-ghost btn-xs"
                                                onClick={(e) => { e.stopPropagation(); onViewReceipt(payment); }}
                                            >
                                                <IconSVG.FileText /> Recibo
                                            </button>
                                            <button
                                                className="btn btn-ghost btn-xs"
                                                onClick={(e) => { e.stopPropagation(); onEdit(payment); }}
                                            >
                                                <IconSVG.Edit3 /> Editar
                                            </button>
                                            <button
                                                className="btn btn-ghost btn-xs"
                                                style={{ color: 'var(--danger)' }}
                                                onClick={(e) => { e.stopPropagation(); onDelete(payment); }}
                                            >
                                                <IconSVG.Trash2 /> Eliminar
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    })}
            </div>
        );
    };

    // ============================================================
    // 12. COMPONENT: PAYMENT MODAL - CORREGIDO
    // ============================================================

    const PaymentModal = ({
        isOpen,
        onClose,
        installment,
        loan,
        client,
        user,
        onSuccess,
        onError,
        existingPayment = null
    }) => {
        const { refreshAllData, addToast, installments: allInstallments } = useApp();

        const [step, setStep] = useState('type');
        const [paymentType, setPaymentType] = useState('full_installment');
        const [amount, setAmount] = useState('');
        const [method, setMethod] = useState('Efectivo');
        const [date, setDate] = useState(formatDateLocal(todayLocal()));
        const [note, setNote] = useState('');
        const [customAllocation, setCustomAllocation] = useState({ capital: 0, interest: 0, mora: 0 });

        const [loading, setLoading] = useState(false);
        const [error, setError] = useState('');
        const [previewResult, setPreviewResult] = useState(null);
        const [paymentResult, setPaymentResult] = useState(null);
        const [userEditedAmount, setUserEditedAmount] = useState(false);

        const remainingCapital = normalizeMoney(installment?.remainingAmount || installment?.totalAmount || 0);
        const remainingInterest = normalizeMoney(installment?.interest || 0);
        const remainingMora = installment ? normalizeMoney(MoraEngine.calculateMoraRemaining(installment)) : 0;
        const totalDue = normalizeMoney(remainingCapital + remainingInterest + remainingMora);

        useEffect(() => {
            if (isOpen) {
                setStep('type');
                setPaymentType('full_installment');
                const defaultAmount = totalDue > 0 ? totalDue.toString() : '';
                setAmount(defaultAmount);
                setUserEditedAmount(false);
                setMethod('Efectivo');
                setDate(formatDateLocal(todayLocal()));
                setNote('');
                setCustomAllocation({ capital: 0, interest: 0, mora: 0 });
                setError('');
                setPreviewResult(null);
                setPaymentResult(null);

                if (existingPayment) {
                    setPaymentType(existingPayment.paymentType || 'full_installment');
                    setAmount((existingPayment.amount || 0).toString());
                    setUserEditedAmount(true);
                    setMethod(existingPayment.method || 'Efectivo');
                    setDate(existingPayment.paymentDate ? formatDateLocal(existingPayment.paymentDate) : formatDateLocal(todayLocal()));
                    setNote(existingPayment.note || '');
                    const bd = existingPayment.breakdown || {};
                    setCustomAllocation({
                        capital: bd.capital || 0,
                        interest: bd.interest || 0,
                        mora: bd.mora || 0
                    });
                    setStep('form');
                }
            }
        }, [isOpen, existingPayment, totalDue]);

        const handleAmountChange = (value) => {
            setAmount(value);
            setUserEditedAmount(true);
            setError('');
        };

        const generatePreview = () => {
            const amountValue = normalizeMoney(parseFloat(amount));
            if (!amountValue || amountValue <= 0) {
                setError('Ingresa un monto válido');
                return;
            }

            setError('');

            try {
                const pendingInstallments = allInstallments
                    .filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled')
                    .sort((a, b) => a.number - b.number);

                if (pendingInstallments.length === 0) {
                    setError('No hay cuotas pendientes para este préstamo');
                    return;
                }

                const selectedInst = pendingInstallments.find(i => i.id === installment.id);
                if (!selectedInst) {
                    setError('La cuota seleccionada no está pendiente');
                    return;
                }

                const distribution = PaymentDistributionEngine.distributePayment(
                    pendingInstallments,
                    amountValue,
                    installment.id
                );

                if (distribution.distributed.length === 0) {
                    setError('No se pudo aplicar el pago a ninguna cuota');
                    return;
                }

                const breakdown = { capital: 0, interest: 0, mora: 0 };
                let totalPaid = 0;
                const distributionDetails = [];

                for (const dist of distribution.distributed) {
                    const inst = allInstallments.find(i => i.id === dist.installmentId);
                    if (!inst) continue;

                    const result = PaymentEngine.process({
                        installment: inst,
                        amount: dist.appliedAmount
                    });

                    breakdown.capital = normalizeMoney(breakdown.capital + result.breakdown.capital);
                    breakdown.interest = normalizeMoney(breakdown.interest + result.breakdown.interest);
                    breakdown.mora = normalizeMoney(breakdown.mora + result.breakdown.mora);
                    totalPaid = normalizeMoney(totalPaid + result.totalPaid);

                    distributionDetails.push({
                        installmentNumber: inst.number,
                        originalRemaining: dist.previousRemaining,
                        applied: dist.appliedAmount,
                        newRemaining: dist.newRemaining,
                        isFullyPaid: dist.isFullyPaid,
                        breakdown: result.breakdown
                    });
                }

                const totalCapitalAfter = normalizeMoney(remainingCapital - breakdown.capital);
                const totalInterestAfter = normalizeMoney(remainingInterest - breakdown.interest);
                const totalMoraAfter = normalizeMoney(remainingMora - breakdown.mora);
                const totalAfter = normalizeMoney(totalCapitalAfter + totalInterestAfter + totalMoraAfter);

                const allPaid = distribution.distributed.every(d => d.isFullyPaid);
                const wasFullPayment = amountValue >= totalDue;

                const preview = {
                    installmentId: installment.id,
                    loanId: loan.id,
                    clientName: client?.fullName || 'Cliente',
                    loanNumber: loan?.loanNumber || 'N/A',
                    paymentType,
                    receivedAmount: amountValue,
                    date,
                    method,
                    note,
                    user: user ? user.id : null,
                    allocation: breakdown,
                    installmentStatus: allPaid ? 'paid' : 'partial',
                    isFullPayment: wasFullPayment,
                    surplus: normalizeMoney(amountValue - totalPaid),
                    after: {
                        capital: totalCapitalAfter,
                        interest: totalInterestAfter,
                        mora: totalMoraAfter,
                        total: totalAfter
                    },
                    timestamp: new Date().toISOString(),
                    receiptNumber: `REC-${Date.now().toString(36).toUpperCase()}`,
                    originalValues: {
                        capital: remainingCapital,
                        interest: remainingInterest,
                        mora: remainingMora,
                        total: totalDue
                    },
                    audit: {
                        action: 'payment_created',
                        timestamp: new Date().toISOString(),
                        userId: user ? user.id : null,
                        details: {
                            paymentType,
                            amount: amountValue,
                            allocation: breakdown,
                            distribution: distributionDetails,
                            wasFullPayment,
                            surplus: normalizeMoney(amountValue - totalPaid)
                        }
                    },
                    distribution: distributionDetails
                };

                setPreviewResult(preview);
                setStep('preview');
            } catch (err) {
                setError(err.message || 'Error generando vista previa');
                console.error('[PREVIEW ERROR]', err);
            }
        };

        const confirmPayment = async () => {
            if (!previewResult) return;

            setLoading(true);
            setError('');

            try {
                await initDatabase();

                const result = previewResult;
                const allLoanInstallments = await db.installments.where({ loanId: loan.id }).toArray();

                await db.transaction('rw', db.payments, db.installments, db.loans, db.capitalMovements, db.auditLog, async () => {
                    const paymentRecords = [];
                    let totalCapitalPaid = 0;
                    let totalInterestPaid = 0;
                    let totalMoraPaid = 0;

                    for (const dist of result.distribution) {
                        const inst = allLoanInstallments.find(i => i.number === dist.installmentNumber);
                        if (!inst) continue;

                        const paymentResult = PaymentEngine.process({
                            installment: inst,
                            amount: dist.applied
                        });

                        const newPaidAmount = normalizeMoney((inst.paidAmount || 0) + paymentResult.breakdown.capital + paymentResult.breakdown.interest);
                        const newMoraPaid = normalizeMoney((inst.moraPaid || 0) + paymentResult.breakdown.mora);
                        const newRemaining = normalizeMoney(Math.max(0, (inst.totalAmount || 0) - newPaidAmount));

                        const instStatus = dist.isFullyPaid ? 'paid' : 
                            (paymentResult.breakdown.capital > 0 || paymentResult.breakdown.interest > 0 || paymentResult.breakdown.mora > 0) ? 'partial' : 'pending';

                        await db.installments.update(inst.id, {
                            paidAmount: newPaidAmount,
                            remainingAmount: newRemaining,
                            moraPaid: newMoraPaid,
                            moraRemaining: normalizeMoney(Math.max(0, (inst.moraAmount || 0) - newMoraPaid)),
                            status: instStatus
                        });

                        const paymentData = {
                            loanId: loan.id,
                            clientId: client.id,
                            installmentId: inst.id,
                            amount: dist.applied,
                            paymentDate: result.date,
                            method: result.method,
                            note: result.note || `Distribución: Cuota ${inst.number}`,
                            breakdown: paymentResult.breakdown,
                            paymentType: result.paymentType,
                            receiptNumber: `${result.receiptNumber}-${inst.number}`,
                            isFullPayment: dist.isFullyPaid,
                            surplus: 0,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        };

                        const paymentId = await db.payments.add(paymentData);
                        paymentRecords.push({ ...paymentData, id: paymentId });

                        totalCapitalPaid = normalizeMoney(totalCapitalPaid + paymentResult.breakdown.capital);
                        totalInterestPaid = normalizeMoney(totalInterestPaid + paymentResult.breakdown.interest);
                        totalMoraPaid = normalizeMoney(totalMoraPaid + paymentResult.breakdown.mora);

                        await db.capitalMovements.add({
                            userId: user.id,
                            type: 'payment',
                            amount: dist.applied,
                            date: result.date,
                            description: `Pago ${client.fullName} - ${loan.loanNumber} - Cuota ${inst.number}`,
                            referenceType: 'payment',
                            referenceId: paymentId,
                            createdAt: new Date().toISOString()
                        });
                    }

                    const totalPaid = normalizeMoney((loan.totalPaid || 0) + totalCapitalPaid + totalInterestPaid + totalMoraPaid);
                    const currentBalance = normalizeMoney(Math.max(0, (loan.totalRepayment || 0) - totalPaid));
                    const progress = loan.totalRepayment > 0 ? normalizeMoney((totalPaid / loan.totalRepayment) * 100) : 0;

                    const updatedInstallments = await db.installments.where({ loanId: loan.id }).toArray();
                    const allPaid = updatedInstallments.every(i => i.status === 'paid' || i.status === 'cancelled');
                    const hasOverdue = updatedInstallments.some(i => i.status === 'overdue');

                    let loanStatus = loan.status;
                    if (allPaid) {
                        loanStatus = 'finished';
                    } else if (hasOverdue) {
                        loanStatus = 'overdue';
                    } else if (loan.status === 'overdue') {
                        loanStatus = 'active';
                    }

                    await db.loans.update(loan.id, {
                        totalPaid,
                        currentBalance,
                        progress,
                        status: loanStatus,
                        updatedAt: new Date().toISOString()
                    });

                    await db.auditLog.add({
                        userId: user.id,
                        timestamp: new Date().toISOString(),
                        entityType: 'payment',
                        entityId: paymentRecords[0]?.id || 'multiple',
                        action: 'payment_created',
                        description: `Pago distribuido en ${paymentRecords.length} cuotas para ${client.fullName} - ${loan.loanNumber}`,
                        before: null,
                        after: JSON.stringify({
                            totalAmount: result.receivedAmount,
                            distribution: result.distribution
                        }),
                        details: JSON.stringify({
                            paymentType: result.paymentType,
                            amount: result.receivedAmount,
                            allocation: result.allocation,
                            distribution: result.distribution,
                            wasFullPayment: result.isFullPayment,
                            surplus: result.surplus
                        })
                    });
                });

                await refreshAllData();
                setPaymentResult({ ...previewResult, id: 'payment_saved' });
                setStep('receipt');
                addToast(
                    existingPayment ? 'Abono actualizado correctamente' : 'Abono registrado correctamente',
                    'success'
                );
                if (onSuccess) onSuccess(previewResult);

            } catch (err) {
                console.error('[PAYMENT ERROR]', err);
                setError(err.message || 'Error al guardar el pago');
                if (onError) onError(err);
            }

            setLoading(false);
        };

        const renderTypeStep = () => (
            <>
                <div style={{ fontSize: '18px', fontWeight: '700', marginBottom: '4px' }}>
                    {existingPayment ? 'Editar abono' : 'Registrar abono'}
                </div>
                <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '16px' }}>
                    {client?.fullName} · {loan?.loanNumber}
                </div>

                <div style={{
                    padding: '12px',
                    background: 'rgba(255,255,255,0.02)',
                    borderRadius: 'var(--radius-md)',
                    marginBottom: '16px',
                    display: 'grid',
                    gridTemplateColumns: '1fr 1fr 1fr',
                    gap: '8px',
                    fontSize: '12px'
                }}>
                    <div>
                        <span style={{ color: 'var(--text-muted)' }}>Capital:</span>
                        <span style={{ fontWeight: '600', color: 'var(--accent-light)' }}>
                            {formatCurrency(remainingCapital)}
                        </span>
                    </div>
                    <div>
                        <span style={{ color: 'var(--text-muted)' }}>Intereses:</span>
                        <span style={{ fontWeight: '600', color: 'var(--warning-light)' }}>
                            {formatCurrency(remainingInterest)}
                        </span>
                    </div>
                    <div>
                        <span style={{ color: 'var(--text-muted)' }}>Mora:</span>
                        <span style={{ fontWeight: '600', color: 'var(--danger-light)' }}>
                            {formatCurrency(remainingMora)}
                        </span>
                    </div>
                </div>

                <div style={{ fontSize: '13px', fontWeight: '600', marginBottom: '8px' }}>
                    Selecciona el tipo de abono:
                </div>
                <PaymentTypes
                    selected={paymentType}
                    onSelect={setPaymentType}
                    disabled={!!existingPayment}
                />

                {paymentType === 'custom' && (
                    <div style={{
                        marginTop: '12px',
                        padding: '12px',
                        background: 'rgba(255,255,255,0.02)',
                        borderRadius: 'var(--radius-md)'
                    }}>
                        <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '8px' }}>
                            Distribución personalizada:
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' }}>
                            <div>
                                <label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block' }}>
                                    Capital
                                </label>
                                <input
                                    type="number"
                                    value={customAllocation.capital}
                                    onChange={(e) => setCustomAllocation({
                                        ...customAllocation,
                                        capital: normalizeMoney(parseFloat(e.target.value) || 0)
                                    })}
                                    className="glass-input"
                                    style={{ padding: '6px 10px', fontSize: '13px' }}
                                    min="0"
                                    step="100"
                                />
                            </div>
                            <div>
                                <label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block' }}>
                                    Intereses
                                </label>
                                <input
                                    type="number"
                                    value={customAllocation.interest}
                                    onChange={(e) => setCustomAllocation({
                                        ...customAllocation,
                                        interest: normalizeMoney(parseFloat(e.target.value) || 0)
                                    })}
                                    className="glass-input"
                                    style={{ padding: '6px 10px', fontSize: '13px' }}
                                    min="0"
                                    step="100"
                                />
                            </div>
                            <div>
                                <label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block' }}>
                                    Mora
                                </label>
                                <input
                                    type="number"
                                    value={customAllocation.mora}
                                    onChange={(e) => setCustomAllocation({
                                        ...customAllocation,
                                        mora: normalizeMoney(parseFloat(e.target.value) || 0)
                                    })}
                                    className="glass-input"
                                    style={{ padding: '6px 10px', fontSize: '13px' }}
                                    min="0"
                                    step="100"
                                />
                            </div>
                        </div>
                        <div style={{
                            marginTop: '8px',
                            fontSize: '11px',
                            textAlign: 'center',
                            color: 'var(--text-muted)'
                        }}>
                            Total distribuido: {formatCurrency(customAllocation.capital + customAllocation.interest + customAllocation.mora)}
                            {parseFloat(amount) > 0 && (
                                <span style={{
                                    marginLeft: '8px',
                                    color: Math.abs((customAllocation.capital + customAllocation.interest + customAllocation.mora) - normalizeMoney(parseFloat(amount))) < 0.01 ?
                                        'var(--success)' : 'var(--danger)'
                                }}>
                                    {Math.abs((customAllocation.capital + customAllocation.interest + customAllocation.mora) - normalizeMoney(parseFloat(amount))) < 0.01 ?
                                        '✅ Correcto' :
                                        `⚠️ Debe ser ${formatCurrency(normalizeMoney(parseFloat(amount)))}`
                                    }
                                </span>
                            )}
                        </div>
                    </div>
                )}

                <div style={{ marginTop: '16px' }}>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Valor recibido *
                            </label>
                            <input
                                type="number"
                                value={amount}
                                onChange={(e) => handleAmountChange(e.target.value)}
                                className={`glass-input ${error ? 'error' : ''}`}
                                placeholder={formatCurrency(totalDue)}
                                required
                                autoFocus
                                min="0"
                                step="100"
                            />
                            <div style={{ fontSize: '10px', color: 'var(--text-muted)', marginTop: '4px' }}>
                                {!userEditedAmount && totalDue > 0 ? 
                                    `Saldo pendiente: ${formatCurrency(totalDue)}` :
                                    userEditedAmount ? 'Valor personalizado' : 'Sin saldo pendiente'
                                }
                            </div>
                        </div>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Método de pago
                            </label>
                            <select
                                value={method}
                                onChange={(e) => setMethod(e.target.value)}
                                className="glass-input"
                            >
                                <option>Efectivo</option>
                                <option>Transferencia</option>
                                <option>Nequi</option>
                                <option>Daviplata</option>
                                <option>Tarjeta</option>
                                <option>Otro</option>
                            </select>
                        </div>
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginTop: '10px' }}>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Fecha de pago
                            </label>
                            <input
                                type="date"
                                value={date}
                                onChange={(e) => setDate(e.target.value)}
                                className="glass-input"
                            />
                        </div>
                        <div>
                            <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '4px' }}>
                                Observación
                            </label>
                            <input
                                type="text"
                                value={note}
                                onChange={(e) => setNote(e.target.value)}
                                className="glass-input"
                                placeholder="Opcional"
                            />
                        </div>
                    </div>
                </div>

                {error && (
                    <div style={{
                        marginTop: '12px',
                        padding: '10px',
                        background: 'rgba(239,68,68,0.1)',
                        border: '1px solid rgba(239,68,68,0.25)',
                        borderRadius: '8px',
                        color: 'var(--danger-light)',
                        fontSize: '12px'
                    }}>
                        {error}
                    </div>
                )}

                <div style={{ display: 'flex', gap: '10px', marginTop: '16px' }}>
                    <button className="btn btn-ghost" style={{ flex: 1 }} onClick={onClose}>
                        Cancelar
                    </button>
                    <button className="btn btn-primary" style={{ flex: 1 }} onClick={generatePreview}>
                        <IconSVG.Eye /> Ver resumen
                    </button>
                </div>
            </>
        );

        const renderPreviewStep = () => (
            <>
                <button
                    className="back-btn"
                    onClick={() => setStep('form')}
                    style={{ marginBottom: '8px' }}
                >
                    <IconSVG.ArrowLeft /> Volver
                </button>
                <PaymentPreview
                    result={previewResult}
                    onConfirm={confirmPayment}
                    onCancel={() => setStep('form')}
                    loading={loading}
                />
                {error && (
                    <div style={{
                        marginTop: '12px',
                        padding: '10px',
                        background: 'rgba(239,68,68,0.1)',
                        border: '1px solid rgba(239,68,68,0.25)',
                        borderRadius: '8px',
                        color: 'var(--danger-light)',
                        fontSize: '12px'
                    }}>
                        {error}
                    </div>
                )}
            </>
        );

        const renderReceiptStep = () => (
            <>
                <div style={{
                    padding: '12px',
                    background: 'rgba(16,185,129,0.08)',
                    border: '1px solid rgba(16,185,129,0.15)',
                    borderRadius: 'var(--radius-md)',
                    marginBottom: '16px',
                    color: 'var(--success-light)',
                    fontSize: '14px',
                    fontWeight: '600',
                    textAlign: 'center'
                }}>
                    ✅ Abono registrado correctamente
                </div>
                <PaymentReceipt
                    payment={{
                        ...paymentResult,
                        clientName: client?.fullName,
                        loanNumber: loan?.loanNumber,
                        remainingBalance: paymentResult?.after?.total || 0
                    }}
                    onClose={onClose}
                />
            </>
        );

        if (!isOpen) return null;

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    {step === 'type' && renderTypeStep()}
                    {step === 'form' && renderTypeStep()}
                    {step === 'preview' && renderPreviewStep()}
                    {step === 'receipt' && renderReceiptStep()}
                </div>
            </div>
        );
    };

    // ============================================================
    // 13. COMPONENT: PAYMENT DELETE
    // ============================================================

    const PaymentDelete = ({ payment, isOpen, onClose, onSuccess, onError }) => {
        const { refreshAllData, addToast, user } = useApp();
        const [loading, setLoading] = useState(false);

        if (!payment || !isOpen) return null;

        const handleDelete = async () => {
            setLoading(true);
            try {
                await initDatabase();

                const loan = await db.loans.get(payment.loanId);
                const installment = await db.installments.get(payment.installmentId);

                if (!loan || !installment) {
                    throw new Error('No se encontraron los datos relacionados');
                }

                await db.transaction('rw', db.payments, db.installments, db.loans, db.capitalMovements, db.auditLog, async () => {
                    const bd = payment.breakdown || {};
                    const capitalPaid = normalizeMoney(bd.capital || 0);
                    const interestPaid = normalizeMoney(bd.interest || 0);
                    const moraPaid = normalizeMoney(bd.mora || 0);

                    const newPaidAmount = normalizeMoney(Math.max(0, (installment.paidAmount || 0) - capitalPaid - interestPaid));
                    const newMoraPaid = normalizeMoney(Math.max(0, (installment.moraPaid || 0) - moraPaid));
                    const newRemaining = normalizeMoney(Math.min(
                        installment.totalAmount || 0,
                        (installment.remainingAmount || 0) + capitalPaid + interestPaid
                    ));

                    let status = 'pending';
                    if (newRemaining <= 0.01) {
                        status = 'paid';
                    } else {
                        const daysLate = MoraEngine.calculateMoraDays(installment.dueDate);
                        if (daysLate > 0) {
                            status = 'overdue';
                        }
                    }

                    await db.installments.update(installment.id, {
                        paidAmount: newPaidAmount,
                        remainingAmount: newRemaining,
                        moraPaid: newMoraPaid,
                        moraRemaining: normalizeMoney(Math.max(0, (installment.moraAmount || 0) - newMoraPaid)),
                        status
                    });

                    const totalPaid = normalizeMoney(Math.max(0, (loan.totalPaid || 0) - (payment.amount || 0)));
                    const currentBalance = normalizeMoney(Math.max(0, (loan.totalRepayment || 0) - totalPaid));
                    const progress = loan.totalRepayment > 0 ? normalizeMoney((totalPaid / loan.totalRepayment) * 100) : 0;

                    const allInstallments = await db.installments.where({ loanId: loan.id }).toArray();
                    const allPaid = allInstallments.every(i => i.status === 'paid' || i.status === 'cancelled');
                    const hasOverdue = allInstallments.some(i => i.status === 'overdue');

                    let loanStatus = loan.status;
                    if (allPaid) {
                        loanStatus = 'finished';
                    } else if (hasOverdue) {
                        loanStatus = 'overdue';
                    } else if (loan.status === 'overdue') {
                        loanStatus = 'active';
                    }

                    await db.loans.update(loan.id, {
                        totalPaid,
                        currentBalance,
                        progress,
                        status: loanStatus,
                        updatedAt: new Date().toISOString()
                    });

                    await db.capitalMovements.where({
                        referenceType: 'payment',
                        referenceId: payment.id
                    }).delete();

                    await db.payments.delete(payment.id);

                    await db.auditLog.add({
                        userId: user.id,
                        timestamp: new Date().toISOString(),
                        entityType: 'payment',
                        entityId: payment.id,
                        action: 'payment_deleted',
                        description: `Pago eliminado de ${payment.clientId}`,
                        before: JSON.stringify(payment),
                        after: null,
                        details: JSON.stringify({
                            amount: payment.amount,
                            paymentType: payment.paymentType,
                            reason: 'Eliminado por usuario'
                        })
                    });
                });

                await refreshAllData();
                addToast('Pago eliminado correctamente', 'success');
                if (onSuccess) onSuccess();
                onClose();

            } catch (err) {
                console.error('[DELETE PAYMENT ERROR]', err);
                addToast('Error al eliminar el pago: ' + (err.message || 'Error desconocido'), 'error');
                if (onError) onError(err);
            }

            setLoading(false);
        };

        return (
            <div className="confirm-overlay" onClick={onClose}>
                <div className="confirm-dialog" onClick={e => e.stopPropagation()}>
                    <div style={{ fontSize: '36px', marginBottom: '10px', color: 'var(--danger)' }}>

                        <span style={{ color: 'var(--danger-light)', fontSize: '12px' }}>
                            Esta acción revertirá completamente los efectos financieros de este pago.

                        <br /><br />
                        <div style={{

                            <div><span style={{ color: 'var(--text-muted)' }}>Tipo:</span> {

                            }</div>
                            <div><span style={{ color: 'var(--text-muted)' }}>Capital:</span> {formatCurrency(payment.breakdown?.capital || 0)}</div>
                            <div><span style={{ color: 'var(--text-muted)' }}>Intereses:</span> {formatCurrency(payment.breakdown?.interest || 0)}</div>
                            <div><span style={{ color: 'var(--text-muted)' }}>Mora:</span> {formatCurrency(payment.breakdown?.mora || 0)}</div>

                    <div style={{ display: 'flex', gap: '10px' }}>

        const handleSubmit = async (e) => {
            e.preventDefault();
            setError('');
            if (!doc.trim() || !password.trim()) {
                setError('Completa todos los campos requeridos.');
                return;
            }
            const nd = doc.trim().replace(/\s+/g, '');
            if (isRegistering) {
                if (!fullName.trim()) {
                    setError('El nombre completo es requerido.');
                    return;
                }
                if (password !== confirmPassword) {
                    setError('Las contraseñas no coinciden.');
                    return;
                }
                if (password.length < 6) {
                    setError('La contraseña debe tener al menos 6 caracteres.');
                    return;
                }
            }
            setLoading(true);
            try {
                await initDatabase();
                if (isRegistering) {
                    const ex = await db.users.where({ document: nd }).first();
                    if (ex) {
                        setError('Esta cédula ya está registrada.');
                        setLoading(false);
                        return;
                    }
                    if (email.trim()) {
                        const ee = await db.users.where({ email: email.trim().toLowerCase() }).first();

                            setLoading(false);
                            return;

                    const ph = await SecurityUtils.hashPassword(password);
                    const uid = await db.users.add({
                        fullName: fullName.trim(),
                        document: nd,
                        email: email.trim().toLowerCase(),
                        phone: phone.trim(),
                        passwordHash: ph,
                        createdAt: new Date().toISOString()
                    });
                    await verifyPersistence(db.users, uid);
                    await SecurityUtils.createSession(uid, remember);
                    onLogin({ id: uid, document: nd, fullName: fullName.trim(), email: email.trim().toLowerCase() });
                } else {
                    const u = await db.users.where({ document: nd }).first();
                    if (!u) {
                        setError('No existe una cuenta con esta cédula.');
                        setLoading(false);
                        return;
                    }
                    const v = await SecurityUtils.verifyPassword(password, u.passwordHash);
                    if (!v) {
                        setError('Contraseña incorrecta.');
                        setLoading(false);
                        return;
                    }
                    await SecurityUtils.createSession(u.id, remember);
                    onLogin(u);

                setError(err.message || 'Error inesperado.');

    const ClientsPage = ({ onNavigate }) => {
        const { clients, loans, refreshAllData, addToast, user, loading } = useApp();
        const [search, setSearch] = useState('');
        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);

        const filtered = clients.filter(c =>
            (c.fullName || '').toLowerCase().includes(search.toLowerCase()) ||
            (c.document || '').includes(search)
        );

        const handleSave = async (data) => {
            if (!data.fullName?.trim()) {
                addToast('El nombre es requerido', 'error');
                return;
            }
            try {
                await initDatabase();
                const docData = { ...data, userId: user.id, updatedAt: new Date().toISOString() };
                let savedId;
                if (editing) {
                    await db.clients.update(editing.id, docData);
                    savedId = editing.id;
                } else {
                    docData.createdAt = new Date().toISOString();
                    savedId = await db.clients.add(docData);
                }
                await verifyPersistence(db.clients, savedId);
                await refreshAllData();
                addToast(editing ? 'Cliente actualizado correctamente' : 'Cliente creado correctamente', 'success');
                setShowForm(false);
                setEditing(null);
            } catch (err) {
                addToast(err.message || 'No se pudo guardar el cliente.', 'error');

    const ClientDetailPage = ({ id, onNavigate }) => {
        const { clients, loans, refreshAllData, addToast } = useApp();
        const [showEdit, setShowEdit] = useState(false);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

        const client = clients.find(c => c.id === parseInt(id));
        if (!client) return <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>Cliente no encontrado</div>;

        const cl = loans.filter(l => l.clientId === client.id);
        const tl = normalizeMoney(cl.reduce((s, l) => s + (l.principal || 0), 0));
        const tp = normalizeMoney(cl.filter(l => l.status === 'active' || l.status === 'overdue').reduce((s, l) => s + (l.currentBalance || 0), 0));
        const ac = cl.filter(l => l.status === 'active' || l.status === 'overdue');

        const handleUpdate = async (data) => {
            try {
                await db.clients.update(parseInt(id), { ...data, updatedAt: new Date().toISOString() });
                await verifyPersistence(db.clients, parseInt(id));
                await refreshAllData();
                addToast('Cliente actualizado correctamente', 'success');
                setShowEdit(false);
            } catch (err) {
                addToast('Error al actualizar.', 'error');
            }
        };

        const handleDelete = async () => {
            try {
                if (cl.length > 0) {
                    addToast('No se puede eliminar: tiene préstamos asociados.', 'error');
                    return;
                }
                await db.clients.delete(parseInt(id));
                await refreshAllData();
                addToast('Cliente eliminado', 'success');
                onNavigate('clients');
            } catch {
                addToast('Error al eliminar.', 'error');
            }
            setShowDeleteConfirm(false);
        };

            <div style={{ padding: '20px', paddingBottom: '120px' }}>

                    <IconSVG.ArrowLeft /> Volver

                                width: '56px',
                                height: '56px',
                                borderRadius: '50%',
                                background: 'linear-gradient(135deg, #6366f1, #4f46e5)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                fontSize: '24px',
                                fontWeight: '700',
                                color: 'white',
                                flexShrink: 0
                            }}>
                                {(client.fullName || '?')[0].toUpperCase()}
                            </div>
                            <div>
                                <div style={{ fontSize: '20px', fontWeight: '700' }}>{client.fullName}</div>
                                <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>{client.document} · {client.phone}</div>

                        </div>
                        <div style={{ display: 'flex', gap: '6px' }}>
                            <button className="btn btn-ghost btn-sm" onClick={() => setShowEdit(true)}>
                                <IconSVG.Edit3 /> Editar
                            </button>

                                <IconSVG.Trash2 />
                            </button>
                        </div>
                    </div>

                        <div style={{
                            marginTop: '14px',

                        <div style={{ fontSize: '17px', fontWeight: '700' }}>{ac.length}</div>
                    </div>
                    <div className="glass-card" style={{ padding: '12px', textAlign: 'center' }}>

    const LoanDetailPage = ({ id, onNavigate }) => {
        const { loans, clients, installments, payments, refreshAllData, addToast, user } = useApp();
        const loan = loans.find(l => l.id === parseInt(id));

        const [showPaymentModal, setShowPaymentModal] = useState(false);
        const [selectedInstallment, setSelectedInstallment] = useState(null);
        const [editingPayment, setEditingPayment] = useState(null);
        const [deletingPayment, setDeletingPayment] = useState(null);
        const [viewingReceipt, setViewingReceipt] = useState(null);
        const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
        const [deleting, setDeleting] = useState(false);

        if (!loan) return <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-muted)' }}>
            Préstamo no encontrado
        </div>;

        const client = clients.find(c => c.id === loan.clientId);
        const insts = installments.filter(i => i.loanId === loan.id).sort((a, b) => a.number - b.number);
        const loanPayments = payments.filter(p => p.loanId === loan.id);
        const prog = loan.totalRepayment > 0 ? normalizeMoney((loan.totalPaid || 0) / loan.totalRepayment * 100) : 0;
        const totalMoraLoan = normalizeMoney(insts.reduce((s, i) => s + MoraEngine.calculateMoraRemaining(i), 0));

        const handleDeleteLoan = async () => {
            setDeleting(true);
            try {
                await initDatabase();
                const loanInsts = await db.installments.where({ loanId: loan.id }).toArray();
                const instIds = loanInsts.map(i => i.id);

                await db.transaction('rw', db.loans, db.installments, db.payments, db.capitalMovements, db.auditLog, async () => {
                    if (instIds.length > 0) {
                        await db.payments.where('installmentId').anyOf(instIds).delete();
                    }
                    await db.installments.where({ loanId: loan.id }).delete();
                    await db.capitalMovements.where({ referenceType: 'loan', referenceId: loan.id }).delete();
                    const paymentMovements = await db.capitalMovements
                        .where({ referenceType: 'payment' })
                        .filter(m => instIds.includes(m.referenceId))
                        .toArray();
                    if (paymentMovements.length > 0) {
                        await db.capitalMovements.bulkDelete(paymentMovements.map(m => m.id));
                    }
                    await db.auditLog.where({ entityType: 'loan', entityId: loan.id }).delete();
                    await db.loans.delete(loan.id);
                });

                await cleanOrphanCapitalMovements(user.id);
                await refreshAllData();
                addToast('Préstamo eliminado correctamente.', 'success');
                onNavigate('loans');
            } catch (err) {
                console.error('[DELETE LOAN ERROR]', err);
                addToast('Error al eliminar el préstamo: ' + (err.message || 'Error desconocido'), 'error');
            }
            setDeleting(false);
            setShowDeleteConfirm(false);
        };

        const openPaymentModal = (installment) => {
            setSelectedInstallment(installment);
            setEditingPayment(null);
            setShowPaymentModal(true);
        };

        const openEditPayment = (payment) => {
            setEditingPayment(payment);
            setSelectedInstallment(installments.find(i => i.id === payment.installmentId));
            setShowPaymentModal(true);

    const CollectionsPage = ({ onNavigate }) => {
        const { loans, clients, installments } = useApp();

        const today = todayLocal();

        const data = loans.map(l => ({

            _c: clients.find(c => c.id === l.clientId),
            _i: installments.filter(i => i.loanId === l.id)

        const dueToday = data.filter(l =>

                if (i.status === 'paid' || i.status === 'cancelled') return false;
                const due = parseLocalDate(i.dueDate);
                return getCalendarDaysDiff(today, due) === 0;
            })
        );

        const overdue = data.filter(l =>
            l.status === 'overdue' || l._i?.some(i => i.status === 'overdue')
        );

        const pending = data.filter(l =>
            l.status === 'active' || l.status === 'overdue'
        );

        const paid = data.filter(l => l.status === 'finished');

        const filtered = filter === 'today' ? dueToday :
            filter === 'overdue' ? overdue :
            filter === 'pending' ? pending :
            filter === 'paid' ? paid :
            data;

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', marginBottom: '14px' }}>
                    Cobros
                    <button className="btn btn-success btn-sm" style={{ marginLeft: '8px' }}
                        onClick={() => {
                            const firstPending = data.find(l => l.status === 'active' || l.status === 'overdue');
                            if (firstPending) onNavigate('loanDetail', firstPending.id);
                        }}>
                        <IconSVG.Check /> Registrar abono
                    </button>
                </div>

                <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto' }}>
                    {[
                        { id: 'all', label: 'Todos' },
                        { id: 'today', label: 'Vence hoy' },
                        { id: 'pending', label: 'Pendientes' },
                        { id: 'overdue', label: 'Vencidas' },
                        { id: 'paid', label: 'Pagados' }
                    ].map(f => (
                        <button key={f.id} onClick={() => setFilter(f.id)} className="btn btn-ghost btn-sm"
                            style={{
                                background: filter === f.id ? 'rgba(99,102,241,0.15)' : 'transparent',
                                whiteSpace: 'nowrap'
                            }}>
                            {f.label}
                        </button>
                    ))}
                </div>

                {filtered.length === 0 ? (
                    <EmptyState
                        icon={<IconSVG.Receipt />}
                        title="No hay cobros"
                        description="No se encontraron cobros para este filtro"
                    />
                ) : (
                    filtered.map(l => {
                        const pendingCount = l._i?.filter(i => i.status !== 'paid' && i.status !== 'cancelled').length || 0;
                        const overdueCount = l._i?.filter(i => i.status === 'overdue').length || 0;
                        const todayCount = l._i?.filter(i => {
                            if (i.status === 'paid' || i.status === 'cancelled') return false;
                            return getCalendarDaysDiff(today, parseLocalDate(i.dueDate)) === 0;
                        }).length || 0;

                        const totalWithMora = normalizeMoney(l._i?.reduce((sum, i) => {
                            if (i.status === 'paid' || i.status === 'cancelled') return sum;
                            return sum + normalizeMoney((i.remainingAmount || i.totalAmount || 0) + MoraEngine.calculateMoraRemaining(i));
                        }, 0) || 0);

                        return (
                            <div key={l.id} className="glass-card" onClick={() => onNavigate('loanDetail', l.id)}

                                    <div>

                                        <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                            #{l.loanNumber} · {pendingCount} cuotas pendientes
                                        </div>
                                    </div>
                                    <span style={{
                                        fontWeight: '700',
                                        color: l.status === 'overdue' ? 'var(--danger)' :
                                            l.status === 'active' ? 'var(--warning)' :
                                            'var(--success)'

                                        {formatCurrency(totalWithMora)}
                                    </span>
                                </div>
                                <div style={{ display: 'flex', gap: '8px', fontSize: '10px' }}>
                                    {todayCount > 0 && <span className="today-badge" style={{ padding: '2px 6px' }}>
                                        {todayCount} vence hoy

                                    {overdueCount > 0 && <span className="mora-badge" style={{ padding: '2px 6px' }}>
                                        {overdueCount} vencidas
                                    </span>}
                                </div>
                            </div>

                    })
                )}
            </div>
        );

    const ExpensesPage = ({ onNavigate }) => {
        const { expenses, expenseCategories, refreshAllData, addToast, user } = useApp();
        const [showForm, setShowForm] = useState(false);
        const [editing, setEditing] = useState(null);
        const [showDelete, setShowDelete] = useState(null);

        const now = new Date();
        const thisMonth = expenses.filter(e =>
            new Date(e.date).getUTCMonth() === now.getUTCMonth() &&
            new Date(e.date).getUTCFullYear() === now.getUTCFullYear()
        );
        const totalMonth = normalizeMoney(thisMonth.reduce((s, e) => s + (e.amount || 0), 0));

        const handleSave = async (data) => {
            if (!data.amount || data.amount <= 0) {
                addToast('Monto inválido', 'error');
                return;
            }
            try {
                await initDatabase();
                const amount = normalizeMoney(parseFloat(data.amount));
                let savedId;
                if (editing) {
                    const oldExpense = await db.expenses.get(editing.id);
                    await db.expenses.update(editing.id, { ...data, amount, updatedAt: new Date().toISOString() });
                    savedId = editing.id;
                    if (oldExpense && oldExpense.capitalMovementId) {
                        await db.capitalMovements.update(oldExpense.capitalMovementId, {
                            amount,
                            date: data.date,
                            description: `Gasto: ${data.category}`
                        });
                    }
                } else {
                    savedId = await db.expenses.add({
                        ...data,
                        amount,
                        userId: user.id,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                    const cmId = await db.capitalMovements.add({
                        userId: user.id,
                        type: 'expense',
                        amount,
                        date: data.date,
                        description: `Gasto: ${data.category}`,
                        referenceType: 'expense',
                        referenceId: savedId,
                        createdAt: new Date().toISOString()
                    });
                    await db.expenses.update(savedId, { capitalMovementId: cmId });
                }
                await verifyPersistence(db.expenses, savedId);
                await refreshAllData();
                addToast(editing ? 'Gasto actualizado correctamente' : 'Gasto registrado correctamente', 'success');
                setShowForm(false);
                setEditing(null);
            } catch (err) {
                addToast('No se pudo guardar el gasto.', 'error');
                console.error('[EXPENSE SAVE ERROR]', err);
            }
        };

        const handleDelete = async () => {
            if (!showDelete) return;
            try {
                if (showDelete.capitalMovementId) {
                    await db.capitalMovements.delete(showDelete.capitalMovementId);
                }
                await db.expenses.delete(showDelete.id);
                await refreshAllData();
                addToast('Gasto eliminado', 'success');
                setShowDelete(null);
            } catch (err) {
                addToast('Error al eliminar.', 'error');
                console.error('[EXPENSE DELETE ERROR]', err);
            }
        };

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <button onClick={() => onNavigate('finance')} className="back-btn">
                    <IconSVG.ArrowLeft /> Volver
                </button>

                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '14px' }}>
                    <div style={{ fontSize: '26px', fontWeight: '700' }}>Gastos</div>
                    <button className="btn btn-primary btn-sm" onClick={() => { setEditing(null);
                        setShowForm(true); }}>
                        <IconSVG.Plus /> Registrar
                    </button>
                </div>

                <div className="glass-card" style={{ padding: '14px', marginBottom: '14px', textAlign: 'center' }}>
                    <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>Total del mes</div>
                    <div style={{ fontSize: '22px', fontWeight: '700', color: 'var(--danger)' }}>
                        {formatCurrency(totalMonth)}
                    </div>
                </div>

                {expenses.length === 0 ? (
                    <EmptyState
                        icon={<IconSVG.TrendingUp />}
                        title="Sin gastos"
                        action={<button className="btn btn-primary btn-sm" onClick={() => { setEditing(null);
                            setShowForm(true); }}>
                            + Registrar gasto
                        </button>}
                    />
                ) : (
                    expenses.sort((a, b) => new Date(b.date) - new Date(a.date)).map(e => (
                        <div key={e.id} className="glass-card" style={{
                            padding: '12px',
                            marginBottom: '6px',
                            display: 'flex',
                            justifyContent: 'space-between',

    const ChangePasswordForm = ({ onSuccess }) => {
        const [cp, setCp] = useState('');
        const [np, setNp] = useState('');
        const [cf, setCf] = useState('');
        const [error, setError] = useState('');
        const [loading, setLoading] = useState(false);
        const { user } = useApp();

        const submit = async (e) => {
            e.preventDefault();
            setError('');
            if (!cp || !np || !cf) {
                setError('Completa todos los campos');
                return;
            }
            if (np !== cf) {
                setError('No coinciden');
                return;
            }
            if (np.length < 6) {
                setError('Mínimo 6 caracteres');
                return;
            }
            setLoading(true);
            try {
                await initDatabase();
                const u = await db.users.get(user.id);
                if (!u) {
                    setError('Usuario no encontrado');
                    setLoading(false);
                    return;
                }
                const v = await SecurityUtils.verifyPassword(cp, u.passwordHash);
                if (!v) {
                    setError('Contraseña actual incorrecta');
                    setLoading(false);
                    return;
                }
                const nh = await SecurityUtils.hashPassword(np);
                await db.users.update(user.id, { passwordHash: nh });
                onSuccess();
            } catch (err) {
                console.error('Error cambiando contraseña:', err);
                setError('Error al cambiar la contraseña');
            }
            setLoading(false);
        };

        return (
            <form onSubmit={submit} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {error && <div style={{
                    padding: '10px',
                    background: 'rgba(239,68,68,0.1)',

                        required
                    />
                </div>
                <div>

                    <input
                        type="password"

                        onChange={e => setNp(e.target.value)}
                        className="glass-input"

                    />
                </div>
                <div>

        );
