    const NetProfitDetailModal = ({ isOpen, onClose }) => {
        const { payments, expenses, lostDebts, recoveryMovements, lossCompensations, refreshKey } = useApp();
        const [period, setPeriod] = useState('month');
        const [customStart, setCustomStart] = useState(formatDateLocal(todayLocal()));
        const [customEnd, setCustomEnd] = useState(formatDateLocal(todayLocal()));

        const metrics = useMemo(() => {
            if (!isOpen) return null;
            const now = new Date();
            let startDate, endDate;
            switch (period) {
                case 'today': startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0)); endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999)); break;
                case 'week': const dayOfWeek = now.getUTCDay() || 7; startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - dayOfWeek + 1, 0, 0, 0)); endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999)); break;
                case 'month': startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0)); endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999)); break;
                case 'year': startDate = new Date(Date.UTC(now.getUTCFullYear(), 0, 1, 0, 0, 0)); endDate = new Date(Date.UTC(now.getUTCFullYear(), 11, 31, 23, 59, 59, 999)); break;
                case 'custom': startDate = parseLocalDate(customStart); endDate = parseLocalDate(customEnd); endDate.setUTCHours(23, 59, 59, 999); break;
                default: startDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0)); endDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999));
            }
            const periodPayments = payments.filter(p => { const d = new Date(p.paymentDate); return d >= startDate && d <= endDate; });
            let collectedInterest = 0, collectedMora = 0, collectedCapital = 0;
            for (const p of periodPayments) { const bd = p.breakdown || {}; collectedCapital += normalizeMoney(bd.capital || 0); collectedInterest += normalizeMoney(bd.interest || 0); collectedMora += normalizeMoney(bd.mora || 0); }
            const periodExpenses = expenses.filter(e => { const d = new Date(e.date); return d >= startDate && d <= endDate; });
            const totalExpenses = normalizeMoney(periodExpenses.reduce((s, e) => s + (e.amount || 0), 0));
            const periodCompensations = lossCompensations.filter(c => { const d = new Date(c.appliedAt || c.createdAt); return d >= startDate && d <= endDate; });
            const periodInterestComp = normalizeMoney(periodCompensations.reduce((s, c) => s + normalizeMoney(c.amountAppliedToLoss || 0), 0));
            const lossState = LossCompensationEngine.calculateState(lostDebts, recoveryMovements, lossCompensations);
            const totalPendingLoss = lossState.totalPending;
            const grossProfit = normalizeMoney(collectedInterest + collectedMora);
            const availableProfit = normalizeMoney(grossProfit - periodInterestComp - totalExpenses);
            return { grossProfit, collectedInterest: normalizeMoney(collectedInterest), collectedMora: normalizeMoney(collectedMora), collectedCapital: normalizeMoney(collectedCapital), totalExpenses, periodInterestComp, totalPendingLoss, availableProfit, compensationsCount: periodCompensations.length, expensesCount: periodExpenses.length, paymentsCount: periodPayments.length };
        }, [isOpen, period, customStart, customEnd, payments, expenses, lostDebts, recoveryMovements, lossCompensations, refreshKey]);

        if (!isOpen || !metrics) return null;

        return (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '18px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <div style={{ color: 'var(--success)' }}><IconSVG.ChartBar /></div>
                            <div style={{ fontSize: '20px', fontWeight: '700' }}>Utilidad Neta</div>
                        </div>
                        <button onClick={onClose} className="btn btn-ghost btn-sm"><IconSVG.X /></button>
                    </div>
                    <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto', flexWrap: 'wrap' }}>
                        {[{ id: 'today', label: 'Hoy' }, { id: 'week', label: 'Semana' }, { id: 'month', label: 'Mes' }, { id: 'year', label: 'Año' }, { id: 'custom', label: 'Custom' }].map(p => (
                            <button key={p.id} onClick={() => setPeriod(p.id)} className="btn btn-ghost btn-sm"
                                style={{ background: period === p.id ? 'rgba(99,102,241,0.15)' : 'transparent', whiteSpace: 'nowrap' }}>
                                {p.label}
                            </button>
                        ))}
                    </div>
                    {period === 'custom' && (
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                            <div><label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>Desde</label><input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} className="glass-input" style={{ fontSize: '13px', padding: '8px 12px' }} /></div>
                            <div><label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>Hasta</label><input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} className="glass-input" style={{ fontSize: '13px', padding: '8px 12px' }} /></div>
                        </div>
                    )}
                    <div style={{ background: 'var(--bg-primary)', border: '1px solid var(--glass-border)', borderRadius: 'var(--radius-lg)', padding: '20px', marginBottom: '14px' }}>
                        <div style={{ fontSize: '13px', fontWeight: '700', color: 'var(--accent-light)', marginBottom: '14px' }}>Utilidad disponible</div>
                        <div className="financial-detail-row">
                            <div><div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>Ganancias generadas</div><div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>({metrics.paymentsCount} pagos)</div></div>
                            <div style={{ textAlign: 'right' }}><div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--success)' }}>+{formatCurrency(metrics.grossProfit)}</div></div>
                        </div>
                        <div className="financial-detail-row">
                            <div><div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>− Aplicado a pérdidas</div><div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{metrics.compensationsCount} compensación(es)</div></div>
                            <div style={{ textAlign: 'right' }}><div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--accent-light)' }}>−{formatCurrency(metrics.periodInterestComp)}</div></div>
                        </div>
                        <div className="financial-detail-row">
                            <div><div style={{ fontSize: '13px', color: 'var(--text-secondary)' }}>− Gastos</div><div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{metrics.expensesCount} gastos</div></div>
                            <div style={{ textAlign: 'right' }}><div style={{ fontSize: '15px', fontWeight: '700', color: 'var(--danger)' }}>−{formatCurrency(metrics.totalExpenses)}</div></div>
                        </div>
                        <div className="financial-detail-row total">
                            <div style={{ color: 'var(--text-secondary)' }}>= Utilidad disponible</div>
                            <div style={{ color: metrics.availableProfit >= 0 ? 'var(--success)' : 'var(--danger)', fontSize: '20px' }}>{formatCurrency(metrics.availableProfit)}</div>
                        </div>
                        <div style={{ marginTop: '12px', padding: '12px', background: 'rgba(220,38,38,0.05)', border: '1px solid rgba(220,38,38,0.15)', borderRadius: 'var(--radius-sm)' }}>
                            <div className="financial-detail-row" style={{ borderBottom: 'none', padding: '4px 0' }}>
                                <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Pérdida pendiente global</span>
                                <span style={{ fontWeight: '700', color: metrics.totalPendingLoss > 0 ? 'var(--danger)' : 'var(--recovery)' }}>{formatCurrency(metrics.totalPendingLoss)}</span>
                            </div>
                        </div>
                    </div>
                    <button className="btn btn-primary" style={{ width: '100%' }} onClick={onClose}>Entendido</button>
                </div>
            </div>
        );
    };

    // ============================================================

    // ============================================================

    const MiCuentaEmpleado = ({ onNavigate }) => {
        const { user, incomingRequests, linkagesList, respondLinkRequest, refreshAllData, addToast } = useApp();
        const [expandedRequest, setExpandedRequest] = useState(null);

        let linkStatus = 'none';
        if (linkedBosses.length > 0) linkStatus = 'linked';
        else if (pendingIncoming.length > 0) linkStatus = 'pending';

        const handleCopyCode = async () => {
            if (!user.employeeCode) return;
            try { await navigator.clipboard.writeText(user.employeeCode); addToast('Código copiado', 'success'); }
            catch { addToast('No se pudo copiar', 'warning'); }

        const handleShareCode = async () => {
            if (!user.employeeCode) return;
            try {
                const text = `Mi código de empleado en Loans W es: ${user.employeeCode}`;
                if (navigator.share) await navigator.share({ title: 'Código de empleado', text });
                else { await navigator.clipboard.writeText(text); addToast('Texto copiado', 'success'); }

                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <LinkStatusChip status={linkStatus} />
                        {linkedBosses.length > 0 && <span style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>{linkedBosses.length} jefe(s)</span>}
                    </div>
                </div>
                {pendingIncoming.length > 0 && (
                    <div style={{ marginBottom: '14px' }}>
                        <div style={{ fontSize: '11px', color: 'var(--text-muted)', textTransform: 'uppercase', marginBottom: '10px' }}>Solicitudes pendientes ({pendingIncoming.length})</div>
                        {pendingIncoming.map(req => (
                            <div key={req.id} style={{ padding: '14px', background: 'rgba(245,158,11,0.05)', border: '1px solid rgba(245,158,11,0.2)', borderRadius: 'var(--radius-md)', marginBottom: '8px' }}>

// ============================================================
    // 20. PANEL DEL JEFE
    // ============================================================

    const PanelJefe = ({ onNavigate }) => {
        const { user, linkedEmployees, loans, clients, installments, payments, lostDebts, recoveryMovements, lossCompensations, sendLinkRequest, refreshAllData, addToast } = useApp();
        const [searchCode, setSearchCode] = useState('');
        const [searchName, setSearchName] = useState('');
        const [periodFilter, setPeriodFilter] = useState('month');
        const [customStart, setCustomStart] = useState(formatDateLocal(todayLocal()));
        const [customEnd, setCustomEnd] = useState(formatDateLocal(todayLocal()));
        const [searching, setSearching] = useState(false);
        const [searchResult, setSearchResult] = useState(null);
        const [searchError, setSearchError] = useState('');
        const [showAddEmployee, setShowAddEmployee] = useState(false);
        const [newEmpCode, setNewEmpCode] = useState('');
        const [newEmpMessage, setNewEmpMessage] = useState('');
        const [sendingRequest, setSendingRequest] = useState(false);

        const dateRange = useMemo(() => {
            const now = new Date();
            switch (periodFilter) {
                case 'today': return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999)) };
                case 'week': const dow = now.getUTCDay() || 7; return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() - dow + 1, 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 23, 59, 59, 999)) };
                case 'month': return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999)) };
                case 'year': return { start: new Date(Date.UTC(now.getUTCFullYear(), 0, 1, 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), 11, 31, 23, 59, 59, 999)) };
                case 'custom': const cs = parseLocalDate(customStart); const ce = parseLocalDate(customEnd); ce.setUTCHours(23, 59, 59, 999); return { start: cs, end: ce };
                default: return { start: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1, 0, 0, 0)), end: new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0, 23, 59, 59, 999)) };
            }
        }, [periodFilter, customStart, customEnd]);

        const metrics = useMemo(() => {
            const empIds = (linkedEmployees || []).map(e => e.id);
            const allVisibleIds = [user.id, ...empIds];
            const visibleLoans = (loans || []).filter(l => allVisibleIds.includes(l.ownerId || l.userId));
            const visibleInstallments = (installments || []).filter(inst => visibleLoans.find(l => l.id === inst.loanId));
            const visiblePayments = (payments || []).filter(p => visibleLoans.find(l => l.id === p.loanId));
            const visibleLostDebts = (lostDebts || []).filter(d => allVisibleIds.includes(d.ownerId || d.userId));
            const visibleRecoveries = (recoveryMovements || []).filter(r => allVisibleIds.includes(r.ownerId || r.userId));
            const visibleCompensations = (lossCompensations || []).filter(c => allVisibleIds.includes(c.ownerId || c.userId));
            const activeLoans = visibleLoans.filter(l => l.status === 'active' || l.status === 'overdue');
            const capitalPlaced = normalizeMoney(activeLoans.reduce((s, l) => s + (l.currentBalance || 0), 0));
            const periodPayments = visiblePayments.filter(p => { const d = new Date(p.paymentDate || p.createdAt); return d >= dateRange.start && d <= dateRange.end; });
            let capitalRecovered = 0, interestCollected = 0, moraCollected = 0, totalCollected = 0;
            for (const p of periodPayments) { const bd = p.breakdown || {}; capitalRecovered += normalizeMoney(bd.capital || 0); interestCollected += normalizeMoney(bd.interest || 0); moraCollected += normalizeMoney(bd.mora || 0); totalCollected += normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0)); }
            let totalPorRecuperar = 0;
            for (const loan of activeLoans) {
                const loanInsts = visibleInstallments.filter(i => i.loanId === loan.id && i.status !== 'paid' && i.status !== 'cancelled');
                for (const inst of loanInsts) totalPorRecuperar += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst));
            }
            const overdueInstallments = visibleInstallments.filter(i => i.status === 'overdue');
            const moraClientIds = new Set();
            for (const inst of overdueInstallments) { const loan = visibleLoans.find(l => l.id === inst.loanId); if (loan) moraClientIds.add(loan.clientId); }
            const lossState = LossCompensationEngine.calculateState(visibleLostDebts, visibleRecoveries, visibleCompensations);
            return { employeesCount: (linkedEmployees || []).length, capitalPlaced, capitalRecovered: normalizeMoney(capitalRecovered), totalCollected: normalizeMoney(totalCollected), interestCollected: normalizeMoney(interestCollected), moraCollected: normalizeMoney(moraCollected), totalPorRecuperar: normalizeMoney(totalPorRecuperar), moraClientCount: moraClientIds.size, activeLoansCount: activeLoans.length, totalLostCapital: lossState.totalLostCapital, totalPendingLost: lossState.totalPending, periodPaymentsCount: periodPayments.length };
        }, [user, linkedEmployees, loans, installments, payments, lostDebts, recoveryMovements, lossCompensations, dateRange]);

        const handleSearchByCode = async () => {
            const code = searchCode.trim().toUpperCase();
            if (!code) { setSearchError('Ingresa un código'); return; }
            setSearching(true); setSearchError(''); setSearchResult(null);
            try {
                const sb = await waitForSupabase(5000);
                if (sb) {
                    const { data, error } = await sb.from('users').select('*').eq('employee_code', code).limit(1);
                    if (error) throw error;
                    if (!data || data.length === 0) { setSearchError('No encontramos un empleado con ese código.'); setSearching(false); return; }
                    const emp = data[0];
                    if (emp.role !== 'employee') { setSearchError('Ese código no pertenece a un empleado.'); setSearching(false); return; }
                    const localEmp = await db.users.where({ supabaseId: emp.id }).first();
                    const isLinked = localEmp ? (user.linkedEmployeeIds || []).includes(localEmp.id) : false;
                    const pendingReq = await db.linkRequests.where({ bossId: user.id }).filter(r => r.status === 'pending' && r.employeeCode === code).first();
                    setSearchResult({ employee: { id: emp.id, supabaseId: emp.id, fullName: emp.full_name, employeeCode: emp.employee_code, role: emp.role }, isLinked, hasPendingRequest: !!pendingReq });
                } else {
                    const emp = await db.users.where({ employeeCode: code }).first();
                    if (!emp) { setSearchError('No encontramos un empleado con ese código.'); setSearching(false); return; }
                    const isLinked = (user.linkedEmployeeIds || []).includes(emp.id);
                    const pendingReq = await db.linkRequests.where({ bossId: user.id, employeeId: emp.id, status: 'pending' }).first();
                    setSearchResult({ employee: emp, isLinked, hasPendingRequest: !!pendingReq });
                }
            } catch (err) {
                console.error('[SEARCH]', err);
                setSearchError('Error buscando. Intenta de nuevo.');
            }
            setSearching(false);
        };

        const filteredEmployees = useMemo(() => {
            if (!searchName.trim()) return linkedEmployees;
            const t = searchName.toLowerCase().trim();
            return (linkedEmployees || []).filter(e => (e.fullName || '').toLowerCase().includes(t) || (e.employeeCode || '').toLowerCase().includes(t));
        }, [linkedEmployees, searchName]);

        const handleSendLinkRequest = async () => {
            setSendingRequest(true);
            const result = await sendLinkRequest(newEmpCode, newEmpMessage);
            if (result.ok) {
                addToast(`Solicitud enviada a ${result.employee.fullName || result.employee.employeeCode}`, 'success');
                setNewEmpCode(''); setNewEmpMessage(''); setShowAddEmployee(false); setSearchResult(null); setSearchCode('');
                await refreshAllData();
            } else { addToast(result.error || 'Error al enviar', 'error'); }
            setSendingRequest(false);
        };

        if (!user || user.role !== 'boss') {
            return <EmptyState icon={<IconSVG.Boss />} title="Solo jefes" />;
        }

        return (
            <div style={{ padding: '20px', paddingBottom: '120px' }}>
                <div className="boss-header">
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                        <span style={{ color: 'var(--boss)' }}><IconSVG.Boss /></span>
                        <div style={{ flex: 1 }}>
                            <div style={{ fontSize: '16px', fontWeight: '700', letterSpacing: '-0.3px' }}>PANEL DEL NEGOCIO</div>
                            <div style={{ fontSize: '11px', color: 'var(--text-secondary)' }}>{user.fullName || 'Jefe'} · {metrics.employeesCount} empleados</div>
                        </div>
                        <SyncStatusPanel compact />
                    </div>
                </div>

                <div style={{ display: 'flex', gap: '6px', marginBottom: '14px', overflow: 'auto', paddingBottom: '4px' }}>
                    {[{ id: 'today', label: 'Hoy' }, { id: 'week', label: 'Semana' }, { id: 'month', label: 'Mes' }, { id: 'year', label: 'Año' }, { id: 'custom', label: 'Custom' }].map(p => (
                        <button key={p.id} onClick={() => setPeriodFilter(p.id)} className="btn btn-ghost btn-sm"
                            style={{ background: periodFilter === p.id ? 'rgba(245,158,11,0.15)' : 'transparent', borderColor: periodFilter === p.id ? 'rgba(245,158,11,0.4)' : undefined, color: periodFilter === p.id ? 'var(--warning-light)' : undefined, whiteSpace: 'nowrap' }}>
                            {p.label}
                        </button>
                    ))}
                </div>

                {periodFilter === 'custom' && (
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                        <div><label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>Desde</label><input type="date" value={customStart} onChange={e => setCustomStart(e.target.value)} className="glass-input" style={{ fontSize: '13px', padding: '8px 12px' }} /></div>
                        <div><label style={{ fontSize: '10px', color: 'var(--text-muted)', display: 'block', marginBottom: '4px' }}>Hasta</label><input type="date" value={customEnd} onChange={e => setCustomEnd(e.target.value)} className="glass-input" style={{ fontSize: '13px', padding: '8px 12px' }} /></div>
                    </div>
                )}

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px', marginBottom: '14px' }}>
                    <div className="glass-card disabled" style={{ padding: '14px' }}>
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Empleados</div>
                        <div style={{ fontSize: '22px', fontWeight: '700', color: 'var(--employee)' }}>{metrics.employeesCount}</div>
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px' }}>
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Capital colocado</div>
                        <AnimatedNumber value={metrics.capitalPlaced} style={{ fontSize: '18px', fontWeight: '700', color: 'var(--accent-light)', display: 'block' }} />
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>{metrics.activeLoansCount} activos</div>
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px' }}>
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Cobrado</div>
                        <AnimatedNumber value={metrics.totalCollected} style={{ fontSize: '18px', fontWeight: '700', color: 'var(--success)', display: 'block' }} />
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>{metrics.periodPaymentsCount} pagos</div>
                    </div>
                    <div className="glass-card disabled" style={{ padding: '14px' }}>
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)', textTransform: 'uppercase' }}>Por recuperar</div>
                        <AnimatedNumber value={metrics.totalPorRecuperar} style={{ fontSize: '18px', fontWeight: '700', color: 'var(--warning)', display: 'block' }} />
                        <div style={{ fontSize: '9px', color: 'var(--text-muted)' }}>{metrics.moraClientCount} en mora</div>
                    </div>
                </div>

                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '14px' }}>
                    <div style={{ fontSize: '11px', fontWeight: '600', color: 'var(--text-secondary)', textTransform: 'uppercase', marginBottom: '10px' }}>Financiero del período</div>
                    <div className="financial-detail-row"><span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Capital recuperado</span><span style={{ fontWeight: '600', color: 'var(--accent-light)' }}>{formatCurrency(metrics.capitalRecovered)}</span></div>
                    <div className="financial-detail-row"><span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Intereses cobrados</span><span style={{ fontWeight: '600', color: 'var(--success)' }}>{formatCurrency(metrics.interestCollected)}</span></div>
                    <div className="financial-detail-row"><span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Mora cobrada</span><span style={{ fontWeight: '600', color: 'var(--danger-light)' }}>{formatCurrency(metrics.moraCollected)}</span></div>
                    {metrics.totalPendingLost > 0 && (
                        <div className="financial-detail-row"><span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>Pérdidas por recuperar</span><span style={{ fontWeight: '600', color: 'var(--danger)' }}>{formatCurrency(metrics.totalPendingLost)}</span></div>
                    )}
                </div>

                <div className="glass-card disabled" style={{ padding: '16px', marginBottom: '14px' }}>
                    <div style={{ fontSize: '13px', fontWeight: '700', marginBottom: '10px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <IconSVG.Search /> Buscar empleado por código
                    </div>
                    <div style={{ display: 'flex', gap: '8px', marginBottom: '8px' }}>
                        <input type="text" value={searchCode} onChange={e => setSearchCode(e.target.value.toUpperCase())} className="glass-input" placeholder="LW-EMP-XXXXXX" style={{ fontFamily: 'SF Mono, monospace', letterSpacing: '0.5px' }} />
                        <button className="btn btn-boss btn-sm" onClick={handleSearchByCode} disabled={searching}>
                            {searching ? <span className="spinner" style={{ width: '14px', height: '14px' }}></span> : 'Buscar'}
                        </button>
                    </div>
                    {searchError && (<div style={{ padding: '10px', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: '8px', color: 'var(--danger-light)', fontSize: '12px' }}>{searchError}</div>)}
                    {searchResult && (
                        <div style={{ padding: '14px', background: searchResult.isLinked ? 'rgba(16,185,129,0.05)' : 'rgba(245,158,11,0.05)', border: `1px solid ${searchResult.isLinked ? 'rgba(16,185,129,0.2)' : 'rgba(245,158,11,0.2)'}`, borderRadius: 'var(--radius-md)', marginTop: '10px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '10px' }}>
                                <div style={{ width: '42px', height: '42px', borderRadius: '50%', background: 'linear-gradient(135deg, #8b5cf6, #7c3aed)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px', fontWeight: '700', color: 'white' }}>
                                    {getSafeInitial(searchResult.employee.fullName)}
                                </div>
                                <div style={{ flex: 1 }}>
                                    <div style={{ fontSize: '14px', fontWeight: '600' }}>{searchResult.employee.fullName || 'Empleado'}</div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)', fontFamily: 'SF Mono, monospace' }}>{searchResult.employee.employeeCode}</div>
                                </div>
                                <LinkStatusChip status={searchResult.isLinked ? 'linked' : searchResult.hasPendingRequest ? 'pending' : 'none'} />
                            </div>
                            {searchResult.isLinked ? (
                                <button className="btn btn-boss btn-sm" style={{ width: '100%' }} onClick={() => onNavigate('perfilSupervision', searchResult.employee.id)}>
                                    <IconSVG.Eye /> Ver perfil
                                </button>
                            ) : searchResult.hasPendingRequest ? (
                                <div style={{ fontSize: '12px', color: 'var(--warning-light)', textAlign: 'center' }}>Solicitud pendiente</div>
                            ) : (
                                <button className="btn btn-boss btn-sm" style={{ width: '100%' }} onClick={() => { setNewEmpCode(searchResult.employee.employeeCode); setShowAddEmployee(true); }}>
                                    <IconSVG.UserPlus /> Enviar solicitud
                                </button>
                            )}
                        </div>
                    )}
                </div>

                <div style={{ position: 'relative', marginBottom: '14px' }}>
                    <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }}><IconSVG.Search /></span>
                    <input type="text" placeholder="Filtrar por nombre o código..." value={searchName} onChange={e => setSearchName(e.target.value)} className="glass-input" style={{ paddingLeft: '38px' }} />
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                    <div style={{ fontSize: '14px', fontWeight: '700' }}>Mis empleados ({filteredEmployees.length})</div>
                    <button className="btn btn-boss btn-sm" onClick={() => setShowAddEmployee(true)}>
                        <IconSVG.UserPlus /> Agregar
                    </button>
                </div>

                {filteredEmployees.length === 0 ? (
                    <EmptyState icon={<IconSVG.Users />} title={searchName ? 'Sin resultados' : 'Sin empleados'} description={searchName ? 'Ningún empleado coincide' : 'Agrega empleados por su código único'} action={!searchName && (<button className="btn btn-boss" onClick={() => setShowAddEmployee(true)}><IconSVG.UserPlus /> Agregar</button>)} />
                ) : (
                    filteredEmployees.map(emp => {
                        const empLoans = (loans || []).filter(l => (l.ownerId || l.userId) === emp.id);
                        const empActiveLoans = empLoans.filter(l => l.status === 'active' || l.status === 'overdue');
                        const empCapitalPlaced = normalizeMoney(empActiveLoans.reduce((s, l) => s + (l.currentBalance || 0), 0));
                        const empLoanIds = empLoans.map(l => l.id);
                        const empPayments = (payments || []).filter(p => empLoanIds.includes(p.loanId));
                        let empTotalCollected = 0;
                        for (const p of empPayments) { const bd = p.breakdown || {}; empTotalCollected += normalizeMoney((bd.capital || 0) + (bd.interest || 0) + (bd.mora || 0)); }
                        const empOverdueCount = (installments || []).filter(inst => { if (inst.status !== 'overdue') return false; return empLoans.some(l => l.id === inst.loanId); }).length;
                        return (
                            <div key={emp.id} className="employee-card" onClick={() => onNavigate('perfilSupervision', emp.id)}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '10px' }}>
                                    <div style={{ width: '42px', height: '42px', borderRadius: '50%', background: 'linear-gradient(135deg, #8b5cf6, #7c3aed)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '18px', fontWeight: '700', color: 'white', flexShrink: 0 }}>
                                        {getSafeInitial(emp.fullName)}
                                    </div>
                                    <div style={{ flex: 1, minWidth: 0 }}>
                                        <div className="truncate" style={{ fontSize: '14px', fontWeight: '600' }}>{emp.fullName || 'Empleado'}</div>
                                        <div style={{ fontSize: '10px', color: 'var(--text-muted)', fontFamily: 'SF Mono, monospace' }}>{emp.employeeCode || '—'}</div>
                                    </div>
                                    <span className="badge badge-success">Activo</span>
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '6px', fontSize: '10px' }}>
                                    <div><div style={{ color: 'var(--text-muted)' }}>Colocado</div><div style={{ fontWeight: '700', color: 'var(--accent-light)', fontSize: '12px' }}>{formatCurrency(empCapitalPlaced)}</div></div>
                                    <div><div style={{ color: 'var(--text-muted)' }}>Cobrado</div><div style={{ fontWeight: '700', color: 'var(--success)', fontSize: '12px' }}>{formatCurrency(empTotalCollected)}</div></div>
                                    <div><div style={{ color: 'var(--text-muted)' }}>En mora</div><div style={{ fontWeight: '700', color: empOverdueCount > 0 ? 'var(--danger)' : 'var(--text-muted)', fontSize: '12px' }}>{empOverdueCount} cuotas</div></div>
                                </div>
                            </div>
                        );
                    })
                )}

                {showAddEmployee && (
                    <div className="modal-overlay" onClick={() => setShowAddEmployee(false)}>
                        <div className="modal-content" onClick={e => e.stopPropagation()}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '18px' }}>
                                <div style={{ fontSize: '20px', fontWeight: '700', display: 'flex', alignItems: 'center', gap: '8px' }}><IconSVG.UserPlus /> Agregar empleado</div>
                                <button onClick={() => setShowAddEmployee(false)} className="btn btn-ghost btn-sm"><IconSVG.X /></button>
                            </div>
                            <div style={{ padding: '12px', background: 'rgba(245,158,11,0.05)', border: '1px solid rgba(245,158,11,0.15)', borderRadius: '10px', fontSize: '11px', color: 'var(--warning-light)', lineHeight: '1.5', marginBottom: '14px' }}>
                                Se enviará una solicitud al empleado. Deberá aceptarla desde su cuenta.
                            </div>
                            <div style={{ marginBottom: '12px' }}>
                                <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Código del empleado *</label>
                                <input type="text" value={newEmpCode} onChange={e => setNewEmpCode(e.target.value.toUpperCase())} className="glass-input" placeholder="LW-EMP-XXXXXX" style={{ fontFamily: 'SF Mono, monospace', textTransform: 'uppercase' }} autoFocus />
                            </div>
                            <div style={{ marginBottom: '16px' }}>
                                <label style={{ fontSize: '11px', color: 'var(--text-secondary)', display: 'block', marginBottom: '5px' }}>Mensaje (opcional)</label>
                                <input type="text" value={newEmpMessage} onChange={e => setNewEmpMessage(e.target.value)} className="glass-input" maxLength={120} />
                            </div>
                            <div style={{ display: 'flex', gap: '10px' }}>
                                <button className="btn btn-ghost" style={{ flex: 1 }} onClick={() => setShowAddEmployee(false)}>Cancelar</button>
                                <button className="btn btn-boss" style={{ flex: 1 }} onClick={handleSendLinkRequest} disabled={sendingRequest || !newEmpCode.trim()}>
                                    {sendingRequest ? <span className="spinner" style={{ width: '16px', height: '16px' }}></span> : <><IconSVG.UserPlus /> Enviar</>}
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ============================================================
    // 21. PERFIL DE SUPERVISIÓN — FIX B APLICADO (HOOKS AL INICIO)
    // ============================================================

    const PerfilSupervision = ({ employeeId, onNavigate }) => {
        const { user, loans, clients, installments, payments, expenses, lostDebts, recoveryMovements, lossCompensations, refreshAllData, addToast } = useApp();

        // ═══════════════════════════════════════════════════════════
        // TODOS LOS HOOKS DEBEN IR AQUÍ, ANTES DE CUALQUIER RETURN
        // ═══════════════════════════════════════════════════════════

        const [employee, setEmployee] = useState(null);
        const [loadingEmp, setLoadingEmp] = useState(true);
        const [tab, setTab] = useState('resumen');
        const [moraFilter, setMoraFilter] = useState('all');
        const [showUnlinkConfirm, setShowUnlinkConfirm] = useState(false);
        const [unlinking, setUnlinking] = useState(false);

        // ═══ useEffect ═══
        useEffect(() => {
            let cancelled = false;
            const loadEmp = async () => {
                if (!user || user.role !== 'boss') {
                    if (!cancelled) setLoadingEmp(false);
                    return;
                }
                try {
                    const emp = await db.users.get(parseInt(employeeId));
                    if (cancelled) return;
                    if (!emp) { setEmployee(null); setLoadingEmp(false); return; }
                    const isLinked = (user.linkedEmployeeIds || []).includes(emp.id);
                    if (!isLinked) { setEmployee(null); setLoadingEmp(false); return; }
                    setEmployee(emp);
                } catch (err) {
                    console.error('[PERFIL]', err);
                    if (!cancelled) setEmployee(null);
                }
                if (!cancelled) setLoadingEmp(false);
            };
            loadEmp();
            return () => { cancelled = true; };
        }, [employeeId, user]);

        // ═══ useMemo: datos derivados (SIEMPRE ejecutados) ═══
        const empLoans = useMemo(() => {
            if (!employee) return [];
            return (loans || []).filter(l => (l.ownerId || l.userId) === employee.id);
        }, [employee, loans]);

        const empLoanIds = useMemo(() => empLoans.map(l => l.id), [empLoans]);

        const empClients = useMemo(() => {
            if (!employee) return [];
            return (clients || []).filter(c => (c.ownerId || c.userId) === employee.id);
        }, [employee, clients]);

        const empInstallments = useMemo(() => (installments || []).filter(i => empLoanIds.includes(i.loanId)), [installments, empLoanIds]);

        const empPayments = useMemo(() => (payments || []).filter(p => empLoanIds.includes(p.loanId)), [payments, empLoanIds]);

        const empExpenses = useMemo(() => {
            if (!employee) return [];
            return (expenses || []).filter(e => (e.ownerId || e.userId) === employee.id);
        }, [employee, expenses]);

        const empLostDebts = useMemo(() => {
            if (!employee) return [];
            return (lostDebts || []).filter(d => (d.ownerId || d.userId) === employee.id);
        }, [employee, lostDebts]);

        const empRecoveries = useMemo(() => {
            if (!employee) return [];
            return (recoveryMovements || []).filter(r => (r.ownerId || r.userId) === employee.id);
        }, [employee, recoveryMovements]);

        const empCompensations = useMemo(() => {
            if (!employee) return [];
            return (lossCompensations || []).filter(c => (c.ownerId || c.userId) === employee.id);
        }, [employee, lossCompensations]);

        const metrics = useMemo(() => {
            const activeLoans = empLoans.filter(l => l.status === 'active' || l.status === 'overdue');
            const totalCapitalLent = normalizeMoney(empLoans.reduce((s, l) => s + (Number(l.principal) || 0), 0));
            const capitalPlaced = normalizeMoney(activeLoans.reduce((s, l) => s + (Number(l.currentBalance) || 0), 0));
            let capitalRecovered = 0, interestCollected = 0, moraCollected = 0;
            for (const p of empPayments) {
                const bd = p.breakdown || {};
                capitalRecovered += normalizeMoney(bd.capital || 0);
                interestCollected += normalizeMoney(bd.interest || 0);
                moraCollected += normalizeMoney(bd.mora || 0);
            }
            const lossState = LossCompensationEngine.calculateState(empLostDebts, empRecoveries, empCompensations);
            const totalExpenses = normalizeMoney(empExpenses.reduce((s, e) => s + (e.amount || 0), 0));
            const grossProfit = normalizeMoney(interestCollected + moraCollected);
            const availableProfit = normalizeMoney(grossProfit - lossState.totalInterestCompensation - totalExpenses);
            return { totalCapitalLent, capitalPlaced, capitalRecovered: normalizeMoney(capitalRecovered), interestCollected: normalizeMoney(interestCollected), moraCollected: normalizeMoney(moraCollected), grossProfit, totalExpenses, availableProfit, lossState, activeLoansCount: activeLoans.length, activeLoans };
        }, [empLoans, empPayments, empExpenses, empLostDebts, empRecoveries, empCompensations]);

        const moraDetails = useMemo(() => {
            const moraInstallments = empInstallments.filter(i => i.status === 'overdue');
            const map = new Map();
            for (const inst of moraInstallments) {
                const loan = empLoans.find(l => l.id === inst.loanId);
                if (!loan) continue;
                const client = empClients.find(c => c.id === loan.clientId);
                if (!client) continue;
                const key = `${client.id}-${loan.id}`;
                if (!map.has(key)) map.set(key, { client, loan, installments: [], totalOverdue: 0, maxMoraDays: 0, lastPayment: null });
                const entry = map.get(key);
                entry.installments.push(inst);
                entry.totalOverdue += normalizeMoney((inst.remainingAmount || inst.totalAmount || 0) + MoraEngine.calculateMoraRemaining(inst));
                entry.maxMoraDays = Math.max(entry.maxMoraDays, inst.moraDays || 0);
            }
            for (const entry of map.values()) {
                const lp = empPayments.filter(p => p.loanId === entry.loan.id);
                if (lp.length > 0) {
                    lp.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate));
                    entry.lastPayment = lp[0];
                }
            }
            return Array.from(map.values());
        }, [empInstallments, empLoans, empClients, empPayments]);

        const filteredMora = useMemo(() => {
            let result = [...moraDetails];
            if (moraFilter === 'recent') result = result.filter(m => m.maxMoraDays <= 7);
            else if (moraFilter === 'medium') result = result.filter(m => m.maxMoraDays > 7 && m.maxMoraDays <= 30);
            else if (moraFilter === 'high') result = result.filter(m => m.maxMoraDays > 30);
            return result.sort((a, b) => b.maxMoraDays - a.maxMoraDays);
        }, [moraDetails, moraFilter]);

        const handleUnlink = useCallback(async () => {
            if (!employee) return;
            setUnlinking(true);
            try {
                const boss = await db.users.get(user.id);
                const emp = await db.users.get(employee.id);
                if (!boss || !emp) { setUnlinking(false); return; }
                const now = new Date().toISOString();
                const linkage = await db.linkages.where({ bossId: user.id, employeeId: employee.id, status: 'active' }).first();
                if (linkage) await db.linkages.update(linkage.id, { status: 'inactive', unlinkedAt: now, syncStatus: 'pending' });
                const bossList = (boss.linkedEmployeeIds || []).filter(id => id !== employee.id);
                await db.users.update(boss.id, { linkedEmployeeIds: bossList });
                const empList = (emp.linkedBossIds || []).filter(id => id !== user.id);
                await db.users.update(emp.id, { linkedBossIds: empList });
                if (supabase && boss.supabaseId) {
                    try { await supabase.from('users').update({ linked_employee_ids: bossList }).eq('id', boss.supabaseId); } catch (e) {}
                }
                if (supabase && emp.supabaseId) {
                    try { await supabase.from('users').update({ linked_boss_ids: empList }).eq('id', emp.supabaseId); } catch (e) {}
                }
                addToast('Empleado desvinculado', 'success');
                await refreshAllData();
                onNavigate('panelJefe');
            } catch (err) {
                console.error(err);

                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>

                {tab === 'actividad' && <ActividadEmpleado employeeId={employee.id} />}

                {showUnlinkConfirm && (
                    <ConfirmDialog
                        title="Desvincular empleado"
                        message={`¿Desvincular a ${employee.fullName || employee.employeeCode}?\n\nSus datos NO se eliminan.`}
                        confirmLabel="Desvincular"

                        onConfirm={handleUnlink}

                        loading={unlinking}
                    />

    // ============================================================
    // 22. ACTIVIDAD DEL EMPLEADO
    // ============================================================

    const ActividadEmpleado = ({ employeeId }) => {
        const [logs, setLogs] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            const load = async () => {
                try {
                    const all = await db.employeeActivityLog.where({ employeeId: parseInt(employeeId) }).toArray();
                    all.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    setLogs(all.slice(0, 100));
                } catch (err) { console.error(err); }
                setLoading(false);
            };
            load();
        }, [employeeId]);

        if (loading) return <SkeletonCard />;

        if (logs.length === 0) {
            return <EmptyState icon={<IconSVG.Activity />} title="Sin actividad" />;
        }

        const getIcon = (action) => {
            if (action.includes('payment') || action.includes('cobro')) return '💵';
            if (action.includes('loan')) return '📋';
            if (action.includes('client')) return '👤';
            if (action.includes('recovery')) return '🔄';
            if (action.includes('lost')) return '❌';
            return '📌';
        };

        return (
            <div>
                {logs.map(log => (
                    <div key={log.id} style={{ padding: '12px', background: 'rgba(255,255,255,0.02)', borderRadius: 'var(--radius-sm)', marginBottom: '6px', display: 'flex', gap: '12px', alignItems: 'flex-start' }}>
                        <div style={{ fontSize: '20px', flexShrink: 0 }}>{getIcon(log.action)}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ fontSize: '12px', fontWeight: '500', marginBottom: '2px' }}>{log.description}</div>
                            <div style={{ fontSize: '10px', color: 'var(--text-muted)' }}>{formatDateTime(log.timestamp)}</div>
                        </div>
                    </div>
                ))}
            </div>
        );
    };
